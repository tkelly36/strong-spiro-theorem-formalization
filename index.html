set.mem_filter.mpr ⟨Finset.mem_univ y,\n        hP y (Finset.mem_filter.mp hy).2⟩\n    calc\n      LabelMass (fun _ : Ω => (Fintype.card Ω : ℝ)⁻¹) P =\n          ((Finset.univ.filter P).card : ℝ) / (Fintype.card Ω : ℝ) := by\n        simp [LabelMass, div_eq_mul_inv]\n      _ ≤ (MAtLeastCount E S t : ℝ) / (Fintype.card Ω : ℝ) := by\n        apply (div_le_div_iff_of_pos_right hn).mpr\n        exact_mod_cast Finset.card_le_card hsub\n      _ ≤ q ^ t := (div_le_iff₀ hn).mpr hc\n  have hexact (i : ℕ) (hi : i + 1 \u003c levels) (x : Ω) (S : Finset V) (t : ℕ)\n      (hS : S ⊆ E x) (hlo : r (i + 1) ≤ S.card) (hup : S.card ≤ r i)\n      (ht : r (i + 1) ≤ t) :\n      LabelMass (fun _ : Ω => (Fintype.card Ω : ℝ)⁻¹)\n        (fun y => (E y ∩ S).card = t) ≤ q ^ t := by\n    exact hbound S t (fun y => (E y ∩ S).card = t) (fun y hy => hy.ge)\n      (hcount i hi S t ⟨x, hS⟩ hlo hup ht)\n  refine ⟨?_, ?_, ?_⟩\n  · refine ⟨hq, hq1, hprob, hE, hr, hdec, ?_⟩\n    intro i hi x S t hS hlo hup ht _\n    exact hexact i hi x S t hS hlo hup ht\n  · intro rLast hlevels hfinal hprev\n    have hi : levels - 2 + 1 \u003c levels := by omega\n    have hlast : levels - 2 + 1 = levels - 1 := by omega\n    have hstrict : 1 \u003c rLast := by\n      simpa only [hlast, hfinal, hprev] using hdec (levels - 2) hi\n    refine ⟨hq, hq1, by norm_num, le_rfl, by omega, hstrict, hprob, ?_⟩\n    intro x S t hS hlo hup ht _\n    simpa only [one_mul] using hexact (levels - 2) hi x S t hS\n      (by simpa only [hlast, hfinal] using hlo)\n      (by simpa only [hprev] using hup)\n      (by simpa only [hlast, hfinal] using ht)\n  · intro hlevels hfinal\n    refine ⟨hprob, ?_⟩\n    intro T\n    by_cases hempty : T = ∅\n    · subst T\n      simpa only [LabelMass, Finset.empty_subset, Finset.filter_true,\n        Finset.card_empty, pow_zero] using hprob.2.le\n    by_cases hdegree : ∃ x, T ⊆ E x\n    · obtain ⟨x, hx⟩ := hdegree\n      have hpos : 1 ≤ T.card := Finset.card_pos.mpr (Finset.nonempty_iff_ne_empty.mpr hempty)\n      have htop : T.card ≤ r 0 := (Finset.card_le_card hx).trans (hE x)\n      let I := (Finset.range levels).filter (fun j => T.card ≤ r j)\n      have hzero : 0 ∈ I := by\n        exact Finset.mem_filter.mpr ⟨Finset.mem_range.mpr (by omega), htop⟩\n      have hI : I.Nonempty := ⟨0, hzero⟩\n      let j := I.max' hI\n      have hj : j ∈ I := Finset.max'_mem I hI\n      obtain ⟨hjlt, hjup⟩ := Finset.mem_filter.mp hj\n      have hjlevels : j \u003c levels := Finset.mem_range.mp hjlt\n      have hinter : ∃ i, i + 1 \u003c levels ∧ r (i + 1) ≤ T.card ∧ T.card ≤ r i := by\n        by_cases hjfinal : j = levels - 1\n        · have hcard : T.card = 1 := by\n            rw [hjfinal, hfinal] at hjup\n            omega\n          have hi : levels - 2 + 1 \u003c levels := by omega\n          have hlast : levels - 2 + 1 = levels - 1 := by omega\n          refine ⟨levels - 2, hi, ?_, ?_⟩\n          · simp only [hlast, hfinal, hcard, le_refl]\n          · have hs := hdec (levels - 2) hi\n            rw [hlast, hfinal] at hs\n            omega\n        · have hnext : j + 1 \u003c levels := by omega\n          have hnot : ¬ T.card ≤ r (j + 1) := by\n            intro hle\n            have hmem : j + 1 ∈ I :=\n              Finset.mem_filter.mpr ⟨Finset.mem_range.mpr hnext, hle⟩\n            have hmax : j + 1 ≤ j := Finset.le_max' I (j + 1) hmem\n            omega\n          exact ⟨j, hnext, by omega, hjup⟩\n      obtain ⟨i, hi, hlo, hup⟩ := hinter\n      apply hbound T T.card (fun y => T ⊆ E y)\n      · intro y hy\n        exact le_of_eq (congrArg Finset.card (Finset.inter_eq_right.mpr hy)).symm\n      · exact hcount i hi T T.card ⟨x, hx⟩ hlo hup hlo\n    · have hnone : ∀ x, ¬ T ⊆ E x := by simpa only [not_exists] using hdegree\n      simpa [LabelMass, hnone] using (pow_nonneg hq.le T.card)","tex_statement":"\\begin{lemma}\nLet $E:\\Omega\\to2^V$ be a nonempty\n$(q;r_1,\\dots,r_s)$-Spiro-spread labelled hypergraph, and let $\\mu$ be the\nuniform probability distribution on its labels.  Then $\\mu$ is\n$(q;r_1,\\dots,r_s)$-spread.  If the final two scales are $r$ and $1$, then\n$\\mu$ is also $(q,1;r,1)$-spread.  Moreover, if there is a final interval and\nits lower endpoint is $1$, then $(E,\\mu)$ is $q$-containment-spread.\n\\end{lemma}","tex_proof":"\\begin{proof}\nWrite $\\Omega$ for the finite label set.  Since $\\Omega$ is nonempty, the\nuniform weight $\\mu(x)=|\\Omega|^{-1}$ is nonnegative at every label and has\ntotal mass\n\\[\n    \\sum_{x\\in\\Omega}|\\Omega|^{-1}=|\\Omega|\\cdot |\\Omega|^{-1}=1.\n\\]\nThus $\\mu$ is a probability mass in the sense of\n\\noderef{ProbabilityMass}.  The hypotheses $0\u003cq$, $q\\le 1$, boundedness by\nthe top scale, positivity of every scale, and strict decrease of consecutive\nscales are exactly the corresponding structural clauses in the definition\n\\noderef{SpiroSpread}; in particular the boundedness clause is the\n\\noderef{BoundedEdges} condition required by\n\\noderef{DistributionalSmootherSpread}.\n\nWe first verify the distributional spread condition.  Fix an interval\n$[r_{i+1},r_i]$, a labelled edge $E(x)$, a set $S\\subseteq E(x)$ with\n$r_{i+1}\\le |S|\\le r_i$, and an integer $t$ with\n$r_{i+1}\\le t\\le r_i$.  Because $S\\subseteq E(x)$, the set $S$ has positive\ndegree in the labelled hypergraph.  The labels $y$ satisfying\n$|E(y)\\cap S|=t$ form a subset of the labels satisfying\n$|E(y)\\cap S|\\ge t$, whose cardinality is $M_t(S)$ by\n\\noderef{MAtLeastCount}.  Since $\\mu$ is uniform, \\noderef{LabelMass} gives\n\\[\n    \\mu\\{y:|E(y)\\cap S|=t\\}\n    =\n    \\frac{|\\{y:|E(y)\\cap S|=t\\}|}{|\\Omega|}\n    \\le\n    \\frac{M_t(S)}{|\\Omega|}.\n\\]\nApplying the counting clause of \\noderef{SpiroSpread} to this same interval,\nto the positive-degree set $S$, and to the integer $t$, gives\n$M_t(S)\\le q^t|\\Omega|$.  Dividing by the positive number $|\\Omega|$ yields\n\\[\n    \\mu\\{y:|E(y)\\cap S|=t\\}\\le q^t .\n\\]\nAll quantified data were arbitrary subject to the hypotheses of\n\\noderef{DistributionalSmootherSpread}, so $\\mu$ is\n$(q;r_1,\\dots,r_s)$-spread.\n\nNow assume that the final two scales are $r$ and $1$.  The strict decrease\nclause of \\noderef{SpiroSpread} then gives $1\u003cr$, while the already proved\nnormalization gives the probability-mass hypothesis and the inequalities\n$0\u003cq\\le1$ give the same inequalities for the first parameter.  Also\n$0\u003c1\\le1$, so the terminal strength parameter $\\gamma=1$ satisfies\n$0\u003c\\gamma\\le1$.  To check the remaining quantified clause of\n\\noderef{StrongTerminalSpread}, fix a labelled edge $E(x)$, a set\n$S\\subseteq E(x)$ with $1\\le |S|\\le r$, and an integer $t$ with\n$1\\le t\\le r$.  These are exactly the hypotheses for the final Spiro interval\n$[1,r]$.  Repeating the preceding exact-intersection subset argument gives\n\\[\n    \\mu\\{y:|E(y)\\cap S|=t\\}\\le q^t=1\\cdot q^t,\n\\]\nwhich is the required $(q,1;r,1)$ terminal spread bound.\n\nIt remains to prove containment spreadness under the additional assumptions\nthat the scale list has a genuine final interval and that the lower endpoint\nof that final interval is $1$.  In zero-based notation this says\n$1\u003c\\mathrm{levels}$ and $r(\\mathrm{levels}-1)=1$.  Fix a set $T\\subseteq V$.\nIf $T=\\varnothing$, then every label contains $T$, so the left side in\n\\noderef{ContainmentSpread} is the total mass $1$; this equals $q^0$ and\nhence gives the desired bound.  If $T$ has degree zero, then no label contains\n$T$, so the relevant label mass is $0$, and this is at most $q^{|T|}$.\n\nWe may therefore suppose that $T$ is nonempty and has positive degree.  Choose\na label $x$ with $T\\subseteq E(x)$.  By the boundedness clause of\n\\noderef{SpiroSpread}, equivalently the \\noderef{BoundedEdges} condition,\n$|T|\\le |E(x)|\\le r(0)$.  Since $T$ is nonempty, $1\\le |T|$, and the final\nendpoint hypothesis gives $r(\\mathrm{levels}-1)=1\\le |T|$.\n\nWe now choose an actual Spiro interval containing $|T|$.  Among the indices\n$j\u003c\\mathrm{levels}$ for which $|T|\\le r(j)$, take a largest one; such an index\nexists because $j=0$ is admissible.  If this largest index is\n$\\mathrm{levels}-1$, then $|T|\\le r(\\mathrm{levels}-1)=1$ and $1\\le |T|$, so\n$|T|=1$.  Since $1\u003c\\mathrm{levels}$, the preceding index\n$i=\\mathrm{levels}-2$ exists and satisfies\n$i+1=\\mathrm{levels}-1\u003c\\mathrm{levels}$; hence\n$r(i+1)=1=|T|\\le r(i)$, where the last inequality follows from the strict\ndecrease clause of \\noderef{SpiroSpread}.  Otherwise the largest admissible\nindex $i$ is not final.  Then $i+1\u003c\\mathrm{levels}$, maximality says\n$|T|\\nleq r(i+1)$, and for natural numbers this is exactly\n$r(i+1)\u003c|T|$, hence $r(i+1)\\le |T|$; by admissibility of $i$ we also have\n$|T|\\le r(i)$.  In either case there is an index $i$ with\n$i+1\u003c\\mathrm{levels}$ and\n\\[\n    r(i+1)\\le |T|\\le r(i).\n\\]\nTaking $S=T$ and $t=|T|$ in the counting clause of \\noderef{SpiroSpread} gives\n\\[\n    M_{|T|}(T)\\le q^{|T|}|\\Omega|.\n\\]\nThe labels containing $T$ are exactly the labels for which\n$|E(y)\\cap T|=|T|$, and they are among the labels counted by\n$M_{|T|}(T)$ as defined in \\noderef{MAtLeastCount}.  Uniformity and\n\\noderef{LabelMass} therefore give\n\\[\n    \\mu\\{y:T\\subseteq E(y)\\}\n    =\n    \\frac{|\\{y:T\\subseteq E(y)\\}|}{|\\Omega|}\n    \\le\n    \\frac{M_{|T|}(T)}{|\\Omega|}\n    \\le q^{|T|}.\n\\]\nTogether with the empty and degree-zero cases, this proves every clause of\n\\noderef{ContainmentSpread}.\n\\end{proof}","tex_env":"lemma","semantic_closure":["BoundedEdges","ContainmentSpread","DistributionalSmootherSpread","LabelMass","MAtLeastCount","ProbabilityMass","SpiroSpread","StrongTerminalSpread"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonFixedLabelSeparation":{"name":"FiniteJansonFixedLabelSeparation","title":"FiniteJansonFixedLabelSeparation","kind":"lemma","is_target":false,"imports":["FiniteBernoulliBooleanPowersetTransport","FiniteBernoulliPowersetIdentities","FiniteBernoulliResidualBooleanPowersetTransport","FiniteBernoulliResidualConditioning","FiniteJansonBooleanHarrisDisjointComparison","FiniteJansonConditionalJensenMoment","FiniteJansonResidualFactorsDecreasing","FiniteProductHarrisKleitman"],"imported_by":["FiniteJansonOneLabelNumeratorSeparation"],"lean_statement":"lemma FiniteJansonFixedLabelSeparation {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (i : Ω) :\n    ∀ s : ℝ, 0 ≤ s →\n      (Finset.sum ((Finset.univ : Finset V).powerset)\n        (fun Z : Finset V =>\n          (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n            Real.exp\n              (-(s *\n                (((Finset.univ : Finset Ω).filter\n                  (fun ω : Ω => G ω ⊆ Z)).card : ℝ))))) *\n        (p ^ (G i).card *\n          Real.exp\n            (-(s *\n              (((Finset.univ : Finset Ω).sum\n                (fun j : Ω =>\n                  if (G i ∩ G j).Nonempty then\n                    p ^ (G i ∪ G j).card\n                  else 0)) /\n                p ^ (G i).card)))) ≤\n      Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => G i ⊆ Z))\n        (fun Z : Finset V =>\n          (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n            Real.exp\n              (-(s *\n                (((Finset.univ : Finset Ω).filter\n                  (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))) := by","lean_proof":"classical\n  intro s hs\n  let A : Finset V := G i\n  let R : Finset V := (Finset.univ : Finset V) \\ A\n  let q : ℝ := p ^ A.card\n  let D : ℝ :=\n    (Finset.univ : Finset Ω).sum\n      (fun j : Ω =>\n        if (G i ∩ G j).Nonempty then\n          p ^ (G i ∪ G j).card\n        else 0)\n  let ψ : ℝ :=\n    ((Finset.univ : Finset V).powerset).sum\n      (fun Z : Finset V =>\n        (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n          Real.exp\n            (-(s *\n              (((Finset.univ : Finset Ω).filter\n                (fun ω : Ω => G ω ⊆ Z)).card : ℝ))))\n  let interExp : Finset V → ℝ := fun X =>\n    Real.exp\n      (-(s *\n        (((Finset.univ : Finset Ω).filter\n          (fun j : Ω => (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X)).card : ℝ)))\n  let disjExp : Finset V → ℝ := fun X =>\n    Real.exp\n      (-(s *\n        (((Finset.univ : Finset Ω).filter\n          (fun j : Ω => ¬ (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X)).card : ℝ)))\n  let F : Finset V → ℝ := fun Z =>\n    Real.exp\n      (-(s *\n        (((Finset.univ : Finset Ω).filter\n          (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))\n  have hqpos : 0 \u003c q := by\n    dsimp [q, A]\n    exact pow_pos hp.1 _\n  have hJ_sub := FiniteJansonConditionalJensenMoment G p hp i s hs\n  have hJ :\n      Real.exp (-(s * (D / q))) ≤\n        R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X) := by\n    have hattach :\n        (Finset.univ :\n            Finset {X : Finset V // X ∈ R.powerset}).sum\n          (fun X =>\n            (p ^ X.val.card * (1 - p) ^ (R.card - X.val.card)) *\n              interExp X.val) =\n        R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X) := by\n      simpa using (Finset.sum_attach R.powerset\n        (fun X : Finset V =>\n          (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X))\n    rw [← hattach]\n    simpa [D, q, A, R, interExp] using hJ_sub\n  have hpsi_bool :\n      (Finset.univ : Finset (V → Bool)).sum\n        (fun x : V → Bool =>\n          ((Finset.univ : Finset V).prod\n              (fun v : V => if x v then p else 1 - p)) *\n            Real.exp\n              (-(s *\n                (((Finset.univ : Finset Ω).filter\n                  (fun j : Ω =>\n                    G j ⊆ (Finset.univ : Finset V).filter\n                      (fun v : V => x v))).card : ℝ)))) = ψ := by\n    let H : Finset V → ℝ := fun Z =>\n      Real.exp\n        (-(s *\n          (((Finset.univ : Finset Ω).filter\n            (fun j : Ω => G j ⊆ Z)).card : ℝ)))\n    have h := FiniteBernoulliBooleanPowersetTransport (V := V) p H\n    simpa [ψ, H] using h\n  have hinter_bool :\n      (Finset.univ : Finset (V → Bool)).sum\n        (fun x : V → Bool =>\n          ((Finset.univ : Finset V).prod\n              (fun v : V => if x v then p else 1 - p)) *\n            Real.exp\n              (-(s *\n                (((Finset.univ : Finset Ω).filter\n                  (fun j : Ω =>\n                    (G i ∩ G j).Nonempty ∧\n                      G j ⊆ G i ∪\n                        ((Finset.univ : Finset V) \\ G i).filter\n                          (fun v : V => x v))).card : ℝ)))) =\n        R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X) := by\n    let H : Finset V → ℝ := interExp\n    have h := FiniteBernoulliResidualBooleanPowersetTransport (A := G i) (p := p) H\n    simpa [A, R, H, interExp] using h\n  have hprod_bool :\n      (Finset.univ : Finset (V → Bool)).sum\n        (fun x : V → Bool =>\n          ((Finset.univ : Finset V).prod\n              (fun v : V => if x v then p else 1 - p)) *\n            (Real.exp\n                (-(s *\n                  (((Finset.univ : Finset Ω).filter\n                    (fun j : Ω =>\n                      (G i ∩ G j).Nonempty ∧\n                        G j ⊆ G i ∪\n                          ((Finset.univ : Finset V) \\ G i).filter\n                            (fun v : V => x v))).card : ℝ))) *\n              Real.exp\n                (-(s *\n                  (((Finset.univ : Finset Ω).filter\n                    (fun j : Ω =>\n                      ¬ (G i ∩ G j).Nonempty ∧\n                        G j ⊆ G i ∪\n                          ((Finset.univ : Finset V) \\ G i).filter\n                            (fun v : V => x v))).card : ℝ))))) =\n        R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) *\n              (interExp X * disjExp X)) := by\n    let H : Finset V → ℝ := fun X => interExp X * disjExp X\n    have h := FiniteBernoulliResidualBooleanPowersetTransport (A := G i) (p := p) H\n    simpa [A, R, H, interExp, disjExp] using h\n  have hHarris := FiniteJansonBooleanHarrisDisjointComparison G p hp i s hs\n  have hHarris_res :\n      R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) *\n              (interExp X * disjExp X)) ≥\n        (R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X)) * ψ := by\n    rw [← hprod_bool, ← hinter_bool, ← hpsi_bool]\n    exact hHarris\n  have hsplit : ∀ X : Finset V, X ∈ R.powerset →\n      F (A ∪ X) = interExp X * disjExp X := by\n    intro X hX\n    have hcount :\n        ((Finset.univ : Finset Ω).filter\n          (fun ω : Ω => G ω ⊆ A ∪ X)).card =\n        ((Finset.univ : Finset Ω).filter\n          (fun j : Ω => (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X)).card +\n        ((Finset.univ : Finset Ω).filter\n          (fun j : Ω => ¬ (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X)).card := by\n      let S : Finset Ω :=\n        (Finset.univ : Finset Ω).filter (fun j : Ω => G j ⊆ A ∪ X)\n      let Q : Ω → Prop := fun j => (G i ∩ G j).Nonempty\n      have hpart := Finset.card_filter_add_card_filter_not (s := S) (p := Q)\n      have hleft :\n          S.filter Q =\n            (Finset.univ : Finset Ω).filter\n              (fun j : Ω => (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X) := by\n        ext j\n        simp [S, Q, and_comm]\n      have hright :\n          S.filter (fun j => ¬ Q j) =\n            (Finset.univ : Finset Ω).filter\n              (fun j : Ω => ¬ (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X) := by\n        ext j\n        simp [S, Q, and_comm]\n      rw [hleft, hright] at hpart\n      exact hpart.symm\n    dsimp [F, interExp, disjExp]\n    rw [hcount]\n    have : -(s * (((((Finset.univ : Finset Ω).filter\n          (fun j : Ω => (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X)).card +\n        ((Finset.univ : Finset Ω).filter\n          (fun j : Ω => ¬ (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X)).card) : ℕ) : ℝ)) =\n        -(s * (((Finset.univ : Finset Ω).filter\n          (fun j : Ω => (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X)).card : ℝ)) +\n        -(s * (((Finset.univ : Finset Ω).filter\n          (fun j : Ω => ¬ (G i ∩ G j).Nonempty ∧ G j ⊆ A ∪ X)).card : ℝ)) := by\n      norm_num\n      ring\n    rw [this, Real.exp_add]\n  have hright_res :\n      R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) *\n              (interExp X * disjExp X)) =\n        R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) *\n              F (A ∪ X)) := by\n    refine Finset.sum_congr rfl ?_\n    intro X hX\n    rw [hsplit X hX]\n  have hmain_res :\n      ψ * Real.exp (-(s * (D / q))) ≤\n        R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) *\n              F (A ∪ X)) := by\n    have hpsi_nonneg : 0 ≤ ψ := by\n      dsimp [ψ]\n      refine Finset.sum_nonneg ?_\n      intro Z hZ\n      exact mul_nonneg\n        (mul_nonneg (pow_nonneg (le_of_lt hp.1) _)\n          (pow_nonneg (sub_nonneg.mpr (le_of_lt hp.2)) _))\n        (Real.exp_pos _).le\n    have hmul : ψ * Real.exp (-(s * (D / q))) ≤\n        ψ * (R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X)) := by\n      exact mul_le_mul_of_nonneg_left hJ hpsi_nonneg\n    have hcomm :\n        ψ * (R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X)) =\n        (R.powerset.sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X)) * ψ := by\n      ring\n    calc\n      ψ * Real.exp (-(s * (D / q))) ≤\n          ψ * (R.powerset.sum\n            (fun X : Finset V =>\n              (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X)) := hmul\n      _ =\n          (R.powerset.sum\n            (fun X : Finset V =>\n              (p ^ X.card * (1 - p) ^ (R.card - X.card)) * interExp X)) * ψ := hcomm\n      _ ≤\n          R.powerset.sum\n            (fun X : Finset V =>\n              (p ^ X.card * (1 - p) ^ (R.card - X.card)) *\n                (interExp X * disjExp X)) := hHarris_res\n      _ =\n          R.powerset.sum\n            (fun X : Finset V =>\n              (p ^ X.card * (1 - p) ^ (R.card - X.card)) *\n                F (A ∪ X)) := hright_res\n  have hcond := FiniteBernoulliResidualConditioning (A := G i) (p := p) (F := F)\n  change\n      ψ * (q * Real.exp (-(s * (D / q)))) ≤\n        Finset.sum\n          (((Finset.univ : Finset V).powerset).filter\n            (fun Z : Finset V => G i ⊆ Z))\n          (fun Z : Finset V =>\n            (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) * F Z)\n  rw [hcond]\n  rw [show p ^ (G i).card = q by rfl]\n  rw [show (Finset.univ : Finset V) \\ G i = R by rfl]\n  rw [show G i = A by rfl]\n  nlinarith [mul_le_mul_of_nonneg_left hmain_res (le_of_lt hqpos)]","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$, and\nwrite\n\\[\n  Y(Z)=|\\{j:G_j\\subseteq Z\\}|,\\qquad\n  \\psi(s)=\\mathbb E e^{-sY(Z)}.\n\\]\nFor a fixed label $i$, put\n\\[\n  q_i=p^{|G_i|},\\qquad\n  d_i=\\sum_{j:G_i\\cap G_j\\ne\\varnothing}p^{|G_i\\cup G_j|}.\n\\]\nIf $0\u003cp\u003c1$ and $s\\ge0$, then\n\\[\n  \\psi(s)q_i e^{-s d_i/q_i}\n  \\le\n  \\sum_{Z\\supseteq G_i}\n    p^{|Z|}(1-p)^{|V|-|Z|}e^{-sY(Z)} .\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nLet $A_i$ be the event $G_i\\subseteq Z$.  By\n\\noderef{FiniteBernoulliPowersetIdentities}, its Bernoulli mass is\n$q_i=p^{|G_i|}$.  Since $0\u003cp\u003c1$, this number is positive.  Conditional on\n$A_i$, the vertices in $G_i$ are forced to be present and the remaining\nvertices still carry the independent Bernoulli product law.\n\nOn this conditional residual product space, let $Y_i$ count the contained\nlabels $j$ with $G_i\\cap G_j\\ne\\varnothing$, and let $Z_i$ count the\ncontained labels disjoint from $G_i$.  Then on $A_i$ one has\n$Y=Y_i+Z_i$.  Adding residual vertices can only increase both $Y_i$ and\n$Z_i$, so because $s\\ge0$ the functions $e^{-sY_i}$ and $e^{-sZ_i}$ are\ndecreasing.  Applying \\noderef{FiniteProductHarrisKleitman} to this residual\nBernoulli product measure gives\n\\[\n  \\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\n  \\ge\n  \\mathbb E(e^{-sY_i}\\mid A_i)\\,\n  \\mathbb E(e^{-sZ_i}\\mid A_i).\n\\]\nThe disjoint-label part $Z_i$ depends only on labels whose sets are disjoint\nfrom $G_i$, so after conditioning on $A_i$ its residual distribution is the\nsame as in the original product measure.  Since $Y_i\\ge0$ and $s\\ge0$,\n$e^{-sY_i}\\le1$; hence\n$e^{-sZ_i}\\ge e^{-s(Y_i+Z_i)}=e^{-sY}$.  Therefore\n\\[\n  \\mathbb E(e^{-sZ_i}\\mid A_i)\\ge \\psi(s).\n\\]\nMultiplying the preceding Harris inequality by $q_i=\\Pr(A_i)$ gives\n\\[\n  \\mathbb E({\\bf 1}_{A_i}e^{-sY})\n  \\ge\n  q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i)\\,\\psi(s).\n\\]\n\nIt remains to lower-bound the conditional expectation of $e^{-sY_i}$.\nApply finite Jensen, \\texttt{ConvexOn.map\\_sum\\_le} specialized to the\nconvex exponential function, on the finite conditional space $A_i$, with\npoints $-sY_i$ and weights equal to the Bernoulli atom masses divided by $q_i$.\nThese weights are nonnegative and sum to $1$ by\n\\noderef{FiniteBernoulliPowersetIdentities}.  Jensen gives\n\\[\n  \\mathbb E(e^{-sY_i}\\mid A_i)\n  \\ge\n  \\exp(-s\\,\\mathbb E(Y_i\\mid A_i)).\n\\]\nFor every label $j$ intersecting $G_i$, the conditional contribution of\nthe event $G_j\\subseteq Z$ is\n\\[\n  q_i\\,\\Pr(G_j\\subseteq Z\\mid A_i)\n  =\n  \\Pr(G_i\\cup G_j\\subseteq Z)\n  =\n  p^{|G_i\\cup G_j|},\n\\]\nagain by \\noderef{FiniteBernoulliPowersetIdentities}.  Summing over such\n$j$ gives $q_i\\mathbb E(Y_i\\mid A_i)=d_i$, and hence\n\\[\n  \\mathbb E({\\bf 1}_{A_i}e^{-sY})\n  \\ge\n  q_i e^{-s d_i/q_i}\\psi(s).\n\\]\nFinally,\n\\[\n  \\mathbb E({\\bf 1}_{A_i}e^{-sY})\n  =\n  \\sum_{Z\\supseteq G_i}\n    p^{|Z|}(1-p)^{|V|-|Z|}e^{-sY(Z)},\n\\]\nwhich is exactly the right-hand side in finite-sum notation.  This proves\nthe displayed fixed-label inequality.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteBernoulliUniformVariance":{"name":"FiniteBernoulliUniformVariance","title":"Variance of uniform fragments under Bernoulli sampling","kind":"lemma","is_target":false,"imports":["FiniteBernoulliPowersetIdentities","ProbabilityMass"],"imported_by":["AnchoredTerminalBinomialMiss"],"lean_statement":"lemma FiniteBernoulliUniformVariance {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (F : Ω → Finset V) (ν : Ω → ℝ) (P : Ω → Prop)\n    (p : ℝ) (r : ℕ)\n    (hν : ProbabilityMass ν)\n    (hsupport : ∀ x, ¬ P x → ν x = 0)\n    (hcard : ∀ x, P x → (F x).card = r)\n    (hp : 0 \u003c p ∧ p ≤ 1) :\n    (∑ Z ∈ (Finset.univ : Finset V).powerset,\n      (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n        ((∑ x, if F x ⊆ Z then ν x else 0) - p ^ r) ^ 2) ≤\n      (p ^ r) ^ 2 * ∑ x, ν x * ∑ y,\n        if (F x ∩ F y).card = 0 then 0\n        else ν y * (p⁻¹) ^ (F x ∩ F y).card := by","lean_proof":"classical\n  let S := (Finset.univ : Finset V).powerset\n  let w : Finset V → ℝ := fun Z =>\n    p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)\n  let I : Ω → Finset V → ℝ := fun x Z => if F x ⊆ Z then 1 else 0\n  let X : Finset V → ℝ := fun Z => ∑ x, ν x * I x Z\n  let M := p ^ r\n  obtain ⟨hnorm, hcontain, hjoint⟩ := FiniteBernoulliPowersetIdentities F p\n  have hw : ∑ Z ∈ S, w Z = 1 := hnorm\n  have hI (x : Ω) : (∑ Z ∈ S, w Z * I x Z) = p ^ (F x).card := by\n    simpa only [S, w, I, mul_ite, mul_one, mul_zero, Finset.sum_filter]\n      using hcontain (F x)\n  have hII (x y : Ω) :\n      (∑ Z ∈ S, w Z * (I x Z * I y Z)) = p ^ (F x ∪ F y).card := by\n    have hpoint (Z : Finset V) :\n        I x Z * I y Z = if F x ∪ F y ⊆ Z then 1 else 0 := by\n      by_cases hx : F x ⊆ Z \u003c;> by_cases hy : F y ⊆ Z \u003c;>\n        simp [I, Finset.union_subset_iff, hx, hy]\n    simp_rw [hpoint]\n    simpa only [S, w, mul_ite, mul_one, mul_zero, Finset.sum_filter]\n      using hjoint x y\n  have hmean : (∑ Z ∈ S, w Z * X Z) = M := by\n    simp only [X, Finset.mul_sum]\n    rw [Finset.sum_comm]\n    calc\n      (∑ x, ∑ Z ∈ S, w Z * (ν x * I x Z)) =\n          ∑ x, ν x * p ^ (F x).card := by\n        apply Finset.sum_congr rfl\n        intro x _\n        rw [← hI x, Finset.mul_sum]\n        apply Finset.sum_congr rfl\n        intro Z _\n        ring\n      _ = ∑ x, ν x * M := by\n        apply Finset.sum_congr rfl\n        intro x _\n        by_cases hx : P x\n        · rw [hcard x hx]\n        · simp [hsupport x hx]\n      _ = M := by rw [← Finset.sum_mul, hν.2, one_mul]\n  have hsecond : (∑ Z ∈ S, w Z * X Z ^ 2) =\n      ∑ x, ∑ y, ν x * ν y * p ^ (F x ∪ F y).card := by\n    have hexpand (Z : Finset V) : X Z ^ 2 =\n        ∑ x, ∑ y, ν x * ν y * (I x Z * I y Z) := by\n      simp only [X, pow_two, Finset.sum_mul, Finset.mul_sum]\n      apply Finset.sum_congr rfl\n      intro x _\n      apply Finset.sum_congr rfl\n      intro y _\n      ring\n    simp_rw [hexpand, Finset.mul_sum]\n    rw [Finset.sum_comm]\n    apply Finset.sum_congr rfl\n    intro x _\n    rw [Finset.sum_comm]\n    apply Finset.sum_congr rfl\n    intro y _\n    rw [← hII x y, Finset.mul_sum]\n    apply Finset.sum_congr rfl\n    intro Z _\n    ring\n  have hpair (x y : Ω) : ν x * ν y * p ^ (F x ∪ F y).card =\n      M ^ 2 * (ν x * ν y * (p⁻¹) ^ (F x ∩ F y).card) := by\n    by_cases hx : P x\n    · by_cases hy : P y\n      · have hc : (F x ∪ F y).card + (F x ∩ F y).card = r + r := by\n          simpa only [hcard x hx, hcard y hy] using Finset.card_union_add_card_inter (F x) (F y)\n        have hpow : p ^ (F x ∪ F y).card * p ^ (F x ∩ F y).card = M ^ 2 := by\n          rw [← pow_add, hc, pow_add]\n          dsimp [M]\n          ring\n        have hpne : p ^ (F x ∩ F y).card ≠ 0 := pow_ne_zero _ hp.1.ne'\n        rw [inv_pow]\n        apply (mul_right_cancel₀ hpne)\n        calc\n          ν x * ν y * p ^ (F x ∪ F y).card * p ^ (F x ∩ F y).card =\n              ν x * ν y * M ^ 2 := by rw [mul_assoc, hpow]\n          _ = M ^ 2 * (ν x * ν y * (p ^ (F x ∩ F y).card)⁻¹) *\n              p ^ (F x ∩ F y).card := by field_simp\n      · simp [hsupport y hy]\n    · simp [hsupport x hx]\n  have hvariance : (∑ Z ∈ S, w Z * (X Z - M) ^ 2) =\n      M ^ 2 * ∑ x, ν x * ∑ y, ν y * ((p⁻¹) ^ (F x ∩ F y).card - 1) := by\n    have hexpand : (∑ Z ∈ S, w Z * (X Z - M) ^ 2) =\n        (∑ Z ∈ S, w Z * X Z ^ 2) - 2 * M * (∑ Z ∈ S, w Z * X Z) +\n          M ^ 2 * (∑ Z ∈ S, w Z) := by\n      simp only [Finset.mul_sum, ← Finset.sum_sub_distrib, ← Finset.sum_add_distrib]\n      apply Finset.sum_congr rfl\n      intro Z _\n      ring\n    rw [hexpand, hsecond, hmean, hw]\n    simp_rw [hpair]\n    have htotal : (∑ x, ν x * ∑ y, ν y) = 1 := by simp [hν.2]\n    have hfactor : (∑ x, ∑ y, M ^ 2 * (ν x * ν y * (p⁻¹) ^ (F x ∩ F y).card)) =\n        M ^ 2 * (∑ x, ν x * ∑ y, ν y * (p⁻¹) ^ (F x ∩ F y).card) := by\n      simp only [Finset.mul_sum]\n      apply Finset.sum_congr rfl\n      intro x _\n      apply Finset.sum_congr rfl\n      intro y _\n      ring\n    have hdiff : (∑ x, ν x * ∑ y, ν y * ((p⁻¹) ^ (F x ∩ F y).card - 1)) =\n        (∑ x, ν x * ∑ y, ν y * (p⁻¹) ^ (F x ∩ F y).card) - 1 := by\n      simp only [mul_sub, mul_one, Finset.sum_sub_distrib]\n      rw [htotal]\n    calc\n      (∑ x, ∑ y, M ^ 2 * (ν x * ν y * (p⁻¹) ^ (F x ∩ F y).card)) -\n          2 * M * M + M ^ 2 * 1 =\n          M ^ 2 * ((∑ x, ν x * ∑ y, ν y * (p⁻¹) ^ (F x ∩ F y).card) - 1) := by\n        rw [hfactor]\n        ring\n      _ = M ^ 2 * ∑ x, ν x * ∑ y, ν y * ((p⁻¹) ^ (F x ∩ F y).card - 1) := by\n        rw [hdiff]\n  have hbound : (∑ Z ∈ S, w Z * (X Z - M) ^ 2) ≤\n      M ^ 2 * ∑ x, ν x * ∑ y,\n        if (F x ∩ F y).card = 0 then 0 else ν y * (p⁻¹) ^ (F x ∩ F y).card := by\n    rw [hvariance]\n    apply mul_le_mul_of_nonneg_left _ (sq_nonneg M)\n    apply Finset.sum_le_sum\n    intro x _\n    apply mul_le_mul_of_nonneg_left _ (hν.1 x)\n    apply Finset.sum_le_sum\n    intro y _\n    by_cases hzero : (F x ∩ F y).card = 0\n    · simp [hzero]\n    · rw [if_neg hzero]\n      nlinarith [hν.1 y]\n  simpa only [S, w, X, I, M, mul_ite, mul_one, mul_zero] using hbound","tex_statement":"\\begin{lemma}[Variance of uniform fragments under Bernoulli sampling]\nLet $V$ and $\\Omega$ be finite, let $F:\\Omega\\to2^V$, and let $\\nu$\nbe a probability mass on $\\Omega$. Let $P$ be a predicate such that\n$\\nu(x)=0$ outside $P$, and suppose $|F(x)|=r$ for every $x$ satisfying\n$P$. Let $0\u003cp\\le1$. Write\n\\[\n w(Z)=p^{|Z|}(1-p)^{|V|-|Z|},\\qquad\n X(Z)=\\sum_{x:F(x)\\subseteq Z}\\nu(x),\\qquad M=p^r.\n\\]\nThen\n\\[\n \\sum_{Z\\subseteq V}w(Z)(X(Z)-M)^2\n \\le M^2\\sum_x\\nu(x)\\sum_{y:|F(x)\\cap F(y)|\\ne0}\n       \\nu(y)(p^{-1})^{|F(x)\\cap F(y)|}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nBy \\noderef{ProbabilityMass}, all weights $\\nu(x)$ are nonnegative and\ntheir sum is one. By \\noderef{FiniteBernoulliPowersetIdentities}, the\nweights $w$ sum to one, the total weight of sets containing $F(x)$ is\n$p^{|F(x)|}$, and the total weight of sets containing both $F(x)$ and\n$F(y)$ is $p^{|F(x)\\cup F(y)|}$.\nLet $I_x(Z)$ indicate $F(x)\\subseteq Z$, so $X=\\sum_x\\nu(x)I_x$.\nExchanging the finite sums gives\n\\[\n \\sum_Z w(Z)X(Z)=\\sum_x\\nu(x)p^{|F(x)|}=M.\n\\]\nIndeed, terms outside $P$ vanish, and inside $P$ the exponent is $r$.\nExpanding the square and exchanging finite sums likewise gives\n\\[\n \\sum_Zw(Z)X(Z)^2\n =\\sum_{x,y}\\nu(x)\\nu(y)p^{|F(x)\\cup F(y)|}.\n\\]\nPut $j_{xy}=|F(x)\\cap F(y)|$. For $x,y$ satisfying $P$, the union\ncardinality identity gives $|F(x)\\cup F(y)|+j_{xy}=2r$.\nSince $p>0$, division by $p^{j_{xy}}$ is legal and hence\n$p^{|F(x)\\cup F(y)|}=M^2(p^{-1})^{j_{xy}}$.\nIf either label is outside $P$, its coefficient $\\nu(x)\\nu(y)$ is zero,\nso the corresponding weighted identity remains valid.\nUsing normalization and the first moment to expand the centered square,\nwe therefore obtain\n\\[\n \\sum_Zw(Z)(X(Z)-M)^2\n = M^2\\sum_{x,y}\\nu(x)\\nu(y)\n       \\bigl((p^{-1})^{j_{xy}}-1\\bigr).\n\\]\nHere the constant term has total coefficient\n$\\sum_{x,y}\\nu(x)\\nu(y)=1$. When $j_{xy}=0$, the parenthesis is zero.\nWhen $j_{xy}\\ne0$, dropping its subtracted $1$ increases the summand,\nbecause $\\nu(x)\\nu(y)\\ge0$. Summing these inequalities and multiplying\nby $M^2\\ge0$ proves the stated bound. All calculations hold also for\n$r=0$.\n\\end{proof}","tex_env":"lemma","semantic_closure":["ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"UniformExtensionKernelFirstMarginal":{"name":"UniformExtensionKernelFirstMarginal","title":"UniformExtensionKernelFirstMarginal","kind":"lemma","is_target":false,"imports":["ProbabilityMass","UniformExtensionKernel"],"imported_by":["UniformExtensionKernelProbabilityMass","UniformExtensionKernelSecondMarginal","UniformExtensionCoupling"],"lean_statement":"lemma UniformExtensionKernelFirstMarginal {V : Type v} [Fintype V] [DecidableEq V]\n    (Udist : Finset V → ℝ) (m : ℕ)\n    (hprob : ProbabilityMass Udist)\n    (hsize : ∀ U : Finset V, 0 \u003c Udist U → U.card ≤ m)\n    (hm : m ≤ Fintype.card V) :\n    ∀ U : Finset V,\n      Finset.sum Finset.univ (fun W : Finset V =>\n        UniformExtensionKernel Udist m (U, W)) = Udist U := by","lean_proof":"intro U\n  by_cases hzero : Udist U = 0\n  · simp [UniformExtensionKernel, hzero]\n  · have hnonneg : 0 ≤ Udist U := hprob.1 U\n    have hpos : 0 \u003c Udist U := lt_of_le_of_ne hnonneg (Ne.symm hzero)\n    have hUle : U.card ≤ m := hsize U hpos\n    let S : Finset (Finset V) := (Finset.univ \\ U).powersetCard (m - U.card)\n    have hcard_filter :\n        (Finset.univ.filter (fun W : Finset V => U.card ≤ m ∧ U ⊆ W ∧ W.card = m)).card =\n          S.card := by\n      dsimp [S]\n      refine Finset.card_bij'\n        (fun W _hW => W \\ U)\n        (fun R _hR => U ∪ R)\n        ?to_mem ?from_mem ?left_inv ?right_inv\n      · intro W hW\n        simp only [Finset.mem_filter, Finset.mem_univ, true_and] at hW\n        rcases hW with ⟨_hUm, hUW, hWcard⟩\n        rw [Finset.mem_powersetCard]\n        constructor\n        · intro x hx\n          simp only [Finset.mem_sdiff, Finset.mem_univ, true_and] at hx ⊢\n          exact hx.2\n        · rw [Finset.card_sdiff_of_subset hUW, hWcard]\n      · intro R hR\n        rw [Finset.mem_powersetCard] at hR\n        rcases hR with ⟨hRsub, hRcard⟩\n        simp only [Finset.mem_filter, Finset.mem_univ, true_and]\n        refine ⟨hUle, ?_, ?_⟩\n        · exact Finset.subset_union_left\n        · have hdisj : Disjoint U R := by\n            rw [Finset.disjoint_left]\n            intro x hxU hxR\n            have hxnot : x ∉ U := by\n              have := hRsub hxR\n              simpa using this\n            exact hxnot hxU\n          rw [Finset.card_union_of_disjoint hdisj, hRcard, Nat.add_sub_of_le hUle]\n      · intro W hW\n        simp only [Finset.mem_filter, Finset.mem_univ, true_and] at hW\n        rcases hW with ⟨_hUm, hUW et, let $\\mu$ be a probability mass on subsets of $V$,\nand let $m\\le |V|$.  Assume that $\\mu(A)>0$ implies $|A|\\le m$ for every\nsubset $A\\subseteq V$.  For the kernel $K_\\mu$ of\n\\noderef{UniformExtensionKernel}, one has\n\\[\n    \\sum_{B\\subseteq V} K_\\mu(A,B)=\\mu(A)\n\\]\nfor every subset $A\\subseteq V$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nFix $A\\subseteq V$.  We use \\noderef{ProbabilityMass} for the fact that\n$\\mu(A)\\ge 0$.  If $\\mu(A)$ is not positive, then nonnegativity gives\n$\\mu(A)=0$.  In that case every nonzero-formula term in the definition of\n$K_\\mu(A,B)$ contains the factor $\\mu(A)$, while every inadmissible case is\ndefined to be zero.  Hence every summand is zero, and the whole sum is zero,\nwhich equals $\\mu(A)$.\n\nNow suppose $\\mu(A)>0$.  By hypothesis, $|A|\\le m$.  The terms\n$K_\\mu(A,B)$ are nonzero only for sets $B$ satisfying $A\\subseteq B$ and\n$|B|=m$.  Such $B$ are in bijection with\n$(m-|A|)$-element subsets $R$ of $V\\setminus A$, by the mutually inverse maps\n$B\\mapsto B\\setminus A$ and $R\\mapsto A\\cup R$.  The cardinalities match\nbecause $A$ is disjoint from $R$ and\n$|A\\cup R|=|A|+|R|=m$; conversely, if $A\\subseteq B$ and $|B|=m$, then\n$|B\\setminus A|=m-|A|$.  The assumption $m\\le |V|$ and $|A|\\le m$ ensure this\nfamily is nonempty and has positive finite cardinality.  On each of these\nexactly $\\left|\\binom{V\\setminus A}{m-|A|}\\right|$ choices, the kernel has\nthe constant value\n\\[\n    \\mu(A)\\left|\\binom{V\\setminus A}{m-|A|}\\right|^{-1}.\n\\]\nTherefore the sum over all admissible $B$ is the number of admissible\nchoices times this reciprocal-normalized value, namely $\\mu(A)$.  All\ninadmissible $B$ contribute zero, so the full sum over all $B\\subseteq V$ is\n$\\mu(A)$.\n\\end{proof}","tex_env":"lemma","semantic_closure":["ProbabilityMass","UniformExtensionKernel"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubs nonneg _) (Nat.cast_nonneg _))\n  -- For each fixed label the union and intersection reconstruct the exposed set.\n  have reconstruct (x : Ω) (W : Finset V) :\n      ((F x ∪ W) \\ F x) ∪ (F x ∩ W) = W := by\n    ext a\n    simp only [Finset.mem_union, Finset.mem_sdiff, Finset.mem_inter]\n    tauto\n  have eligible (x : Ω) (W : Finset V) (hW : W ∈ B x) :\n      (F x ∪ W) ∈ Zs ∧ Q x (F x ∪ W) ∧\n        (F x ∩ W) ∈ (F x).powersetCard t := by\n    obtain ⟨hsize, hbad, hinter, hnon⟩ := Finset.mem_filter.mp hW\n    have hWcard := (Finset.mem_powersetCard.mp hsize).2\n    have hZcard : (F x ∪ W).card = w + r := by\n      have hc := Finset.card_union_add_card_inter (F x) W\n      rw [hunif x, hWcard, hinter] at hc\n      dsimp [w]\n      omega\n    have hsmall : (F x ∪ W) \\ F x ⊆ W := by\n      intro a ha\n      obtain ⟨ha, hnot⟩ := Finset.mem_sdiff.mp ha\n      exact (Finset.mem_union.mp ha).resolve_left hnot\n    have hbad' : ¬ KGoodPair F k x ((F x ∪ W) \\ F x) := by\n      rintro ⟨y, hy, hcard⟩\n      apply hbad\n      refine ⟨y, hy.trans ?_, le_trans (Finset.card_le_card ?_) hcard⟩\n      · exact Finset.union_subset_union_right hsmall\n      · exact Finset.sdiff_subset_sdiff (Finset.Subset.refl _) hsmall\n    have hthreshold : g (F x ∪ W) ≤ N := by\n      exact le_of_not_gt hnon\n    exact ⟨Finset.mem_powersetCard.mpr ⟨Finset.subset_univ _, hZcard⟩,\n      ⟨⟨Finset.subset_union_left, hbad'⟩, hthreshold⟩,\n      Finset.mem_powersetCard.mpr ⟨Finset.inter_subset_left, hinter⟩⟩\n  have count (x : Ω) :\n      (B x).card ≤ (Zs.filter (Q x)).card * r.choose t := by\n    calc\n      (B x).card ≤ ((Zs.filter (Q x)).product ((F x).powersetCard t)).card := by\n        apply Finset.card_le_card_of_injOn (fun W => (F x ∪ W, F x ∩ W))\n        · intro W hW\n          obtain ⟨hZ, hQ, hT⟩ := eligible x W hW\n          exact Finset.mem_product.mpr ⟨Finset.mem_filter.mpr ⟨hZ, hQ⟩, hT⟩\n        · intro W hW W' hW' heq\n          have hZ : F x ∪ W = F x ∪ W' := congrArg Prod.fst heq\n          have hT : F x ∩ W = F x ∩ W' := congrArg Prod.snd heq\n          calc\n            W = ((F x ∪ W) \\ F x) ∪ (F x ∩ W) := (reconstruct x W).symm\n            _ = ((F x ∪ W') \\ F x) ∪ (F x ∩ W') := by rw [hZ, hT]\n            _ = W' := reconstruct x W'\n      _ = (Zs.filter (Q x)).card * r.choose t := by\n        simp only [Finset.product_eq_sprod, Finset.card_product,\n          Finset.card_powersetCard, hunif x]\n  have weighted (x : Ω) :\n      ν x * ((B x).card : ℝ) ≤\n        ∑ Z ∈ Zs, if Q x Z then ν x * (r.choose t : ℝ) else 0 := by\n    calc\n      ν x * ((B x).card : ℝ) ≤\n          ν x * ((Zs.filter (Q x)).card * r.choose t : ℝ) := by\n        apply mul_le_mul_of_nonneg_left _ (hν.1 x)\n        exact_mod_cast count x\n      _ = ∑ Z ∈ Zs, if Q x Z then ν x * (r.choose t : ℝ) else 0 := by\n        rw [← Finset.sum_filter]\n        simp only [Finset.sum_const, nsmul_eq_mul]\n        ring\n  -- Swap the label and union sums; pathological unions have no eligible labels.\n  have fiber (Z : Finset V) :\n      (∑ x : Ω, if Q x Z then ν x * (r.choose t : ℝ) else 0) ≤\n        N * (r.choose t : ℝ) := by\n    by_cases hg : g Z ≤ N\n    · calc\n        (∑ x : Ω, if Q x Z then ν x * (r.choose t : ℝ) else 0) =\n            g Z * (r.choose t : ℝ) := by\n          simp only [Q, hg, and_true]\n          simp [g, LabelMass, Finset.sum_filter, Finset.sum_mul]\n        _ ≤ N * (r.choose t : ℝ) :=\n          mul_le_mul_of_nonneg_right hg (Nat.cast_nonneg _)\n    · simpa [Q, hg] using mul_nonneg hN (Nat.cast_nonneg (r.choose t) :\n        (0 : ℝ) ≤ (r.choose t : ℝ))\n  have total : (∑ x : Ω, ν x * ((B x).card : ℝ)) ≤\n      (n.choose (w + r) : ℝ) * N * (r.choose t : ℝ) := by\n    calc\n      (∑ x : Ω, ν x * ((B x).card : ℝ)) ≤\n          ∑ x : Ω, ∑ Z ∈ Zs, if Q x Z then ν x * (r.choose t : ℝ) else 0 :=\n        Finset.sum_le_sum (fun x _ => weighted x)\n      _ = ∑ Z ∈ Zs, ∑ x : Ω, if Q x Z then ν x * (r.choose t : ℝ) else 0 :=\n        Finset.sum_comm\n      _ ≤ ∑ Z ∈ Zs, N * (r.choose t : ℝ) :=\n        Finset.sum_le_sum (fun Z _ => fiber Z)\n      _ = (n.choose (w + r) : ℝ) * N * (r.choose t : ℝ) := by\n        simp [Zs, n, mul_assoc]\n  have hchoose : (n.choose (w + r) : ℝ) * ((w + r).choose r : ℝ) =\n      (n.choose r : ℝ) * ((n - r).choose w : ℝ) := by\n    exact_mod_cast (by\n      simpa only [Nat.add_sub_cancel] using\n        (Nat.choose_mul (n := n) (k := w + r) (s := r) (by omega)))\n  have cancel : (n.choose (w + r) : ℝ) * D = ((n - r).choose w : ℝ) := by\n    dsimp [D]\n    rw [← mul_div_assoc]\n    apply (div_eq_iff hden).mpr\n    simpa only [mul_comm] using hchoose\n  calc\n    (∑ x : Ω, ν x * ((B x).card : ℝ)) ≤\n        (n.choose (w + r) : ℝ) * N * (r.choose t : ℝ) := total\n    _ = η * (r.choose t : ℝ) * ((n - r).choose w : ℝ) := by\n      dsimp [N]\n      calc\n        _ = η * (r.choose t : ℝ) * ((n.choose (w + r) : ℝ) * D) := by ring\n        _ = _ := by rw [cancel]","tex_statement":"\\begin{lemma}\nLet $V,\\Omega$ be finite, $n=|V|$, $F:\\Omega\\to\\binom Vr$, and let\n$\\nu:\\Omega\\to\\mathbb R$ be nonnegative with $\\sum_x\\nu(x)=1$.\nSuppose $1\\leq k\\leq r$, $C\\geq8$, $2r\\leq m$, $2m\\leq n$,\nand $0\\leq t\\leq r$. Put $w=m-t$, $\\eta=(C/4)^{-k/2}$,\n$D=\\binom{w+r}{r}/\\binom nr$, and $N=\\eta D$.\nLet $\\mathcal B_t^-$ consist of pairs $(x,W)$ with $|W|=m$,\n$|F(x)\\cap W|=t$, $(F(x),W)$ $k$-bad, and\n$\\neg\\operatorname{WeightedBadPairPathological}(F,\\nu,r,k,m,C,t,x,W)$.\nThen\n\\[\n\\sum_x\\nu(x)\\bigl|\\{W:(x,W)\\in\\mathcal B_t^-\\}\\bigr|\n\\leq\\eta\\binom rt\\binom{n-r}{w}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nThe meanings of uniformity, mass, and badness are those in\n\\noderef{UniformEdges}, \\noderef{ProbabilityMass}, \\noderef{LabelMass},\nand \\noderef{KGoodPair}; pathology is \\noderef{WeightedBadPairPathological}.\nWe have $n\\geq4r$, $r\\geq1$, $r\\leq w\\leq m\\leq n-r$, and\n$w+r\\leq n$. Thus every binomial coefficient that will be a denominator\nis positive. Also $C/4>0$, so $\\eta>0$ and $N>0$.\n\nFor a pair counted on the left put $Z=F(x)\\cup W$ and $T=F(x)\\cap W$.\nThen $|Z|=r+m-t=r+w$, $T\\in\\binom{F(x)}t$, and\n\\[\nW=(Z\\setminus F(x))\\cup T.\n\\]\nConsequently this encoding by $(Z,x,T)$ is injective and preserves the\nweight $\\nu(x)$. Put $U=Z\\setminus F(x)=W\\setminus F(x)$.\nIf $(F(x),U)$ were good, its witness $y$ would satisfy\n$F(y)\\subseteq F(x)\\cup U\\subseteq F(x)\\cup W$ and\n$|F(y)\\setminus W|\\leq|F(y)\\setminus U|\\leq k$.\nThis contradicts the original badness. Thus $x$ belongs to the set\nwhose mass is $g(Z)$ in the definition of pathology.\n\nFor fixed $Z$, nonpathology says $g(Z)\\leq N$. For each eligible label\n$x$ there are at most $\\binom rt$ possible $T$, since $|F(x)|=r$.\nAll weights are nonnegative, so enlarging the eligible label set to\nthe set defining $g(Z)$ only increases the weighted count. Hence\nthe total weight encoded at this $Z$ is at most $N\\binom rt$.\nThere are $\\binom n{w+r}$ sets $Z$. The desired count is therefore at most\n$\\binom n{w+r}\\eta D\\binom rt$.\n\nFor completeness, factorial cancellation, valid because $w+r\\leq n$,\ngives\n\\[\n\\binom n{w+r}\\frac{\\binom{w+r}r}{\\binom nr}\n=\\frac{n!}{(w+r)!(n-w-r)!}\n  \\frac{(w+r)!}{r!w!}\\frac{r!(n-r)!}{n!}\n=\\binom{n-r}w.\n\\]\nSubstitution proves the bound. Nothing in the encoding identifies\ndifferent labels with the same edge, and zero label weights contribute\nzero, so neither distinctness of edges nor strict positivity of weights\nhas been assumed.\n\\end{proof}","tex_env":"lemma","semantic_closure":["KGoodPair","LabelMass","ProbabilityMass","UniformEdges","WeightedBadPairPathological"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"WeightedBadPairPathologicalCount":{"name":"WeightedBadPairPathologicalCount","title":"WeightedBadPairPathologicalCount","kind":"lemma","is_target":false,"imports":["ProbabilityMass","UniformEdges","WeightedBadPairHypergeometricFactor","WeightedBadPairPathological"],"imported_by":["WeightedBadPairEstimate"],"lean_statement":"lemma WeightedBadPairPathologicalCount {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq Ω] [Fintype V] [DecidableEq V]\n    (F : Ω → Finset V) (ν : Ω → ℝ) (r k m t : ℕ) (C p : ℝ)\n    (hν : ProbabilityMass ν) (hunif : UniformEdges F r)\n    (hk : 1 ≤ k ∧ k ≤ r) (hC : 8 ≤ C)\n    (hp : 0 \u003c p ∧ p ≤ (1 / 2 : ℝ))\n    (hm : (m : ℝ) = p * (Fintype.card V : ℝ))\n    (hm_large : 2 * r ≤ m) (hm_small : 2 * m ≤ Fintype.card V)\n    (ht : t ≤ r)\n    (hoverlap : ∀ x : Ω,\n      Finset.sum (Finset.Icc k r) (fun j : ℕ =>\n        LabelMass ν (fun y : Ω => (F x ∩ F y).card = j) *\n          (p / 2) ^ (-(j : ℝ))) ≤ 4 * (C / 2) ^ (-(k : ℝ))) :\n    (∑ x : Ω, ν x *\n      (((Finset.univ : Finset V).powersetCard m).filter\n        (fun W => ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t ∧\n          WeightedBadPairPathological F ν r k m C t x W)).card) ≤\n    2 * (C / 4) ^ (-(k : ℝ) / 2) * (r.choose t : ℝ) *\n      ((Fintype.card V - r).choose (m - t) : ℝ) := by","lean_proof":"classical\n  let n := Fintype.card V\n  let w := m - t\n  let η := (C / 4) ^ (-(k : ℝ) / 2)\n  let D := ((w + r).choose r : ℝ) / (n.choose r : ℝ)\n  let M := ((n - r).choose w : ℝ)\n  let Us := fun x => ((Finset.univ : Finset V) \\ F x).powersetCard w\n  let Y := fun x U => LabelMass ν (fun y =>\n    F y ⊆ F x ∪ U ∧ k ≤ (F x ∩ F y).card)\n  let H := fun x => (Us x).filter (fun U => η * D \u003c Y x U)\n  let B := fun x => ((Finset.univ : Finset V).powersetCard m).filter\n    (fun W => ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t ∧\n      WeightedBadPairPathological F ν r k m C t x W)\n  have hr : 1 ≤ r := hk.1.trans hk.2\n  have hrw : r ≤ w := by dsimp [w]; omega\n  have hwN : w ≤ n - r := by dsimp [w, n]; omega\n  have hrn : r ≤ n := by dsimp [n]; omega\n  have hD : 0 \u003c D := by\n    apply div_pos \u003c;> exact_mod_cast Nat.choose_pos (by omega)\n  have hM : 0 \u003c M := by\n    dsimp [M]\n    exact_mod_cast Nat.choose_pos hwN\n  have hη : 0 \u003c η := Real.rpow_pos_of_pos (by linarith) _\n  have hUcard (x : Ω) : ((Us x).card : ℝ) = M := by\n    simp [Us, Finset.card_sdiff_of_subset (Finset.subset_univ _), hunif x, M, n]\n  have hY (x : Ω) (U : Finset V) : 0 ≤ Y x U :=\n    Finset.sum_nonneg (fun y _ => hν.1 y)\n  -- Removing the required subset gives the exact number of extensions.\n  have extensions (S A : Finset V) (hAS : A ⊆ S) (hAw : A.card ≤ w) :\n      ((S.powersetCard w).filter (fun U => A ⊆ U)).card =\n        (S.card - A.card).choose (w - A.card) := by\n    rw [← Finset.card_sdiff_of_subset hAS, ← Finset.card_powersetCard]\n    apply Finset.card_bij (fun U _ => U \\ A)\n    · intro U hU\n      obtain ⟨hU, hAU⟩ := Finset.mem_filter.mp hU\n      obtain ⟨hUS, hc⟩ := Finset.mem_powersetCard.mp hU\n      apply Finset.mem_powersetCard.mpr\n      exact ⟨Finset.sdiff_subset_sdiff hUS (Finset.Subset.refl _),\n        by rw [Finset.card_sdiff_of_subset hAU, hc]⟩\n    · intro U hU U' hU' heq\n      have ha := (Finset.mem_filter.mp hU).2\n      have ha' := (Finset.mem_filter.mp hU').2\n      calc\n        U = (U \\ A) ∪ A := (Finset.sdiff_union_of_subset ha).symm\n        _ = (U' \\ A) ∪ A := by rw [heq]\n        _ = U' := Finset.sdiff_union_of_subset ha'\n    · intro R hR\n      obtain ⟨hRS, hc⟩ := Finset.mem_powersetCard.mp hR\n      have hdis : Disjoint R A := by\n        apply Finset.disjoint_left.mpr\n        intro a ha ha'\n        exact (Finset.mem_sdiff.mp (hRS ha)).2 ha'\n      refine ⟨R ∪ A, Finset.mem_filter.mpr ⟨?_, Finset.subset_union_right⟩, ?_⟩\n      · apply Finset.mem_powersetCard.mpr\n        refine ⟨Finset.union_subset (hRS.trans Finset.sdiff_subset) hAS, ?_⟩\n        rw [Finset.card_union_of_disjoint hdis, hc, Nat.sub_add_cancel hAw]\n      · ext a\n        simp only [Finset.mem_sdiff, Finset.mem_union]\n        have hd := Finset.disjoint_left.mp hdis\n        tauto\n  have contain_count (x y : Ω) :\n      (((Us x).filter (fun U => F y ⊆ F x ∪ U)).card : ℝ) / M =\n        (w.choose (r - (F x ∩ F y).card) : ℝ) /\n          ((n - r).choose (r - (F x ∩ F y).card) : ℝ) := by\n    let j := (F x ∩ F y).card\n    let d := r - j\n    have hj : j ≤ r := (Finset.card_le_card Finset.inter_subset_left).trans (hunif x).le\n    have hdw : d ≤ w := (Nat.sub_le _ _).trans hrw\n    have hdN : d ≤ n - r := hdw.trans hwN\n    have hA : (F y \\ F x).card = d := by\n      rw [Finset.card_sdiff, hunif y]\n    have hS : ((Finset.univ : Finset V) \\ F x).card = n - r := by\n      rw [Finset.card_sdiff_of_subset (Finset.subset_univ _), Finset.card_univ, hunif x]\n    have heq : (Us x).filter (fun U => F y ⊆ F x ∪ U) =\n        (Us x).filter (fun U => F y \\ F x ⊆ U) := by\n      ext U\n      simp only [Finset.mem_filter]\n      constructor\n      · rintro ⟨hU, hy⟩\n        refine ⟨hU, ?_⟩\n        intro a ha\n        exact (Finset.mem_union.mp (hy (Finset.mem_sdiff.mp ha).1)).resolve_left\n          (Finset.mem_sdiff.mp ha).2\n      · rintro ⟨hU, hy⟩\n        refine ⟨hU, ?_⟩\n        intro a ha\n        by_cases hx : a ∈ F x\n        · exact Finset.mem_union_left _ hx\n        · exact Finset.mem_union_right _ (hy (Finset.mem_sdiff.mpr ⟨ha, hx⟩))\n    rw [heq, extensions _ _ (Finset.sdiff_subset_sdiff (Finset.subset_univ _)\n      (Finset.Subset.refl _))\n      (by rw [hA]; exact hdw), hS, hA]\n    have hden : ((n - r).choose d : ℝ) ≠ 0 := by\n      exact_mod_cast Nat.ne_of_gt (Nat.choose_pos hdN)\n    apply (div_eq_div_iff (ne_of_gt hM) hden).mpr\n    have hc := Nat.choose_mul (n := n - r) (k := w) (s := d) hdw\n    dsimp [M]\n    exact_mod_cast (by simpa only [Nat.mul_comm] using hc.symm)\n  -- Exchange the two finite sums, then group labels by their overlap size.\n  have average (x : Ω) :\n      (∑ U ∈ Us x, Y x U) / M ≤ D * (4 * (C / 2) ^ (-(k : ℝ))) := by\n    have exchange : (∑ U ∈ Us x, Y x U) / M =\n        ∑ y : Ω, if k ≤ (F x ∩ F y).card then\n verlap x) hD.le\n  have numerical : 4 * (C / 2) ^ (-(k : ℝ)) ≤ 2 * η * η := by\n    have hbase : 0 \u003c C / 4 := by linarith\n    have hsquare : η * η = (C / 4) ^ (-(k : ℝ)) := by\n      rw [← Real.rpow_add hbase]\n      congr 1\n      ring\n    have hsplit : (C / 2) ^ (-(k : ℝ)) =\n        (C / 4) ^ (-(k : ℝ)) / (2 : ℝ) ^ k := by\n      rw [show C / 2 = C / 4 * 2 by ring,\n        Real.mul_rpow hbase.le (by norm_num), Real.rpow_neg (by norm_num : (0 : ℝ) ≤ 2),\n        Real.rpow_natCast]\n      rfl\n    have htwo : (2 : ℝ) ≤ 2 ^ k := by\n      simpa using (pow_le_pow_right₀ (by norm_num : (1 : ℝ) ≤ 2) hk.1)\n    rw [hsplit, ← hsquare, ← mul_div_assoc]\n    apply (div_le_iff₀ (by positivity : (0 : ℝ) \u003c 2 ^ k)).mpr\n    nlinarith [mul_le_mul_of_nonneg_right htwo (mul_nonneg hη.le hη.le)]\n  have markov (x : Ω) : ((H x).card : ℝ) ≤ 2 * η * M := by\n    have lower : η * D * ((H x).card : ℝ) ≤ ∑ U ∈ Us x, Y x U := by\n      calc\n        _ = ∑ U ∈ H x, η * D := by simp [mul_comm]\n        _ ≤ ∑ U ∈ H x, Y x U := Finset.sum_le_sum (fun U hU =>\n          (Finset.mem_filter.mp hU).2.le)\n        _ ≤ ∑ U ∈ Us x, Y x U := Finset.sum_le_sum_of_subset_of_nonneg\n          (Finset.filter_subset _ _) (fun U _ _ => hY x U)\n    have upper : (∑ U ∈ Us x, Y x U) ≤ (D * (4 * (C / 2) ^ (-(k : ℝ)))) * M :=\n      (div_le_iff₀ hM).mp (average x)\n    have hup := mul_le_mul_of_nonneg_right\n      (mul_le_mul_of_nonneg_left numerical hD.le) hM.le\n    have hpos : 0 \u003c η * D := mul_pos hη hD\n    apply (mul_le_mul_iff_right₀ hpos).mp\n    nlinarith [lower.trans (upper.trans hup)]\n  -- A pathological bad pair maps injectively to its outside part and intersection.\n  have eligible (x : Ω) (W : Finset V) (hW : W ∈ B x) :\n      W \\ F x ∈ H x ∧ F x ∩ W ∈ (F x).powersetCard t := by\n    obtain ⟨hsize, hbad, hinter, hpath⟩ := Finset.mem_filter.mp hW\n    have hWcard := (Finset.mem_powersetCard.mp hsize).2\n    have hU : W \\ F x ∈ Us x := by\n      apply Finset.mem_powersetCard.mp binom rt\\binom{n-r}{w}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nWe use \\noderef{UniformEdges}, \\noderef{ProbabilityMass},\n\\noderef{LabelMass}, \\noderef{KGoodPair}, and the predicate in\n\\noderef{WeightedBadPairPathological} with the displayed parameters.\nThe assumptions give $n\\geq4r$, $r\\geq1$, and\n$r\\leq w\\leq m\\leq n-r$, with $w+r\\leq n$. Thus\n$\\binom{n-r}w$, $\\binom nr$, and $\\binom{w+r}r$ are positive.\nSince $C/4>0$, also $\\eta,D,N>0$.\n\nFix $x$ and $T\\in\\binom{F(x)}t$. Write\n$U=W\\setminus F(x)$. Pairs with this $x,T$ are uniquely represented by\n$U\\in\\binom{V\\setminus F(x)}w$, with $W=U\\cup T$. Define\n\\[\nY_x(U)=\\sum_{y\\in\\Omega}\\nu(y)\n\\mathbf1_{\\{F(y)\\subseteq F(x)\\cup U,\\ |F(y)\\cap F(x)|\\geq k\\}}.\n\\]\nThis is nonnegative. If the represented pair is bad, $(F(x),U)$ is bad:\na good witness for $U\\subseteq W$ would remain a witness for $W$, since\nthe containment condition remains valid and the difference cardinality\ncan only decrease. Put $Z=F(x)\\cup U=F(x)\\cup W$.\nFor every $y$ with $F(y)\\subseteq Z$, badness for $U$ implies\n$|F(y)\\setminus U|>k$. Because $U$ is disjoint from $F(x)$ and\n$F(y)\\subseteq F(x)\\cup U$, we have\n$F(y)\\setminus U=F(y)\\cap F(x)$. In particular its cardinality is at\nleast $k$. Thus all labels contributing to $g(Z)$ contribute to $Y_x(U)$.\nNonnegative weights imply $Y_x(U)\\geq g(Z)$; pathology gives $Y_x(U)>N$.\n\nAverage over the $M=\\binom{n-r}w>0$ choices of $U$. For a fixed label\n$y$ with $|F(x)\\cap F(y)|=j$, the set $F(y)\\setminus F(x)$ has size\n$r-j$ and lies in $V\\setminus F(x)$. Its containment in $U$ is equivalent\nto $F(y)\\subseteq F(x)\\cup U$. Since $r-j\\leq r\\leq w$, one chooses\nthe remaining $w-r+j$ vertices from the $n-2r+j$ vertices outside this\nrequired set and outside $F(x)$. Thus exactly\n$\\binom{n-2r+j}{w-r+j}$ choices contain it. Interchanging the two\nfinite sums and grouping labels by $j$ therefore gives\n\\[\n\\frac1M\\sum_U Y_x(U)\n=\\sum_{j=k}^r a_j(x)\n \\frac{\\binom{n-2r+j}{w-r+j}}{\\binom{n-r}w}\n=\\sum_{j=k}^r a_j(x)\n \\frac{\\binom w{r-j}}{\\binom{n-r}{r-j}}.\n\\]\nThe second equality follows by factorial cancellation: for $a=n-r$\nand $d=r-j\\leq w\\leq a$, both ratios equal\n$w!(a-d)!/((w-d)!a!)$. All factorial arguments are nonnegative;\nthe binomial denominators are positive.\n\nApply \\noderef{WeightedBadPairHypergeometricFactor} for each $j$.\nIts hypotheses hold with $r\\geq k\\geq1$, the stated $m,n,t,p$, and\n$j\\leq r$. Since $a_j(x)\\geq0$ and $D>0$, the overlap assumption gives\n\\[\n\\frac1M\\sum_U Y_x(U)\n\\leq D\\sum_{j=k}^r a_j(x)(p/2)^{-j}\n\\leq4D(C/2)^{-k}.\n\\]\nLet $H$ be the number of $U$ with $Y_x(U)>N$. Nonnegativity implies\n$NH\\leq\\sum_UY_x(U)$, by summing $N\\leq Y_x(U)$ over these $U$ and\nthen including all the other nonnegative terms. Dividing by $NM>0$\nand using $N=\\eta D$ proves\n\\[\n\\frac HM\\leq\\frac{4(C/2)^{-k}}\\eta\\leq2\\eta.\n\\]\nFor the final inequality, positive-base power laws give\n$\\eta^2=(C/4)^{-k}$ and\n$4(C/2)^{-k}=4\\,2^{-k}\\eta^2$; since $k\\geq1$, $2^k\\geq2$,\nso $4\\,2^{-k}\\leq2$. Division by $\\eta>0$ proves it.\nThe number of pathological bad choices for each $x,T$ is at most $H$,\nhence at most $2\\eta M$. Summing over the $\\binom rt$ choices of $T$\nand over labels with weights $\\nu(x)$ yields the claimed bound because\n$\\sum_x\\nu(x)=1$. Labels were counted individually throughout;\nduplicate edges and zero-mass labels cause no change.\n\\end{proof}","tex_env":"lemma","semantic_closure":["KGoodPair","LabelMass","ProbabilityMass","UniformEdges","WeightedBadPairPathological"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"BinomialUpperTailUnnormalizedLeLower":{"name":"BinomialUpperTailUnnormalizedLeLower","title":"BinomialUpperTailUnnormalizedLeLower","kind":"lemma","is_target":false,"    \\sum_{m\u003ck\\le m+q} t_k\n    \\le\n    \\sum_{0\\le k\\le m} t_k .\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nFor each upper-tail index write $k=m+d$, where $1\\le d\\le q$.  Thus\nthe upper tail is exactly\n\\[\n    \\sum_{d=1}^{q} t_{m+d}.\n\\]\nFor the same values of $d$, the partner index is $m+1-d$.  Since\n$1\\le d\\le q\\le m$, these partner indices all lie in $\\{0,\\ldots,m\\}$,\nand they are distinct because $d\\mapsto m+1-d$ is injective on\n$\\{1,\\ldots,q\\}$.\n\nBy \\noderef{BinomialUpperPairedTermComparison}, for every\n$1\\le d\\le q$,\n\\[\n    t_{m+d}\n    =\n    \\binom{m+q}{m+d}m^{m+d}q^{q-d}\n    \\le\n    \\binom{m+q}{m+1-d}m^{m+1-d}q^{q-1+d}\n    =\n    t_{m+1-d}.\n\\]\nSumming these inequalities over $d=1,\\ldots,q$ gives\n\\[\n    \\sum_{m\u003ck\\le m+q}t_k\n    =\n    \\sum_{d=1}^{q}t_{m+d}\n    \\le\n    \\sum_{d=1}^{q}t_{m+1-d}.\n\\]\nThe final sum on the right is a sum over a subset of the lower-tail\nindices $\\{0,\\ldots,m\\}$.  Every omitted lower-tail summand is\nnonnegative, since it is a product of a binomial coefficient and powers of\nthe nonnegative natural numbers $m$ and $q$.  Therefore\n\\[\n    \\sum_{d=1}^{q}t_{m+1-d}\n    \\le\n    \\sum_{0\\le k\\le m}t_k,\n\\]\nand the claimed upper-tail bound follows.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonJensenDeltaAggregation":{"name":"FiniteJansonJensenDeltaAggregation","title":"FiniteJansonJensenDeltaAggregation","kind":"lemma","is_target":false,"imports":["FiniteBernoulliPowersetIdentities"],"imported_by":["FiniteJansonNumeratorLowerBound"],"lean_statement":"lemma FiniteJansonJensenDeltaAggregation {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, ^ (G ω).card)))) := by\n          rfl","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, and let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$.\nPut\n\\[\n  q_i=p^{|G_i|},\\qquad\n  d_i=\\sum_{j:G_i\\cap G_j\\ne\\varnothing}p^{|G_i\\cup G_j|},\n  \\qquad\n  \\mu=\\sum_i q_i,\\qquad\n  \\Delta=\\sum_i d_i .\n\\]\nIf $0\u003cp\u003c1$ and $\\Delta>0$, then for every $s\\ge0$,\n\\[\n  \\mu\\exp(-s\\Delta/\\mu)\n  \\le\n  \\sum_i q_i\\exp(-s\\,d_i/q_i).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nBy the containment-event identity in \\noderef{FiniteBernoulliPowersetIdentities},\n$q_i$ is the Bernoulli mass of the event $G_i\\subseteq Z$.  Since $0\u003cp\u003c1$\nand $G_i$ is finite, $q_i=p^{|G_i|}>0$ for every $i$.  The displayed\nassumption $\\Delta>0$ implies that the label set is nonempty in the only case\nrelevant to the conclusion, and hence\n\\[\n  \\mu=\\sum_i q_i>0.\n\\]\nTherefore the numbers $w_i=q_i/\\mu$ are nonnegative and satisfy\n$\\sum_i w_i=1$.\n\nApply finite Jensen, \\texttt{ConvexOn.map\\_sum\\_le} specialized to the\nconvex exponential function, to the finite label set with weights $w_i$\nand points $-s x_i$, where $x_i=d_i/q_i$.  It gives\n\\[\n  \\exp\\left(-s\\sum_i w_i\\,\\frac{d_i}{q_i}\\right)\n  \\le\n  \\sum_i w_i\\exp(-s\\,d_i/q_i).\n\\]\nMultiplying by the positive number $\\mu$ gives\n\\[\n  \\mu\\exp\\left(-s\\sum_i \\frac{q_i}{\\mu}\\frac{d_i}{q_i}\\right)\n  \\le\n  \\sum_i q_i\\exp(-s\\,d_i/q_i).\n\\]\nSince $q_i>0$, the sum in the exponent simplifies:\n\\[\n  \\sum_i \\frac{q_i}{\\mu}\\frac{d_i}{q_i}\n  =\n  \\frac{1}{\\mu}\\sum_i d_i\n  =\n  \\frac{\\Delta}{\\mu}.\n\\]\nSubstituting this identity is exactly the claimed aggregation bound.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","so Ω).filter (fun ω : Ω => G ω ⊆ Z)).card\n  let psi : ℝ → ℝ := fun r =>\n    ∑ Z ∈ S, W Z * Real.exp (-(r * (C Z : ℝ)))\n  have hpsi_deriv :\n      HasDerivAt psi\n        (-(∑ Z ∈ S, W Z * Real.exp (-(s * (C Z : ℝ))) * (C Z : ℝ))) s := by\n    dsimp [psi]\n    convert HasDerivAt.fun_sum (u := S)\n      (A := fun Z r => W Z * Real.exp (-(r * (C Z : ℝ))))\n      (A' := fun Z => W Z * Real.exp (-(s * (C Z : ℝ))) * (-(C Z : ℝ)))\n      (x := s) (fun Z _hZ => ?_) using 1\n    · trans ∑ Z ∈ S, -(W Z * Real.exp (-(s * (C Z : ℝ))) * (C Z : ℝ))\n      · rw [Finset.sum_neg_distrib]\n      · refine Finset.sum_congr rfl ?_\n        intro Z _hZ\n        ring\n    · have hlin : HasDerivAt (fun r : ℝ => -(r * (C Z : ℝ))) (-(C Z : ℝ)) s := by\n        convert (hasDerivAt_id s).const_mul (-(C Z : ℝ)) using 1\n        · ext r\n          simp [mul_comm]\n        · ring\n      convert hlin.exp.const_mul (W Z) using 1\n      ring\n  have hpsi_pos : 0 \u003c psi s := by\n    dsimp [psi, S, W, C]\n    refine Finset.sum_pos ?hpos ?hne\n    · intro Z _hZ\n      exact mul_pos\n        (mul_pos (pow_pos hp.1 _) (pow_pos (sub_pos.mpr hp.2) _))\n        (Real.exp_pos _)\n    · exact ⟨∅, by simp⟩\n  have hnum_eq :\n      (∑ Z ∈ S, W Z * Real.exp (-(s * (C Z : ℝ))) * (C Z : ℝ)) =\n      (∑ ω : Ω,\n        ∑ Z ∈ S.filter (fun Z : Finset V => G ω ⊆ Z),\n          W Z * Real.exp (-(s * (C Z : ℝ)))) := by\n    calc\n      (∑ Z ∈ S, W Z * Real.exp (-(s * (C Z : ℝ))) * (C Z : ℝ))\n          = ∑ Z ∈ S,\n              ∑ ω : Ω,\n                if G ω ⊆ Z then W Z * Real.exp (-(s * (C Z : ℝ))) else 0 := by\n            refine Finset.sum_congr rfl ?_\n            intro Z _hZ\n            rw [← Finset.sum_filter]\n            rw [Finset.sum_const]\n            simp [C, nsmul_eq_mul, mul_comm, mul_left_comm]\n      _ = ∑ ω : Ω,\n            ∑ Z ∈ S,\n              if G ω ⊆ Z then W Z * Real.exp (-(s * (C Z : ℝ))) else 0 := by\n            rw [Finset.sum_comm]\n      _ = ∑ ω : Ω,\n            ∑ Z ∈ S.filter (fun Z : Finset V => G ω ⊆ Z),\n              W Z * Real.exp (-(s * (C Z : ℝ))) := by\n            refine Finset.sum_congr rfl ?_\n            intro ω _hω\n            rw [Finset.sum_filter]\n  have hlog :\n      HasDerivAt (fun r : ℝ => Real.log (psi r))\n        (-(∑ Z ∈ S, W Z * Real.exp (-(s * (C Z : ℝ))) * (C Z : ℝ)) / psi s) s :=\n    hpsi_deriv.log hpsi_pos.ne'\n  change deriv (fun r : ℝ => Real.log (psi r)) s =\n    -((∑ ω : Ω,\n        ∑ Z ∈ S.filter (fun Z : Finset V => G ω ⊆ Z),\n          W Z * Real.exp (-(s * (C Z : ℝ)))) / psi s)\n  rw [hlog.deriv]\n  rw [hnum_eq]\n  ring","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, and let\n$(G_i)_{i\\in I}$ be a finite labelled family of subsets of $V$.  Define\n\\[\n\\psi(s)=\\sum_{Z\\subseteq V}p^{|Z|}(1-p)^{|V|-|Z|}\n  \\exp\\{-s\\,|\\{i:G_i\\subseteq Z\\}|\\}.\n\\]\nFor every real $s$,\n\\[\n(\\log \\psi)'(s)=\n-\\frac{\\sum_i\\sum_{Z\\supseteq G_i}\n p^{|Z|}(1-p)^{|V|-|Z|}\n \\exp\\{-s\\,|\\{j:G_j\\subseteq Z\\}|\\}}{\\psi(s)}.\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nFor each fixed $Z\\subseteq V$, the summand in $\\psi(r)$ is a constant\nBernoulli mass times the differentiable function\n$\\exp(-r\\,|\\{i:G_i\\subseteq Z\\}|)$.  Since the sum is finite,\ndifferentiation commutes with the sum.  The derivative is\n\\[\n\\psi'(s)=\n\\sum_{Z\\subseteq V}p^{|Z|}(1-p)^{|V|-|Z|}\n  \\bigl(-|\\{i:G_i\\subseteq Z\\}|\\bigr)\n  \\exp\\{-s\\,|\\{j:G_j\\subseteq Z\\}|\\}.\n\\]\nThe finite cardinality $|\\{i:G_i\\subseteq Z\\}|$ is the sum over labels of\nthe indicator of $G_i\\subseteq Z$.  Interchanging the two finite sums rewrites\n$-\\psi'(s)$ as the numerator displayed in the statement.\n\nIt remains to divide by $\\psi(s)$.  Every Bernoulli mass is nonnegative by\n$0\u003cp\u003c1$, every exponential factor is positive, and by\n\\noderef{FiniteBernoulliPowersetIdentities} the Bernoulli masses over all\n$Z\\subseteq V$ sum to $1$.  Hence at least one summand has positive total\ncontribution and $\\psi(s)>0$.  The ordinary derivative rule for the logarithm\ntherefore gives $(\\log\\psi)'(s)=\\psi'(s)/\\psi(s)$, and substituting the\npreceding formula for $\\psi'(s)$ gives the claimed identity.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"RoundedSpiroSampleSizes":{"name":"RoundedSpiroSampleSizes","title":"RoundedSpiroSampleSizes","kind":"lemma","is_target":false,"imports":["DistributionalSmootherSpread","LargestEdgeScale"],"imported_by":["StrongSpiroTheorem","IntermediateStoppingEstimate"],"lean_statement":"lemma RoundedSpiroSampleSizes {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (E : Ω → Finset V) (μ : Ω → ℝ) (q C : ℝ) (r : ℕ → ℕ)\n    (ℓ m : ℕ) (hunif : UniformEdges E (r 0))\n    (hspread : DistributionalSmootherSpread E μ q r (ℓ + 1))\n    (hC : 8 ≤ C) (hlast : 0 \u003c ℓ ∧ r ℓ = 1)\n    (hm_le : m ≤ Fintype.card V)\n    (hm : (m : ℝ) = 2 * C * (ℓ : ℝ) * q * (Fintype.card V : ℝ)) :\n    let n := Fintype.card V\n    let a := C * q * (n : ℝ)\n    let k := Nat.ceil a\n    let t := Nat.ceil ((ℓ : ℝ) * a)\n    0 \u003c n ∧ ℓ + 1 ≤ r 0 ∧ 2 * (r 0 : ℝ) \u003c a ∧ (ℓ : ℝ) ≤ a ∧\n      0 \u003c k ∧ 0 \u003c t ∧ a ≤ (k : ℝ) ∧ (ℓ : ℝ) * a ≤ (t : ℝ) ∧\n      t ≤ n ∧ (ℓ - 1) * k + t ≤ m ∧\n      (2 ≤ ℓ → (k : ℝ) ≤ (n : ℝ) / 2 ∧ 2 * r 0 ≤ k) := by","lean_proof":"classical\n  dsimp only\n  let n := Fintype.card V\n  let a := C * q * (n : ℝ)\n  let k := Nat.ceil a\n  let t := Nat.ceil ((ℓ : ℝ) * a)\n  change 0 \u003c n ∧ ℓ + 1 ≤ r 0 ∧ 2 * (r 0 : ℝ) \u003c a ∧ (ℓ : ℝ) ≤ a ∧\n    0 \u003c k ∧ 0 \u003c t ∧ a ≤ (k : ℝ) ∧ (ℓ : ℝ) * a ≤ (t : ℝ) ∧\n    t ≤ n ∧ (ℓ - 1) * k + t ≤ m ∧\n    (2 ≤ ℓ → (k : ℝ) ≤ (n : ℝ) / 2 ∧ 2 * r 0 ≤ k)\n  have hdec : ∀ j, j \u003c ℓ → r (j + 1) \u003c r j :=\n    fun j hj => hspread.2.2.2.2.2.1 j (by omega)\n  have hscale : ∀ d j, j + d = ℓ → r ℓ + d ≤ r j := by\n    intro d\n    induction d with\n    | zero => intro j hj; simp_all\n    | succ d ih =>\n      intro j hj\n      have hh := ih (j + 1) (by omega)\n      have hd := hdec j (by omega)\n      omega\n  have hr : ℓ + 1 ≤ r 0 := by\n    simpa [hlast.2, Nat.add_comm] using hscale ℓ 0 (by omega)\n  have hprob := hspread.2.2.1\n  have hex : ∃ x : Ω, 0 \u003c μ x := by\n    by_contra! h\n    have hz : (∑ x : Ω, μ x) ≤ 0 := Finset.sum_nonpos (fun x _ => h x)\n    rw [hprob.2] at hz\n    norm_num at hz\n  obtain ⟨x, hx⟩ := hex\n  have hn : 0 \u003c n := by\n    have hb := Finset.card_le_card (Finset.subset_univ (E x))\n    rw [hunif x, Finset.card_univ] at hb\n    dsimp [n]\n    omega\n  have hnR : (0 : ℝ) \u003c n := by exact_mod_cast hn\n  have hℓR : (1 : ℝ) ≤ ℓ := by exact_mod_cast hlast.1\n  have hq := hspread.1\n  have hqn : 0 \u003c q * (n : ℝ) := mul_pos hq hnR\n  have ha : 0 \u003c a := by dsimp [a]; positivity\n  have hedge := LargestEdgeScale E μ q (r 0) hprob hunif hq (by\n    intro y hy\n    apply hspread.2.2.2.2.2.2 0 (by omega) y (E y) (r 0)\n    · exact Finset.Subset.refl _\n    · rw [hunif y]; exact (hdec 0 hlast.1).le\n    · rw [hunif y]\n    · exact (hdec 0 hlast.1).le\n    · exact le_rfl)\n  have ha2 : 2 * (r 0 : ℝ) \u003c a := by\n    have he : Real.exp 1 \u003c 4 := Real.exp_one_lt_three.trans (by norm_num)\n    have he' := mul_lt_mul_of_pos_right he hqn\n    have hc := mul_le_mul_of_nonneg_right hC hqn.le\n    dsimp [a, n] at *\n    nlinarith\n  have hrR : (ℓ : ℝ) + 1 ≤ r 0 := by exact_mod_cast hr\n  have hℓa : (ℓ : ℝ) ≤ a := by linarith\n  have hak : a ≤ (k : ℝ) := Nat.le_ceil a\n  have hat : (ℓ : ℝ) * a ≤ (t : ℝ) := Nat.le_ceil _\n  have hkupper : (k : ℝ) ≤ a + 1 := (Nat.ceil_lt_add_one ha.le).le\n  have htupper : (t : ℝ) ≤ (ℓ : ℝ) * a + 1 :=\n    (Nat.ceil_lt_add_one (by positivity)).le\n  have hkpos : 0 \u003c k := by exact_mod_cast (ha.trans_le hak)\n  have htpos : 0 \u003c t := by\n    have : (0 : ℝ) \u003c t := lt_of_lt_of_le (mul_pos (by positivity) ha) hat\n    exact_mod_cast this\n  have hm' : (m : ℝ) = 2 * (ℓ : ℝ) * a := by dsimp [a, n]; rw [hm]; ring\n  have hbudget : (ℓ - 1) * k + t ≤ m := by\n    have hsub : ((ℓ - 1 : ℕ) : ℝ) = (ℓ : ℝ) - 1 := by\n      rw [Nat.cast_sub (by omega), Nat.cast_one]\n    have hmul := mul_le_mul_of_nonneg_left hkupper (sub_nonneg.mpr hℓR)\n    have hb : (((ℓ - 1) * k + t : ℕ) : ℝ) ≤ (m : ℝ) := by\n      push_cast\n      rw [hsub, hm']\n      nlinarith\n    exact_mod_cast hb\n  have htn : t ≤ n := (by omega : t ≤ m).trans hm_le\n  refine ⟨hn, hr, ha2, hℓa, hkpos, htpos, hak, hat, htn, hbudget, ?_⟩\n  intro htwo\n  have htwoR : (2 : ℝ) ≤ ℓ := by exact_mod_cast htwo\n  have hmn : (m : ℝ) ≤ n := by exact_mod_cast hm_le\n  have hprod := mul_le_mul_of_nonneg_right htwoR ha.le\n  have hkhalf : (k : ℝ) ≤ (n : ℝ) / 2 := by\n    rw [hm'] at hmn\n    nlinarith\n  refine ⟨hkhalf, ?_⟩\n  have : (2 : ℝ) * r 0 ≤ (k : ℝ) := ha2.le.trans hak\n  exact_mod_cast this","tex_statement":"\\begin{lemma}\nLet $E:\\Omega\\to\\binom V{r_0}$, let $\\mu$ be a\n$(q;r_0,\\ldots,r_\\ell)$-spread probability mass, let $\\ell>0$,\n$r_\\ell=1$, $C\\ge8$, and let $m\\le n=|V|$ be an integer with\n$m=2C\\ell qn$. Put $a=Cqn$, $k=\\lceil a\\rceil$, and\n$t=\\lceil\\ell a\\rceil$. Then\n\\[\n n>0,\\quad r_0\\ge\\ell+1,\\quad a>2r_0,\\quad a\\ge\\ell,\n \\quad k,t>0,\\quad k\\ge a,\\quad t\\ge\\ell a,\n\\]\nand $t\\le n$ and $(\\ell-1)k+t\\le m$.\nIf $\\ell\\ge2$, also $k\\le n/2$ and $k\\ge2r_0$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nBy \\noderef{DistributionalSmootherSpread}, the scales are strictly\ndecreasing positive integers. Summing $r_j\\ge r_{j+1}+1$ from $j=0$ to\n$\\ell-1$ gives $r_0\\ge r_\\ell+\\ell=\\ell+1$.\nBy \\noderef{ProbabilityMass}, some label has positive mass: otherwise all\nnonnegative weights would be zero, contradicting their sum being one.\nIts edge has $r_0>0$ vertices by \\noderef{UniformEdges}, so $n>0$.\nThe full-edge profile in \\noderef{DistributionalSmootherSpread}, with\n$S=E(x)$, interval $[r_1,r_0]$, and intersection size $r_0$, gives the\nprofile required by \\noderef{LargestEdgeScale}. Thus $r_0\\le eqn$.\nSince $qn>0$, $e\u003c4$, and $C\\ge8$,\n$2r_0\\le2eqn\u003c8qn\\le Cqn=a$.\nIn particular $a\\ge\\ell$ and $a\\ge1$.\n\nThe ceiling inequalities give $a\\le k\\le a+1$ and\n$\\ell a\\le t\\le\\ell a+1$; both ceilings are positive. Consequently\n\\[\n (\\ell-1)k+t\n \\le(\\ell-1)(a+1)+\\ell a+1\n =(2\\ell-1)a+\\ell\\le2\\ell a=m.\n\\]\nAs $\\ell-1\\ge0$, this also gives $t\\le m\\le n$.\nWhen $\\ell=1$, this calculation reads simply $t\\le a+1\\le2a=m$,\nand there are no stage samples. When $\\ell\\ge2$,\n$k\\le a+1\\le2a$ and $4a\\le2\\ell a=m\\le n$, hence $k\\le n/2$.\nFinally $k\\ge a>2r_0$ gives the asserted integer lower bound.\n\\end{proof}","tex_env":"lemma","semantic_closure":["BoundedEdges","DistributionalSmootherSpread","LabelMass","ProbabilityMass","UniformEdges"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"UniformExtensionKernelSecondMarginalConstancy":{"name":"UniformExtensionKernelSecondMarginalConstancy","title":"UniformExtensionKernelSecondMarginalConstancy","kind":"lemma","is_target":false,"imports":["UniformExtensionKernel"],"imported_by":["UniformExtensionKernelSecondMarginal"],"lean_statement":"lemma UniformExtensionKernelSecondMarginalConstancy {V : Type v} [Fintype V] [DecidableEq V]\n    (Udist : Finset V → ℝ) (m : ℕ)\n    (hinv : ∀ σ : Equiv.Perm V, ∀ U : Finset V, Udist (U.image σ) = Udist U) :\n    ∀ W W' : Finset V, W.card = m → W'.card = m →\n      Finset.sum Finset.univ (fun U : Finset V =>\n        UniformExtensionKernel Udist m (U, W)) =\n      Finset.sum Finset.univ (fun U : Finset V =>\n        UniformExtensionKernel Udist m (U, W')) := by","lean_proof":"classical\n  intro W W' hWcard hW'card\n  obtain ⟨σ, hσW⟩ : ∃ σ : Equiv.Perm V, W.image σ = W' := by\n    obtain ⟨σ, hσ⟩ :=\n      Equiv.Perm.exists_map_finset_eq W W' (hWcard.trans hW'card.symm)\n    refine ⟨σ, ?_⟩\n    simpa [Finset.map_eq_image] using hσ\n  refine Finset.sum_bij (fun U _ => U.image σ) ?_ ?_ ?_ ?_\n  · intro U hU\n    simp\n  · intro U₁ hU₁ U₂ hU₂ himage\n    change U₁.image σ = U₂.image σ at himage\n    ext x\n    constructor\n    · intro hx\n      have : σ x ∈ U₂.image σ := by\n        rw [← himage]\n        exact Finset.mem_image.mpr ⟨x, hx, rfl⟩\n      rcases Finset.mem_image.mp this with ⟨y, hy, hy_eq⟩\n      exact σ.injective hy_eq.symm ▸ hy\n    · intro hx\n      have : σ x ∈ U₁.image σ := by\n        rw [himage]\n        exact Finset.mem_image.mpr ⟨x, hx, rfl⟩\n      rcases Finset.mem_image.mp this with ⟨y, hy, hy_eq⟩\n      exact σ.injective hy_eq.symm ▸ hy\n  · intro B hB\n    refine ⟨B.image σ.symm, by simp, ?_⟩\n    change (B.image σ.symm).image σ = B\n    ext x\n    constructor\n    · intro hx\n      rcases Finset.mem_image.mp hx with ⟨y, hy, hy_eq⟩\n      rcases Finset.mem_image.mp hy with ⟨z, hz, hz_eq⟩\n      rw [← hy_eq, ← hz_eq]\n      simpa using hz\n    · intro hx\n      exact Finset.mem_image.mpr ⟨σ.symm x, Finset.mem_image.mpr ⟨x, hx, rfl⟩, by simp⟩\n  · intro U hU\n    have hcardU : (U.image σ).card = U.card := by\n      exact Finset.card_image_of_injective U σ.injective\n    have hsub : U ⊆ W ↔ U.image σ ⊆ W' := by\n      constructor\n      · intro hUW\n        rw [← hσW]\n        exact Finset.image_subset_image hUW\n      · intro hUW x hx\n        have hximg : σ x ∈ U.image σ := by\n          exact Finset.mem_image.mpr ⟨x, hx, rfl⟩\n        have hxW' : σ x ∈ W' := hUW hximg\n        rw [← hσW] at hxW'\n        rcases Finset.mem_image.mp hxW' with ⟨y, hyW, hy⟩\n        exact σ.injective hy.symm ▸ hyW\n    have hdenNat :\n        ((Finset.univ \\ (U.image σ)).powersetCard (m - (U.image σ).card)).card =\n          ((Finset.univ \\ U).powersetCard (m - U.card)).card \\le m$ is equivalent to $|\\pi(A)|\\le m$, $A\\subseteq B$ is equivalent to\n$\\pi(A)\\subseteq \\pi(B)=B'$, and $|B|=m$ is equivalent to $|B'|=m$.\nMoreover,\n\\[\n    |V\\setminus A|=|V\\setminus \\pi(A)|,\n\\]\nso the number of admissible completions used in the denominator of\n\\noderef{UniformExtensionKernel} is unchanged.  The numerator is also\nunchanged, because the hypothesis gives $\\mu(\\pi(A))=\\mu(A)$ for every\npermutation $\\pi$ and every subset $A$.\n\nThus\n\\[\n    K_\\mu(\\pi(A),B')=K_\\mu(A,B)\n\\]\nfor every $A\\subseteq V$.  Reindexing the finite sum over all subsets by the\nbijection $A\\mapsto \\pi(A)$ proves the desired equality of the two second\nmarginal values.\n\\end{proof}","tex_env":"helper","semantic_closure":["UniformExtensionKernel"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"UniformExtensionKernelSecondMarginalSupport":{"name":"UniformExtensionKernelSecondMarginalSupport","title":"UniformExtensionKernelSecondMarginalSupport","kind":"lemma","is_target":false,"imports":["UniformExtensionKernel"],"imported_by":["UniformExtensionKernelSecondMarginal"],"lean_statement":"lemma UniformExtensionKernelSecondMarginalSupport {V : Type v} [Fintype V] [DecidableEq V]\n    (Udist : Finset V → ℝ) (m : ℕ) :\n    ∀ W : Finset V, W.card ≠ m →\n      Finset.sum Finset.univ (fun U : Finset V =>\n        UniformExtensionKernel Udist m (U, W)) = 0 := by","lean_proof":"intro W hW\n  apply Finset.sum_eq_zero\n  intro U _hU\n  simp [UniformExtensionKernel, hW]","tex_statement":"\\begin{helper}\nFor the kernel $K_\\mu$ of \\noderef{UniformExtensionKernel}, the second\nmarginal has no mass away from the $m$-subsets: if $|B|\\ne m$, then\n\\[\n    \\sum_{A\\subseteq V} K_\\mu(A,B)=0.\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nFix a subset $B$ with $|B|\\ne m$.  By the definition in\n\\noderef{UniformExtensionKernel},
