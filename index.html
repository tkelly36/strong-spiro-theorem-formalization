lity $p^kq^{n-k}$, so\n\\[\n    \\Pr(|Z|=k)=b_k .\n\\]\nIt remains to prove\n\\[\n    B_{m,n}(p):=\\sum_{k=0}^m\\binom nk p^k(1-p)^{n-k}\\ge \\frac12\n    \\qquad\\text{when }p=\\frac mn .\n\\]\n\nWe first record an exact integral identity for $B_{m,n}$.  For\n$x\\in[0,1]$, termwise differentiation gives\n\\begin{align*}\n B'_{m,n}(x)\n &= \\sum_{k=1}^m k\\binom nk x^{k-1}(1-x)^{n-k}\n    -\\sum_{k=0}^m (n-k)\\binom nk x^k(1-x)^{n-k-1}  \\\\\n &= n\\sum_{j=0}^{m-1}\\binom{n-1}j x^j(1-x)^{n-1-j}\n    -n\\sum_{k=0}^{m}\\binom{n-1}k x^k(1-x)^{n-1-k}  \\\\\n &= -\\,n\\binom{n-1}m x^m(1-x)^{n-1-m}.\n\\end{align*}\nHere we used\n$k\\binom nk=n\\binom{n-1}{k-1}$ and\n$(n-k)\\binom nk=n\\binom{n-1}k$, and all terms except the last one telescope.\nSince $B_{m,n}(1)=0$,\n\\[\n    B_{m,n}(p)\n    = n\\binom{n-1}m\n      \\int_p^1 x^m(1-x)^{n-1-m}\\,dx .       \\tag{1}\n\\]\nTaking the lower limit to be $0$ in the same identity and using\n$B_{m,n}(0)=1$ shows that the same constant times the integral over $[0,1]$\nis $1$.\n\nSuppose first that $m\u003cn/2$.  Put $a=m$ and $b=n-1-m$, so\n$0\u003ca\\le b$, and set\n\\[\n    x_0=\\frac{a}{a+b}=\\frac{m}{n-1}.\n\\]\nBecause $p=m/n=a/(a+b+1)$, we have $p\u003cx_0$.  We compare the two parts of\nthe integral of $f(x)=x^a(1-x)^b$ around $x_0$.  For $0\\le e\\le a$, the\npoints\n\\[\n    x_-=\\frac{a-e}{a+b},\\qquad\n    x_+=\\frac{a+e}{a+b}\n\\]\nlie symmetrically on the two sides of $x_0$, with equal absolute\nJacobians $dx_\\pm/de=1/(a+b)$.  The desired pointwise comparison is\n\\[\n    (a-e)^a(b+e)^b\\le (a+e)^a(b-e)^b .      \\tag{2}\n\\]\nFor $0\\le e\u003ca$, after dividing by the positive right-hand side, (2) is\nequivalent to\n\\[\n    \\left(\\frac{a-e}{a+e}\\right)^a\n    \\le\n    \\left(\\frac{b-e}{b+e}\\right)^b .\n\\]\nFor fixed $e$, the function\n\\[\n    c\\longmapsto\n    c\\log\\!\\left(\\frac{c-e}{c+e}\\right)\n\\]\nis increasing on $c>e$: indeed\n\\[\n    c\\log\\!\\left(\\frac{c-e}{c+e}\\right)\n    =\n    -2e\\sum_{j\\ge0}\\frac{(e/c)^{2j}}{2j+1},\n\\]\nand, apart from the constant first term, every summand decreases as $c$\nincreases.  Since $a\\le b$, this proves the displayed inequality; the\nendpoint $e=a$ follows by continuity.  Integrating the paired inequalities\ntherefore bounds the integral over $[0,x_0]$ by the integral over\n$[x_0,2x_0]$, and hence gives\n\\[\n    \\int_0^{x_0} f(x)\\,dx \\le \\int_{x_0}^1 f(x)\\,dx .\n\\]\nAs $p\u003cx_0$, it follows that\n\\[\n    \\int_0^{p} f(x)\\,dx \u003c \\int_p^1 f(x)\\,dx .\n\\]\nUsing the normalization following (1), this implies\n$B_{m,n}(p)>1/2$.\n\nIt remains to handle $m\\ge n/2$.  Now put $q_0=n-m$ and use the\nunnormalized masses\n\\[\n    t_k=\\binom nk m^kq_0^{\\,n-k}.\n\\]\nSince $p=m/n$ and $1-p=q_0/n$, the binomial probability $b_k$ is exactly\n$t_k/n^n$.  For $1\\le d\\le q_0$, pair the upper-tail term\n$t_{m+d}$ with the lower-tail term $t_{m+1-d}$.  Let\n$r_d=t_{m+d}/t_{m+1-d}$.  Direct cancellation gives\n\\[\n    r_1=\\frac{t_{m+1}}{t_m}=\\frac{m}{m+1}\u003c1.\n\\]\nFor $1\\le d\u003cq_0$, another cancellation gives\n\\[\n    \\frac{r_{d+1}}{r_d}\n    =\n    \\frac{(q_0+d)(q_0-d)m^2}\n         {(m+1+d)(m+1-d)q_0^2}.\n\\]\nThe denominator is larger than the numerator, because their difference is\n\\[\n    \\bigl((m+1)^2-d^2\\bigr)q_0^2\n       -\\bigl(q_0^2-d^2\\bigr)m^2\n    =(2m+1)q_0^2+(2m-n)nd^2>0,\n\\]\nusing $q_0>0$ and $2m\\ge n$.  Hence $r_{d+1}\u003cr_d$, and consequently\n$r_d\u003c1$ for every $1\\le d\\le q_0$.  Thus\n\\[\n    t_{m+d}\u003ct_{m+1-d}\\qquad(1\\le d\\le q_0).\n\\]\nThe upper tail $\\sum_{k=m+1}^n t_k$ consists exactly of the terms\n$t_{m+d}$ for $1\\le d\\le q_0$, and their partners\n$t_{m+1-d}$ are distinct terms among $t_0,\\ldots,t_m$.  Therefore\n\\[\n    \\sum_{k=m+1}^n t_k \u003c \\sum_{k=0}^m t_k.\n\\]\nDividing by $n^n$ gives\n\\[\n    \\Pr(|Z|>m)\u003c\\Pr(|Z|\\le m),\n\\]\nso again $\\Pr(|Z|\\le m)>1/2$.\n\nCombining the two cases proves $\\Pr(|Z|\\le m)\\ge1/2$.  Finally, expanding\nthe event by the possible subsets gives exactly the displayed sum:\n\\[\n    \\Pr(|Z|\\le m)\n    =\n    \\sum_{\\substack{U\\subseteq V\\\\ |U|\\le m}}\n        p^{|U|}(1-p)^{|V|-|U|}.\n\\]\nThis proves the asserted finite Bernoulli-subset estimate.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonOneLabelNumeratorSeparation":{"name":"FiniteJansonOneLabelNumeratorSeparation","title":"FiniteJansonOneLabelNumeratorSeparation","kind":"lemma","is_target":false,"imports":["FiniteBernoulliPowersetIdentities","FiniteJansonFixedLabelSeparation","FiniteProductHarrisKleitman"],"imported_by":["FiniteJansonNumeratorLowerBound"],"lean_statement":"lemma FiniteJansonOneLabelNumeratorSeparation {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            p ^ (G pair.1 ∪ G pair.2).card\n          else 0)) :\n    ∀ s : ℝ, 0 ≤ s →\n        (Finset.univ : Finset Ω).sum\n          (fun ω : Ω =>\n            p ^ (G ω).card *\n              Real.exp\n                (-(s *\n                  (((Finset.univ : Finset Ω).sum\n                    (fun ω' : Ω =>\n                      if (G ω ∩ G ω').Nonempty then\n                        p ^ (G ω ∪ G ω').card\n                      else 0)) /\n                    p ^ (G ω).card)))) ≤\n        (((Finset.univ : Finset Ω).sum\n          (fun ω : Ω =>\n            Finset.sum\n              (((Finset.univ : Finset V).powerset).filter\n                (fun Z : Finset V => G ω ⊆ Z))\n              (fun Z : Finset V =>\n                (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n                  Real.exp\n                    (-(s *\n                      (((Finset.univ : Finset Ω).filter\n                        (fun ω' : Ω => G ω' ⊆ Z)).card : ℝ)))))) /\n          (Finset.sum ((Finset.univ : Finset V).powerset)\n            (fun Z : Finset V =>\n              (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n                Real.exp\n                  (-(s *\n                    (((Finset.univ : Finset Ω).filter\n                      (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))))) := by","lean_proof":"classical\n  intro s hs\n  let ψ : ℝ :=\n    Finset.sum ((Finset.univ : Finset V).powerset)\n      (fun Z : Finset V =>\n        (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n          Real.exp\n            (-(s *\n              (((Finset.univ : Finset Ω).filter\n                (fun ω : Ω => G ω ⊆ Z)).card : ℝ))))\n  have hp0 : 0 \u003c p := hp.1\n  have hp1 : 0 \u003c 1 - p := sub_pos.mpr hp.2\n  have hψpos : 0 \u003c ψ := by\n    refine Finset.sum_pos' (s := (Finset.univ : Finset V).powerset)\n      (f := fun Z : Finset V =>\n        (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n          Real.exp\n            (-(s *\n              (((Finset.univ : Finset Ω).filter\n                (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))) ?_ ?_\n    · intro Z _hZ\n      exact mul_nonneg\n        (mul_nonneg (pow_nonneg (le_of_lt hp0) _)\n          (pow_nonneg (le_of_lt hp1) _))\n        (le_of_lt (Real.exp_pos _))\n    · refine ⟨∅, by simp, ?_⟩\n      exact mul_pos\n        (mul_pos (pow_pos hp0 _) (pow_pos hp1 _))\n        (Real.exp_pos _)\n  have hsum_mul :\n      ψ *\n          (Finset.univ : Finset Ω).sum\n            (fun ω : Ω =>\n              p ^ (G ω).card *\n                Real.exp\n                  (-(s *\n                    (((Finset.univ : Finset Ω).sum\n                      (fun ω' : Ω =>\n                        if (G ω ∩ G ω').Nonempty then\n                          p ^ (G ω ∪ G ω').card\n                        else 0)) /\n                      p ^ (G ω).card)))) ≤\n        (Finset.univ : Finset Ω).sum\n          (fun ω : Ω =>\n            Finset.sum\n              (((Finset.univ : Finset V).powerset).filter\n                (fun Z : Finset V => G ω ⊆ Z))\n              (fun Z : Finset V =>\n                (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n                  Real.exp\n                    (-(s *\n                      (((Finset.univ : Finset Ω).filter\n                        (fun ω' : Ω => G ω' ⊆ Z)).card : ℝ))))) := by\n    rw [Finset.mul_sum]\n    refine Finset.sum_le_sum ?_\n    intro ω _hω\n    simpa [ψ] using\n      FiniteJansonFixedLabelSeparation G p hp hnonempty ω s hs\n  exact (le_div_iff₀ hψpos).mpr (by simpa [mul_comm] using hsum_mul)","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$, and\nwrite\n\\[\n  Y(Z)=|\\{j:G_j\\subseteq Z\\}|,\\qquad\n  \\psi(s)=\\mathbb E e^{-sY(Z)}.\n\\]\nFor each fixed label $i$, put\n\\[\n  q_i=p^{|G_i|},\\qquad\n  d_i=\\sum_{j:G_i\\cap G_j\\ne\\varnothing}p^{|G_i\\cup G_j|}.\n\\]\nIf $0\u003cp\u003c1$, $\\Delta>0$, and $s\\ge0$, then\n\\[\n  \\sum_i q_i e^{-s d_i/q_i}\n  \\le\n  \\frac{\\sum_i\\sum_{Z\\supseteq G_i}\n    p^{|Z|}(1-p)^{|V|-|Z|}e^{-sY(Z)}}{\\psi(s)} .\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nFix a label $i$ and let $A_i$ be the event $G_i\\subseteq Z$.  By\n\\noderef{FiniteBernoulliPowersetIdentities}, its Bernoulli mass is\n$q_i=p^{|G_i|}$; this is positive because $0\u003cp\u003c1$.  Conditional on $A_i$,\nthe vertices of $G_i$ are forced to be present, while the remaining vertices\nretain their independent Bernoulli product law.\n\nLet $Y_i$ count those labels $j$ for which $G_i\\cap G_j\\ne\\varnothing$ and\n$G_j\\subseteq Z$, and let $Z_i$ count the remaining contained labels.  On the\nresidual product space, adding vertices can only increase both counts.  Since\n$s\\ge0$, the functions $e^{-sY_i}$ and $e^{-sZ_i}$ are decreasing.  Applying\n\\noderef{FiniteProductHarrisKleitman} to the residual Bernoulli product law\ntherefore gives\n\\[\n  \\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\n  \\ge\n  \\mathbb E(e^{-sY_i}\\mid A_i)\\,\n  \\mathbb E(e^{-sZ_i}\\mid A_i).\n\\]\nThe variable $Z_i$ only uses labels disjoint from $G_i$, so its residual\nconditional distribution is the same as its unconditioned product\ndistribution on those coordinates.  Also $Y_i\\ge0$, hence\n$e^{-sY_i}\\le1$ and $e^{-sZ_i}\\ge e^{-s(Y_i+Z_i)}=e^{-sY}$.  Consequently\n\\[\n  \\mathbb E(I_i e^{-sY})\n  =\n  q_i\\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\n  \\ge\n  q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i)\\,\\psi(s).\n\\]\n\nApply finite Jensen, \\texttt{ConvexOn.map\\_sum\\_le} specialized to the\nconvex exponential function, to the conditional finite probability space\n$A_i$, with points $-sY_i$.  The conditional weights are the Bernoulli atom\nmasses divided by $q_i$, so they are nonnegative and sum to $1$.  It gives\n\\[\n  \\mathbb E(e^{-sY_i}\\mid A_i)\n  \\ge\n  \\exp(-s\\,\\mathbb E(Y_i\\mid A_i)).\n\\]\nAgain by \\noderef{FiniteBernoulliPowersetIdentities},\n\\[\n  q_i\\,\\mathbb E(Y_i\\mid A_i)\n  =\n  \\sum_{j:G_i\\cap G_j\\ne\\varnothing}\\Pr(A_i\\cap A_j)\n  =\n  d_i.\n\\]\nThus\n\\[\n  \\mathbb E(I_i e^{-sY})\\ge q_i e^{-s d_i/q_i}\\psi(s).\n\\]\n\nSumming this inequality over $i$ and using $\\psi(s)>0$ gives the desired\ndivision by $\\psi(s)$.  The denominator is positive because every Bernoulli\natom mass and every exponential factor is nonnegative, every exponential\nfactor is in fact positive, and\n\\noderef{FiniteBernoulliPowersetIdentities} states that the total Bernoulli\nmass over all subsets of $V$ is $1$.  Written out as finite subset sums,\n$\\sum_i\\mathbb E(I_i e^{-sY})$ is exactly the numerator displayed in the\nstatement, so the finite-sum inequality is precisely the claimed bound.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"WeightedBadPairEstimate":{"name":"WeightedBadPairEstimate","title":"WeightedBadPairEstimate","kind":"lemma","is_target":false,"imports":["KGoodPair","LabelMass","ProbabilityMass","UniformEdges","WeightedBadPairNonpathologicalCount","WeightedBadPairPathologicalCount"],"imported_by":["StageExpectedBadMass"],"lean_statement":"lemma WeightedBadPairEstimate {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq Ω] [Fintype V] [DecidableEq V]\n    (F : Ω → Finset V) (ν : Ω → ℝ) (r k m : ℕ) (C p : ℝ)\n    (hν : ProbabilityMass ν)\n    (hunif : UniformEdges F r)\n    (hk : 1 ≤ k ∧ k ≤ r)\n    (hC : 8 ≤ C)\n    (hp : 0 \u003c p ∧ p ≤ (1 / 2 : ℝ))\n    (hm : (m : ℝ) = p * (Fintype.card V : ℝ))\n    (hm_large : 2 * r ≤ m)\n    (hoverlap : ∀ x : Ω,\n      Finset.sum (Finset.Icc k r)\n        (fun j : ℕ =>\n          LabelMass ν (fun y : Ω => (F x ∩ F y).card = j) *\n            (p / 2) ^ (-(j : ℝ))) ≤\n        4 * (C / 2) ^ (-(k : ℝ))) :\n    Finset.sum Finset.univ (fun x : Ω =>\n      ν x *\n        (((@Finset.filter (Finset V)\n          (fun W : Finset V => ¬ KGoodPair F k x W)\n          (Classical.decPred (fun W : Finset V => ¬ KGoodPair F k x W))\n          ((Finset.univ : Finset V).powersetCard m)).card : ℝ) /\n        ((((Finset.univ : Finset V).powersetCard m).card : ℕ) : ℝ)))\n      ≤ 3 * (C / 4) ^ (-(k : ℝ) / 2) := by","lean_proof":"classical\n  let n := Fintype.card V\n  let η := (C / 4) ^ (-(k : ℝ) / 2)\n  let A := (Finset.univ : Finset V).powersetCard m\n  have hm_small : 2 * m ≤ n := by\n    have hn : (0 : ℝ) ≤ n := Nat.cast_nonneg _\n    have h := mul_le_mul_of_nonneg_right hp.2 hn\n    rw [← hm] at h\n    have : (2 * m : ℝ) ≤ n := by linarith\n    exact_mod_cast this\n  have hrn : r ≤ n := by omega\n  have hrm : r ≤ m := by omega\n  have hfixed (t : ℕ) (ht : t ≤ r) :\n      (∑ x : Ω, ν x * ((A.filter (fun W =>\n        ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t)).card : ℝ)) ≤\n      3 * η * (r.choose t : ℝ) * ((n-r).choose (m-t) : ℝ) := by\n    have hN := WeightedBadPairNonpathologicalCount F ν r k m t C\n      hν hunif hk hC hm_large hm_small ht\n    have hP := WeightedBadPairPathologicalCount F ν r k m t C p\n      hν hunif hk hC hp hm hm_large hm_small ht hoverlap\n    have hsplit (x : Ω) :\n        ((A.filter (fun W => ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t)).card : ℝ) =\n        ((A.filter (fun W => ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t ∧\n          ¬ WeightedBadPairPathological F ν r k m C t x W)).card : ℝ) +\n        ((A.filter (fun W => ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t ∧\n          WeightedBadPairPathological F ν r k m C t x W)).card : ℝ) := by\n      have h := Finset.card_filter_add_card_filter_not\n        (s := A.filter (fun W => ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t))\n        (fun W => WeightedBadPairPathological F ν r k m C t x W)\n      simp only [Finset.filter_filter, and_assoc] at h\n      exact_mod_cast (by omega : _ = _)\n    calc\n      _ = (∑ x : Ω, ν x * ((A.filter (fun W =>\n          ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t ∧\n          ¬ WeightedBadPairPathological F ν r k m C t x W)).card : ℝ)) +\n          (∑ x : Ω, ν x * ((A.filter (fun W =>\n          ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t ∧\n          WeightedBadPairPathological F ν r k m C t x W)).card : ℝ)) := by\n        rw [← Finset.sum_add_distrib]\n        apply Finset.sum_congr rfl\n        intro x hx\n        rw [hsplit, mul_add]\n      _ ≤ η * (r.choose t : ℝ) * ((n-r).choose (m-t) : ℝ) +\n          2 * η * (r.choose t : ℝ) * ((n-r).choose (m-t) : ℝ) := add_le_add hN hP\n      _ = _ := by ring\n  have hpartition (x : Ω) :\n      ((A.filter (fun W => ¬ KGoodPair F k x W)).card : ℝ) =\n      ∑ t ∈ Finset.range (r+1),\n        ((A.filter (fun W => ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t)).card : ℝ) := by\n    have h := Finset.card_eq_sum_card_fiberwise\n      (s := A.filter (fun W => ¬ KGoodPair F k x W))\n      (t := Finset.range (r+1)) (f := fun W => (F x ∩ W).card)\n      (by\n        intro W hW\n        change (F x ∩ W).card ∈ Finset.range (r+1)\n        apply Finset.mem_range.mpr\n        have : (F x ∩ W).card ≤ r := by\n          simpa only [hunif x] using Finset.card_le_card (Finset.inter_subset_left (s₁ := F x) (s₂ := W))\n        omega)\n    simpa only [Nat.cast_sum, Finset.filter_filter] using congrArg (fun a : ℕ => (a : ℝ)) h\n  have hvand : (∑ t ∈ Finset.range (r+1),\n      (r.choose t : ℝ) * ((n-r).choose (m-t) : ℝ)) = (n.choose m : ℝ) := by\n    have h := Nat.add_choose_eq r (n-r) m\n    rw [Finset.Nat.sum_antidiagonal_eq_sum_range_succ_mk] at h\n    have htrunc : (∑ t ∈ Finset.range (r+1), r.choose t * (n-r).choose (m-t)) =\n        ∑ t ∈ Finset.range (m+1), r.choose t * (n-r).choose (m-t) := by\n      apply Finset.sum_subset\n      · exact Finset.range_mono (by omega)\n      · intro t ht htr\n        have hrt : r \u003c t := by simpa only [Finset.mem_range, not_lt] using htr\n        rw [Nat.choose_eq_zero_of_lt hrt, zero_mul]\n    rw [← htrunc, Nat.add_sub_of_le hrn] at h\n    exact_mod_cast h.symm\n  have htotal : (∑ x : Ω, ν x *\n      ((A.filter (fun W => ¬ KGoodPair F k x W)).card : ℝ)) ≤\n      3 * η * (n.choose m : ℝ) := by\n    calc\n      _ = ∑ t ∈ Finset.range (r+1), ∑ x : Ω, ν x *\n          ((A.filter (fun W => ¬ KGoodPair F k x W ∧ (F x ∩ W).card = t)).card : ℝ) := by\n        simp_rw [hpartition, Finset.mul_sum]\n        rw [Finset.sum_comm]\n      _ ≤ ∑ t ∈ Finset.range (r+1),\n          3 * η * (r.choose t : ℝ) * ((n-r).choose (m-t) : ℝ) := by\n        apply Finset.sum_le_sum\n        intro t ht\n        exact hfixed t (by simpa only [Finset.mem_range, Nat.lt_succ_iff] using ht)\n      _ = _ := by\n        simp_rw [mul_assoc (3 * η)]\n        rw [← Finset.mul_sum, hvand]\n  have hden : (0 : ℝ) \u003c (n.choose m : ℝ) := by\n    exact_mod_cast Nat.choose_pos (show m ≤ n by omega)\n  have hA : (A.card : ℝ) = (n.choose m : ℝ) := by\n    simp [A, n, Finset.card_powersetCard]\n  have hprob : (∑ x : Ω, ν x *\n      (((A.filter (fun W => ¬ KGoodPair F k x W)).card : ℝ) / (A.card : ℝ))) ≤ 3 * η := by\n    simp_rw [← mul_div_assoc]\n    simp_rw [div_eq_mul_inv]\n    rw [← Finset.sum_mul, hA]\n    rw [← div_eq_mul_inv]\n    exact (div_le_iff₀ hden).mpr htotal\n  convert hprob using 1\n  apply Finset.sum_congr rfl\n  intro x hx\n  congr 3\n  congr 1\n  exact Finset.filter_congr_decidable _ _ _","tex_statement":"\\begin{lemma}\nLet $V$ be an $n$-element set, let $F:\\Omega\\to\\binom Vr$, and let $\\nu$ be a\nprobability distribution on $\\Omega$.  Let $k\\in[r]$, let $C\\geq8$, and let\n$p\\in(0,1/2]$ be such that $m=pn$ is an integer and $m\\geq2r$.  For\n$x\\in\\Omega$ and $j\\in[0,r]$, set\n\\[\n    a_j(x)=\\nu\\bigl(\\{y\\in\\Omega:|F(x)\\cap F(y)|=j\\}\\bigr).\n\\]\nSuppose that, for every $x\\in\\Omega$,\n\\[\n    \\sum_{j=k}^r a_j(x)\\left(\\frac p2\\right)^{-j}\n    \\leq4\\left(\\frac C2\\right)^{-k}.\n\\]\nIf $x$ is sampled according to $\\nu$ and $W$ is sampled independently and\nuniformly from $\\binom Vm$, then\n\\[\n    \\Pr\\bigl((F(x),W)\\text{ is }k\\text{-bad}\\bigr)\n    \\leq3\\left(\\frac C4\\right)^{-k/2}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nThe terms ``$k$-good'' and ``$k$-bad'' are those of\n\\noderef{KGoodPair}.  Put\n\\[\n    \\eta=\\left(\\frac C4\\right)^{-k/2}.\n\\]\nFor each $t\\in[0,r]$, let $\\mathcal B_t$ be the set of pairs $(x,W)$ with\n$|F(x)\\cap W|=t$ for which $(F(x),W)$ is $k$-bad.  We bound the\n$\\nu$-weighted number of pairs in each $\\mathcal B_t$.\n\nFix $t$ and set $w=m-t$.  If $(x,W)\\in\\mathcal B_t$, then\n$|F(x)\\cup W|=r+w$.  Define\n\\[\n    D=\\frac{\\binom{w+r}{r}}{\\binom nr}\n      =\\frac{\\binom{n-r}{w}}{\\binom n{w+r}},\n    \\qquad N=\\eta D.\n\\]\nFor $Z\\in\\binom V{w+r}$ let\n\\[\n    g(Z)=\\nu\\bigl(\\{x:F(x)\\subseteq Z\n       \\text{ and }(F(x),Z\\setminus F(x))\\text{ is }k\\text{-bad}\\}\\bigr).\n\\]\nCall $Z$ pathological when $g(Z)>N$, and call a pair pathological when\n$F(x)\\cup W$ is pathological.\n\nFirst consider nonpathological pairs in $\\mathcal B_t$.  Such a pair is\nspecified by $Z=F(x)\\cup W$, then by the label $x$, and then by\n$T=F(x)\\cap W$.  There are $\\binom n{w+r}$ choices for $Z$.  If\n$(F(x),W)$ is $k$-bad, then $(F(x),W\\setminus F(x))$ is still $k$-bad:\ndeleting exposed vertices cannot create a witness satisfying\n\\noderef{KGoodPair}, because any witness contained in\n$F(x)\\cup(W\\setminus F(x))$ is also contained in $F(x)\\cup W$.  Thus, for\nnonpathological $Z$, the total possible $\\nu$-mass of labels $x$ is at most\n$N$.  Finally there are $\\binom rt$ choices for $T$.  The nonpathological\nweighted count is therefore at most\n\\[\n    \\binom n{w+r}N\\binom rt\n    =\\eta\\binom rt\\binom{n-r}{w}.\n\\]\n\nNow fix $x$ and $T\\in\\binom{F(x)}t$, and write $W'=W\\setminus F(x)$.  For\n$W'\\in\\binom{V\\setminus F(x)}w$ define\n\\[\n    Y_x(W')=\\nu\\bigl(\\{y:F(y)\\subseteq F(x)\\cup W'\n       \\text{ and }|F(y)\\cap F(x)|\\geq k\\}\\bigr).\n\\]\nIf the corresponding pair is pathological and $k$-bad, then for every\n$y$ counted by $g(F(x)\\cup W')$ the badness condition forces\n$|F(y)\\setminus W'|>k$.  Since $F(y)\\subseteq F(x)\\cup W'$, this implies\n$|F(y)\\cap F(x)|\\ge k$, and hence $Y_x(W')>N$.\n\nWhen $W'$ is uniform in $\\binom{V\\setminus F(x)}w$, the contribution from\nlabels $y$ with $|F(x)\\cap F(y)|=j$ is exactly the probability that the\n$r-j$ vertices of $F(y)\\setminus F(x)$ all lie in $W'$.  Hence\n\\[\n    \\mathbb E Y_x(W')\n    =\\sum_{j=k}^r a_j(x)\n       \\frac{\\binom w{r-j}}{\\binom{n-r}{r-j}}.\n\\]\nFor each $j$ this hypergeometric factor is at most\n$D(p/2)^{-j}$: write it with falling factorials, use\n$w\\le m\\le n/2\\le n-r$ to compare the numerator factors with the denominator\nfactors, and use $w=m-t\\ge m-r\\ge m/2=pn/2$.  The assumed overlap-moment\nbound then gives\n\\[\n    \\mathbb E Y_x(W')\\le4D\\left(\\frac C2\\right)^{-k}.\n\\]\nBy Markov's inequality and $N=\\eta D$, the proportion of $W'$ with\n$Y_x(W')>N$ is at most\n\\[\n    \\frac{4(C/2)^{-k}}{\\eta}\\le2\\eta,\n\\]\nwhere the last inequality is equivalent to $2\\le2^k$ and follows from\n$k\\ge1$.  Summing over the labels $x$ with weights $\\nu(x)$ and the\n$\\binom rt$ choices of $T$ shows that the pathological weighted count is at\nmost\n\\[\n    2\\eta\\binom rt\\binom{n-r}{w}.\n\\]\n\nCombining the two counts, the weighted number of bad pairs in\n$\\mathcal B_t$ is at most\n$3\\eta\\binom rt\\binom{n-r}{m-t}$.  Summing over $t$ and using Vandermonde's\nidentity,\n\\[\n    \\sum_{t=0}^r \\binom rt\\binom{n-r}{m-t}=\\binom nm,\n\\]\ngives a total weighted count at most $3\\eta\\binom nm$.  Dividing by the\nnumber $\\binom nm$ of possible uniform choices of $W$ proves the stated\nprobability bound.\n\\end{proof}","tex_env":"lemma","semantic_closure":["KGoodPair","LabelMass","ProbabilityMass","UniformEdges"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"AnchoredTerminalBinomialMiss":{"name":"AnchoredTerminalBinomialMiss","title":"Anchored binomial miss bound","kind":"lemma","is_target":false,"imports":["FiniteBernoulliUniformVariance","LabelMass","ProbabilityMass"],"imported_by":["AnchoredTerminalEstimate"],"lean_statement":"lemma AnchoredTerminalBinomialMiss {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (E F : Ω → Finset V) (μ : Ω → ℝ) (P : Ω → Prop) [DecidablePred P]\n    (q γ α : ℝ) (r : ℕ)\n    (hprob : ProbabilityMass μ)\n    (hmass : (1 / 2 : ℝ) ≤ LabelMass μ P)\n    (hFcard : ∀ x : Ω, P x → (F x).card = r)\n    (hFsub : ∀ x : Ω, P x → F x ⊆ E x)\n    (hq : 0 \u003c q ∧ q ≤ 1)\n    (hγ : 0 \u003c γ ∧ γ ≤ 1)\n    (hα : 0 \u003c α ∧ α ≤ 1 ∧ 8 * q ≤ α)\n    (hprofile : ∀ x : Ω, P x → ∀ t : ℕ, 1 ≤ t → t ≤ r →\n      LabelMass μ (fun y : Ω => (E y ∩ F x).card = t) ≤ γ * q ^ t) :\n    Finset.sum (((Finset.univ : Finset V).powerset).filter\n      (fun Z : Finset V => ∀ x : Ω, P x → ¬ F x ⊆ Z))\n      (fun Z : Finset V =>\n        (3 * α / 8) ^ Z.card *\n          (1 - 3 * α / 8) ^ (Fintype.card V - Z.card)) ≤ 8 * γ * q / α := by","lean_proof":"classical\n  let b := LabelMass μ P\n  have hb : 0 \u003c b := by dsimp [b]; linarith\n  let ν : Ω → ℝ := fun x => (if P x then μ x else 0) / b\n  have hνsupport (x : Ω) (hx : ¬ P x) : ν x = 0 := by simp [ν, hx]\n  have hν : ProbabilityMass ν := by\n    constructor\n    · intro x\n      dsimp [ν]\n      split_ifs \u003c;> positivity [hprob.1 x]\n    · dsimp [ν]\n      rw [← Finset.sum_div]\n      rw [← Finset.sum_filter]\n      change LabelMass μ P / b = 1\n      exact div_self hb.ne'\n  have hdom (x : Ω) : ν x ≤ 2 * μ x := by\n    by_cases hx : P x\n    · simp only [ν, if_pos hx]\n      apply (div_le_iff₀ hb).2\n      have hmass' : (1 / 2 : ℝ) ≤ b := hmass\n      nlinarith [hprob.1 x]\n    · rw [hνsupport x hx]\n      positivity [hprob.1 x]\n  let β := 3 * α / 8\n  have hβ : 0 \u003c β := by dsimp [β]; positivity [hα.1]\n  have hβone : β ≤ 1 := by dsimp [β]; linarith [hα.2.1]\n  let t := β⁻¹\n  have ht : 0 ≤ t := le_of_lt (inv_pos.mpr hβ)\n  have htone : 1 ≤ t := (one_le_inv₀ hβ).2 hβone\n  let s := q * t\n  have hs : 0 ≤ s := mul_nonneg hq.1.le ht\n  have hsle : s ≤ (1 / 3 : ℝ) := by\n    change q * β⁻¹ ≤ (1 / 3 : ℝ)\n    rw [← div_eq_mul_inv, div_le_iff₀ hβ]\n    dsimp [β]\n    linarith [hα.2.2]\n  have hgeom : (∑ h ∈ Finset.Icc 1 r, s ^ h) ≤ (3 / 2 : ℝ) * s := by\n    have h := geom_sum_Ico_le_of_lt_one (m := 1) (n := r + 1) hs\n      (by linarith : s \u003c 1)\n    rw [Finset.Ico_add_one_right_eq_Icc, pow_one] at h\n    apply h.trans\n    apply (div_le_iff₀ (by linarith : 0 \u003c 1 - s)).2\n    nlinarith [mul_nonneg hs (show 0 ≤ 1 - 3 * s by linarith)]\n  have hconstant : 3 * γ * s = 8 * γ * q / α := by\n    dsimp [s, t, β]\n    field_simp\n  have hoverlap (x : Ω) (hx : P x) :\n      (∑ y, if (F x ∩ F y).card = 0 then 0\n        else ν y * t ^ (F x ∩ F y).card) ≤ 8 * γ * q / α := by\n    let J : Ω → ℕ := fun y => (F x ∩ F y).card\n    let H : Ω → ℕ := fun y => (E y ∩ F x).card\n    have hJH (y : Ω) (hy : P y) : J y ≤ H y := by\n      apply Finset.card_le_card\n      intro v hv\n      obtain ⟨hvx, hvy⟩ := Finset.mem_inter.mp hv\n      exact Finset.mem_inter.mpr ⟨hFsub y hy hvy, hvx⟩\n    have hHr (y : Ω) : H y ≤ r :=\n      (Finset.card_le_card Finset.inter_subset_right).trans_eq (hFcard x hx)\n    have hregroup : (∑ h ∈ Finset.Icc 1 r,\n        LabelMass μ (fun y => H y = h) * t ^ h) =\n        ∑ y, if H y ∈ Finset.Icc 1 r then μ y * t ^ H y else 0 := by\n      simp only [LabelMass, Finset.sum_filter, Finset.sum_mul, ite_mul, zero_mul]\n      rw [Finset.sum_comm]\n      apply Finset.sum_congr rfl\n      intro y _\n      simp [Finset.sum_ite_eq]\n    calc\n      (∑ y, if J y = 0 then 0 else ν y * t ^ J y) ≤\n          2 * ∑ y, if H y ∈ Finset.Icc 1 r then μ y * t ^ H y else 0 := by\n        rw [Finset.mul_sum]\n        apply Finset.sum_le_sum\n        intro y _\n        by_cases hy : P y\n        · by_cases hj : J y = 0\n          · rw [if_pos hj]\n            apply mul_nonneg (by norm_num)\n            split_ifs \u003c;> positivity [hprob.1 y]\n          · have hHy : H y ∈ Finset.Icc 1 r :=\n              Finset.mem_Icc.mpr ⟨(Nat.one_le_iff_ne_zero.mpr hj).trans (hJH y hy), hHr y⟩\n            rw [if_neg hj, if_pos hHy]\n            calc\n              ν y * t ^ J y ≤ (2 * μ y) * t ^ J y :=\n                mul_le_mul_of_nonneg_right (hdom y) (pow_nonneg ht _)\n              _ ≤ (2 * μ y) * t ^ H y :=\n                mul_le_mul_of_nonneg_left (pow_le_pow_right₀ htone (hJH y hy))\n                  (by positivity [hprob.1 y])\n              _ = 2 * (μ y * t ^ H y) := by ring\n        · simp only [hνsupport y hy, zero_mul, ite_self]\n          apply mul_nonneg (by norm_num)\n          split_ifs \u003c;> positivity [hprob.1 y]\n      _ = 2 * ∑ h ∈ Finset.Icc 1 r, LabelMass μ (fun y => H y = h) * t ^ h := by\n        rw [hregroup]\n      _ ≤ 2 * ∑ h ∈ Finset.Icc 1 r, (γ * q ^ h) * t ^ h := by\n        apply mul_le_mul_of_nonneg_left _ (by norm_num)\n        apply Finset.sum_le_sum\n        intro h hh\n        exact mul_le_mul_of_nonneg_right\n          (hprofile x hx h (Finset.mem_Icc.mp hh).1 (Finset.mem_Icc.mp hh).2)\n          (pow_nonneg ht h)\n      _ = 2 * γ * ∑ h ∈ Finset.Icc 1 r, s ^ h := by\n        simp only [s, mul_pow, Finset.mul_sum]\n        apply Finset.sum_congr rfl\n        intro h _\n        ring\n      _ ≤ 2 * γ * ((3 / 2 : ℝ) * s) :=\n        mul_le_mul_of_nonneg_left hgeom (by positivity [hγ.1])\n      _ = 8 * γ * q / α := by rw [← hconstant]; ring\n  let S := (Finset.univ : Finset V).powerset\n  let w : Finset V → ℝ := fun Z =>\n    β ^ Z.card * (1 - β) ^ (Fintype.card V - Z.card)\n  let X : Finset V → ℝ := fun Z => ∑ x, if F x ⊆ Z then ν x else 0\n  let M := β ^ r\n  have hM : 0 \u003c M := pow_pos hβ r\n  have hw (Z : Finset V) : 0 ≤ w Z := by\n    dsimp [w]\n    exact mul_nonneg (pow_nonneg hβ.le _) (pow_nonneg (sub_nonneg.mpr hβone) _)\n  have havg : (∑ x, ν x * ∑ y,\n      if (F x ∩ F y).card = 0 then 0 else ν y * t ^ (F x ∩ F y).card) ≤\n      8 * γ * q / α := by\n    calc\n      _ ≤ ∑ x, ν x * (8 * γ * q / α) := by\n        apply Finset.sum_le_sum\n        intro x _\n        by_cases hx : P x\n        · exact mul_le_mul_of_nonneg_left (hoverlap x hx) (hν.1 x)\n        · simp [hνsupport x hx]\n      _ = 8 * γ * q / α := by rw [← Finset.sum_mul, hν.2, one_mul]\n  have hvariance : (∑ Z ∈ S, w Z * (X Z - M) ^ 2) ≤ M ^ 2 * (8 * γ * q / α) := by\n    exact (FiniteBernoulliUniformVariance F ν P β r hν hνsupport hFcard ⟨hβ, hβone⟩).trans\n      (mul_le_mul_of_nonneg_left havg (sq_nonneg M))\n  let D : Finset V → Prop := fun Z => ∀ x, P x → ¬ F x ⊆ Z\n  have hmiss (Z : Finset V) (hZ : D Z) : X Z = 0 := by\n    apply Finset.sum_eq_zero\n    intro x _\n    by_cases hx : P x\n    · simp [hZ x hx]\n    · simp [hνsupport x hx]\n  have hmarkov : M ^ 2 * (∑ Z ∈ S.filter D, w Z) ≤\n      ∑ Z ∈ S, w Z * (X Z - M) ^ 2 := by\n    rw [Finset.sum_filter, Finset.mul_sum]\n    apply Finset.sum_le_sum\n    intro Z _\n    by_cases hZ : D Z\n    · rw [if_pos hZ, hmiss Z hZ]\n      nlinarith\n    · rw [if_neg hZ, mul_zero]\n      exact mul_nonneg (hw Z) (sq_nonneg _)\n  exact le_of_mul_le_mul_left (hmarkov.trans hvariance) (sq_pos_of_pos hM)","tex_statement":"\\begin{lemma}[Anchored binomial miss bound]\nLet $V$ and $\\Omega_0$ be finite sets, let $\\mu$ be a probability mass on\n$\\Omega_0$, and let $P\\subseteq\\Omega_0$ have mass at least $1/2$.\nLet $E,F:\\Omega_0\\to2^V$, and let $r\\ge0$ be an integer such that\n$|F(x)|=r$ and $F(x)\\subseteq E(x)$ for every $x\\in P$.\nSuppose $q,\\gamma,\\alpha\\in(0,1]$, $8q\\le\\alpha$, and, for every $x\\in P$\nand every integer $1\\le t\\le r$,\n\\[\n \\sum_{y:\\,|E(y)\\cap F(x)|=t}\\mu(y)\\le\\gamma q^t.\n\\]\nPut $n=|V|$ and $\\beta=3\\alpha/8$.  Then\n\\[\n \\sum_{\\substack{Z\\subseteq V:\\ F(x)\\nsubseteq Z\\ \\text{for all }x\\in P}}\n       \\beta^{|Z|}(1-\\beta)^{n-|Z|}\n \\le \\frac{8\\gamma q}{\\alpha}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nBy \\noderef{ProbabilityMass}, $\\mu(y)\\ge0$ and $\\sum_y\\mu(y)=1$.\nWrite $b=\\sum_{x\\in P}\\mu(x)$, the mass defined in \\noderef{LabelMass}.\nThen $1/2\\le b\\le1$, so $b>0$.  Define\n$\\nu(x)=\\mu(x)/b$ for $x\\in P$, and $\\nu(x)=0$ otherwise.\nThus $\\nu\\ge0$, $\\sum_{x\\in P}\\nu(x)=1$, and $\\nu(x)\\le2\\mu(x)$ for\nevery $x$.  The last inequality follows from $b\\ge1/2$ on $P$ and from\n$\\mu(x)\\ge0$ outside $P$.\n\nWe have $0\u003c\\beta\\le3/8\u003c1$.  On all subsets of $V$ put\n$w(Z)=\\beta^{|Z|}(1-\\beta)^{n-|Z|}$.  These weights are nonnegative and\nsum to $(\\beta+(1-\\beta))^n=1$: expand the product over the vertices,\nchoosing a factor $\\beta$ for vertices in $Z$ and $1-\\beta$ for vertices\noutside $Z$.  Write $\\mathbb E$ for the resulting finite weighted sum.\nFor any fixed $A\\subseteq V$,\n\\[\n \\Pr(A\\subseteq Z)\n =\\sum_{B\\subseteq V\\setminus A}\n    \\beta^{|A|+|B|}(1-\\beta)^{n-|A|-|B|}\n =\\beta^{|A|}.\n\\]\nIndeed, the sum remaining after taking out $\\beta^{|A|}$ is\n$(\\beta+(1-\\beta))^{n-|A|}=1$.\n\nLet $I_x(Z)$ be the indicator of $F(x)\\subseteq Z$, and set\n$X(Z)=\\sum_{x\\in P}\\nu(x)I_x(Z)$.  The preceding identity and\n$|F(x)|=r$ give $M:=\\mathbb EX=\\beta^r>0$.\nFor $x,y\\in P$, put $j_{xy}=|F(x)\\cap F(y)|$.\nSince $|F(x)\\cup F(y)|=2r-j_{xy}$, we have\n$\\mathbb E(I_xI_y)=\\beta^{2r-j_{xy}}$.\nExpanding the square and using $\\sum_{x\\in P}\\nu(x)=1$ therefore gives\n\\[\n \\frac{\\mathbb E[(X-M)^2]}{M^2}\n =\\sum_{x,y\\in P}\\nu(x)\\nu(y)(\\beta^{-j_{xy}}-1)\n \\le\\sum_{x\\in P}\\nu(x)\n       \\sum_{\\substack{y\\in P:\\ j_{xy}\\ge1}}\\nu(y)\\beta^{-j_{xy}}.\n\\]\nHere $\\mathbb E[(X-M)^2]=\\mathbb E[X^2]-M^2$ follows by expansion and\n$\\mathbb EX=M$.  Terms with $j_{xy}=0$ vanish exactly, and the other\nterms are bounded by dropping the subtracted $1$, with nonnegative\ncoefficients $\\nu(x)\\nu(y)$.\n\nFix $x\\in P$.  For $y\\in P$ set $h_y=|E(y)\\cap F(x)|$.\nThe anchoring $F(y)\\subseteq E(y)$ implies $j_{xy}\\le h_y$, and\n$h_y\\le |F(x)|=r$.  If $j_{xy}\\ge1$, then $1\\le h_y\\le r$ and,\nbecause $0\u003c\\beta\u003c1$, $\\beta^{-j_{xy}}\\le\\beta^{-h_y}$.\nUsing $\\nu(y)\\le2\\mu(y)$, grouping by $h_y$, and then enlarging each\ngroup to all labels of $\\Omega_0$ with that value of $h_y$, yields\n\\[\n \\begin{aligned}\n \\sum_{\\substack{y\\in P:\\ j_{xy}\\ge1}}\\nu(y)\\beta^{-j_{xy}}\n &\\le2\\sum_{t=1}^r\\beta^{-t}\n                \\sum_{y:\\,|E(y)\\cap F(x)|=t}\\mu(y)\\\\\n &\\le2\\gamma\\sum_{t=1}^r(q/\\beta)^t.\n \\end{aligned}\n\\]\nAll enlargements are valid because every summand is nonnegative.\nPut $s=q/\\beta=8q/(3\\alpha)$.  Then $0\u003cs\\le1/3$.\nThe finite geometric identity\n$(1-s)\\sum_{t=1}^r s^t=s-s^{r+1}\\le s$ implies\n\\[\n 2\\gamma\\sum_{t=1}^r s^t\n \\le\\frac{2\\gamma s}{1-s}\n \\le3\\gamma s=\\frac{8\\gamma q}{\\alpha}.\n\\]\nThis also holds for $r=0$, when the sum is empty.  Averaging over $x$\nwith weights $\\nu(x)$ proves\n$\\mathbb E[(X-M)^2]/M^2\\le8\\gamma q/\\alpha$.\n\nLet $D$ be the event that every active fragment is missed.  On $D$, every\n$I_x$ with $x\\in P$ is zero, hence $X=0$ and $(X-M)^2=M^2$.\nOn its complement the squared deviation is nonnegative, so pointwise\n$M^2\\mathbf1_D\\le(X-M)^2$.  Multiplying by $w(Z)$ and summing gives\n$\\Pr(D)\\le\\mathbb E[(X-M)^2]/M^2$, proving the claim.  This uses only\n$D\\Rightarrow X=0$, not its converse: labels of weight zero cause no\nproblem.  In particular no positivity of $r$ was needed.  If $r=0$,\nthe same calculation has $X=M=1$ and zero variance, so $\\Pr(D)=0$.\n\\end{proof}","tex_env":"lemma","semantic_closure":["LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"UniformExtensionKernelProbabilityMass":{"name":"UniformExtensionKernelProbabilityMass","title":"UniformExtensionKernelProbabilityMass","kind":"lemma","is_target":false,"imports":["UniformExtensionKernel","UniformExtensionKernelFirstMarginal"],"imported_by":["UniformExtensionKernelSecondMarginal","UniformExtensionCoupling"],"lean_statement":"lemma UniformExtensionKernelProbabilityMass {V : Type v} [Fintype V] [DecidableEq V]\n    (Udist : Finset V → ℝ) (m : ℕ)\n    (hprob : ProbabilityMass Udist)\n    (hsize : ∀ U : Finset V, 0 \u003c Udist U → U.card ≤ m)\n    (hm : m ≤ Fintype.card V) :\n    ProbabilityMass (UniformExtensionKernel Udist m) := by","lean_proof":"constructor\n  · rintro ⟨U, W⟩\n    unfold UniformExtensionKernel\n    split_ifs\n    · exact mul_nonneg (hprob.1 U) (inv_nonneg.mpr (by positivity))\n    · positivity\n  · calc\n      ∑ UW : Finset V × Finset V, UniformExtensionKernel Udist m UW\n          = ∑ U : Finset V, ∑ W : Finset V,\n              UniformExtensionKernel Udist m (U, W) := by\n            rw [Fintype.sum_prod_type]\n      _ = ∑ U : Finset V, Udist U := by\n            apply Finset.sum_congr rfl\n            intro U _hU\n            exact UniformExtensionKernelFirstMarginal Udist m hprob hsize hm U\n      _ = 1 := hprob.2","tex_statement":"\\begin{lemma}\nLet $\\mu$ be a probability mass on subsets of a finite set $V$, let\n$m\\le |V|$, and assume that $\\mu(A)>0$ implies $|A|\\le m$.  Then the kernel\n$K_\\mu$ of \\noderef{UniformExtensionKernel} is a probability mass on ordered\npairs $(A,B)$ of subsets of $V$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nWe use \\noderef{ProbabilityMass} for the meaning of probability mass.  First,\nevery value of $K_\\mu$ is nonnegative.  By the definition of $K_\\mu$ in\n\\noderef{UniformExtensionKernel}, there are two cases.  In the zero case the\nvalue is $0$, which is nonnegative.  In the nonzero case, the same definition\ngives\n\\[\n    \\mu(A)\\left|\\binom{V\\setminus A}{m-|A|}\\right|^{-1}.\n\\]\nThe factor $\\mu(A)$ is nonnegative because $\\mu$ is a probability mass, and\nthe reciprocal factor is nonnegative because it is the reciprocal of the\nreal number associated to a finite cardinality.  Hence all kernel values are\nnonnegative.\n\nIt remains to show that the total mass is one.  Sum first over $B$ for each\nfixed $A$, and then over $A$.  By\n\\noderef{UniformExtensionKernelFirstMarginal}, the inner sum over $B$ equals\n$\\mu(A)$ for every $A$.  Therefore\n\\[\n    \\sum_{A,B}K_\\mu(A,B)=\\sum_A \\mu(A)=1,\n\\]\nwhere the last equality is the total-mass clause of\n\\noderef{ProbabilityMass}.  Thus $K_\\mu$ is a probability mass on pairs.\n\\end{proof}","tex_env":"lemma","semantic_closure":["ProbabilityMass","UniformExtensionKernel"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonNumeratorLowerBound":{"name":"FiniteJansonNumeratorLowerBound","title":"FiniteJansonNumeratorLowerBound","kind":"lemma","is_target":false,"imports":["FiniteBernoulliPowersetIdentities","FiniteJansonJensenDeltaAggregation","FiniteJansonOneLabelNumeratorSeparation","FiniteProductHarrisKleitman"],"imported_by":["FiniteJansonLogDerivativeBound"],"lean_statement":"lemma FiniteJansonNumeratorLowerBound {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            p ^ (G pair.1 ∪ G pair.2).card\n          else 0)) :\n    ∀ s : ℝ, 0 ≤ s →\n      ((Finset.univ : Finset Ω).sum\n        (fun ω : Ω => p ^ (G ω).card)) *\n          Real.exp\n            (-(s *\n              (Finset.sum\n                ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n                (fun pair : Ω × Ω =>\n                  if (G pair.1 ∩ G pair.2).Nonempty then\n                    p ^ (G pair.1 ∪ G pair.2).card\n                  else 0) /\n              (Finset.univ : Finset Ω).sum\n                (fun ω : Ω => p ^ (G ω).card)))) ≤\n        (((Finset.univ : Finset Ω).sum\n          (fun ω : Ω =>\n            Finset.sum\n              (((Finset.univ : Finset V).powerset).filter\n                (fun Z : Finset V => G ω ⊆ Z))\n              (fun Z : Finset V =>\n                (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n                  Real.exp\n                    (-(s *\n                      (((Finset.univ : Finset Ω).filter\n                        (fun ω' : Ω => G ω' ⊆ Z)).card : ℝ)))))) /\n          (Finset.sum ((Finset.univ : Finset V).powerset)\n            (fun Z : Finset V =>\n              (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n                Real.exp\n                  (-(s *\n                    (((Finset.univ : Finset Ω).filter\n                      (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))))) := by","lean_proof":"classical\n  intro s hs\n  have hagg := FiniteJansonJensenDeltaAggregation G p hp hnonempty hDelta s hs\n  have hsep := FiniteJansonOneLabelNumeratorSeparation G p hp hnonempty hDelta s hs\n  exact hagg.trans hsep","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$,\nand put\n\\[\n\\psi(s)=\\mathbb E e^{-s|\\{i:G_i\\subseteq Z\\}|},\\qquad\n\\mu=\\sum_i p^{|G_i|},\\qquad\n\\Delta=\\sum_{i,j:G_i\\cap G_j\\ne\\varnothing}p^{|G_i\\cup G_j|}.\n\\]\nAssume $0\u003cp\u003c1$ and $\\Delta>0$.  Then for every $s\\ge0$,\n\\[\n\\mu e^{-s\\Delta/\\mu}\\le\n\\frac{\\sum_i\\sum_{Z\\supseteq G_i}\n p^{|Z|}(1-p)^{|V|-|Z|}\n e^{-s|\\{j:G_j\\subseteq Z\\}|}}{\\psi(s)} .\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nBy \\noderef{FiniteBernoulliPowersetIdentities}, the event\n$A_i=\\{G_i\\subseteq Z\\}$ has Bernoulli mass $q_i=p^{|G_i|}$ and\n$A_i\\cap A_j$ has Bernoulli mass $p^{|G_i\\cup G_j|}$.  The assumptions\n$0\u003cp\u003c1$ and $G_i\\ne\\varnothing$ imply $q_i>0$, while $\\Delta>0$ implies\n$\\mu=\\sum_i q_i>0$.\n\nFix $i$ and condition on $A_i$.  The vertices of $G_i$ are forced to be\npresent, and the remaining vertices retain their independent Bernoulli\nproduct law.  Split the count $Y$ as $Y_i+Z_i$, where $Y_i$ counts labels\nwhose sets meet $G_i$ and $Z_i$ counts labels whose sets are disjoint from\n$G_i$.  On the residual product space, adding vertices can only increase\nboth $Y_i$ and $Z_i$; since $s\\ge0$, both $e^{-sY_i}$ and $e^{-sZ_i}$ are\ndecreasing.  Applying \\noderef{FiniteProductHarrisKleitman} to these two\ndecreasing functions gives\n\\[\n \\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\\ge\n \\mathbb E(e^{-sY_i}\\mid A_i)\\mathbb E(e^{-sZ_i}\\mid A_i).\n\\]\nThe disjoint part $Z_i$ depends only on labels supported outside $G_i$, so\nunder the residual product law its expectation is the corresponding\nunconditioned expectation; and $e^{-sY_i}\\le1$.  Thus\n\\[\n\\mathbb E(I_i e^{-sY})\\ge\nq_i\\,\\mathbb E(e^{-sY_i}\\mid A_i)\\,\\psi(s).\n\\]\nSumming over $i$ and dividing by the positive $\\psi(s)$ gives\n\\[\n\\frac{\\sum_i\\mathbb E(I_i e^{-sY})}{\\psi(s)}\n\\ge\n\\sum_i q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i).\n\\]\n\nFor each $i$, finite Jensen, \\texttt{ConvexOn.map\\_sum\\_le} specialized to\nthe convex exponential function, applied to the conditional finite\nprobability distribution on $A_i$ with points $-sY_i$ gives\n$\\mathbb E(e^{-sY_i}\\mid A_i)\\ge e^{-s\\mathbb E(Y_i\\mid A_i)}$.  Applying\n\\texttt{ConvexOn.map\\_sum\\_le} for the exponential again to the label\nweights $q_i/\\mu$ and points $-s\\mathbb E(Y_i\\mid A_i)$,\nwhich are nonnegative and sum to $1$, yields\n\\[\n\\sum_i q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i)\n\\ge\n\\mu\\exp\\left(-\\frac{s}{\\mu}\\sum_i q_i\\mathbb E(Y_i\\mid A_i)\\right).\n\\]\nFinally,\n\\[\nq_i\\mathbb E(Y_i\\mid A_i)\n=\\sum_{j:G_i\\cap G_j\\ne\\varnothing}\\Pr(A_i\\cap A_j),\n\\]\nbecause $Y_i$ is the sum of exactly those intersecting indicators.  Summing\nover $i$ and using the second intersection identity from\n\\noderef{FiniteBernoulliPowersetIdentities} identifies the total with\n$\\Delta$.  This proves the displayed lower bound.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"StageExpectedBadMass":{"name":"StageExpectedBadMass","title":"StageExpectedBadMass","kind":"lemma","is_target":false,"imports":["AnchoredOverlapMoment","DistributionalSmootherSpread cted bad mass.\n  have hexchange :\n      (∑ W ∈ A, B W) / (A.card : ℝ) =\n        ∑ x : S, ν x *\n          (((A.filter (fun W => ¬ KGoodPair Fs (r (i + 1)) x W)).card : ℝ) /\n            (A.card : ℝ)) := by\n    simp_rw [hB]\n    rw [Finset.sum_comm]\n    rw [Finset.sum_div]\n    simp_rw [← mul_div_assoc]\n    apply Finset.sum_congr rfl\n    intro x _\n    congr 1\n    rw [← Finset.sum_filter]\n    simp only [Finset.sum_const, nsmul_eq_mul, mul_comm]\n  have hexpect : (∑ W ∈ A, B W) / (A.card : ℝ) ≤\n      3 * (C / 4) ^ (-(r (i + 1) : ℝ) / 2) := by\n    rw [hexchange]\n    convert hestimate using 1\n    apply Finset.sum_congr rfl\n    intro x _\n    congr 3\n    congr 1\n    ext W\n    simp only [Finset.mem_filter]\n    rfl\n  convert hexpect using 1\n  congr 1\n  apply Finset.sum_congr rfl\n  intro W _\n  dsimp only [B, bad, Fs]\n  congr 1","tex_statement":"\\begin{lemma}\nLet $E,F:\\Omega\\to2^V$ be finite labelled families and $S\\subseteq\\Omega$.\nLet $\\mu$ be $(q;r_0,\\ldots,r_\\ell)$-spread, with positive decreasing\ninteger scales, and let $\\nu$ be a probability mass supported on $S$ with\n$\\nu(y)\\le2\\mu(y)$ for every label. Assume $|F(x)|=r_i$ and\n$F(x)\\subseteq E(x)$ for $x\\in S$. Let $\\ell>0$, $i+1\u003c\\ell$, $C\\ge8$,\n$p=Cq\\in(0,1/2]$, and let $k=p|V|$ be an integer with $k\\ge2r_i$.\nFor a uniform $k$-subset $W$ of $V$, set\n\\[\n B(W)=\\nu\\{x\\in S:(F(x),W)\\text{ is }r_{i+1}\\text{-bad in }F(S)\\}.\n\\]\nThen $\\mathbb E B(W)\\le3(C/4)^{-r_{i+1}/2}$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nRestrict the label space to $S$. Since $\\nu$ vanishes off $S$, its\nrestriction is still a probability mass, by \\noderef{ProbabilityMass}.\nFor $x\\in S$ and $h\\in[r_{i+1},r_i]$, the definition\n\\noderef{DistributionalSmootherSpread}, applied to the anchored set $F(x)$\nof size $r_i$, gives\n$\\mu\\{y:|E(y)\\cap F(x)|=h\\}\\le q^h$.\nThe support, domination, anchoring, cardinality, and parameter assumptions\ntherefore satisfy \\noderef{AnchoredOverlapMoment}, which gives\n\\[\n \\sum_{j=r_{i+1}}^{r_i}\n \\nu\\{y\\in S:|F(x)\\cap F(y)|=j\\}(p/2)^{-j}\n \\le4(C/2)^{-r_{i+1}}.\n\\]\nHere $1\\le r_{i+1}\\le r_i$ follows from the positive decreasing scales.\nApply \\noderef{WeightedBadPairEstimate} to this restricted family and\nprobability mass. Its numerical assumptions are precisely $C\\ge8$,\n$0\u003cp\\le1/2$, $k=p|V|$, and $k\\ge2r_i$. It bounds\n\\[\n \\sum_{x\\in S}\\nu(x)\n \\frac{|\\{W\\in\\binom Vk:(F(x),W)\\text{ is }r_{i+1}\\text{-bad}\\}|}\n {|\\binom Vk|}\n \\le3(C/4)^{-r_{i+1}/2}.\n\\]\nExpanding the mass by \\noderef{LabelMass} and interchanging the two finite\nsums identifies the left side with $\\mathbb E B(W)$. This proves the\nclaim without any hypothesis on a final sample size.\n\\end{proof}","tex_env":"lemma","semantic_closure":["BoundedEdges","DistributionalSmootherSpread","KGoodPair","LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"UniformExtensionKernelSecondMarginal":{"name":"UniformExtensionKernelSecondMarginal","title":"UniformExtensionKernelSecondMarginal","kind":"lemma","is_target":false,"imports":["UniformExtensionKernel","UniformExtensionKernelFirstMarginal","UniformExtensionKernelProbabilityMass","UniformExtensionKernelSecondMarginalConstancy","UniformExtensionKernelSecondMarginalSupport"],"imported_by":["UniformExtensionCoupling"],"lean_statement":"lemma UniformExtensionKernelSecondMarginal {V : Type v} [Fintype V] [DecidableEq V]\n    (Udist : Finset V → ℝ) (m : ℕ)\n    (hprob : ProbabilityMass Udist)\n    (hsize : ∀ U : Finset V, 0 \u003c Udist U → U.card ≤ m)\n    (hinv : ∀ σ : Equiv.Perm V, ∀ U : Finset V, Udist (U.image σ) = Udist U)\n    (hm : m ≤ Fintype.card V) :\n    ∀ W : Finset V,\n      Finset.sum Finset.univ (fun U : Finset V =>\n        UniformExtensionKernel Udist m (U, W)) =\n          if W.card = m then\n            (((((Finset.univ : Finset V).powersetCard m).card : ℕ) : ℝ))⁻¹\n          else 0 := by","lean_proof":"intro W\n  by_cases hW : W.card = m\n  · rw [if_pos hW]\n    let S : Finset (Finset V) := (Finset.univ : Finset V).powersetCard m\n    let lam : Finset V → ℝ := fun X =>\n      Finset.sum Finset.univ (fun U : Finset V => UniformExtensionKernel Udist m (U, X))\n    have hWmem : W ∈ S := by\n      dsimp [S]\n      rw [Finset.mem_powersetCard]\n      exact ⟨by intro x _hx; simp, hW⟩\n    have hS_nonempty : S.Nonempty := ⟨W, hWmem⟩\n    have hS_card_ne_nat : S.card ≠ 0 := Finset.card_ne_zero.mpr hS_nonempty\n    have hS_card_ne : ((S.card : ℕ) : ℝ) ≠ 0 := by\n      exact_mod_cast hS_card_ne_nat\n    have hsum_univ_eq_sum_S : Finset.sum Finset.univ lam = Finset.sum S lam := by\n      symm\n      refine Finset.sum_subset (by intro X _hX; simp) ?_\n      intro X _hXuniv hXnot\n      have hXcard_ne : X.card ≠ m := by\n        intro hXcard\n        apply hXnot\n        dsimp [S]\n        rw [Finset.mem_powersetCard]\n        exact ⟨by intro x _hx; simp, hXcard⟩\n      change Finset.sum Finset.univ\n          (fun U : Finset V => UniformExtensionKernel Udist m (U, X)) = 0\n      exact UniformExtensionKernelSecondMarginalSupport Udist m X hXcard_ne\n    have hsum_S_const : Finset.sum S lam = ((S.card : ℕ) : ℝ) * lam W := by\n      calc\n        Finset.sum S lam = Finset.sum S (fun _X : Finset V => lam W) := by\n          apply Finset.sum_congr rfl\n          intro X hX\n          have hXmem : X ∈ (Finset.univ : Finset V).powersetCard m := by\n            simpa only [S] using hX\n          have hXcard : X.card = m := (Finset.mem_powersetCard.mp hXmem).2\n          dsimp [lam]\n          exact UniformExtensionKernelSecondMarginalConstancy Udist m hinv X W hXcard hW\n        _ = ((S.card : ℕ) : ℝ) * lam W := by\n          simp [Finset.sum_const, nsmul_eq_mul]\n    have htotal : Finset.sum Finset.univ lam = 1 := by\n      dsimp [lam]\n      have hmass := (UniformExtensionKernelProbabilityMass Udist m hprob hsize hm).2\n      rw [Fintype.sum_prod_type] at hmass\n      rw [Finset.sum_comm]\n      exact hmass\n    have hmul : ((S.card : ℕ) : ℝ) * lam W = 1 := by\n      rw [← hsum_S_const, ← hsum_univ_eq_sum_S]\n      exact htotal\n    have hlam : lam W = (((S.card : ℕ) : ℝ))⁻¹ := by\n      have := congrArg (fun z : ℝ => (((S.card : ℕ) : ℝ))⁻¹ * z) hmul\n      simpa [mul_assoc, hS_card_ne] using this\n    dsimp [lam] at hlam\n    simpa [S] using hlam\n  · rw [if_neg hW]\n    exact UniformExtensionKernelSecondMarginalSupport Udist m W hW","tex_statement":"\\begin{lemma}\nLet $\\mu$ be a probability mass on subsets of a finite set $V$.  Suppose that\n$\\mu$ is invariant under every permutation of $V$, that $\\mu(A)>0$ implies\n$|A|\\le m$, and that $m\\le |V|$.  For the kernel $K_\\mu$ of\n\\noderef{UniformExtensionKernel}, the second marginal is the uniform\nprobability mass on the $m$-subsets:\n\\[\n    \\sum_{A\\subseteq V} K_\\mu(A,B)=\n    \\begin{cases}\n    |\\binom Vm|^{-1},& |B|=m,\\\\\n    0,& |B|\\ne m.\n    \\end{cases}\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nLet\n\\[\n    \\lambda(B)=\\sum_{A\\subseteq V} K_\\mu(A,B).\n\\]\nFirst, $\\lambda$ is supported on $m$-subsets.  Indeed every nonzero term\n$K_\\mu(A,B)$ in \\noderef{UniformExtensionKernel} requires $|B|=m$, so if\n$|B|\\ne m$ then every summand is zero and $\\lambda(B)=0$.\n\nNext, $\\lambda$ is invariant under every permutation of $V$.  Fix a\npermutation $\\pi$ of $V$.  The map $A\\mapsto \\pi(A)$ is a bijection on the\nsubsets of $V$.  The definition of \\noderef{UniformExtensionKernel} is\nequivariant under this bijection: the conditions $|A|\\le m$, $A\\subseteq B$,\nand $|B|=m$ are equivalent to the corresponding conditions for\n$\\pi(A)\\subseteq \\pi(B)$, and\n$|V\\setminus A|=|V\\setminus \\pi(A)|$.  The value of $\\mu$ is unchanged by\nthe permutation by hypothesis.  Therefore\n$K_\\mu(\\pi(A),\\pi(B))=K_\\mu(A,B)$ for every $A,B$.  Reindexing the finite sum\nover all $A$ gives $\\lambda(\\pi(B))=\\lambda(B)$.\n\nThe permutation group acts transitively on the family of $m$-subsets of\n$V$: if $B$ and $B'$ both have cardinality $m$, choose a bijection from $B$\nto $B'$ and a bijection from $V\\setminus B$ to $V\\setminus B'$; their union\nis a permutation of $V$ sending $B$ to $B'$.  Hence the invariant function\n$\\lambda$ is constant on all $m$-subsets.  Let this common value be $c$.\n\nFinally, \\noderef{UniformExtensionKernelProbabilityMass} gives total mass\none for $K_\\mu$ on ordered pairs $(A,B)$.  Expanding the finite sum over\npairs as an iterated sum and interchanging the two finite sums gives\n\\[\n    \\sum_B \\lambda(B)\n    =\\sum_B\\sum_A K_\\mu(A,B)\n    =\\sum_A\\sum_B K_\\mu(A,B)\n    =\\sum_{(A,B)} K_\\mu(A,B)\n    =1,\n\\]\nusing the total-mass clause of \\noderef{ProbabilityMass} for the last\nequality.  Since $\\lambda$ is\nzero off the $m$-subsets and is equal to $c$ on each $m$-subset, this same\ntotal is\n\\[\n    |\\binom Vm|\\,c.\n\\]\nThe inequality $m\\le |V|$ ensures that $\\binom Vm$ is nonempty, so its\ncardinality is positive.  Therefore\n$c=|\\binom Vm|^{-1}$, and the displayed formula for the second marginal\nfollows.\n\\end{proof}","tex_env":"lemma","semantic_closure":["ProbabilityMass","UniformExtensionKernel"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonLogDerivativeBound":{"name":"FiniteJansonLogDerivativeBound","title":"FiniteJansonLogDerivativeBound","kind":"lemma","is_target":false,"imports":["FiniteBernoulliPowersetIdentities","FiniteJansonLogDerivativeIdentity","FiniteJansonNumeratorLowerBound","FiniteProductHarrisKleitman"],"imported_by":["FiniteJansonIntegratedLogDerivativeEstimate"],"lean_statement":"lemma FiniteJansonLogDerivativeBound {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            p ^ (G pair.1 ∪ G pair.2).card\n          else 0)) :\n    ∀ s : ℝ, 0 ≤ s →\n      deriv\n        (fun r : ℝ =>\n          Real.log\n            (Finset.sum ((Finset.univ : Finset V).powerset)\n              (fun Z : Finset V =>\n                (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n                  Real.exp\n                    (-(r *\n                      (((Finset.univ : Finset Ω).filter\n                        (fun ω : Ω => G ω ⊆ Z)).card : ℝ))))))\n        s ≤\n        -\n          ((Finset.univ : Finset Ω).sum\n            (fun ω : Ω => p ^ (G ω).card)) *\n            Real.exp\n              (-(s *\n                (Finset.sum\n                  ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n                  (fun pair : Ω × Ω =>\n                    if (G pair.1 ∩ G pair.2).Nonempty then\n                      p ^ (G pair.1 ∪ G pair.2).card\n    else 0) /\n                (Finset.univ : Finset Ω).sum\n                  (fun ω : Ω => p ^ (G ω).card)))) := by","lean_proof":"classical\n  intro s hs\n  have hder := FiniteJansonLogDerivativeIdentity G p hp s\n  have hlower := FiniteJansonNumeratorLowerBound G p hp hnonempty hDelta s hs\n  rw [hder]\n  linarith","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, and let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$.\nWrite\n\\[\n    Y(Z)=\\sum_{i\\in I}\\mathbf 1_{\\{G_i\\subseteq Z\\}},\\qquad\n    \\psi(s)=\\mathbb E e^{-sY(Z)},\\qquad\n    \\mu=\\sum_{i\\in I}p^{|G_i|},\n\\]\nand\n\\[\n    \\Delta=\n    \\sum_{\\substack{i,j\\in I\\\\G_i\\cap G_j\\ne\\varnothing}}\n       p^{|G_i\\cup G_j|}.\n\\]\nAssume $0\u003cp\u003c1$, every $G_i$ is nonempty, and $\\Delta>0$.  Then for every\n$s\\ge0$,\n\\[\n    (\\log\\psi)'(s)\n    \\le\n    -\\mu \\exp(-s\\Delta/\\mu).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nBy \\noderef{FiniteBernoulliPowersetIdentities}, the Bernoulli mass of\n$A_i=\\{G_i\\subseteq Z\\}$ is $q_i=p^{|G_i|}$, and the Bernoulli mass of\n$A_i\\cap A_j$ is $p^{|G_i\\cup G_j|}$.  Since $0\u003cp\u003c1$, each $q_i$ is\npositive, and the displayed $\\Delta>0$ also implies\n$\\mu=\\sum_i q_i>0$.\n\nBecause the sample space is finite, $\\psi$ is a finite sum of differentiable\nfunctions.  Differentiating term by term gives\n\\[\n    -\\psi'(s)\n    =\n    \\sum_i \\mathbb E\\bigl(I_i e^{-sY}\\bigr),\n\\]\nwhere $I_i=\\mathbf 1_{A_i}$.  Fix $i$.  Decompose $Y=Y_i+Z_i$, where\n$Y_i$ counts labels $j$ with $G_i\\cap G_j\\ne\\varnothing$ and $Z_i$ counts\nthe remaining labels.  Conditional on $A_i$, the vertices in $G_i$ are fixed\nto be present, and the vertices outside $G_i$ still carry their independent\nBernoulli-$p$ product law.  On this residual product space both\n$e^{-sY_i}$ and $e^{-sZ_i}$ are decreasing functions, since adding vertices\ncan only increase the corresponding counts and $s\\ge0$.  Therefore\n\\noderef{FiniteProductHarrisKleitman} gives\n\\[\n    \\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\n    \\ge\n    \\mathbb E(e^{-sY_i}\\mid A_i)\\,\n    \\mathbb E(e^{-sZ_i}\\mid A_i).\n\\]\nThe random variable $Z_i$ uses only labels disjoint from $G_i$, so its value\ndepends only on vertices outside $G_i$ and has the same distribution after\nconditioning on $A_i$ as before conditioning.  Also $Y_i\\ge0$, hence\n$e^{-sY_i}\\le1$ and consequently $e^{-sZ_i}\\ge e^{-s(Y_i+Z_i)}=e^{-sY}$.\nThus\n\\[\n    \\mathbb E(I_i e^{-sY})\n    =\n    q_i\\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\n    \\ge\n    q_i\\mathbb E(e^{-sY_i}\\mid A_i)\\psi(s).\n\\]\nSince $\\psi(s)>0$, summing over $i$ and dividing by $\\psi(s)$ yields\n\\[\n    -(\\log\\psi)'(s)\n    \\ge\n    \\sum_i q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i).\n\\]\n\nApply finite Jensen, \\texttt{ConvexOn.map\\_sum\\_le} specialized to the\nconvex exponential function, to each conditional distribution with points\n$-sY_i$:\n\\[\n    \\mathbb E(e^{-sY_i}\\mid A_i)\n    \\ge\n    \\exp\\bigl(-s\\mathbb E(Y_i\\mid A_i)\\bigr).\n\\]\nApply \\texttt{ConvexOn.map\\_sum\\_le} for the exponential again on the finite\nlabel set with weights $q_i/\\mu$ and points $-s\\mathbb E(Y_i\\mid A_i)$.\nThe weights are nonnegative and sum to $1$, so\n\\[\n    \\sum_i q_i\\mathbb E(e^{-sY_i}\\mid A_i)\n    \\ge\n    \\mu\\exp\\left(\n      -\\frac{s}{\\mu}\\sum_i q_i\\mathbb E(Y_i\\mid A_i)\n    \\right).\n\\]\nFor fixed $i$,\n\\[\n    q_i\\mathbb E(Y_i\\mid A_i)\n    =\n    \\sum_{j:G_i\\cap G_j\\ne\\varnothing}\\Pr(A_i\\cap A_j),\n\\]\nbecause $Y_i$ is the sum of the indicators of precisely those intersecting\nevents.  Summing over $i$ identifies the inner total with $\\Delta$.  Hence\n\\[\n    -(\\log\\psi)'(s)\\ge \\mu e^{-s\\Delta/\\mu},\n\\]\nwhich is equivalent to the claimed upper bound on $(\\log\\psi)'(s)$.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"SpiroGoodHistoryEstimate":{"name":"SpiroGoodHistoryEstimate","title":"SpiroGoodHistoryEstimate","kind":"lemma","is_target":false,"imports":["FiniteFirstFailureBound","FiniteUniformMarkov","StageExpectedBadMass","SurvivorMassDomination"],"imported_by":["StrongSpiroTheorem","IntermediateStoppingEstimate"],"lean_statement":"lemma SpiroGoodHistoryEstimate {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq Ω] [Fintype V] [DecidableEq V]\n    (E : Ω → Finset V) (μ : Ω → ℝ) (q C : ℝ) (r : ℕ → ℕ)\n    (ℓ d k : ℕ)\n    (hspread : DistributionalSmootherSpread E μ q r (ℓ + 1))\n    (hC : 8 ≤ C) (hℓ : 0 \u003c ℓ) (hd : d \u003c ℓ)\n    (hn : 0 \u003c Fintype.card V) (hkpos : 0 \u003c k) (hk : k ≤ Fintype.card V)\n    (hsize : C * q * (Fintype.card V : ℝ) ≤ (k : ℝ))\n    (hstage : 0 \u003c d →\n      (k : ℝ) ≤ (Fintype.card V : ℝ) / 2 ∧ 2 * r 0 ≤ k)\n    (Surv : List (Finset V) → Ω → Prop)\n    (F : List (Finset V) → Ω → Finset V)\n    (hinit : ∀ x, Surv [] x)\n    (hsub : ∀ L W x, L.length + 1 \u003c ℓ → Surv (W :: L) x → Surv L x)\n    (hanchor : ∀ L x, L.length \u003c ℓ → Surv L x → F L x ⊆ E x)\n    (hcard : ∀ L x, L.length \u003c ℓ → Surv L x → (F L x).card = r L.length)\n    (hstep : ∀ L W x, L.length + 1 \u003c ℓ →\n      (Surv (W :: L) x ↔ ∃ hx : Surv L x,\n        @KGoodPair {y : Ω // Surv L y} V _ (fun y => F L y.1)\n          (r (L.length + 1)) ⟨x, hx⟩ W)) :\n    ∃ Good : (j : ℕ) → (Fin j → {W : Finset V // W.card = k}) → Prop,\n      (∀ h, Good 0 h) ∧\n      (∀ j, j \u003c d → ∀ h W,\n        let L := (List.ofFn (fun a => (h a).val)).reverse\n        Good (j + 1) (Fin.snoc h W) ↔ Good j h ∧\n          @LabelMass Ω _ μ (fun x => Surv L x ∧ ¬ Surv (W.val :: L) x)\n            (Classical.decPred _) ≤\n            @LabelMass Ω _ μ (Surv L) (Classical.decPred _) / (2 * (ℓ : ℝ))) ∧\n      (∀ j, j ≤ d → ∀ h, Good j h →\n        let L := (List.ofFn (fun a => (h a).val)).reverse\n        let M := @LabelMass Ω _ μ (Surv L) (Classical.decPred _)\n        let ν := fun x => @ite ℝ (Surv L x) (Classical.propDecidable _) (μ x / M) 0\n        1 - (j : ℝ) / (2 * (ℓ : ℝ)) ≤ M ∧ (1 / 2 : ℝ) ≤ M ∧\n          ProbabilityMass ν ∧ (∀ x, ¬ Surv L x → ν x = 0) ∧\n          ∀ x, ν x ≤ 2 * μ x) ∧\n      (@LabelMass (Fin d → {W : Finset V // W.card = k}) _\n        (fun _ => (Fintype.card (Fin d → {W : Finset V // W.card = k}) : ℝ)⁻¹)\n        (fun h => ¬ Good d h) (Classical.decPred _) ≤\n        6 * (ℓ : ℝ) ^ 2 * (C / 4) ^ (-(r d : ℝ) / 2)) := by","lean_proof":"classical\n  let X := {W : Finset V // W.card = k}\n  let L : {j : ℕ} → (Fin j → X) → List (Finset V) :=\n    fun h => (List.ofFn (fun a => (h a).val)).reverse\n  let S : {j : ℕ} → (Fin j → X) → Finset Ω :=\n    fun h => Finset.univ.filter (Surv (L h))\n  let loss : {j : ℕ} → (Fin j → X) → X → ℝ :=\n    fun h W => @LabelMass Ω _ μ (fun x => Surv (L h) x ∧ ¬ Surv (W.val :: L h) x)\n      (Classical.decPred _)\n  let M : {j : ℕ} → (Fin j → X) → ℝ := fun h => LabelMass μ (Surv (L h))\n  let Good : (j : ℕ) → (Fin j → X) → Prop :=\n    Nat.rec (fun _ => True) (fun _ G h => G (Fin.init h) ∧\n      loss (Fin.init h) (h (Fin.last _)) ≤ M (Fin.init h) / (2 * (ℓ : ℝ)))\n  have hrec (j : ℕ) (h : Fin j → X) (W : X) :\n      Good (j + 1) (Fin.snoc h W) ↔\n        Good j h ∧ loss h W ≤ M h / (2 * (ℓ : ℝ)) := by\n    simp [Good, Fin.init_snoc, Fin.snoc_last]\n  have hL (j : ℕ) (h : Fin j → X) (W : X) :\n      L (Fin.snoc h W) = W.val :: L h := by\n    dsimp only [L]\n    rw [List.ofFn_succ']\n    simp only [Fin.snoc_castSucc, Fin.snoc_last, List.concat_eq_append,\n      List.reverse_append, List.reverse_singleton, List.singleton_append]\n  have hlen (j : ℕ) (h : Fin j → X) : (L h).length = j := by simp [L]\n  have hS0 (h : Fin 0 → X) : S h = Finset.univ := by\n    ext x\n    simp [S, L, hinit]\n  have hSsub (j : ℕ) (hj : j \u003c d) (h : Fin j → X) (W : X) :\n      S (Fin.snoc h W) ⊆ S h := by\n    intro x hx\n    simp only [S, Finset.mem_filter, Finset.mem_univ, true_and, hL] at hx ⊢\n    exact hsub (L h) W.val x (by rw [hlen]; omega) hx\n  have hloss (j : ℕ) (h : Fin j → X) (W : X) :\n      (∑ x ∈ S h \\ S (Fin.snoc h W), μ x) = loss h W := by\n    congr 1\n    ext x\n    simp [S, hL]\n  -- Each good history supplies the whole nested trajectory, not just its endpoint.\n  have hpath : ∀ j, j ≤ d → ∀ h, Good j h →\n      ∃ T : ℕ → Finset Ω, T 0 = Finset.univ ∧ T j = S h ∧\n        (∀ a, a \u003c j → T (a + 1) ⊆ T a) ∧\n        (∀ a, a \u003c j → (∑ x ∈ T a \\ T (a + 1), μ x) ≤\n          (∑ x ∈ T a, μ x) / (2 * (ℓ : ℝ))) := by\n    intro j\n    induction j with\n    | zero =>\n      intro _ h _\n      exact ⟨fun _ => Finset.univ, rfl, (hS0 h).symm,\n        by omega, by omega⟩\n    | succ j ih =>\n      intro hj h hg\n      obtain ⟨⟨W, h⟩, rfl⟩ := (Fin.snocEquiv (fun _ : Fin (j + 1) => X)).surjective h\n      change Good (j + 1) (Fin.snoc h W) at hg\n      have hg' := (hrec j h W).mp hg\n      obtain ⟨T, hT0, hTj, hsubT, hlossT⟩ := ih (by omega) h hg'.1\n      let U : ℕ → Finset Ω := fun a => if a ≤ j then T a else S (Fin.snoc h W)\n      refine ⟨U, ?_, ?_, ?_, ?_⟩\n      · simpa [U] using hT0\n      · change U (j + 1) = S (Fin.snoc h W)\n        simp [U]\n      · intro a ha\n        by_cases haj : a \u003c j\n        · simpa [U, show a ≤ j by omega, show a + 1 ≤ j by omega] using hsubT a haj\n        · have he : a = j := by omega\n          subst a\n          simpa [U, hTj] using hSsub j (by omega) h W\n      · intro a ha\n        by_cases haj : a \u003c j\n        · simpa [U, show a ≤ j by omega, show a + 1 ≤ j by omega] using hlossT a haj\n        · have he : a = j := by omega\n          subst a\n          simpa [U, hTj, hloss, M, LabelMass] using hg'.2\n  have hnorm (j : ℕ) (hj : j ≤ d) (h : Fin j → X) (hg : Good j h) :\n      1 - (j : ℝ) / (2 * (ℓ : ℝ)) ≤ M h ∧ (1 / 2 : ℝ) ≤ M h ∧\n        (let ν := fun x => if Surv (L h) x then μ x / M h else 0\n         ProbabilityMass ν ∧ (∀ x, ¬ Surv (L h) x → ν x = 0) ∧\n           ∀ x, ν x ≤ 2 * μ x) := by\n    obtain ⟨T, hT0, hTj, hsubT, hlossT⟩ := hpath j hj h hg\n    have he := SurvivorMassDomination μ T ℓ j hspread.2.2.1 hℓ (by omega)\n      hT0 hsubT hlossT j le_rfl\n    simpa [hTj, S, M, LabelMass] using he\n  refine ⟨Good, fun _ => trivial, ?_, ?_, ?_⟩\n  · intro j _ h W\n    simpa only [L, loss, M] using hrec j h W\n  · intro j hj h hg\n    exact hnorm j hj h hg\n  by_cases hd0 : d = 0\n  · subst d\n    simp only [Good, Nat.rec_zero, not_true_eq_false, LabelMass,\n      Finset.filter_false, Finset.sum_empty]\n    positivity\n  have hnR : (0 : ℝ) \u003c Fintype.card V := by exact_mod_cast hn\n  have hkR : (0 : ℝ) \u003c k := by exact_mod_cast hkpos\n  have hℓR : (0 : ℝ) .mem_univ, true_and] using hx)) hm.2.2.2.2\n      (by\n        intro x hx\n        simpa only [hlen] using\n          hcard (L h) x (by rw [hlen]; omega) (by simpa [S] using hx))\n      (by\n        intro x hx\n        exact hanchor (L h) x (by rw [hlen]; omega) (by simpa [S] using hx))\n      hp (hC.trans hC') hp_size hℓ (by omega)\n      (by dsimp [p]; field_simp)\n      (le_trans (Nat.mul_le_mul_left 2 (hrmono 0 j (by omega) (by omega))) hstage'.2)\n    let B : Finset V → ℝ := fun W => @LabelMass Ω _ ν (fun x =>\n      ∃ hx : x ∈ S h, ¬ @KGoodPair {y : Ω // y ∈ S h} V _\n        (fun y => F (L h) y.val) (r (j + 1)) ⟨x, hx⟩ W) (Classical.decPred _)\n    have hB (W : Finset V) : B W =\n        @LabelMass Ω _ μ (fun x => Surv (L h) x ∧ ¬ Surv (W :: L h) x)\n          (Classical.decPred _) / M h := by\n      have hbad (x : Ω) :\n          (∃ hx : x ∈ S h, ¬ @KGoodPair {y : Ω // y ∈ S h} V _\n            (fun y => F (L h) y.val) (r (j + 1)) ⟨x, hx⟩ W) ↔\n          Surv (L h) x ∧ ¬ Surv (W :: L h) x := by\n        have hgood (hx : x ∈ S h) (hx' : Surv (L h) x) :\n            @KGoodPair {y : Ω // y ∈ S h} V _ (fun y => F (L h) y.val)\n              (r (j + 1)) ⟨x, hx⟩ W ↔\n            @KGoodPair {y : Ω // Surv (L h) y} V _ (fun y => F (L h) y.val)\n              (r (j + 1)) ⟨x, hx'⟩ W := by\n          simp [KGoodPair, S]\n        have he := hstep (L h) W x (by rw [hlen]; omega)\n        simp only [hlen] at he\n        constructor\n        · rintro ⟨hx, hb⟩\n          have hx' : Surv (L h) x := by simpa [S] using hx\n          exact ⟨hx', fun hs => by\n            obtain ⟨_, hh⟩ := he.mp hs\n            exact hb ((hgood hx hx').mpr hh)⟩\n        · rintro ⟨hx, hb⟩\n          have hx' : x ∈ S h := by simpa [S] using hx\n          exact ⟨hx', fun hh => hb (he.mpr ⟨hx, (hgood hx' hx).mp hh⟩)⟩\n      simp only [B, LabelMass, Finset.sum_filter, hbad, Finset.sum_div]\n      apply Finset.sum_congr rfl\n      intro x _\n      by_cases hx : Surv (L h) x \u003c;> by_cases hy : Surv
