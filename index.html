)))\n    field_simp\n  have hpower : ((w : ℝ) / ((n - r : ℕ) : ℝ)) ^ d *\n      (((n - r : ℕ) : ℝ) / w) ^ r = (((n - r : ℕ) : ℝ) / w) ^ j := by\n    have hrd : r = d + j := by dsimp [d]; omega\n    have hpow : (((n - r : ℕ) : ℝ) / w) ^ r =\n        (((n - r : ℕ) : ℝ) / w) ^ d * (((n - r : ℕ) : ℝ) / w) ^ j := by\n      simpa only [← hrd] using (pow_add (((n - r : ℕ) : ℝ) / w) d j)\n    rw [hpow, ← mul_assoc, ← mul_pow]\n    have hunit : (w : ℝ) / ((n - r : ℕ) : ℝ) * (((n - r : ℕ) : ℝ) / w) = 1 := by\n      field_simp\n    rw [hunit, one_pow, one_mul]\n  have hpbound : p / 2 ≤ (w : ℝ) / ((n - r : ℕ) : ℝ) := by\n    apply (le_div_iff₀ hNpos).2\n    have hmt : (m : ℝ) - t = w := by\n      dsimp [w]\n      rw [Nat.cast_sub (show t ≤ m by omega)]\n    have hlarge : (2 : ℝ) * r ≤ m := by exact_mod_cast hm_large\n    have htcast : (t : ℝ) ≤ r := by exact_mod_cast ht\n    nlinarith\n  have hrecip : ((n - r : ℕ) : ℝ) / w ≤ (p / 2)⁻¹ := by\n    have h := one_div_le_one_div_of_le (by linarith : (0 : ℝ) \u003c p / 2) hpbound\n    simpa only [one_div, inv_div] using h\n  change (w.choose d : ℝ) / ((n - r).choose d : ℝ) ≤\n    ((w + r).choose r : ℝ) / (n.choose r : ℝ) * (p / 2) ^ (-(j : ℝ))\n  calc\n    _ = ((w + r).choose r : ℝ) / (n.choose r : ℝ) *\n        ((w.choose d : ℝ) / ((n - r).choose d : ℝ) *\n          ((n.choose r : ℝ) / ((w + r).choose r : ℝ))) := hcancel.symm\n    _ ≤ ((w + r).choose r : ℝ) / (n.choose r : ℝ) *\n        (((w : ℝ) / ((n - r : ℕ) : ℝ)) ^ d *\n          (((n - r : ℕ) : ℝ) / w) ^ r) := by\n      apply mul_le_mul_of_nonneg_left _ hDpos.le\n      exact mul_le_mul hfirst hsecond (by positivity) (by positivity)\n    _ = ((w + r).choose r : ℝ) / (n.choose r : ℝ) *\n        (((n - r : ℕ) : ℝ) / w) ^ j := by rw [hpower]\n    _ ≤ ((w + r).choose r : ℝ) / (n.choose r : ℝ) * ((p / 2)⁻¹) ^ j := by\n      exact mul_le_mul_of_nonneg_left (pow_le_pow_left₀ (by positivity) hrecip j) hDpos.le\n    _ = _ := by rw [Real.rpow_neg (by linarith : (0 : ℝ) ≤ p / 2),\n      Real.rpow_natCast, inv_pow]","tex_statement":"\\begin{lemma}\nLet $n,r,m,t,j$ be nonnegative integers with $r\\geq1$, $2r\\leq m$,\n$2m\\leq n$, $t\\leq r$, and $j\\leq r$. Let $p>0$ satisfy $m=pn$.\nPut $w=m-t$ and $D=\\binom{w+r}{r}/\\binom nr$. Then\n\\[\n\\frac{\\binom w{r-j}}{\\binom{n-r}{r-j}}\n\\leq D(p/2)^{-j}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nAll subtractions in this proof are ordinary integer subtractions of a\nsmaller number from a larger one. Indeed,\n$n\\geq2m\\geq4r$, and\n\\[\n1\\leq r\\leq m-r\\leq w\\leq m\\leq n/2\\leq n-r.\n\\]\nIn particular $w+r\\leq m+r\\leq n$, so both binomial coefficients in\n$D$ are positive. Also $r-j\\leq r\\leq w\\leq n-r$, so the two binomial\ncoefficients on the left are positive.\n\nWrite $(a)_b=\\prod_{i=0}^{b-1}(a-i)$ and put $d=r-j$. The factorial\nformula $\\binom ab=(a)_b/b!$ gives\n\\[\n\\frac{\\binom wd}{\\binom{n-r}d}\n=D\\frac{(w)_d}{(n-r)_d}\\frac{(n)_r}{(w+r)_r}.\n\\]\nEvery denominator factor here is positive: for $0\\leq i\u003cd$,\n$n-r-i\\geq n-2r+1>0$; for $0\\leq i\u003cr$,\n$w+r-i\\geq w+1>0$. For $0\\leq i\u003cd$ the inequality $w\\leq n-r$ implies\n\\[\n\\frac{w-i}{n-r-i}\\leq\\frac w{n-r},\n\\]\nby cross multiplication, since $i(n-r-w)\\geq0$.\nFor $0\\leq i\u003cr$, cross multiplication gives\n\\[\n\\frac{n-i}{w+r-i}\\leq\\frac{n-r}{w},\n\\]\nbecause the right cross product minus the left cross product is\n$(r-i)(n-r-w)\\geq0$. Multiplying these nonnegative factor inequalities\n(with the empty product understood as one) proves\n\\[\n\\frac{\\binom wd}{\\binom{n-r}d}\n\\leq D\\left(\\frac w{n-r}\\right)^d\n       \\left(\\frac{n-r}{w}\\right)^r\n=D\\left(\\frac w{n-r}\\right)^{-j}.\n\\]\nFinally, $w\\geq m-r\\geq m/2=pn/2$ and $0\u003cn-r\\leq n$ imply\n$w/(n-r)\\geq p/2>0$. Raising reciprocals to the nonnegative integer\npower $j$ yields $(w/(n-r))^{-j}\\leq(p/2)^{-j}$. Multiplication by\n$D>0$ proves the claim. Real powers at these integer exponents agree\nwith the indicated powers of reciprocals.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteBernoulliPowersetIdentities":{"name":"FiniteBernoulliPowersetIdentities","title":"FiniteBernoulliPowersetIdentities","kind":"lemma","is_target":false,"imports":["FiniteBernoulliResidualConditioning","Preamble"],"imported_by":["FiniteJansonFixedLabelSeparation","FiniteBernoulliUniformVariance","FiniteJansonJensenDeltaAggregation","FiniteJansonLogDerivativeIdentity","FiniteJansonOneLabelNumeratorSeparation","FiniteJansonNumeratorLowerBound","FiniteJansonLogDerivativeBound","FiniteJansonIntegratedLogDerivativeEstimate"],"lean_statement":"lemma FiniteBernoulliPowersetIdentities {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ) :\n    (((Finset.univ : Finset V).powerset).sum\n        (fun Z : Finset V =>\n          p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) = 1) ∧\n      (∀ A : Finset V,\n        (((Finset.univ : Finset V).powerset).filter\n            (fun Z : Finset V => A ⊆ Z)).sum\n          (fun Z : Finset V =>\n            p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) =\n          p ^ A.card) ∧\n      (∀ i j : Ω,\n        (((Finset.univ : Finset V).powerset).filter\n            (fun Z : Finset V => G i ∪ G j ⊆ Z)).sum\n          (fun Z : Finset V =>\n            p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) =\n          p ^ (G i ∪ G j).card) := by","lean_proof":"classical\n  have hnorm : (((Finset.univ : Finset V).powerset).sum\n        (fun Z : Finset V =>\n          p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) = 1) := by\n    have hsum :=\n      Finset.sum_pow_mul_eq_add_pow (s := (Finset.univ : Finset V)) (a := p) (b := 1 - p)\n    change ∑ Z ∈ (Finset.univ : Finset V).powerset,\n        p ^ Z.card * (1 - p) ^ ((Finset.univ : Finset V).card - Z.card) = 1\n    rw [hsum]\n    ring\n  have hcontain : ∀ A : Finset V,\n        (((Finset.univ : Finset V).powerset).filter\n            (fun Z : Finset V => A ⊆ Z)).sum\n          (fun Z : Finset V =>\n            p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) =\n          p ^ A.card := by\n    intro A\n    have hsum := Finset.sum_pow_mul_eq_add_pow\n      (s := (Finset.univ : Finset V) \\ A) (a := p) (b := 1 - p)\n    have hone : p + (1 - p) = 1 := by ring\n    simpa only [mul_one, hsum, hone, one_pow] using\n      FiniteBernoulliResidualConditioning A p (fun _ => (1 : ℝ))\n  refine ⟨hnorm, hcontain, ?_⟩\n  intro i j\n  exact hcontain (G i ∪ G j)","tex_statement":"\\begin{helper}\nLet $V$ be a finite set and let $p$ be a real number.  Give each subset\n$Z\\subseteq V$ the Bernoulli atom weight\n\\[\n    m(Z)=p^{|Z|}(1-p)^{|V|-|Z|}.\n\\]\nThen\n\\[\n    \\sum_{Z\\subseteq V}m(Z)=1.\n\\]\nMoreover, for every finite $A\\subseteq V$,\n\\[\n    \\sum_{\\substack{Z\\subseteq V\\\\A\\subseteq Z}}m(Z)=p^{|A|}.\n\\]\nConsequently, for every labelled family $(G_i)_{i\\in I}$ and all labels\n$i,j\\in I$,\n\\[\n    \\sum_{\\substack{Z\\subseteq V\\\\G_i\\cup G_j\\subseteq Z}}m(Z)\n      =p^{|G_i\\cup G_j|}.\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nThe atom weights factor over the vertices of $V$.  Expanding the product\n\\[\n    \\prod_{v\\in V}\\bigl(p+(1-p)\\bigr)\n\\]\nby choosing, for each vertex, either the $p$ term or the $(1-p)$ term gives\nexactly the sum of $m(Z)$ over all subsets $Z\\subseteq V$.  Since\n$p+(1-p)=1$, the product is $1$.\n\nFix $A\\subseteq V$.  In the sum over subsets $Z$ containing $A$, every\nvertex of $A$ is forced to contribute the $p$ term.  The remaining vertices\nin $V\\setminus A$ are still summed freely, so the same product expansion gives\n\\[\n    p^{|A|}\\prod_{v\\in V\\setminus A}\\bigl(p+(1-p)\\bigr)=p^{|A|}.\n\\]\nTaking $A=G_i\\cup G_j$ gives the final displayed identity.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"BinomialCDFBetaNormalization":{"name":"BinomialCDFBetaNormalization","title":"BinomialCDFBetaNormalization","kind":"lemma","is_target":false,"imports":["BinomialCDFIntegralIdentity"],"imported_by":["BinomialMedianAtMean"],"lean_statement":"lemma BinomialCDFBetaNormalization (m n : ℕ) (hmn : m \u003c n) :\n    (n : ℝ) * (Nat.choose (n - 1) m : ℝ) *\n        (∫ x in (0 : ℝ)..(1 : ℝ), x ^ m * (1 - x) ^ (n - 1 - m)) = 1 := by","lean_proof":"have hcdf := BinomialCDFIntegralIdentity m n hmn (0 : ℝ) (by norm_num) (by norm_num)\n  have hsum :\n      Finset.sum (Finset.range (m + 1))\n          (fun k : ℕ => (Nat.choose n k : ℝ) * (0 : ℝ) ^ k *\n            (1 - (0 : ℝ)) ^ (n - k)) = 1 := by\n    rw [Finset.sum_eq_single 0]\n    · norm_num\n    · intro k _ hk\n      simp [hk]\n    · intro h0\n      simp at h0\n  rw [← hcdf]\n  simpa using hsum","tex_statement":"\\begin{helper}\nLet $m\u003cn$ be nonnegative integers.  Then\n\\[\n  n\\binom{n-1}{m}\n  \\int_0^1 x^m(1-x)^{n-1-m}\\,dx\n  =\n  1 .\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nApply \\noderef{BinomialCDFIntegralIdentity} with $p=0$, which is allowed\nbecause $0\\in[0,1]$.  It gives\n\\[\n  \\sum_{k=0}^{m}\\binom nk 0^k(1-0)^{n-k}\n  =\n  n\\binom{n-1}{m}\n  \\int_0^1 x^m(1-x)^{n-1-m}\\,dx .\n\\]\nIt remains to compute the finite sum on the left.  Since $m\u003cn$, we have\n$n>0$.  The $k=0$ term is\n\\[\n  \\binom n0 0^0(1-0)^n=1\\cdot1\\cdot1=1.\n\\]\nFor every $k$ with $1\\le k\\le m$, the factor $0^k$ is $0$, so the\ncorresponding summand is $0$.  Hence the whole sum is exactly $1$.\nSubstituting this value into the displayed identity gives\n\\[\n  n\\binom{n-1}{m}\n  \\int_0^1 x^m(1-x)^{n-1-m}\\,dx\n  =\n  1,\n\\]\nas required.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","repor \[\n  p=\\frac mn\u003c\\frac{m}{n-1}=x_0\n\\]\nbecause $m>0$ and $n-1\u003cn$ are positive denominators.\n\nWe first compare the mass on the two intervals adjacent to $x_0$.  For\n$0\\le e\\le m$, define\n\\[\n  x_-(e)=\\frac{m-e}{n-1},\\qquad\n  x_+(e)=\\frac{m+e}{n-1}.\n\\]\nAs $e$ runs from $0$ to $m$, the point $x_-(e)$ runs from $x_0$ down to\n$0$, while $x_+(e)$ runs from $x_0$ up to $2x_0$.  Both changes of\nvariables have the same absolute Jacobian $1/(n-1)$.  The statement of\n\\noderef{BinomialSymmetricBetaDensityComparison}, applied with this $e$,\ngives\n\\[\n  f(x_-(e))\\le f(x_+(e)).\n\\]\nIntegrating these pointwise inequalities in the variable $e$ and using the\nequal absolute Jacobians gives\n\\[\n  \\int_0^{x_0} f(x)\\,dx\n  \\le\n  \\int_{x_0}^{2x_0} f(x)\\,dx .             \\tag{1}\n\\]\n\nFor every $x\\in[0,1]$ the factors $x^m$ and $(1-x)^{n-1-m}$ are\nnonnegative, hence $f(x)\\ge0$ on $[0,1]$.  Because $2x_0\\le1$, this\nnonnegativity implies\n\\[\n  \\int_{x_0}^{2x_0} f(x)\\,dx\n  \\le\n  \\int_{x_0}^{1} f(x)\\,dx .\n\\]\nCombining this with (1) yields\n\\[\n  \\int_0^{x_0} f(x)\\,dx\n  \\le\n  \\int_{x_0}^{1} f(x)\\,dx .                \\tag{2}\n\\]\n\nSince $p\u003cx_0$ and $f\\ge0$ on $[0,1]$, the integral from $0$ to $p$ is at\nmost the integral from $0$ to $x_0$, and the integral from $x_0$ to $1$ is\nat most the integral from $p$ to $1$.  From (2) we therefore get\n\\[\n  \\int_0^p f(x)\\,dx\n  \\le\n  \\int_p^1 f(x)\\,dx .                      \\tag{3}\n\\]\nFinally,\n\\[\n  \\int_0^1 f(x)\\,dx\n  =\n  \\int_0^p f(x)\\,dx+\\int_p^1 f(x)\\,dx .\n\\]\nTogether with (3), this gives\n\\[\n  \\int_0^1 f(x)\\,dx\n  \\le\n  2\\int_p^1 f(x)\\,dx,\n\\]\nwhich is exactly\n\\[\n  \\int_p^1 f(x)\\,dx\n  \\ge\n  \\frac12\\int_0^1 f(x)\\,dx .\n\\]\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean c   = (((Nat.choose (m + q) (m + (e + 1)) : ℕ) : ℝ) *\n              ((m + e + 1 : ℕ) : ℝ)) *\n            ((m : ℝ) ^ (m + e) * (m : ℝ)) *\n            (((q : ℝ) ^ (q - (e + 1))) * (q : ℝ)) := by\n              rw [show m + (e + 1) = m + e + 1 by omega, pow_succ]\n              ring\n      _ = (((Nat.choose (m + q) (m + e) : ℕ) : ℝ) *\n              ((q - e : ℕ) : ℝ)) *\n            ((m : ℝ) ^ (m + e) * (m : ℝ)) *\n            (((q : ℝ) ^ (q - (e + 1))) * (q : ℝ)) := by\n              rw [hAchoose]\n      _ = ((Nat.choose (m + q) (m + e) : ℕ) : ℝ) *\n            (m : ℝ) ^ (m + e) * (q : ℝ) ^ (q - e) *\n          ((q - e : ℕ) : ℝ) * (m : ℝ) := by\n              rw [show (q : ℝ) ^ (q - (e + 1)) * (q : ℝ) =\n                  (q : ℝ) ^ (q - e) by\n                rw [← pow_succ, hqsub]]\n              ring\n  have hBrec : ∀ d : ℕ, d \u003c q →\n      B d * ((m + 1 - d : ℕ) : ℝ) * (q : ℝ) =\n        B (d + 1) * ((q + d : ℕ) : ℝ) * (m : ℝ) := by\n    intro e heq\n    dsimp [B]\n    have heleq : e ≤ q := le_of_lt heq\n    have helem : e ≤ m := heleq.trans hqm\n    have hBchooseNat :\n        Nat.choose (m + q) (m + 1 - e) * (m + 1 - e) =\n          Nat.choose (m + q) (m + 1 - (e + 1)) * (q + e) := by\n      have h := Nat.choose_succ_right_eq (m + q) (m - e)\n      have hidx0 : m - e = m + 1 - (e + 1) := by omega\n      have hidx1 : m - e + 1 = m + 1 - e := by omega\n      have hsub : m + q - (m + 1 - (e + 1)) = q + e := by omega\n      rw [hidx1, hidx0] at h\n      rw [hsub] at h\n      exact h\n    have hBchoose :\n        ((Nat.choose (m + q) (m + 1 - e) : ℕ) : ℝ) *\n            ((m + 1 - e : ℕ) : ℝ) =\n          ((Nat.choose (m + q) (m + 1 - (e + 1)) : ℕ) : ℝ) *\n            ((q + e : ℕ) : ℝ) := by\n      exact_mod_cast hBchooseNat\n    have hmexp : m + 1 - (e + 1) + 1 = m + 1 - e := by omega\n    have hqexp : q - 1 + e + 1 = q - 1 + (e + 1) := by omega\n    calc\n      ((Nat.choose (m + q) (m + 1 - e) : ℕ) : ℝ) *\n            (m : ℝ) ^ (m + 1 - e) * (q : ℝ) ^ (q - 1 + e) *\n          ((m + 1 - e : ℕ) : ℝ) * (q : ℝ)\n          = (((Nat.choose (m + q) (m + 1 - e) : ℕ) : ℝ) *\n              ((m + 1 - e : ℕ) : ℝ)) *\n            (((m : ℝ) ^ (m + 1 - (e + 1))) * (m : ℝ)) *\n            ((q : ℝ) ^ (q - 1 + e) * (q : ℝ)) := by\n              rw [show (m : ℝ) ^ (m + 1 - e) =\n                  (m : ℝ) ^ (m + 1 - (e + 1)) * (m : ℝ) by\n                rw [← pow_succ, hmexp]]\n              ring\n      _ = (((Nat.choose (m + q) (m + 1 - (e + 1)) : ℕ) : ℝ) *\n              ((q + e : ℕ) : ℝ)) *\n            (((m : ℝ) ^ (m + 1 - (e + 1))) * (m : ℝ)) *\n            ((q : ℝ) ^ (q - 1 + e) * (q : ℝ)) := by\n              rw [hBchoose]\n      _ = ((Nat.choose (m + q) (m + 1 - (e + 1)) : ℕ) : ℝ) *\n            (m : ℝ) ^ (m + 1 - (e + 1)) * (q : ℝ) ^ (q - 1 + (e + 1)) *\n          ((q + e : ℕ) : ℝ) * (m : ℝ) := by\n              rw [show (q : ℝ) ^ (q - 1 + e) * (q : ℝ) =\n                  (q : ℝ) ^ (q - 1 + (e + 1)) by\n                rw [← pow_succ, hqexp]]\n              ring\n  have hBpos : ∀ e : ℕ, 1 ≤ e → e ≤ q → 0 \u003c B e := by\n    intro e he1 heq\n    dsimp [B]\n    have hidxle : m + 1 - e ≤ m + q := by omega\n    have hchoose : (0 : ℝ) \u003c ((Nat.choose (m + q) (m + 1 - e) : ℕ) : ℝ) := by\n      exact_mod_cast Nat.choose_pos hidxle\n    have hmR : (0 : ℝ) \u003c (m : ℝ) := by exact_mod_cast hmpos\n    have hqR : (0 : ℝ) \u003c (q : ℝ) := by exact_mod_cast hq\n    positivity\n  have hstep : ∀ e : ℕ, 1 ≤ e → e \u003c q → A (e + 1) * B e ≤ A e * B (e + 1) := by\n    intro e he1 heq\n    let C : ℝ := ((m + e + 1 : ℕ) : ℝ) * ((m + 1 - e : ℕ) : ℝ) * (q : ℝ) ^ 2\n    let D : ℝ := ((q - e : ℕ) : ℝ) * ((q + e : ℕ) : ℝ) * (m : ℝ) ^ 2\n    have hEq : (A (e + 1) * B e) * C = (A e * B (e + 1)) * D := by\n      have hmul := congrArg₂ (fun x y : ℝ => x * y) (hArec e heq) (hBrec e heq)\n      dsimp [C, D] at hmul ⊢\n      ring_nf at hmul ⊢\n      exact hmul\n    have hDleC : D ≤ C := by\n      have halg := BinomialUpperPairRatioAlgebra m q e hq hqm cq$, $q\\le m$, $1\\le d$, and\n$d\\le q$.  Then the upper-half paired unnormalized binomial terms satisfy\n\\[\n    \\binom{m+q}{m+d}m^{m+d}q^{q-d}\n    \\le\n    \\binom{m+q}{m+1-d}m^{m+1-d}q^{q-1+d}.\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nFor $1\\le e\\le q$, write\n\\[\n    A_e=\\binom{m+q}{m+e}m^{m+e}q^{q-e},\n    \\qquad\n    B_e=\\binom{m+q}{m+1-e}m^{m+1-e}q^{q-1+e}.\n\\]\nThe first comparison $A_1\\le B_1$ is exactly\n\\noderef{BinomialUpperFirstPairComparison}.\n\nWe next compare adjacent ratios.  Suppose $1\\le e\u003cq$.  The binomial\nrecurrence $\\binom N{K+1}(K+1)=\\binom NK(N-K)$ gives\n\\[\n    \\binom{m+q}{m+e+1}(m+e+1)\n    =\n    \\binom{m+q}{m+e}(q-e),\n\\]\nand hence\n\\[\n    A_{e+1}(m+e+1)q=A_e(q-e)m.        \\tag{1}\n\\]\nApplying the same recurrence at the lower index $m-e$ gives\n\\[\n    \\binom{m+q}{m+1-e}(m+1-e)\n    =\n    \\binom{m+q}{m-e}(q+e),\n\\]\nwhich is the same as\n\\[\n    B_e(m+1-e)q=B_{e+1}(q+e)m.        \\tag{2}\n\\]\nMultiplying (1) and (2), and rearranging the nonnegative factors, yields\n\\[\n    A_{e+1}B_e\\,(m+e+1)(m+1-e)q^2\n    =\n    A_eB_{e+1}\\,(q-e)(q+e)m^2 .       \\tag{3}\n\\]\nBy \\noderef{BinomialUpperPairRatioAlgebra}, since $0\u003cq$, $q\\le m$,\n$1\\le e$, and $e\u003cq$,\n\\[\n    (q+e)(q-e)m^2\\le (m+1+e)(m+1-e)q^2.\n\\]\nBecause $m+1+e=m+e+1$, (3) implies\n\\[\n    A_{e+1}B_e\\le A_eB_{e+1}.\n\\]\nHere division by $(m+e+1)(m+1-e)q^2$ is legitimate because all three\nfactors are positive: $q>0$, $m+e+1>0$, and $e\u003cq\\le m$ gives\n$m+1-e>0$.\n\nWe prove $A_d\\le B_d$ by induction on $d$.  The case $d=1$ was proved\nabove.  If $A_e\\le B_e$ for some $1\\le e\u003cq$, then the adjacent comparison\ngives $A_{e+1}B_e\\le A_eB_{e+1}\\le B_eB_{e+1}$, since $B_{e+1}\\ge0$.\nMoreover $B_e>0$: its binomial coefficient is positive because\n$m+1-e\\le m+q$, and the powers of $m$ and $q$ are positive since\n$0\u003cq\\le m$.  Dividing by $B_e$ gives $A_{e+1}\\le B_{e+1}$.  Thus\n$A_d\\le B_d$ for every $1\\le d\\le q$, which is the claimed inequality.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"DistributionalSmootherSpread":{"name":"DistributionalSmootherSpread","title":"DistributionalSmootherSpread","kind":"definition","is_target":false,"imports":["BoundedEdges","LabelMass","ProbabilityMass"],"imported_by":["SpiroToDistributionalSpread","RoundedSpiroSampleSizes","StageExpectedBadMass","StrongSpiroTheorem","IntermediateStoppingEstimate"],"lean_statement":"def DistributionalSmootherSpread {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq V] (E : Ω → Finset V) (μ : Ω → ℝ)\n    (q : ℝ) (r : ℕ → ℕ) (levels : ℕ) : Prop :=","lean_proof":"0 \u003c q ∧ q ≤ 1 ∧ ProbabilityMass μ ∧ BoundedEdges E (r 0) ∧\n    (∀ i : ℕ, i \u003c levels → 0 \u003c r i) ∧\n    (∀ i : ℕ, i + 1 \u003c levels → r (i + 1) \u003c r i) ∧\n    ∀ (i : ℕ), i + 1 \u003c levels →\n      ∀ (x : Ω) (S : Finset V) (t : ℕ),\n        S ⊆ E x →\n        r (i + 1) ≤ S.card → S.card ≤ r i →\n        r (i + 1) ≤ t → t ≤ r i →\n        LabelMass μ (fun y : Ω => (E y ∩ S).card = t) ≤ q ^ t","tex_statement":"\\begin{definition}\nLet $q\\in(0,1]$, let $r_1>\\cdots>r_s$ be positive integers, let\n$E:\\Omega\\to2^V$ be an $r_1$-bounded labelled hypergraph, and let $\\mu$ be a\nprobability distribution on the labels.  The distribution $\\mu$ is\n$(q;r_1,\\dots,r_s)$-spread if, for every interval $[r_{i+1},r_i]$, every\nlabelled edge $E(x)$, every $S\\subseteq E(x)$ with\n$r_{i+1}\\le |S|\\le r_i$, and every $t\\in[r_{i+1},r_i]$, the label mass of\nthe labels $y$ satisfying $|E(y)\\cap S|=t$ is at most $q^t$.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":["BoundedEdges","LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Corr exact Finset.mem_filter.mpr\n                ⟨hXsub hvX, Finset.mem_union.mpr (Or.inr hvX)⟩\n      · intro Z hZ\n        have hZu : Z ⊆ (Finset.univ : Finset V) := Finset.mem_powerset.mp hZ\n        have hZeq : T Z ∪ R.filter (fun v : V => v ∈ Z) = Z := by\n          ext v\n          by_cases hvA : v ∈ A\n          · simp [T, R, hvA]\n          · simp [T, R, hvA]\n        rw [hZeq]\n    rw [hpartition]\n    calc\n      (A.powerset.product R.powerset).sum\n          (fun BR : Finset V × Finset V =>\n            (p ^ (BR.1 ∪ BR.2).card *\n                (1 - p) ^ (Fintype.card V - (BR.1 ∪ BR.2).card)) *\n              K (BR.1 ∪ BR.2))\n          =\n        (A.powerset.product R.powerset).sum\n          (fun BR : Finset V × Finset V =>\n            (p ^ BR.1.card * (1 - p) ^ (A.card - BR.1.card)) *\n              ((p ^ BR.2.card * (1 - p) ^ (R.card - BR.2.card)) *\n                H BR.2)) := by\n            refine Finset.sum_congr rfl ?_\n            intro BR hBR\n            rcases BR with ⟨B, X⟩\n            have hBR' := Finset.mem_product.mp hBR\n            have hBsub : B ⊆ A := Finset.mem_powerset.mp hBR'.1\n            have hXsub : X ⊆ R := Finset.mem_powerset.mp hBR'.2\n            have hdisjBX : Disjoint B X := hdisjAR.mono_left hBsub |>.mono_right hXsub\n            have hcard_union : (B ∪ X).card = B.card + X.card := by\n              simpa [Nat.add_comm] using Finset.card_union_of_disjoint hdisjBX\n            have hBcard : B.card ≤ A.card := Finset.card_le_card hBsub\n            have hXcard : X.card ≤ R.card := Finset.card_le_card hXsub\n            have hfilter : R.filter (fun v : V => v ∈ B ∪ X) = X := by\n              ext v\n              constructor\n              · intro hv\n                simp only [Finset.mem_filter] at hv\n                rcases Finset.mem_union.mp hv.2 with hvB | hvX\n                · have hvA := hBsub hvB\n                  have hvR := hv.1\n                  simp [R, hvA] at hvR\n                · exact hvX\n              · \n                    intro B hB\n                    rw [Finset.mul_sum]\n              _ =\n                (∑ x ∈ A.powerset,\n                  p ^ x.card * (1 - p) ^ (A.card - x.card)) *\n                    (∑ x_1 ∈ R.powerset,\n                      (p ^ x_1.card * (1 - p) ^ (R.card - x_1.card)) * H x_1) := by\n                    rw [Finset.sum_mul]\n              _ = ∑ x_1 ∈ R.powerset,\n                      (p ^ x_1.card * (1 - p) ^ (R.card - x_1.card)) * H x_1 := by\n                    rw [hAnorm]\n                    ring\n  calc\n    (Finset.univ : Finset (V → Bool)).sum\n      (fun x : V → Bool =>\n        ((Finset.univ : Finset V).prod\n          (fun v : V => if x v then p else 1 - p)) *\n        H (((Finset.univ : Finset V) \\ A).filter (fun v : V => x v)))\n        =\n      (Finset.univ : Finset (V → Bool)).sum\n        (fun x : V → Bool =>\n          ((Finset.univ : Finset V).prod\n            (fun v : V => if x v then p else 1 - p)) *\n          K ((Finset.univ : Finset V).filter (fun v : V => x v))) := by\n          refine Finset.sum_congr rfl ?_\n          intro x hx\n          congr 1\n          simp [K, R]\n    _ =\n      ((Finset.univ : Finset V).powerset).sum\n        (fun Z : Finset V =>\n          (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) * K Z) := hfull\n    _ =\n      (((Finset.univ : Finset V) \\ A).powerset).sum\n        (fun X : Finset V =>\n          (p ^ X.card * (1 - p) ^ (((Finset.univ : Finset V) \\ A).card - X.card)) *\n            H X) := by\n          simpa [R] using hreduce","tex_statement":"\\begin{helper}\nLet $V$ be a finite set, let $A\\subseteq V$, let $p$ be a real number, and let\n$H$ be any real-valued function on subsets of $V$.  Then\n\\[\n  \\sum_{x:V\\to\\{0,1\\}}\n    \\left(\\prod_{v\\in V} (x(v)?p:1-p)\\right)\n    H(\\{v\\in V\\setminus A:x(v)=1\\})\n  =\n  \\sum_{X\\subseteq V\\setminus A}\n    p^{|X|}(1-p)^{|V\\setminus A|-|X|}H(X).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nBy \\noderef{FiniteBernoulliBooleanPowersetTransport}, the Boolean-atom sum\nover $V$ may be reindexed as a sum over all subsets $Z\\subseteq V$, with\nsummand\n\\[\n  p^{|Z|}(1-p)^{|V|-|Z|}H(Z\\cap(V\\setminus A)).\n\\]\nNow decompose each subset $Z\\subseteq V$ uniquely as\n\\[\n  Z=B\\cup X,\\qquad B=Z\\cap A,\\quad X=Z\\cap(V\\setminus A),\n\\]\nwhere $B\\subseteq A$ and $X\\subseteq V\\setminus A$.  These two parts are\ndisjoint.  Hence\n\\[\n  |Z|=|B|+|X|,\\qquad\n  |V|-|Z|=(|A|-|B|)+(|V\\setminus A|-|X|),\n\\]\nbecause $A$ and $V\\setminus A$ partition $V$.  Therefore the transported\nsummand factors as\n\\[\n  \\bigl(p^{|B|}(1-p)^{|A|-|B|}\\bigr)\n  \\bigl(p^{|X|}(1-p)^{|V\\setminus A|-|X|}H(X)\\bigr).\n\\]\nSumming first over $B\\subseteq A$ gives\n\\[\n  \\sum_{B\\subseteq A}p^{|B|}(1-p)^{|A|-|B|}\n  =(p+(1-p))^{|A|}=1.\n\\]\nThe remaining sum over $X\\subseteq V\\setminus A$ is exactly the displayed\nresidual powerset sum.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonBooleanHarrisDisjointComparison":{"name":"FiniteJansonBooleanHarrisDisjointComparison","title":"FiniteJansonBooleanHarrisDisjointComparison","kind":"lemma","is_target":false,"imports":["FiniteJansonResidualFactorsDecreasing","FiniteProductHarrisKleitman"],"imported_by":["FiniteJansonFixedLabelSeparation"],"lean_statement":"lemma FiniteJansonBooleanHarrisDisjointComparison {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (i : Ω) :\n    ∀ s : ℝ, 0 ≤ s →\n      (Finset.univ : Finset (V → Bool)).sum\n        (fun x : V → Bool =>\n          ((Finset.univ : Finset V).prod\n              (fun v : V => if x v then p else 1 - p)) *\n            (Real.exp\n                (-(s *\n                  (((Finset.univ : Finset Ω).filter\n                    (fun j : Ω =>\n                      (G i ∩ G j).Nonempty ∧\n                        G j ⊆ G i ∪\n                          ((Finset.univ : Finset V) \\ G i).filter\n                            (fun v : V => x v))).card : ℝ))) *\n              Real.exp\n                (-(s *\n                  (((Finset.univ : Finset Ω).filter\n                    (fun j : Ω =>\n                      ¬ (G i ∩ G j).Nonempty ∧\n                        G j ⊆ G i ∪\n                          ((Finset.univ : Finset V) \\ G i).filter\n                            (fun v : V => x v))).card : ℝ))))) ≥\n        ((Finset.univ : Finset (V → Bool)).sum\n          (fun x : V → Bool =>\n            ((Finset.univ : Finset V).prod\n                (fun v : V => if x v then p else 1 - p)) *\n              Real.exp\n                (-(s *\n                  (((Finset.univ : Finset Ω).filter\n                    (fun j : Ω =>\n                      (G i ∩ G j).Nonempty ∧\n                        G j ⊆ G i ∪\n                          ((Finset.univ : Finset V) \\ G i).filter\n                            (fun v : V => x v))).card : ℝ))))) *\n          ((Finset.univ : Finset (V → Bool)).sum\n            (fun x : V → Bool =>\n              ((Finset.univ : Finset V).prod\n                  (fun v : V => if x v then p else 1 - p)) *\n                Real.exp\n                  (-(s *\n                    (((Finset.univ : Finset Ω).filter\n                      (fun j : Ω =>\n                        G j ⊆ (Finset.univ : Finset V).filter\n                          (fun v : V => x v))).card : ℝ))))) := by","lean_proof":"classical\n  intro s hs\n  let R : Finset V := (Finset.univ : Finset V) \\ G i\n  let residual : (V → Bool) → Finset V := fun x => R.filter (fun v : V => x v)\n  let chosen : (V → Bool) → Finset V := fun x =>\n    (Finset.univ : Finset V).filter (fun v : V => x v)\n  let interCount : (V → Bool) → ℕ := fun x =>\n    ((Finset.univ : Finset Ω).filter\n      (fun j : Ω => (G i ∩ G j).Nonempty ∧ G j ⊆ G i ∪ residual x)).card\n  let disjCount : (V → Bool) → ℕ := fun x =>\n    ((Finset.univ : Finset Ω).filter\n      (fun j : Ω => ¬ (G i ∩ G j).Nonempty ∧ G j ⊆ G i ∪ residual x)).card\n  let totalCount : (V → Bool) → ℕ := fun x =>\n    ((Finset.univ : Finset Ω).filter\n      (fun j : Ω => G j ⊆ chosen x)).card\n  let f : (V → Bool) → ℝ := fun x => Real.exp (-(s * (interCount x : ℝ)))\n  let g : (V → Bool) → ℝ := fun x => Real.exp (-(s * (disjCount x : ℝ)))\n  let psi : (V → Bool) → ℝ := fun x => Real.exp (-(s * (totalCount x : ℝ)))\n  let μ : (V → Bool) → ℝ := fun x =>\n    (Finset.univ : Finset V).prod (fun v : V => if x v then p else 1 - p)\n  have hp01 : 0 ≤ p ∧ p ≤ 1 := ⟨le_of_lt hp.1, le_of_lt hp.2⟩\n  have hres_mono : ∀ x y : V → Bool,\n      (∀ v : V, x v = true → y v = true) → residual x ⊆ residual y := by\n    intro x y hxy v hv\n    simp only [residual, R, Finset.mem_filter] at hv ⊢\n    exact ⟨hv.1, hxy v hv.2⟩\n  have hf : ∀ x y : V → Bool,\n      (∀ v : V, x v = true → y v = true) → f y ≤ f x := by\n    intro x y hxy\n    have hmono := (FiniteJansonResidualFactorsDecreasing G i s hs (residual x) (residual y)\n      (hres_mono x y hxy)).1\n    simpa [f, interCount, residual] using hmono\n  have hg : ∀ x y : V → Bool,\n      (∀ v : V, x v = true → y v = true) → g y ≤ g x := by\n    intro x y hxy\n    have hmono := (FiniteJansonResidualFactorsDecreasing G i s hs (residual x) (residual y)\n      (hres_mono x y hxy)).2\n    simpa [g, disjCount, residual] using hmono\n  have harris := FiniteProductHarrisKleitman (V := V) p hp01 f g hf hg\n  have hpsi_le_g : (Finset.univ : Finset (V → Bool)).sum (fun x => μ x * psi x) ≤\n      (Finset.univ : Finset (V → Bool)).sum (fun x => μ x * g x) := by\n    refine Finset.sum_le_sum ?_\n    intro x _hx\n    have hμ_nonneg : 0 ≤ μ x := by\n      dsimp [μ]\n      exact Finset.prod_nonneg fun v _ => by\n        by_cases hxv : x v\n        · simp [hxv, le_of_lt hp.1]\n        · simp [hxv, sub_nonneg.mpr (le_of_lt hp.2)]\n    have hcount : disjCount x ≤ totalCount x := by\n      refine Finset.card_le_card ?_\n      intro j hj\n      rcases Finset.mem_filter.mp hj with ⟨hjuniv, hdisj, hsub⟩\n      refine Finset.mem_filter.mpr ⟨hjuniv, ?_⟩\n      intro v hv\n      have hv_union := hsub hv\n      have hv_not_Gi : v ∉ G i := by\n        intro hvGi\n        have : v ∈ G i ∩ G j := by\n          exact Finset.mem_inter.mpr ⟨hvGi, hv⟩\n        exact hdisj ⟨v, this⟩\n      rcases Finset.mem_union.mp hv_union with hvGi | hvres\n      · exact False.elim (hv_not_Gi hvGi)\n      · simp only [chosen, Finset.mem_filter]\n        simp only [residual, R, Finset.mem_filter] at hvres\n        exact ⟨by simp, hvres.2⟩\n    have hpsi_g : psi x ≤ g x := by\n      apply Real.exp_le_exp.mpr\n      have hcast : (disjCount x : ℝ) ≤ (totalCount x : ℝ) := by exact_mod_cast hcount\n      nlinarith [mul_le_mul_of_nonneg_left hcast hs]\n    exact mul_le_mul_of_nonneg_left hpsi_g hμ_nonneg\n  have hfirst_nonneg : 0 ≤ (Finset.univ : Finset (V → Bool)).sum (fun x => μ x * f x) := by\n    refine Finset.sum_nonneg ?_\n    intro x _hx\n    exact mul_nonneg\n      (by\n        dsimp [μ]\n        exact Finset.prod_nonneg fun v _ => by\n          by_cases hxv : x v\n          · simp [hxv, le_of_lt hp.1]\n          · simp [hxv, sub_nonneg.mpr (le_of_lt hp.2)])\n      (Real.exp_pos _).le\n  have hreplace :\n      ((Finset.univ : Finset (V → Bool)).sum (fun x => μ x * f x)) *\n          ((Finset.univ : Finset (V → Bool)).sum (fun x => μ x * psi x)) ≤\n        ((Finset.univ : Finset (V → Bool)).sum (fun x => μ x * f x)) *\n          ((Finset.univ : Finset (V → Bool)).sum (fun x => μ x * g x)) :=\n    mul_le_mul_of_nonneg_left hpsi_le_g hfirst_nonneg\n  exact hreplace.trans harris","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, let\n$(G_j)_{j\\in I}$ be a finite labelled family of subsets of $V$, and fix a\nlabel $i$.  For an atom $x:V\\to\\{0,1\\}$ write\n\\[\n  R_i(x)=\\{v\\in V\\setminus G_i:x(v)=1\\},\\qquad\n  Z(x)=\\{v\\in V:x(v)=1\\}.\n\\]\nFor $s\\ge0$ define\n\\[\n  F_i(x)=\\exp\\!\\left(-s\n    |\\{j:G_i\\cap G_j\\ne\\varnothing,\\;G_j\\subseteq G_i\\cup R_i(x)\\}|\\right)\n\\]\nand\n\\[\n  H_i(x)=\\exp\\!\\left(-s\n    |\\{j:G_i\\cap G_j=\\varnothing,\\;G_j\\subseteq G_i\\cup R_i(x)\\}|\\right).\n\\]\nThen, for $0\u003cp\u003c1$,\n\\[\n\\sum_x \\mu_p(x)F_i(x)H_i(x)\n\\ge\n\\left(\\sum_x \\mu_p(x)F_i(x)\\right)\n\\left(\\sum_x \\mu_p(x)\n  \\exp\\!\\left(-s|\\{j:G_j\\subseteq Z(x)\\}|\\right)\\right),\n\\]\nwhere $\\mu_p(x)=\\prod_{v\\in V}p^{x(v)}(1-p)^{1-x(v)}$ is the Bernoulli\nproduct mass.\n\\end{helper}","tex_proof":"\\begin{proof}\nBy \\noderef{FiniteJansonResidualFactorsDecreasing}, if an atom $x$ is\nincreased coordinatewise to an atom $y$, then the residual set\n$R_i(x)$ is contained in $R_i(y)$, and both displayed residual exponential\nfactors weakly decrease.  Hence the functions $F_i$ and $H_i$ are decreasing\nfunctions on the Boolean product space $V\\to\\{0,1\\}$.\n\nSince $0\u003cp\u003c1$, in particular $0\\le p\\le1$.  Applying\n\\noderef{FiniteProductHarrisKleitman} to the decreasing functions $F_i$ and\n$H_i$ gives\n\\[\n\\sum_x \\mu_p(x)F_i(x)H_i(x)\n\\ge\n\\left(\\sum_x \\mu_p(x)F_i(x)\\right)\n\\left(\\sum_x \\mu_p(x)H_i(x)\\right).\n\\]\nIt remains to compare the second factor with the full moment factor.  Fix\nan atom $x$.  Every label counted by the disjoint residual count defining\n$H_i(x)$ has $G_i\\cap G_j=\\varnothing$ and\n$G_j\\subseteq G_i\\cup R_i(x)$.  Because it is disjoint from $G_i$, this\nimplies $G_j\\subseteq R_i(x)\\subseteq Z(x)$.  Thus the disjoint residual\ncount is at most the full count $|\\{j:G_j\\subseteq Z(x)\\}|$.\nSince $s\\ge0$, the map $n\\mapsto \\exp(-sn)$ is decreasing on nonnegative\ninteger counts, so\n\\[\n  \\exp\\!\\left(-s|\\{j:G_j\\subseteq Z(x)\\}|\\right)\\le H_i(x).\n\\]\nMultiplying by the nonnegative atom mass $\\mu_p(x)$ and summing over all\natoms $x$ gives\n\\[\n\\sum_x \\mu_p(x)\n  \\exp\\!\\left(-s|\\{j:G_j\\subseteq Z(x)\\}|\\right)\n\\le\n\\sum_x \\mu_p(x)H_i(x).\n\\]\nThe first factor $\\sum_x\\mu_p(x)F_i(x)$ is nonnegative, since every atom mass\nand every exponential value is nonnegative.  Replacing the second factor in\nthe Harris--Kleitman lower bound by the smaller full moment factor proves the\nclaimed inequality.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FragmentFiltration":{"name":"FragmentFiltration","title":"FragmentFiltration","kind":"lemma","is_target":false,"imports":["KGoodPair","UniformEdges"],"imported_by":["StageSuccessEstimate","StrongSpiroTheorem","IntermediateStoppingEstimate"],"lean_statement":"lemma FragmentFiltration {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq V]\n    (E : Ω → Finset V) (r : ℕ → ℕ) (ℓ : ℕ)\n    (hunif : UniformEdges E (r 0))\n    (hℓ : 0 \u003c ℓ)\n    (hpos : ∀ i : ℕ, i \u003c ℓ → 1 \u003c r i)\n    (hmono : ∀ i : ℕ, i + 1 \u003c ℓ → r (i + 1) \u003c r i) :\n    ∃ (Surv : List (Finset V) → Ω → Prop)\n      (F : List (Finset V) → Ω → Finset V)\n      (κ : List (Finset V) → Ω → Ω),\n      (∀ x : Ω, Surv [] x ∧ F [] x = E x ∧ κ [] x = x) ∧\n      (∀ L W x, L.length + 1 \u003c ℓ → Surv (W :: L) x → Surv L x) ∧\n      (∀ L x, L.length \u003c ℓ → Surv L x → F L x ⊆ E x) ∧\n      (∀ L x, L.length \u003c ℓ → Surv L x → (F L x).card = r L.length) ∧\n      (∀ L x, L.length \u003c ℓ → Surv L x →\n        E (κ L x) ⊆ F L x ∪ L.toFinset.biUnion id) ∧\n      (∀ L W x, L.length + 1 \u003c ℓ →\n        (Surv (W :: L) x ↔\n          ∃ hx : Surv L x,\n            @KGoodPair {y : Ω // Surv L y} V _ (fun y => F L y.1)\n              (r (L.length + 1)) ⟨x, hx⟩ W)) := by","lean_proof":"classical\n  let State := fun L : List (Finset V) =>\n    {p : (Ω → Prop) × (Ω → Finset V) × (Ω → Ω) //\n      ∀ x, p.1 x → p.2.1 x ⊆ E x ∧ (p.2.1 x).card = r L.length ∧\n        E (p.2.2 x) ⊆ p.2.1 x ∪ L.toFinset.biUnion id}\n  let Good := fun (p : (Ω → Prop) × (Ω → Finset V) × (Ω → Ω))\n      (L : List (Finset V)) (W : Finset V) x =>\n    ∃ hx : p.1 x,\n      @KGoodPair {y : Ω // p.1 y} V _ (fun y => p.2.1 y.1)\n        (r (L.length + 1)) ⟨x, hx⟩ W\n  have extend : ∀ L W, L.length + 1 \u003c ℓ → ∀ (s : State L) x,\n      Good s.val L W x →\n      ∃ q : Finset V × Ω,\n        q.1 ⊆ E x ∧ q.1.card = r (L.length + 1) ∧\n          E q.2 ⊆ q.1 ∪ (W :: L).toFinset.biUnion id := by\n    intro L W hi s x hx\n    rcases hx with ⟨hx, y, hsub, hcard⟩\n    have hdiff : s.val.2.1 y.val \\ W ⊆ s.val.2.1 x := by\n      intro v hv\n      rcases Finset.mem_sdiff.mp hv with ⟨hvy, hvW⟩\n      exact (Finset.mem_union.mp (hsub hvy)).resolve_right hvW\n    have hsize : r (L.length + 1) ≤ (s.val.2.1 x).card := by\n      rw [(s.property x hx).2.1]\n      exact (hmono L.length hi).le\n    obtain ⟨f, hdf, hfx, hfcard⟩ :=\n      Finset.exists_subsuperset_card_eq hdiff hcard hsize\n    refine ⟨(f, s.val.2.2 y.val), hfx.trans (s.property x hx).1, hfcard, ?_⟩\n    have hunion : (W :: L).toFinset.biUnion id = W ∪ L.toFinset.biUnion id := by\n      simp\n    rw [hunion]\n    intro v hv\n    rcases Finset.mem_union.mp ((s.property y.val y.property).2.2 hv) with hv | hv\n    · by_cases hvW : v ∈ W\n      · exact Finset.mem_union_right _ (Finset.mem_union_left _ hvW)\n      · exact Finset.mem_union_left _ (hdf (Finset.mem_sdiff.mpr ⟨hv, hvW⟩))\n    · exact Finset.mem_union_right _ (Finset.mem_union_right _ hv)\n  let initial : State [] :=\n    ⟨((fun _ => True), E, id), by\n      intro x _\n      exact ⟨Finset.Subset.refl _, hunif x, by simp⟩⟩\n  let next : ∀ L W, State L → State (W :: L) := fun L W s =>\n    if hi : L.length + 1 \u003c ℓ then\n      let q : Ω → Finset V × Ω := fun x =>\n        if hx : Good s.val L W x then Classical.choose (extend L W hi s x hx)\n        else (∅, x)\n      ⟨(Good s.val L W, (fun x => (q x).1), (fun x => (q x).2)), by\n        intro x hx\n        simpa only [q, dif_pos hx, List.length_cons] using\n          Classical.choose_spec (extend L W hi s x hx)⟩\n    else\n      ⟨((fun _ => False), (fun _ => ∅), id), by\n        intro x hx\n        exact False.elim hx⟩\n  let states : ∀ L, State L := List.rec initial (fun W L s => next L W s)\n  have successor : ∀ L W x, L.length + 1 \u003c ℓ →\n      ((states (W :: L)).val.1 x ↔ Good (states L).val L W x) := by\n    intro L W x hi\n    change (next L W (states L)).val.1 x ↔ _\n    simp only [next, dif_pos hi]\n  refine ⟨(fun L => (states L).val.1), (fun L => (states L).val.2.1),\n    (fun L => (states L).val.2.2), ?_, ?_, ?_, ?_, ?_, ?_⟩\n  · intro x\n    exact ⟨True.intro, rfl, rfl⟩\n  · intro L W x hi hx\n    exact ((successor L W x hi).mp hx).choose\n  · intro L x _ hx\n    exact ((states L).property x hx).1\n  · intro L x _ hx\n    exact ((states L).property x hx).2.1\n  · intro L x _ hx\n    exact ((states L).property x hx).2.2\n  · intro L W x hi\n    exact successor L W x hi","tex_statement":"\\begin{lemma}\nLet $\\Omega$ be finite, let $E:\\Omega\\to\\binom V{r_0}$, and let $\\ell>0$\nwith $r_j>1$ for $j\u003c\\ell$ and $r_{j+1}\u003cr_j$ when $j+1\u003c\\ell$.\nThere exist jointly chosen functions $S_L\\subseteq\\Omega$,\n$F_L:\\Omega\\to2^V$, and $\\kappa_L:\\Omega\\to\\Omega$, indexed by all finite\nlists $L$ of subsets of $V$. Lists record histories in reverse chronological\norder: the next exposed set $W$ extends $L$ to $W::L$.\nWriting $j=|L|$ and $U_L=\\bigcup_{W\\in L}W$, they satisfy:\n\\begin{enumerate}\n\\item $S_{[]}=\\Omega$, $F_{[]}(x)=E(x)$, and $\\kappa_{[]}(x)=x$.\n\\item If $j+1\u003c\\ell$, then $S_{W::L}\\subseteq S_L$.\n\\item If $j\u003c\\ell$ and $x\\in S_L$, then\n$F_L(x)\\subseteq E(x)$ and $|F_L(x)|=r_j$.\n\\item If $j\u003c\\ell$ and $x\\in S_L$, then\n$E(\\kappa_L(x))\\subseteq F_L(x)\\cup U_L$.\n\\item If $j+1\u003c\\ell$, then\n\\[\n x\\in S_{W::L}\\quad\\Longleftrightarrow\\quad\n x\\in S_L\\ \\text{and }(F_L(x),W)\\text{ is }r_{j+1}\\text{-good in }F_L(S_L).\n\\]\n\\end{enumerate}\nIn particular these states depend only on the exposed history. For any\nfixed sequence $W_0,W_1,\\ldots$, evaluation at\n$L_j=[W_{j-1},\\ldots,W_0]$ gives a filtration with initialization,\ndecreasing survivors, exact fragment sizes, anchoring, coverage, and the\nexact survivor equivalence above. Two sequences agreeing before level $j$\ngive identical states at level $j$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nUse recursion on lists, adjoining the newest sample at the head.\nAt the empty list set $S_{[]}=\\Omega$, $F_{[]}=E$, and $\\kappa_{[]}=\\mathrm{id}$.\nUniformity, in the sense of \\noderef{UniformEdges}, gives the initial\ncardinality, and the initial coverage is $E(x)\\subseteq E(x)\\cup\\varnothing$.\n\nSuppose the state at $L$ has been constructed and $j+1\u003c\\ell$.\nDefine $S_{W::L}$ to be exactly the set of $x\\in S_L$ for which\n$(F_L(x),W)$ is $r_{j+1}$-good, using \\noderef{KGoodPair} in the\nrestricted labelled family on $S_L$. This gives both the survivor\nequivalence and decreasing survivors.\nFix orders once and for all on the finite label set and the finite\nsubsets of each edge. For a surviving $x$, choose the first witness\n$y\\in S_L$ with\n\\[\n F_L(y)\\subseteq F_L(x)\\cup W,\\qquad |F_L(y)\\setminus W|\\le r_{j+1}.\n\\]\nThe set $F_L(y)\\setminus W$ lies in $F_L(x)$, which has size\n$r_j>r_{j+1}$. Extend it within $F_L(x)$ to an $r_{j+1}$-subset,\nchoose the first such extension as $F_{W::L}(x)$, and put\n$\\kappa_{W::L}(x)=\\kappa_L(y)$. Off the new survivor set put\n$F_{W::L}(x)=\\varnothing$ and $\\kappa_{W::L}(x)=x$.\nAnchoring follows from $F_{W::L}(x)\\subseteq F_L(x)\\subseteq E(x)$.\nFor coverage, the old invariant and the extension give\n\\[\n E(\\kappa_{W::L}(x))=E(\\kappa_L(y))\n \\subseteq F_L(y)\\cup U_L\n \\subseteq F_{W::L}(x)\\cup W\\cup U_L\n =F_{W::L}(x)\\cup U_{W::L}.\n\\]\nThe size condition holds by construction.\nFor transitions with $j+1\\ge\\ell$ assign an empty survivor set and arbitrary\nfragment and coverage maps; the asserted noninitial conditions are then\nvacuous at those levels. This defines states for all lists.\n\nEvery recursive choice uses only the already defined state at $L$ and the\nnew set $W$, never a future sample. Equivalently, one can choose extensions\nsimultaneously for every pair $(L,W)$ before any samples are drawn.\nList recursion then gives a single function of the finite history.\nEvaluating at $L_j$ proves the stated fixed-sequence consequences, and\nequality of two length-$j$ histories gives identical states by substitution.\n\\end{proof}","tex_env":"lemma","semantic_closure":["KGoodPair","UniformEdges"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"WeightedBadPairPathological":{"name":"WeightedBadPairPathological","title":"WeightedBadPairPathological","kind":"definition","is_target":false,"imports":["KGoodPair","LabelMass"],"imported_by":["WeightedBadPairNonpathologicalCount","WeightedBadPairPathologicalCount"],"lean_statement":"noncomputable def WeightedBadPairPathological {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (F : Ω → Finset V) (ν : Ω → ℝ) (r k m : ℕ) (C : ℝ)\n    (t : ℕ) (x : Ω) (W : Finset V) : Prop := by","lean_proof":"classical\n  let η := (C / 4) ^ (-(k : ℝ) / 2)\n  let w := m - t\n  let D := ((w + r).choose r : ℝ) / ((Fintype.card V).choose r : ℝ)\n  let Z := F x ∪ W\n  exact LabelMass ν (fun y => F y ⊆ Z ∧ ¬ KGoodPair F k y (Z \\ F y)) > η * D","tex_statement":"\\begin{definition}\nFor finite sets $\\Omega,V$, a labelled family $F:\\Omega\\to 2^V$, real\nweights $\\nu:\\Omega\\to\\mathbb R$, integers $r,k,m,t\\geq0$, and $C\\in\\mathbb R$,\nput $n=|V|$, $w=m-t$ (natural-number subtraction),\n$\\eta=(C/4)^{-k/2}$, and\n$D=\\binom{w+r}{r}/\\binom nr$.\nFor $Z\\subseteq V$ put\n\\[\ng(Z)=\\nu\\{y:F(y)\\subseteq Z\\text{ and }(F(y),Z\\setminus F(y))\n\\text{ is }k\\text{-bad}\\}.\n\\]\nHere mass means the sum of the label weights, and badness is the negation\nof the witness predicate in \\noderef{KGoodPair}.\nThe predicate $\\operatorname{WeightedBadPairPathological}(F,\\nu,r,k,m,C,t,x,W)$\nmeans $g(F(x)\\cup W)>\\eta D$. Powers use Mathlib's total real-power\nfunction \\texttt{Real.rpow}; division is real division, with division\nby zero interpreted as zero. In the counting lemmas the power base and\nall displayed denominators are positive.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":["KGoodPair","LabelMass"],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"AnchoredOverlapMoment":{"name":"AnchoredOverlapMoment","title":"AnchoredOverlapMoment","kind":"lemma","is_target":false,"imports":["LabelMass","ProbabilityMass"],"imported_by":["StageExpectedBadMass"],"lean_statement":"lemma AnchoredOverlapMoment {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq V]\n    (E F : Ω → Finset V) (μ ν : Ω → ℝ) (P : Ω → Prop) [DecidablePred P]\n    (q C p : ℝ) (r k : ℕ)\n    (hμ : ProbabilityMass μ) (hν : ProbabilityMass ν)\n    (hνsupport : ∀ y : Ω, ¬ P y → ν y = 0)\n    (hcond : ∀ y : Ω, P y → ν y ≤ 2 * μ y)\n    (hFsub : ∀ x : Ω, P x → F x ⊆ E x)\n    (hFcard : ∀ x : Ω, P x → (F x).card = r)\n    (hq : 0 \u003c q ∧ q ≤ 1)\n    (hp : 0 \u003c p ∧ p = C * q ∧ p ≤ (1 / 2 : ℝ))\n    (hC : 8 ≤ C)\n    (hk : k ≤ r)\n    (hprofile : ∀ x : Ω, P x → ∀ h : ℕ, k ≤ h → h ≤ r →\n      LabelMass μ (fun y : Ω => (E y ∩ F x).card = h) ≤ q ^ h) :\n    ∀ x : Ω, P x →\n      Finset.sum (Finset.Icc k r)\n        (fun j : ℕ =>\n          LabelMass ν (fun y : Ω => P y ∧ (F x ∩ F y).card = j) *\n            (p / 2) ^ (-(j : ℝ))) ≤\n        4 * (C / 2) ^ (-(k : ℝ)) := by","lean_proof":"classical\n  intro x hx\n  let J : Ω → ℕ := fun y => (F x ∩ F y).card\n  let H : Ω → ℕ := fun y => (E y ∩ F x).card\n  let t : ℝ := 2 / p\n  have ht : 0 ≤ t := le_of_lt (div_pos (by norm_num) hp.1)\n  have htone : 1 ≤ t := (one_le_div hp.1).2 (by linarith [hp.2.2])\n  have hCpos : 0 \u003c C := by linarith\n  have hpow (a : ℝ) (j : ℕ) : a ^ (-(j : ℝ)) = (a⁻¹) ^ j := by\n    rw [Real.rpow_neg_eq_inv_rpow, Real.rpow_natCast]\n  have hJH (y : Ω) (hy : P y) : J y ≤ H y := by\n    apply Finset.card_le_card\n    intro v hv\n    obtain ⟨hvx, hvy⟩ := Finset.mem_inter.mp hv\n    exact Finset.mem_inter.mpr ⟨hFsub y hy hvy, hvx⟩\n  have hHr (y : Ω) : H y ≤ r := by\n    exact (Finset.card_le_card Finset.inter_subset_right).trans_eq (hFcard x hx)\n  -- Expand each mass and exchange the finite sums to collect a label's weight.\n  have hregroup (a : Ω → ℝ) (S : Ω → Prop) [DecidablePred S]\n      (L : Ω → ℕ) :\n      (∑ j ∈ Finset.Icc k r,\n        LabelMass a (fun y => S y ∧ L y = j) * t ^ j) =\n        ∑ y, if S y ∧ L y ∈ Finset.Icc k r then a y * t ^ L y else 0 := by\n    simp only [LabelMass, Finset.sum_filter, Finset.sum_mul, ite_mul, zero_mul]\n    rw [Finset.sum_comm]\n    apply Finset.sum_congr rfl\n    intro y _\n    by_cases hy : S y\n    · simp [hy, Finset.sum_ite_eq]\n    · simp [hy]\n  have hbase : q * t = 2 / C := by\n    dsimp [t]\n    rw [hp.2.1]\n    field_simp [ne_of_gt hq.1, ne_of_gt hCpos]\n  have hratio : 0 ≤ 2 / C := le_of_lt (div_pos (by norm_num) hCpos)\n  have hratio_le : 2 / C ≤ (1 / 4 : ℝ) := by\n    apply (div_le_iff₀ hCpos).2\n    linarith\n  have hgeom : (∑ h ∈ Finset.Icc k r, (2 / C) ^ h) ≤ 2 * (2 / C) ^ k := by\n    have hlt : 2 / C \u003c 1 := by linarith\n    have h := geom_sum_Ico_le_of_lt_one (m := k) (n := r + 1) hratio hlt\n    rw [Finset.Ico_add_one_right_eq_Icc] at h\n    refine h.trans ?_\n    apply (div_le_iff₀ (by linarith : 0 \u003c 1 - 2 / C)).2\n    nlinarith [pow_nonneg hratio k]\n  calc\n    (∑ j ∈ Finset.Icc k r,\n        LabelMass ν (fun y => P y ∧ (F x ∩ F y).card = j) *\n          (p / 2) ^ (-(j : ℝ))) =\n        ∑ y, if P y ∧ J y ∈ Finset.Icc k r then ν y * t ^ J y else 0 := by\n      simpa only [hpow, inv_div, J, t] using hregroup ν P J\n    _ ≤ 2 * ∑ y, if H y ∈ Finset.Icc k r then μ y * t ^ H y else 0 := by\n      rw [Finset.mul_sum]\n      apply Finset.sum_le_sum\n      intro y _\n      have hμy := hμ.1 y\n      by_cases hy : P y ∧ J y ∈ Finset.Icc k r\n      · have hyH : H y ∈ Finset.Icc k r :=\n          Finset.mem_Icc.mpr\n            ⟨(Finset.mem_Icc.mp hy.2).1.trans (hJH y hy.1), hHr y⟩\n        simp only [if_pos hy, if_pos hyH]\n        calc\n          ν y * t ^ J y ≤ (2 * μ y) * t ^ J y :=\n            mul_le_mul_of_nonneg_right (hcond y hy.1) (pow_nonneg ht _)\n          _ ≤ (2 * μ y) * t ^ H y :=\n            mul_le_mul_of_nonneg_left (pow_le_pow_right₀ htone (hJH y hy.1))\n              (by positivity)\n          _ = 2 * (μ y * t ^ H y) := mul_assoc _ _ _\n      · rw [if_neg hy]\n        apply mul_nonneg (by norm_num)\n        split_ifs \u003c;> positivity\n    _ = 2 * ∑ h ∈ Finset.Icc k r,\n        LabelMass μ (fun y => H y = h) * t ^ h := by\n      congr 1\n      simpa only [true_and] using (hregroup μ (fun _ => True) H).symm\n    _ ≤ 2 * ∑ h ∈ Finset.Icc k r, q ^ h * t ^ h := by\n      apply mul_le_mul_of_nonneg_left _ (by norm_num)\n      apply Finset.sum_le_sum\n      intro h hh\n      exact mul_le_mul_of_nonneg_right\n        (hprofile x hx h (Finset.mem_Icc.mp hh).1 (Finset.mem_Icc.mp hh).2)\n        (pow_nonneg ht h)\n    _ = 2 * ∑ h ∈ Finset.Icc k r, (2 / C) ^ h := by\n      simp only [← mul_pow, hbase]\n    _ ≤ 4 * (2 / C) ^ k := by linarith\n    _ = 4 * (C / 2) ^ (-(k : ℝ)) := by rw [hpow, inv_div]","tex_statement":"\\begin{lemma}\nLet $\\Omega$ be a finite label set, let $V$ be a vertex set, and let\n$E,F:\\Omega\\to 2^V$.  Let $\\mu$ and $\\nu$ be probability masses on $\\Omega$\nin the sense of \\noderef{ProbabilityMass}, and let $P$ be a predicate\nselecting the active labels.  Assume that $\\nu$ is supported on $P$ and that,\nfor every active label $y$,\n\\[\n    \\nu(y)\\le 2\\mu(y).\n\\]\nAssume also that, for every active label $x$, the fragment $F(x)$ is anchored\ninside the original edge and has size $r$:\n\\[\n    F(x)\\subseteq E(x),\n    \\qquad |F(x)|=r.\n\\]\nLet $0\u003cq\\le1$, let $0\u003cp$, let $p=Cq\\le1/2$, let $C\\ge8$, and let\n$k\\le r$.  Suppose that, for every active $x$ and every $h\\in[k,r]$,\n\\[\n    \\mu\\bigl(\\{y\\in\\Omega:|E(y)\\cap F(x)|=h\\}\\bigr)\\le q^h.\n\\]\nFor an active label $x$, put\n\\[\n    a_j(x)=\\nu(\\{y\\in\\Omega:P(y)\\text{ and }|F(x)\\cap F(y)|=j\\}).\n\\]\nThen, for every active label $x$,\n\\[\n    \\sum_{j=k}^r a_j(x)\\left(\\frac p2\\right)^{-j}\n    \\le4\\left(\\frac C2\\right)^{-k}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nFix an active label $x$.  For an active label $y$, set\n$j=|F(x)\\cap F(y)|$ and $h=|F(x)\\cap E(y)|$.  Since $F(y)\\subseteq E(y)$,\nwe have $j\\le h$.  If $j\\ge k$, then\n\\[\n    \\left(\\frac p2\\right)^{-j}\\le\n    \\left(\\frac p2\\right)^{-h},\n\\]\nbecause $p/2\\le1$ and negative powers reverse the monotonicity in the\nexponent.  By the pointwise domination hypothesis, every active label has\n$\\nu$-mass at most twice its $\\mu$-mass.  Therefore, using the definition of\nlabel mass from \\noderef{LabelMass} and the nonnegativity in\n\\noderef{ProbabilityMass},\n\\[\n    \\sum_{j=k}^r a_j(x)\\left(\\frac p2\\right)^{-j}\n    \\le\n    2\\sum_{h=k}^r\n       \\mu\\bigl(\\{y:|E(y)\\cap F(x)|=h\\}\\bigr)\n       \\left(\\frac p2\\right)^{-h}.\n\\]\nIndeed, each active $y$ counted by the $j$th summand is assigned to\n$h=|E(y)\\cap F(x)|$; the inequality $j\\le h$ gives the displayed weight\ncomparison, and domination converts the $\\nu$-mass of all such active labels\nto at most twice their $\\mu$-mass.  Forgetting the requirement $P(y)$ can only\nincrease the $\\mu$-mass, giving the displayed upper bound.\n\nThe assumed profile bound replaces each mass by $q^h$, and $p=Cq$ turns\n$q^h(p/2)^{-h}$ into $(C/2)^{-h}$.  Hence the last display is at most\n\\[\n    2\\sum_{h=k}^r\\left(\\frac C2\\right)^{-h}.\n\\]\nBecause $C\\ge8$, the ratio of this geometric tail is at most $1/4$; thus the\ntail is at most twice its first term.  This gives\n\\[\n    2\\sum_{h=k}^r\\left(\\frac C2\\right)^{-h}\n    \\le4\\left(\\frac C2\\right)^{-k},\n\\]\nwhich is the desired overlap-moment estimate.\n\\end{proof}","tex_env":"lemma","semantic_closure":["LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"ContainmentSpread":{"name":"ContainmentSpread","title":"ContainmentSpread","kind":"definition","is_target":false,"imports":["LabelMass","ProbabilityMass"],"imported_by":["SpiroToDistributionalSpread","ContainmentBinomialHitting","ContainmentHitting","IntermediateStoppingEstimate"],"lean_statement":"def ContainmentSpread {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq V] (E : Ω → Finset V) (μ : Ω → ℝ)\n    (q : ℝ) : Prop :=","lean_proof":"ProbabilityMass μ ∧\n    ∀ T : Finset V,\n      LabelMass μ (fun x : Ω => T ⊆ E x) ≤ q ^ T.card","tex_statement":"\\begin{definition}\nFor a labelled family $E:\\Omega\\to2^V$ and a probability distribution $\\mu$ on\nthe labels, the pair $(E,\\mu)$ is $q$-containment-spread if, for every\n$T\\subseteq V$, the label mass of labels $x$ with $T\\subseteq E(x)$ is at\nmost $q^{|T|}$.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":["LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteFirstFailureBound":{"name":"FiniteFirstFailureBound","title":"FiniteFirstFailureBound","kind":"lemma","is_target":false,"imports":["LabelMass","ProbabilityMass"],"imported_by":["SpiroGoodHistoryEstimate","StrongSpiroTheorem","IntermediateStoppingEstimate"],"lean_statement":"lemma FiniteFirstFailureBound {X : Type u} [Fintype X] [Nonempty X]\n    (d : ℕ) (Good : (j : ℕ) → (Fin j → X) → Prop)\n    (ε : ℕ → ℝ)\n    (hzero : ∀ h, Good 0 h)\n    (hprefix : ∀ j, j \u003c d → ∀ h x, Good (j + 1) (Fin.snoc h x) → Good j h)\n    (hε : ∀ j, j \u003c d → 0 ≤ ε j)\n    (hlocal : ∀ j, j \u003c d → ∀ h, Good j h →\n      (((@Finset.filter X (fun x : X => ¬ Good (j + 1) (Fin.snoc h x))\n        (Classical.decPred _) Finset.univ).card : ℝ) /\n        (Fintype.card X : ℝ)) ≤ ε j) :\n    @LabelMass (Fin d → X) _\n      (fun _ => ((Fintype.card X : ℝ) ^ d)⁻¹)\n      (fun h => ¬ Good d h) (Classical.decPred _) ≤ ∑ j ∈ Finset.range d, ε j := by","lean_proof":"classical\n  let N : ℝ := Fintype.card X\n  have hN : 0 \u003c N := by dsimp [N]; exact_mod_cast Fintype.card_pos\n  let B := fun j => ∑ h : Fin j → X, if ¬ Good j h then (1 : ℝ) else 0\n  have hrec (j : ℕ) (hj : j \u003c d) :\n      B (j + 1) ≤ N * B j + ε j * N ^ (j + 1) := by\n    have hlocal' (h : Fin j → X) :\n        (∑ x : X, if ¬ Good (j + 1) (Fin.snoc h x) then (1 : ℝ) else 0) ≤\n          N * (if ¬ Good j h then 1 else 0) + ε j * N := by\n      by_cases hh : Good j h\n      · have he := hlocal j hj h hh\n        rw [div_le_iff₀ hN] at he\n        simp only [Finset.sum_boole, if_neg (not_not.mpr hh), mul_zero, zero_add]\n        convert he using 1\n        congr 1\n        congr 1\n        ext x\n        simp only [Finset.mem_filter]\n      · have he : (∑ x : X,\n            if ¬ Good (j + 1) (Fin.snoc h x) then (1 : ℝ) else 0) ≤ N := by\n          calc\n            _ ≤ ∑ _ : X, (1 : ℝ) := Finset.sum_le_sum (fun x _ => by split_ifs \u003c;> norm_num)\n            _ = N := by simp [N]\n        rw [if_pos hh, mul_one]\n        exact he.trans (le_add_of_nonneg_right (mul_nonneg (hε j hj) hN.le))\n    have hsplit : B (j + 1) =\n        ∑ h : Fin j → X, ∑ x : X,\n          if ¬ Good (j + 1) (Fin.snoc h x) then (1 : ℝ) else 0 := by\n      have he := (Fin.snocEquiv (fun _ : Fin (j + 1) => X)).sum_comp\n        (fun h => if ¬ Good (j + 1) h then (1 : ℝ) else 0)\n      rw [Fintype.sum_prod_type, Finset.sum_comm] at he\n      exact he.symm\n    rw [hsplit]\n    calc\n      _ ≤ ∑ h : Fin j → X, (N * (if ¬ Good j h then 1 else 0) + ε j * N) :=\n        Finset.sum_le_sum (fun h _ => hlocal' h)\n      _ = N * B j + ε j * N ^ (j + 1) := by\n        rw [Finset.sum_add_distrib, ← Finset.mul_sum]\n        simp only [Finset.sum_const, Finset.card_univ, Fintype.card_fun, Fintype.card_fin,\n          Nat.cast_pow, nsmul_eq_mul, pow_succ, B, N]\n        ring\n  have hbound : ∀ j, j ≤ d → B j ≤ N ^ j * ∑ a ∈ Finset.range j, ε a := by\n    intro j\n    induction j with\n    | zero =>\n      intro _\n      simp [B, hzero]\n    | succ j ih =>\n      intro hj\n      have hb := ih (by omega)\n      have hr := hrec j (by omega)\n      have hb' := mul_le_mul_of_nonneg_left hb hN.le\n      rw [pow_succ] at hr\n      rw [Finset.sum_range_succ, pow_succ]\n      nlinarith\n  have hb := hbound d le_rfl\n  have hp : 0 \u003c N ^ d := pow_pos hN d\n  have hmass : @LabelMass (Fin d → X) _\n      (fun _ => ((Fintype.card X : ℝ) ^ d)⁻¹)\n      (fun h => ¬ Good d h) (Classical.decPred _) = B d / N ^ d := by\n    simp only [LabelMass, Finset.sum_const, nsmul_eq_mul, B, Finset.sum_boole, N,\n      div_eq_mul_inv]\n    congr 2\n    congr 1\n    ext h\n    simp only [Finset.mem_filter]\n  rw [hmass]\n  exact (div_le_iff₀ hp).2 (by simpa only [mul_comm] using hb)","tex_statement":"\\begin{lemma}\nLet $X$ be a nonempty finite set, let $d\\ge0$, and for $0\\le j\\le d$\nlet $G_j$ be a predicate on histories $h\\in X^j$. Assume $G_0$ always\nholds, and $G_{j+1}(h,x)$ implies $G_j(h)$. Let $\\varepsilon_j\\ge0$\nfor $j\u003cd$, and suppose that for each $h\\in G_j$,\n\\[\n \\frac{|\\{x\\in X:(h,x)\\notin G_{j+1}\\}|}{|X|}\\le\\varepsilon_j.\n\\]\nFor $d$ independent uniform samples from $X$, the probability that the\ncomplete history is not in $G_d$ is at most $\\sum_{j\u003cd}\\varepsilon_j$.\nPrecisely, this probability is the label mass of $\\neg G_d$ under weights\n$|X|^{-d}$ on $X^d$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nPut $N=|X|>0$. Every bad complete history has a unique first bad extension:\nthere is a unique $j\u003cd$ such that its length-$j$ prefix is in $G_j$ and its\nlength-$(j+1)$ prefix is not in $G_{j+1}$. Existence follows by taking the\nfirst index of a bad prefix, since $G_0$ holds. Uniqueness follows because\nthe implication from good extensions to good prefixes, iterated, prevents\na bad prefix from having a later good extension.\nFor a fixed $j$ and good $h\\in X^j$, the number of bad next symbols is at\nmost $N\\varepsilon_j$. Each such extension has exactly $N^{d-j-1}$\ncompletions. Thus its total probability, summed over this $h$, is at most\n\\[\n N^{-d}(N\\varepsilon_j)N^{d-j-1}=N^{-j}\\varepsilon_j.\n\\]\nThere are at most $N^j$ good prefixes; since $\\varepsilon_j\\ge0$, summing\ngives at most $\\varepsilon_j$. The disjoint first-bad-extension events\npartition $\\neg G_d$, so summing over $j\u003cd$ proves the assertion.\nThese are finite counts, with probability interpreted by\n\\noderef{LabelMass}; no conditioning on a zero-probability event is used.\nWhen $d=0$, the bad event and the sum are both empty and have value zero.\n\\end{proof}","tex_env":"lemma","semantic_closure":["LabelMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"LargestEdgeScale":{"name":"LargestEdgeScale","title":"LargestEdgeScale","kind":"lemma","is_target":false,"imports":["LabelMass","ProbabilityMass","UniformEdges"],"imported_by":["RoundedSpiroSampleSizes","IntermediateStoppingEstimate","SpiroTheorem27"],"lean_statement":"lemma LargestEdgeScale {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (E : Ω → Finset V) (μ : Ω → ℝ) (q : ℝ) (r : ℕ)\n    (hprob : ProbabilityMass μ) (hunif : UniformEdges E r)\n    (hq : 0 \u003c q)\n    (hprofile : ∀ x : Ω, 0 \u003c μ x →\n      LabelMass μ (fun y : Ω => (E y ∩ E x).card = r) ≤ q ^ r) :\n    (r : ℝ) ≤ Real.exp 1 * q * (Fintype.card V : ℝ) := by","lean_proof":"classical\n  rcases eq_or_ne r 0 with rfl | hr\n  · simpa only [Nat.cast_zero] using\n      mul_nonneg (mul_nonneg (Real.exp_pos 1).le hq.le) (Nat.cast_nonneg (Fintype.card V))\n  let S := (Finset.univ : Finset V).powersetCard r\n  let M : Finset V → ℝ := fun A =>\n    (Finset.univ.filter (fun y : Ω => E y = A)).sum μ\n  have htotal : S.sum M = 1 := by\n    calc\n      S.sum M = ∑ y : Ω, μ y :=\n        Finset.sum_fiberwise_of_maps_to\n          (fun y _ => Finset.mem_powersetCard.mpr ⟨Finset.subset_univ _, hunif y⟩) μ\n      _ = 1 := hprob.2\n  have hmass : ∀ A ∈ S, M A ≤ q ^ r := by\n    intro A _\n    by_cases hpos : 0 \u003c M A\n    · obtain ⟨x, hxA, hx⟩ :=\n        (Finset.sum_pos_iff_of_nonneg (fun y _ => hprob.1 y)).mp hpos\n      have hxA : E x = A := (Finset.mem_filter.mp hxA).2\n      have hiff (y : Ω) : (E y ∩ E x).card = r ↔ E y = A := by\n        constructor\n        · intro hi\n          have hy : E y ∩ E x = E y :=\n            Finset.eq_of_subset_of_card_le Finset.inter_subset_left (by rw [hunif y, hi])\n          have hx' : E y ∩ E x = E x :=\n            Finset.eq_of_subset_of_card_le Finset.inter_subset_right (by rw [hunif x, hi])\n          exact hy.symm.trans (hx'.trans hxA)\n        · intro hy\n          rw [← hxA] at hy\n          rw [hy, Finset.inter_self, hunif x]\n      have hp := hprofile x hx\n      simpa only [LabelMass, hiff] using hp\n    · exact (le_of_not_gt hpos).trans (pow_nonneg hq.le r)\n  have hcount : 1 ≤ ((Fintype.card V).choose r : ℝ) * q ^ r := by\n    calc\n      1 = S.sum M := htotal.symm\n      _ ≤ S.sum (fun _ => q ^ r) := Finset.sum_le_sum hmass\n      _ = ((Fintype.card V).choose r : ℝ) * q ^ r := by\n        simp [S, Finset.card_powersetCard]\n  -- The factorial estimate gives the usual binomial bound after clearing r^r.\n  have hbinom : ((Fintype.card V).choose r : ℝ) * (r : ℝ) ^ r ≤\n      (Real.exp 1 * (Fintype.card V : ℝ)) ^ r := by\n    calc\n      ((Fintype.card V).choose r : ℝ) * (r : ℝ) ^ r ≤\n          ((Fintype.card V : ℝ) ^ r / (r.factorial : ℝ)) * (r : ℝ) ^ r :=\n        mul_le_mul_of_nonneg_right (Nat.choose_le_pow_div r (Fintype.card V))\n          (pow_nonneg (Nat.cast_nonneg _) _)\n      _ = (Fintype.card V : ℝ) ^ r * ((r : ℝ) ^ r / (r.factorial : ℝ)) := by ring\n      _ ≤ (Fintype.card V : ℝ) ^ r * Real.exp (r : ℝ) :=\n        mul_le_mul_of_nonneg_left (Real.pow_div_factorial_le_exp _ (Nat.cast_nonneg _) r)\n          (pow_nonneg (Nat.cast_nonneg _) _)\n      _ = (Real.exp 1 * (Fintype.card V : ℝ)) ^ r := by\n        rw [show (r : ℝ) = (r : ℝ) * 1 by ring, Real.exp_nat_mul, mul_pow]\n        ring\n  apply le_of_pow_le_pow_left₀ hr (by positivity)\n  calc\n    (r : ℝ) ^ r ≤ (((Fintype.card V).choose r : ℝ) * q ^ r) * (r : ℝ) ^ r := by\n      simpa only [one_mul] using\n        mul_le_mul_of_nonneg_right hcount (pow_nonneg (Nat.cast_nonneg r) r)\n    _ = (((Fintype.card V).choose r : ℝ) * (r : ℝ) ^ r) * q ^ r := by ring\n    _ ≤ (Real.exp 1 * (Fintype.card V : ℝ)) ^ r * q ^ r :=\n      mul_le_mul_of_nonneg_right hbinom (pow_nonneg hq.le r)\n    _ = (Real.exp 1 * q * (Fintype.card V : ℝ)) ^ r := by rw [← mul_pow]; congr 1; ring","tex_statement":"\\begin{lemma}\nLet $E:\\Omega\\to\\binom Vr$ be an $r$-uniform labelled hypergraph on an\n$n$-element set, and let $\\mu$ be a probability distribution on its labels.\nLet $q>0$.  Suppose that for every label $x$ in the support of $\\mu$, the\nmass of labels $y$ with $|E(y)\\cap E(x)|=r$ is at most $q^r$.  Then\n$r\\le e q n$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nLet $n=|V|$.  If $r=0$, then the desired inequality is\n$0\\le eqn$, which follows from $q>0$ and $n\\ge0$.  We may therefore assume\n$r>0$.\n\nSince $\\mu$ is a probability distribution on the finite label\nset, \\noderef{ProbabilityMass} says that all masses are nonnegative and that\nthe total mass over all labels is $1$.  For each $r$-element subset\n$A\\subseteq V$, define its aggregate mass\n\\[\n    M(A)=\\sum_{y:E(y)=A}\\mu(y).\n\\]\nThe $r$-uniformity hypothesis, interpreted through \\noderef{UniformEdges},\nsays that every labelled edge $E(y)$ has cardinality $r$.  Hence every label\ncontributes to exactly one aggregate mass $M(A)$ with $|A|=r$, and summing\n$M(A)$ over all $r$-subsets $A$ gives $1$.\n\nThere are exactly $\\binom nr$ possible $r$-subsets of $V$ when $r\\le n$.\nIf $r>n$, then \\noderef{UniformEdges} would require an $r$-element subset of\nthe $n$-element set $V$ for every positive-mass label; since the total mass is\n$1$, such a positive-mass label exists, a contradiction.  Thus $r\\le n$.\nBy the pigeonhole principle, some $r$-subset $A$ has\n\\[\n    M(A)\\ge \\binom nr^{-1}.\n\\]\nBecause this aggregate mass is positive, at least one label $x$ with\n$E(x)=A$ has $\\mu(x)>0$.\n\nFor this label $x$, the set of labels $y$ with\n$|E(y)\\cap E(x)|=r$ is exactly the set of labels with $E(y)=A$.  Indeed,\n\\noderef{UniformEdges} gives $|E(y)|=|E(x)|=r$, so an intersection of size\n$r$ is contained in two $r$-element sets and therefore forces equality of the\ntwo underlying sets; the converse is immediate.  Therefore the profile\nhypothesis applied to this positive-mass label $x$ gives\n\\[\n    M(A)\n    =\n    \\mu\\{y:|E(y)\\cap E(x)|=r\\}\n    \\le q^r .\n\\]\nCombining the last two displays yields\n\\[\n    \\binom nr^{-1}\\le q^r .\n\\]\n\nFinally use the standard binomial estimate\n\\[\n    \\binom nr\\le \\left(\\frac{en}{r}\\right)^r\n\\]\nfor $1\\le r\\le n$.  Taking reciprocals and combining with the previous\ninequality gives\n\\[\n    \\left(\\frac r{en}\\right)^r\\le q^r .\n\\]\nSince $r$ is positive and $q>0$, taking $r$th roots gives\n$r/(en)\\le q$, equivalently $r\\le eqn$, as required.\n\\end{proof}","tex_env":"lemma","semantic_closure":["LabelMass","ProbabilityMass","UniformEdges"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"StrongTerminalSpread":{"name":"StrongTerminalSpread","title":"StrongTerminalSpread","kind":"definition","is_target":false,"imports":["LabelMass","ProbabilityMass"],"imported_by":["SpiroToDistributionalSpread","StrongSpiroTheorem"],"lean_statement":"def StrongTerminalSpread {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq V] (E : Ω → Finset V) (μ : Ω → ℝ)\n    (q γ : ℝ) (r r' : ℕ) : Prop :=","lean_proof":"0 \u003c q ∧ q ≤ 1 ∧ 0 \u003c γ ∧ γ ≤ 1 ∧ 0 \u003c r' ∧ r' \u003c r ∧ ProbabilityMass μ ∧\n    ∀ (x : Ω) (S : Finset V) (t : ℕ),\n      S ⊆ E x →\n      r' ≤ S.card → S.card ≤ r →\n      r' ≤ t → t ≤ r →\n      LabelMass μ (fun y : Ω => (E y ∩ S).card = t) ≤ γ * q ^ t","tex_statement":"\\begin{definition}\nLet $q,\\gamma\\in(0,1]$, let $r>r'$ be positive integers, let\n$E:\\Omega\\to2^V$ be a labelled hypergraph, and let $\\mu$ be a probability\ndistribution on the labels.  The distribution $\\mu$ is\n$(q,\\gamma;r,r')$-spread if, for every labelled edge $E(x)$, every\n$S\\subseteq E(x)$ with $r'\\le |S|\\le r$, and every $t\\in[r',r]$, the label\nmass of labels $y$ satisfying $|E(y)\\cap S|=t$ is at most $\\gamma q^t$.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":["LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"SurvivorMassDomination":{"name":"SurvivorMassDomination","title":"SurvivorMassDomination","kind":"lemma","is_target":false,"imports":["LabelMass","ProbabilityMass"],"imported_by":["SpiroGoodHistoryEstimate","StrongSpiroTheorem","IntermediateStoppingEstimate"],"lean_statement":"lemma SurvivorMassDomination {Ω : Type u} [Fintype Ω] [DecidableEq Ω]\n    (μ : Ω → ℝ) (S : ℕ → Finset Ω) (ℓ d : ℕ)\n    (hprob : ProbabilityMass μ) (hℓ : 0 \u003c ℓ) (hd : d \u003c ℓ)\n    (hinit : S 0 = Finset.univ)\n    (hsub : ∀ j, j \u003c d → S (j + 1) ⊆ S j)\n    (hloss : ∀ j, j \u003c d →\n      (∑ x ∈ S j \\ S (j + 1), μ x) ≤ (∑ x ∈ S j, μ x) / (2 * (ℓ : ℝ))) :\n    ∀ j, j ≤ d →\n      1 - (j : ℝ) / (2 * (ℓ : ℝ)) ≤ ∑ x ∈ S j, μ x ∧\n      (1 / 2 : ℝ) ≤ ∑ x ∈ S j, μ x ∧\n      (let ν := fun x => if x ∈ S j then μ x / (∑ y ∈ S j, μ y) else 0\n       ProbabilityMass ν ∧ (∀ x, x ∉ S j → ν x = 0) ∧\n         ∀ x, ν x ≤ 2 * μ x) := by","lean_proof":"classical\n  let M := fun j => ∑ x ∈ S j, μ x\n  have hMnonneg (j : ℕ) : 0 ≤ M j := Finset.sum_nonneg (fun x _ => hprob.1 x)\n  have hMle (j : ℕ) : M j ≤ 1 := by\n    calc\n      M j ≤ ∑ x : Ω, μ x :=\n        Finset.sum_le_sum_of_subset_of_nonneg (Finset.subset_univ _) (fun x _ _ => hprob.1 x)\n      _ = 1 := hprob.2\n  have hℓR : (0 : ℝ) \u003c ℓ := by exact_mod_cast hℓ\n  have hden : 0 \u003c 2 * (ℓ : ℝ) := by positivity\n  have hbound : ∀ j, j ≤ d → 1 - (j : ℝ) / (2 * (ℓ : ℝ)) ≤ M j := by\n    intro j\n    induction j with\n    | zero => intro _; simpa [M, hinit] using hprob.2.ge\n    | succ j ih =>\n      intro hj\n      have hjd : j \u003c d := by omega\n      have hp := ih (by omega)\n      have hsplit : M (j + 1) + (∑ x ∈ S j \\ S (j + 1), μ x) = M j := by\n        simpa [M, add_comm] using Finset.sum_sdiff (f := μ) (hsub j hjd)\n      have hl := hloss j hjd\n      have hdiv := div_le_div_of_nonneg_right (hMle j) hden.le\n      change M j / (2 * (ℓ : ℝ)) ≤ 1 / (2 * (ℓ : ℝ)) at hdiv\n      push_cast\n      rw [add_div]\n      dsimp only [M] at hp ⊢\n      linarith\n  intro j hj\n  have hb := hbound j hj\n  have hjR : (j : ℝ) ≤ ℓ := by exact_mod_cast (by omega : j ≤ ℓ)\n  have hhalf : (1 / 2 : ℝ) ≤ M j := by\n    have heq : (ℓ : ℝ) / (2 * (ℓ : ℝ)) = 1 / 2 := by field_simp\n    have hdiv' : (j : ℝ) / (2 * (ℓ : ℝ)) ≤ 1 / 2 := by\n      rw [← heq]\n      exact div_le_div_of_nonneg_right hjR hden.le\n    linarith\n  have hMpos : 0 \u003c M j := by linarith\n  refine ⟨hb, hhalf, ?_⟩\n  dsimp only\n  refine ⟨⟨?_, ?_⟩, ?_, ?_⟩\n  · intro x\n    dsimp only\n    split_ifs\n    · exact div_nonneg (hprob.1 x) hMpos.le\n    · exact le_rfl\n  · change (∑ x : Ω, if x ∈ S j then μ x / M j else 0) = 1\n    rw [← Finset.sum_filter, Finset.filter_univ_mem, ← Finset.sum_div]\n    exact div_self (ne_of_gt hMpos)\n  · intro x hx\n    simp only [if_neg hx]\n  · intro x\n    by_cases hx : x ∈ S j\n    · rw [if_pos hx]\n      apply (div_le_iff₀ hMpos).2\n      have hh := mul_le_mul_of_nonneg_left hhalf (hprob.1 x)\n      nlinarith\n    · rw [if_neg hx]\n      exact mul_nonneg (by norm_num) (hprob.1 x)","tex_statement":"\\begin{lemma}\nLet $\\mu$ be a probability mass on a finite set $\\Omega$, let\n$0\\le d\u003c\\ell$ with $\\ell>0$, and let $S_0,\\ldots,S_d\\subseteq\\Omega$\nwith $S_0=\\Omega$ and $S_{j+1}\\subseteq S_j$. Suppose that, for $j\u003cd$,\n\\[\n \\sum_{x\\in S_j\\setminus S_{j+1}}\\mu(x)\n \\le\\frac{\\sum_{x\\in S_j}\\mu(x)}{2\\ell}.\n\\]\nThen for every $j\\le d$, writing $M_j=\\sum_{x\\in S_j}\\mu(x)$, one has\n$M_j\\ge1-j/(2\\ell)\\ge1/2$. The weights\n\\[\n \\nu_j(x)=\\begin{cases}\\mu(x)/M_j&x\\in S_j,\\\\0&x\\notin S_j\\end{cases}\n\\]\nform a probability mass supported on $S_j$ and satisfy\n$\\nu_j(x)\\le2\\mu(x)$ for every $x$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nBy \\noderef{ProbabilityMass}, all weights are nonnegative and their total\nis one. Thus $0\\le M_j\\le1$. The disjoint partition\n$S_j=S_{j+1}\\sqcup(S_j\\setminus S_{j+1})$ gives\n\\[\n M_{j+1}=M_j-\\sum_{x\\in S_j\\setminus S_{j+1}}\\mu(x)\n \\ge M_j-M_j/(2\\ell)\\ge M_j-1/(2\\ell).\n\\]\nStarting with $M_0=1$, induction yields $M_j\\ge1-j/(2\\ell)$.\nSince $j\\le d\u003c\\ell$ and $2\\ell>0$, this is at least $1/2$.\nIn particular $M_j>0$. The displayed definition of $\\nu_j$ is nonnegative,\nvanishes off $S_j$, and sums to $M_j/M_j=1$.\nIf $x\\in S_j$, the bound $M_j\\ge1/2$ implies $1/M_j\\le2$, so\n$\\nu_j(x)\\le2\\mu(x)$ by nonnegativity. Off $S_j$ this inequality follows\nfrom $\\nu_j(x)=0\\le2\\mu(x)$. This proves all assertions.\n\\end{proof}","tex_env":"lemma","semantic_closure":["ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"SampledUnionLaw":{"name":"SampledUnionLaw","title":"SampledUnionLaw","kind":"lemma","is_target":false,"imports":["ProbabilityMass"],"imported_by":["SampledUnionHittingTransfer"],"lean_statement":"lemma SampledUnionLaw {V : Type v} [Fintype V] [DecidableEq V]\n    (d k t : ℕ) (hk : k ≤ Fintype.card V) (ht : t ≤ Fintype.card V) :\n    let H := Fin d → {W : Finset V // W.card = k}\n    let B := {Z : Finset V // Z.card = t}\n    let U := fun (h : H) (Z : B) =>\n      Z.val ∪ Finset.univ.biUnion (fun j => (h j).val)\n    let D := fun S : Finset V => ∑ h : H, ∑ Z : B,\n      if U h Z = S then\n        (Fintype.card H : ℝ)⁻¹ * (Fintype.card B : ℝ)⁻¹ else 0\n    ProbabilityMass D ∧\n      (∀ S, 0 \u003c D S → S.card ≤ d * k + t) ∧\n      (∀ σ : Equiv.Perm V, ∀ S, D (S.image σ) = D S) := by","lean_proof":"classical\n  dsimp only\n  let H := Fin d → {W : Finset V // W.card = k}\n  let B := {Z : Finset V // Z.card = t}\n  let U := fun (h : H) (Z : B) =>\n    Z.val ∪ Finset.univ.biUnion (fun j => (h j).val)\n  let w : ℝ := (Fintype.card H : ℝ)⁻¹ * (Fintype.card B : ℝ)⁻¹\n  let D := fun S : Finset V => ∑ h : H, ∑ Z : B,\n    if U h Z = S then w else 0\n  change ProbabilityMass D ∧ _ ∧ _\n  obtain ⟨W, _, hW⟩ := Finset.exists_subset_card_eq\n    (show k ≤ (Finset.univ : Finset V).card by simpa using hk)\n  obtain ⟨Z, _, hZ⟩ := Finset.exists_subset_card_eq\n    (show t ≤ (Finset.univ : Finset V).card by simpa using ht)\n  have hH : 0 \u003c (Fintype.card H : ℝ) := by\n    exact_mod_cast (Fintype.card_pos_iff.mpr ⟨fun _ => ⟨W, hW⟩⟩ :\n      0 \u003c Fintype.card H)\n  have hB : 0 \u003c (Fintype.card B : ℝ) := by\n    exact_mod_cast (Fintype.card_pos_iff.mpr ⟨⟨Z, hZ⟩⟩ :\n      0 \u003c Fintype.card B)\n  have hw : 0 ≤ w := mul_nonneg (inv_nonneg.mpr hH.le) (inv_nonneg.mpr hB.le)\n  have hU : ∀ h Z, (U h Z).card ≤ d * k + t := by\n    intro h Z\n    calc\n      (U h Z).card ≤ Z.val.card +\n          (Finset.univ.biUnion (fun j => (h j).val)).card := Finset.card_union_le _ _\n      _ ≤ t + ∑ j : Fin d, (h j).val.card :=\n        Nat.add_le_add (Nat.le_of_eq Z.property) Finset.card_biUnion_le\n      _ = d * k + t := by simp [fun j => (h j).property, Nat.add_comm]\n  refine ⟨⟨?_, ?_⟩, ?_, ?_⟩\n  · intro S\n    exact Finset.sum_nonneg (fun h _ => Finset.sum_nonneg\n      (fun Z _ => by split_ifs \u003c;> positivity))\n  · change (∑ S, ∑ h : H, ∑ Z : B, if U h Z = S then w else 0) = 1\n    rw [Finset.sum_comm]\n    have hs : ∀ h : H,\n        (∑ S : Finset V, ∑ Z : B, if U h Z = S then w else 0) =\n          ∑ Z : B, w := by\n      intro h\n      rw [Finset.sum_comm]\n      simp\n    simp only [hs, Finset.sum_const, Finset.card_univ, nsmul_eq_mul]\n    dsimp [w]\n    field_simp\n  · intro S hS\n    by_contra hn\n    have hz : D S = 0 := by\n      apply Finset.sum_eq_zero\n      intro h _\n      apply Finset.sum_eq_zero\n      intro Z _\n      have hne : U h Z ≠ S := fun he => hn (he ▸ hU h Z)\n      simp [hne]\n    linarith\n  · intro σ S\n    let eCard := fun r : ℕ => Equiv.subtypeEquiv σ.finsetCongr\n      (p := fun W : Finset V => W.card = r)\n      (q := fun W : Finset V => W.card = r)\n      (by intro W; simp [Equiv.finsetCongr_apply])\n    let eH : H ≃ H := Equiv.piCongrRight (fun _ => eCard k)\n    let eB : B ≃ B := eCard t\n    have heCard : ∀ r (W : {W : Finset V // W.card = r}),\n        (eCard r W).val = W.val.image σ := by\n      intro r W\n      simp [eCard, Equiv.subtypeEquiv, Equiv.finsetCongr_apply, Finset.map_eq_image]\n    have heU : ∀ h Z, U (eH h) (eB Z) = (U h Z).image σ := by\n      intro h Z\n      change (eB Z).val ∪ Finset.univ.biUnion\n        (fun j => (eCard k (h j)).val) = (U h Z).image σ\n      simp only [eB, heCard]\n      simp only [U, Finset.image_union, Finset.biUnion_image]\n    change (∑ h : H, ∑ Z : B, if U h Z = S.image σ then w else 0) = _\n    rw [← eH.sum_comp (fun h => ∑ Z : B,\n      if U h Z = S.image σ then w else 0)]\n    apply Finset.sum_congr rfl\n    intro h _\n    rw [← eB.sum_comp (fun Z => if U (eH h) Z = S.image σ then w else 0)]\n    apply Finset.sum_congr rfl\n    intro Z _\n    rw [heU]\n    have heq : (U h Z).image σ = S.image σ ↔ U h Z = S :=\n      Finset.image_injective σ.injective |>.eq_iff\n    simp only [heq]\n    rfl","tex_statement":"\\begin{lemma}\nLet $V$ be finite, let $d,k,t$ be nonnegative integers, and suppose\n$k,t\\le |V|$. Put $H=\\binom Vk^d$, $B=\\binom Vt$, and\n$U(h,Z)=Z\\cup\\bigcup_{j\u003cd}h_j$. Define\n\\[\n D(S)=\\sum_{h\\in H}\\sum_{Z\\in B}\n \\frac{\\mathbf1_{\\{U(h,Z)=S\\}}}{|H|\\,|B|}.\n\\]\nThen $D$ is a probability mass, $D(S)>0$ implies $|S|\\le dk+t$,\nand $D(\\sigma S)=D(S)$ for every permutation $\\sigma$ of $V$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nThere exist $k$- and $t$-subsets because $k,t\\le |V|$.\nThus $B$ is nonempty, and the constant function with value any fixed\n$k$-subset belongs to $H$. In particular $|H|,|B|>0$; for $d=0$,\n$H$ consists of the unique empty function. All summands defining $D$\nare nonnegative. Interchanging finite sums, each pair $(h,Z)$ contributes\nexactly once to $\\sum_S D(S)$, giving\n$|H||B|/(|H||B|)=1$. This is a probability mass as defined in\n\\noderef{ProbabilityMass}.\n\nFor each pair, the union bound for cardinalities gives\n$|U(h,Z)|\\le |Z|+\\sum_{j\u003cd}|h_j|=t+dk$.\nIf $|S|>dk+t$, no pair has union $S$, so every summand of $D(S)$\nvanishes. This proves the asserted support condition.\n\nFor a permutation $\\sigma$, its action on subsets preserves cardinality,\nand therefore defines bijections on both $H$ and $B$, with inverses\ninduced by $\\sigma^{-1}$. These bijections send $U(h,Z)$ to\n$\\sigma U(h,Z)$, since images commute with unions. They consequently\ngive a bijection between the fibers over $S$ and $\\sigma S$.\nEvery pair has the same weight $1/(|H||B|)$, so reindexing the two\nfinite sums proves $D(\\sigma S)=D(S)$.\n\\end{proof}","tex_env":"lemma","semantic_closure":["ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"UniformExtensionKernel":{"name":"UniformExtensionKernel","title":"UniformExtensionKernel","kind":"definition","is_target":false,"imports":["ProbabilityMass"],"imported_by":["UniformExtensionKernelFirstMarginal","UniformExtensionKernelSecondMarginalConstancy","UniformExtensionKernelSecondMarginalSupport","UniformExtensionKernelSupport","UniformExtensionKernelProbabilityMass","UniformExtensionKernelSecondMarginal","UniformExtensionCoupling"],"lean_statement":"noncomputable def UniformExtensionKernel {V : Type v} [Fintype V] [DecidableEq V]\n    (Udist : Finset V → ℝ) (m : ℕ) : (Finset V × Finset V) → ℝ :=","lean_proof":"fun UW =>\n    if UW.1.card ≤ m ∧ UW.1 ⊆ UW.2 ∧ UW.2.card = m then\n      Udist UW.1 *\n        (((((Finset.univ \\ UW.1).powersetCard (m - UW.1.card)).card : ℕ) : ℝ))⁻¹\n    else 0","tex_statement":"\\begin{definition}\nLet $V$ be a finite set, let $\\mu$ be a real weight function on subsets of\n$V$, and let $m$ be a natural number.  The extension kernel\n$K_\\mu(A,B)$ on ordered pairs of subsets of $V$ is defined by\n\\[\nK_\\mu(A,B)=\n\\begin{cases}\n\\displaystyle\n\\mu(A)\\left|\\binom{V\\setminus A}{m-|A|}\\right|^{-1},\n& \\text{if } |A|\\le m,\\ A\\subseteq B,\\ \\text{and } |B|=m,\\\\\n0, & \\text{otherwise.}\n\\end{cases}\n\\]\nHere $\\binom{V\\setminus A}{m-|A|}$ denotes
