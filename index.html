powerset)\n            (fun Z : Finset V =>\n              p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) := by\n        dsimp [ψ]\n        refine Finset.sum_congr rfl ?_\n        intro Z _hZ\n        simp\n      _ = 1 := hnorm\n  have hlog_bound :\n      Real.log (ψ t) ≤\n        -((μ ^ 2 / Δ) *\n          (1 - Real.exp (-(t * (Δ / μ))))) := by\n    have hright :\n        Real.log (ψ 0) + (μ ^ 2 / Δ) *\n            (1 - Real.exp (-(0 * (Δ / μ)))) = 0 := by\n      simp [hψ0]\n    linarith\n  have hexp_bound :\n      Real.exp (Real.log (ψ t)) ≤\n        Real.exp (-((μ ^ 2 / Δ) *\n          (1 - Real.exp (-(t * (Δ / μ)))))) := by\n    exact Real.exp_le_exp.mpr hlog_bound\n  have hψ_exp_log : Real.exp (Real.log (ψ t)) = ψ t := by\n    exact Real.exp_log (hψpos t)\n  simpa [μ, Δ, ψ] using\n    (calc\n      ψ t = Real.exp (Real.log (ψ t)) := hψ_exp_log.symm\n      _ ≤ Real.exp (-((μ ^ 2 / Δ) *\n            (1 - Real.exp (-(t * (Δ / μ)))))) := hexp_bound)","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, and let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$.\nWith\n\\[\n    Y(Z)=\\sum_{i\\in I}\\mathbf 1_{\\{G_i\\subseteq Z\\}},\\qquad\n    \\psi(t)=\\mathbb E e^{-tY(Z)},\\qquad\n    \\mu=\\sum_{i\\in I}p^{|G_i|}\n\\]\nand\n\\[\n    \\Delta=\n    \\sum_{\\substack{i,j\\in I\\\\G_i\\cap G_j\\ne\\varnothing}}\n       p^{|G_i\\cup G_j|},\n\\]\nassume $0\u003cp\u003c1$, every $G_i$ is nonempty, $\\Delta>0$, and\n\\[\n    (\\log\\psi)'(s)\\le -\\mu e^{-s\\Delta/\\mu}\n    \\qquad\\text{for every }s\\ge0.\n\\]\nThen for every $t\\ge0$,\n\\[\n    \\psi(t)\\le\n    \\exp\\left(\n       -\\frac{\\mu^2}{\\Delta}\\left(1-e^{-t\\Delta/\\mu}\\right)\n    \\right).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nThe assumptions imply $\\mu>0$: since $\\Delta>0$ and every summand in\n$\\Delta$ is nonnegative, some labelled intersecting pair has positive\nBernoulli mass.  Its first coordinate has $q_i=p^{|G_i|}>0$, so\n$\\mu=\\sum_iq_i>0$.  Thus $\\Delta/\\mu>0$.\n\nThe finite formula for $\\psi$ is a finite positive linear combination of\nfunctions $t\\mapsto e^{-tY(Z)}$, so $\\psi(t)>0$ for all $t$ and\n$\\log\\psi$ is differentiable.  Integrating the assumed differential\ninequality from $0$ to $t$ gives\n\\[\n    \\log\\psi(t)-\\log\\psi(0)\n    \\le\n    -\\int_0^t \\mu e^{-s\\Delta/\\mu}\\,ds.\n\\]\nThe Bernoulli probabilities over all subsets sum to $1$ by\n\\noderef{FiniteBernoulliPowersetIdentities}, and $Y(Z)$ is multiplied by\n$0$ at time $0$, so $\\psi(0)=1$ and $\\log\\psi(0)=0$.  Since\n$\\Delta/\\mu>0$,\n\\[\n    \\int_0^t \\mu e^{-s\\Delta/\\mu}\\,ds\n    =\n    \\frac{\\mu^2}{\\Delta}\\left(1-e^{-t\\Delta/\\mu}\\right).\n\\]\nTherefore\n\\[\n    \\log\\psi(t)\n    \\le\n    -\\frac{\\mu^2}{\\Delta}\\left(1-e^{-t\\Delta/\\mu}\\right).\n\\]\nThe exponential function is increasing, so exponentiating both sides yields\nthe desired bound for $\\psi(t)$.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"AnchoredTerminalEstimate":{"name":"AnchoredTerminalEstimate","title":"AnchoredTerminalEstimate","kind":"lemma","is_target":false,"imports":["AnchoredTerminalBinomialMiss","BinomialCardinalityOverflow","BinomialToUniformAdditiveTransfer","LabelMass","ProbabilityMass","UniformExtensionCoupling"],"imported_by":["StrongSpiroTheorem"],"lean_statement":"lemma AnchoredTerminalEstimate {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (E F : Ω → Finset V) (μ : Ω → ℝ) (P : Ω → Prop) [DecidablePred P]\n    (q γ α : ℝ) (r a : ℕ)\n    (hprob : ProbabilityMass μ)\n    (hmass : (1 / 2 : ℝ) ≤ LabelMass μ P)\n    (hFcard : ∀ x : Ω, P x → (F x).card = r)\n    (hFsub : ∀ x : Ω, P x → F x ⊆ E x)\n    (hq : 0 \u003c q ∧ q ≤ 1)\n    (hγ : 0 \u003c γ ∧ γ ≤ 1)\n    (hα : 0 \u003c α ∧ α ≤ 1 ∧ 8 * q ≤ α)\n    (ha : (a : ℝ) = α * (Fintype.card V : ℝ))\n    (hprofile : ∀ x : Ω, P x → ∀ t : ℕ, 1 ≤ t → t ≤ r →\n      LabelMass μ (fun y : Ω => (E y ∩ F x).card = t) ≤ γ * q ^ t) :\n    ((((Finset.univ : Finset V).powersetCard a).filter\n      (fun W : Finset V => ∀ x : Ω, P x → ¬ F x ⊆ W)).card : ℝ) /\n      ((((Finset.univ : Finset V).powersetCard a).card : ℕ) : ℝ)\n      ≤ 2 * Real.exp (-(α * (Fintype.card V : ℝ)) / 4) +\n        8 * γ * q / α := by","lean_proof":"classical\n  have ha_le : a ≤ Fintype.card V := by\n    have h : (a : ℝ) ≤ (Fintype.card V : ℝ) := by\n      rw [ha]\n      exact mul_le_of_le_one_left (by positivity) hα.2.1\n    exact_mod_cast h\n  have hβ : 0 \u003c 3 * α / 8 ∧ 3 * α / 8 \u003c 1 := by\n    constructor \u003c;> linarith [hα.1, hα.2.1]\n  have htransfer := BinomialToUniformAdditiveTransfer\n    (fun W : Finset V => ∀ x : Ω, P x → ¬ F x ⊆ W)\n    (3 * α / 8) a hβ ha_le (by\n      intro U W hUW hW x hx hFx\n      exact hW x hx (hFx.trans hUW))\n  have hmiss := AnchoredTerminalBinomialMiss E F μ P q γ α r\n    hprob hmass hFcard hFsub hq hγ hα hprofile\n  have hover := BinomialCardinalityOverflow (V := V) α a ⟨hα.1, hα.2.1⟩ ha\n  linarith [Real.exp_pos (-(α * (Fintype.card V : ℝ)) / 4)]","tex_statement":"\\begin{lemma}\nLet $V$ be an $n$-element set, let $\\Omega_0$ be a finite set equipped with a\nprobability distribution $\\mu$, and let $E:\\Omega_0\\to2^V$.  Let\n$\\Omega\\subseteq\\Omega_0$ satisfy $\\mu(\\Omega)\\ge1/2$, let\n$F:\\Omega\\to\\binom Vr$, and suppose that $F(x)\\subseteq E(x)$ for every\n$x\\in\\Omega$.  Let $q,\\gamma,\\alpha\\in(0,1]$ satisfy $\\alpha\\ge8q$.  Suppose\nthat, for every $x\\in\\Omega$ and $t\\in[r]$,\n\\[\n    \\mu\\bigl(\\{y\\in\\Omega_0:|E(y)\\cap F(x)|=t\\}\\bigr)\n    \\leq\\gamma q^t.\n\\]\nIf $W$ is chosen uniformly from $\\binom V{\\alpha n}$, then\n\\[\n    \\Pr\\bigl(F(x)\\nsubseteq W\\text{ for every }x\\in\\Omega\\bigr)\n    \\le2\\exp\\left(-\\frac{\\alpha n}{4}\\right)\n       +\\frac{8\\gamma q}{\\alpha}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nLet $\\nu$ be the conditional distribution $\\mu(\\,\\cdot\\mid\\Omega)$, set\n$\\beta=3\\alpha/8$, and let $Z$ be the binomial random subset of $V$ obtained\nby including every vertex independently with probability $\\beta$.  Define\n\\[\n    X=\\sum_{x\\in\\Omega}\\nu(x)\\mathbf 1_{\\{F(x)\\subseteq Z\\}}.\n\\]\nEvery $F(x)$ has size $r$, so $\\mathbb E X=\\beta^r$.\n\nWe estimate the normalized variance.  Expanding the second moment and\ndividing by $(\\mathbb E X)^2$ gives\n\\[\n    \\frac{\\operatorname{Var}(X)}{(\\mathbb E X)^2}\n    \\le\n    \\sum_{x\\in\\Omega}\\nu(x)\n       \\sum_{\\substack{y\\in\\Omega\\\\F(x)\\cap F(y)\\ne\\varnothing}}\n          \\nu(y)\\beta^{-|F(x)\\cap F(y)|}.\n\\]\nFix $x$ and compare each inner summand with the terminal profile.  Put\n$j=|F(x)\\cap F(y)|$ and $h=|F(x)\\cap E(y)|$.  Because $F(y)\\subseteq E(y)$,\nwe have $j\\le h$, and therefore $\\beta^{-j}\\le\\beta^{-h}$.  Since\n$\\mu(\\Omega)\\ge1/2$, the conditional mass satisfies $\\nu(y)\\le2\\mu(y)$.\nGrouping the labels $y$ by the value of $h$ and applying the assumed profile\nbound gives\n\\[\n    \\sum_{\\substack{y\\in\\Omega\\\\F(x)\\cap F(y)\\ne\\varnothing}}\n          \\nu(y)\\beta^{-|F(x)\\cap F(y)|}\n    \\le\n    2\\gamma\\sum_{h=1}^r\\left(\\frac q\\beta\\right)^h.\n\\]\nNow $q/\\beta=8q/(3\\alpha)\\le1/3$, because $\\alpha\\ge8q$.  The geometric sum\nis at most\n\\[\n    \\frac{8q/(3\\alpha)}{1-8q/(3\\alpha)},\n\\]\nand the last expression, after multiplication by $2\\gamma$, is at most\n$8\\gamma q/\\alpha$.  Hence\n\\[\n    \\frac{\\operatorname{Var}(X)}{(\\mathbb E X)^2}\n    \\le \\frac{8\\gamma q}{\\alpha}.\n\\]\nIf no fragment $F(x)$ is contained in $Z$, then $X=0$.  Chebyshev's\ninequality therefore gives\n\\[\n    \\Pr\\bigl(F(x)\\nsubseteq Z\\text{ for every }x\\in\\Omega\\bigr)\n    \\le \\frac{8\\gamma q}{\\alpha}.\n\\]\n\nIt remains to compare the binomial set $Z$ with a uniform\n$\\alpha n$-element set.  Exponential Markov with $e^\\lambda=8/3$ yields\n\\[\n    \\Pr(|Z|>\\alpha n)\n    \\le\n    \\exp\\!\\left(-\\alpha n(\\log(8/3)-5/8)\\right)\n    \\le \\exp(-\\alpha n/4),\n\\]\nusing $\\log x\\ge2(x-1)/(x+1)$ for $x\\ge1$, which gives\n$\\log(8/3)\\ge10/11>7/8$.\n\nWrite $a=\\alpha n$, as in the statement, and let\n$G=\\{U\\subseteq V:|U|\\le a\\}$ be the non-overflow event for the binomial set.\nThe event $G$ has positive probability: the empty set lies in $G$, and its\nbinomial probability is $(1-\\beta)^n>0$ because\n$0\u003c\\beta=3\\alpha/8\\le3/8\u003c1$.  Define a probability law $\\theta$ on subsets of\n$V$ by conditioning the binomial law of $Z$ on $G$:\n\\[\n    \\theta(U)=\n    \\begin{cases}\n    \\Pr(Z=U)/\\Pr(G),& |U|\\le a,\\\\\n    0,& |U|>a.\n    \\end{cases}\n\\]\nThis is a probability mass in the sense of \\noderef{ProbabilityMass}: all\nweights are nonnegative, and summing over all subsets gives\n$\\Pr(G)/\\Pr(G)=1$.  The law is invariant under every permutation of $V$,\nbecause the binomial law assigns to a subset $U$ the value\n$\\beta^{|U|}(1-\\beta)^{n-|U|}$, which depends only on $|U|$, and the\nconditioning event $G$ also depends only on $|U|$.  Moreover\n$\\theta(U)>0$ implies $|U|\\le a$ by definition.  Finally $a\\le |V|$: indeed\n$a=\\alpha n$, $n=|V|$, and $\\alpha\\le1$.\n\nThus the hypotheses of \\noderef{UniformExtensionCoupling} apply to the\nconditioned law $\\theta$ with $m=a$.  Hence there is a coupling of a\n$\\theta$-distributed subset $U$ and a uniform $a$-element subset $W$ such that\n$U\\subseteq W$ almost surely.  Use this coupling on the branch $G$, with\n$U=Z$ conditioned on $G$; on the complementary overflow branch, choose $W$\nindependently and uniformly from $\\binom Va$.  Since the conditional law of\n$W$ is uniform on both branches, the unconditional law of $W$ is uniform on\n$\\binom Va=\\binom V{\\alpha n}$.\n\nIn this coupled experiment, on the non-overflow branch $G$ we have\n$Z\\subseteq W$.  Therefore, if $W$ misses every fragment $F(x)$ and $G$\noccurs, then $Z$ also misses every fragment $F(x)$; equivalently, if $Z$\ncontains some $F(x)$ on $G$, then every extension $W\\supseteq Z$ contains the\nsame $F(x)$.  Consequently\n\\[\n    \\Pr(W\\text{ misses every }F(x))\n    \\le\n    \\Pr(Z\\text{ misses every }F(x))+\\Pr(|Z|>a).\n\\]\nReplacing the left-hand side by the uniform probability ratio in the\nstatement, and substituting the binomial miss bound and the overflow bound,\ngives\n\\[\n    \\Pr\\bigl(F(x)\\nsubseteq W\\text{ for every }x\\in\\Omega\\bigr)\n    \\le\n    \\frac{8\\gamma q}{\\alpha}+\\exp(-\\alpha n/4).\n\\]\nThis is stronger than the displayed bound with the first term\n$2\\exp(-\\alpha n/4)$.\n\\end{proof}","tex_env":"lemma","semantic_closure":["LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonExponentialMomentEstimate":{"name":"FiniteJansonExponentialMomentEstimate","title":"FiniteJansonExponentialMomentEstimate","kind":"lemma","is_target":false,"imports":["FiniteJansonIntegratedLogDerivativeEstimate"],"imported_by":["FiniteJansonZeroEventFromMomentEstimate"],"lean_statement":"lemma FiniteJansonExponentialMomentEstimate {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            p ^ (G pair.1 ∪ G pair.2).card\n          else 0)) :\n    ∀ t : ℝ, 0 ≤ t →\n      Finset.sum ((Finset.univ : Finset V).powerset)\n        (fun Z : Finset V =>\n          (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n            Real.exp\n              (-(t *\n                (((Finset.univ : Finset Ω).filter\n                  (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))) ≤\n        Real.exp\n          (-\n            ((((Finset.univ : Finset Ω).sum\n                (fun ω : Ω => p ^ (G ω).card)) ^ 2 /\n              Finset.sum\n                ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n                (fun pair : Ω × Ω =>\n                  if (G pair.1 ∩ G pair.2).Nonempty then\n                    p ^ (G pair.1 ∪ G pair.2).card\n                  else 0)) *\n              (1 -\n                Real.exp\n                  (-(t *\n                    (Finset.sum\n                      ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n                      (fun pair : Ω × Ω =>\n                        if (G pair.1 ∩ G pair.2).Nonempty then\n                          p ^ (G pair.1 ∪ G pair.2).card\n                        else 0) /\n                    (Finset.univ : Finset Ω).sum\n                      (fun ω : Ω => p ^ (G ω).card))))))) := by","lean_proof":"exact FiniteJansonIntegratedLogDerivativeEstimate G p hp hnonempty hDelta\n    (FiniteJansonLogDerivativeBound G p hp hnonempty hDelta)","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, and let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$.  Write\n\\[\n    Y(Z)=\\sum_{i\\in I}\\mathbf 1_{\\{G_i\\subseteq Z\\}},\\qquad\n    \\mu=\\sum_{i\\in I}p^{|G_i|},\n\\]\nand\n\\[\n    \\Delta=\n    \\sum_{\\substack{i,j\\in I\\\\G_i\\cap G_j\\ne\\varnothing}}\n       p^{|G_i\\cup G_j|}.\n\\]\nAssume $0\u003cp\u003c1$, every $G_i$ is nonempty, and $\\Delta>0$.  Then for every\n$t\\ge0$,\n\\[\n    \\sum_{Z\\subseteq V}p^{|Z|}(1-p)^{|V|-|Z|}e^{-tY(Z)}\n    \\le\n    \\exp\\left(\n       -\\frac{\\mu^2}{\\Delta}\\left(1-e^{-t\\Delta/\\mu}\\right)\n    \\right).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nLet\n\\[\n    \\psi(s)=\\sum_{Z\\subseteq V}p^{|Z|}(1-p)^{|V|-|Z|}e^{-sY(Z)}.\n\\]\nBy \\noderef{FiniteBernoulliPowersetIdentities}, the event\n$A_i=\\{G_i\\subseteq Z\\}$ has probability $q_i=p^{|G_i|}$, and\n$A_i\\cap A_j=\\{G_i\\cup G_j\\subseteq Z\\}$ has probability\n$p^{|G_i\\cup G_j|}$.  Hence $\\mu=\\sum_i q_i$ and the displayed $\\Delta$ is\n$\\sum_{i,j:G_i\\cap G_j\\ne\\varnothing}\\Pr(A_i\\cap A_j)$.  Since the diagonal\nterms have positive mass when $0\u003cp\u003c1$ and the sets $G_i$ are nonempty, the\nassumption $\\Delta>0$ places us in the nondegenerate case $\\mu>0$.\n\nDifferentiate the finite sum defining $\\psi$.  For $s\\ge0$,\n\\[\n    -\\psi'(s)=\\sum_i \\mathbb E(I_i e^{-sY}).\n\\]\nFix $i$ and write $Y=Y_i+Z_i$, where $Y_i$ counts labels intersecting $G_i$\nand $Z_i$ counts labels disjoint from $G_i$.  Conditioned on\n$A_i$, vertices of $G_i$ are fixed and all remaining vertices retain their\nindependent Bernoulli-$p$ distribution.  On that residual product space,\n$e^{-sY_i}$ and $e^{-sZ_i}$ are decreasing functions.  Therefore\n\\noderef{FiniteProductHarrisKleitman} gives\n\\[\n    \\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\n    \\ge\n    \\mathbb E(e^{-sY_i}\\mid A_i)\\mathbb E(e^{-sZ_i}\\mid A_i).\n\\]\nThe variable $Z_i$ depends only on vertices outside $G_i$, so it is\nindependent of $A_i$; also $Y_i\\ge0$, hence\n$\\mathbb E(e^{-sZ_i})\\ge\\psi(s)$.  Thus\n\\[\n    \\mathbb E(I_i e^{-sY})\n    \\ge q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i)\\psi(s).\n\\]\nSumming and dividing by the positive number $\\psi(s)$ yields\n\\[\n    -(\\log\\psi)'(s)\n    \\ge\n    \\sum_i q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i).\n\\]\n\nApply finite Jensen, \\texttt{ConvexOn.map\\_sum\\_le} specialized to the\nconvex exponential function, on each conditional outcome space with points\n$-sY_i$ to obtain\n\\[\n    \\mathbb E(e^{-sY_i}\\mid A_i)\n    \\ge e^{-s\\mathbb E(Y_i\\mid A_i)}.\n\\]\nApply \\texttt{ConvexOn.map\\_sum\\_le} for the exponential again on the finite\nlabel set with weights $q_i/\\mu$ and points $-s\\mathbb E(Y_i\\mid A_i)$.\nThis gives\n\\[\n    \\sum_i q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i)\n    \\ge\n    \\mu\\exp\\left(\n      -\\frac{s}{\\mu}\\sum_i q_i\\mathbb E(Y_i\\mid A_i)\n    \\right).\n\\]\nFinally,\n\\[\n    q_i\\mathbb E(Y_i\\mid A_i)\n    =\n    \\sum_{j:G_i\\cap G_j\\ne\\varnothing}\\Pr(A_i\\cap A_j),\n\\]\nso the sum over $i$ is exactly $\\Delta$.  Therefore\n\\[\n    -(\\log\\psi)'(s)\\ge \\mu e^{-s\\Delta/\\mu}.\n\\]\nIntegrating from $0$ to $t$, using $\\psi(0)=1$, gives the claimed\nexponential-moment bound.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"StrongSpiroTheorem":{"name":"StrongSpiroTheorem","title":"StrongSpiroTheorem","kind":"theorem","is_target":true,"imports":["AnchoredTerminalEstimate","AuxiliaryRandomSetSizeConvention","DistributionalSmootherSpread","FiniteFirstFailureBound","FragmentFiltration","HitProbability","RoundedSpiroSampleSizes","SampledUnionHittingTransfer","SpiroGoodHistoryEstimate","StageSuccessEstimate","StrongTerminalSpread","SurvivorMassDomination","UniformEdges","UniformExtensionCoupling"],"imported_by":["SpiroTheorem27"],"lean_statement":"theorem StrongSpiroTheorem {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (E : Ω → Finset V) (μ : Ω → ℝ) (q γ C : ℝ) (r : ℕ → ℕ)\n    (ℓ m : ℕ)\n    (hunif : UniformEdges E (r 0))\n    (hspread : DistributionalSmootherSpread E μ q r (ℓ + 1))\n    (hterminal : StrongTerminalSpread E μ q γ (r (ℓ - 1)) 1)\n    (hC : 8 ≤ C)\n    (hlast : 0 \u003c ℓ ∧ r ℓ = 1)\n    (hm_le : m ≤ Fintype.card V)\n    (hm : (m : ℝ) = 2 * C * (ℓ : ℝ) * q * (Fintype.card V : ℝ)) :\n    1 - 6 * (ℓ : ℝ) ^ 2 * (C / 4) ^ (-(r (ℓ - 1) : ℝ) / 2)\n        - 2 * Real.exp (-(ℓ : ℝ) * C * q * (Fintype.card V : ℝ) / 4)\n        - 8 * γ / (C * (ℓ : ℝ))\n      ≤ HitProbability E m := by","lean_proof":"classical\n  let n := Fintype.card V\n  let a := C * q * (n : ℝ)\n  let k := Nat.ceil a\n  let t := Nat.ceil ((ℓ : ℝ) * a)\n  let d := ℓ - 1\n  obtain ⟨hn, hrzero, ha, hℓa, hkpos, htpos, hak, hat, htn, hbudget, hstage⟩ :=\n    RoundedSpiroSampleSizes E μ q C r ℓ m hunif hspread hC hlast hm_le hm\n  change 0 \u003c n at hn\n  change 0 \u003c k at hkpos\n  change 0 \u003c t at htpos\n  change a ≤ (k : ℝ) at hak\n  change (ℓ : ℝ) * a ≤ (t : ℝ) at hat\n  change t ≤ n at htn\n  change d * k + t ≤ m at hbudget\n  change 2 ≤ ℓ → (k : ℝ) ≤ (n : ℝ) / 2 ∧ 2 * r 0 ≤ k at hstage\n  have hnR : (0 : ℝ) \u003c n := by exact_mod_cast hn\n  have hℓR : (0 : ℝ) \u003c ℓ := by exact_mod_cast hlast.1\n  have hℓone : (1 : ℝ) ≤ ℓ := by exact_mod_cast hlast.1\n  have hd : d \u003c ℓ := by dsimp [d]; omega\n  have hk : k ≤ n := by\n    by_cases htwo : 2 ≤ ℓ\n    · have hh := (hstage htwo).1\n      have : (k : ℝ) ≤ n := by linarith\n      exact_mod_cast this\n    · have he : ℓ = 1 := by omega\n      have hkt : k = t := by simp [k, t, he]\n      exact hkt ▸ htn\n  have hdec : ∀ j, j \u003c ℓ → r (j + 1) \u003c r j :=\n    fun j hj => hspread.2.2.2.2.2.1 j (by omega)\n  have hmono (i j : ℕ) (hij : i ≤ j) (hj : j ≤ ℓ) : r j ≤ r i := by\n    induction j with\n    | zero =>\n      have hi : i = 0 := by omega\n      subst i\n      exact le_rfl\n    | succ j ih =>\n      by_cases hi : i = j + 1\n      · subst i; exact le_rfl\n      · exact (hdec j (by omega)).le.trans (ih (by omega) (by omega))\n  have hrpos (j : ℕ) (hj : j \u003c ℓ) : 1 \u003c r j := by\n    have hh := hmono (j + 1) ℓ (by omega) le_rfl\n    rw [hlast.2] at hh\n    exact hh.trans_lt (hdec j hj)\n  obtain ⟨Surv, F, κ, hinit, hsub, hanchor, hcard, hcover, hstep⟩ :=\n    FragmentFiltration E r ℓ hunif hlast.1 hrpos\n      (fun j hj => hdec j (by omega))\n  obtain ⟨Good, hgoodzero, hgoodstep, hstate, hfailure⟩ :=\n    SpiroGoodHistoryEstimate E μ q C r ℓ d k hspread hC hlast.1 hd hn hkpos hk\n      hak (fun hdp => hstage (by dsimp [d] at hdp; omega))\n      Surv F (fun x => (hinit x).1) hsub hanchor hcard hstep\n  let H := Fin d → {W : Finset V // W.card = k}\n  let L := fun h : H => (List.ofFn (fun j => (h j).val)).reverse\n  have hlength (h : H) : (L h).length = d := by simp [L]\n  let α : ℝ := (t : ℝ) / (n : ℝ)\n  have hαpos : 0 \u003c α := div_pos (by exact_mod_cast htpos) hnR\n  have hαle : α ≤ 1 := (div_le_one hnR).2 (by exact_mod_cast htn)\n  have hαn : α * (n : ℝ) = (t : ℝ) := by\n    dsimp [α]\n    exact div_mul_cancel₀ _ hnR.ne'\n  have hαlower : (ℓ : ℝ) * C * q ≤ α := by\n    apply (le_div_iff₀ hnR).2\n    dsimp [a] at hat\n    nlinarith [hat]\n  have hαq : 8 * q ≤ α := by\n    have hCpos : 0 ≤ C := by linarith\n    have hℓC : C ≤ (ℓ : ℝ) * C := by nlinarith\n    have h8 : 8 ≤ (ℓ : ℝ) * C := hC.trans hℓC\n    exact (mul_le_mul_of_nonneg_right h8 hspread.1.le).trans hαlower\n  let δ : ℝ := 6 * (ℓ : ℝ) ^ 2 * (C / 4) ^ (-(r d : ℝ) / 2)\n  let η : ℝ := 2 * Real.exp (-(ℓ : ℝ) * C * q * (n : ℝ) / 4) +\n    8 * γ / (C * (ℓ : ℝ))\n  have hCpos : 0 \u003c C := by linarith\n  have hγpos : 0 \u003c γ := hterminal.2.2.1\n  have hη : 0 ≤ η := by dsimp [η]; positivity\n  -- Identify the subtype uniform law with the powerset-cardinality ratio.\n  have hmass (b : ℕ) (P : Finset V → Prop) :\n      @LabelMass {Z : Finset V // Z.card = b} _\n        (fun _ => (Fintype.card {Z : Finset V // Z.card = b} : ℝ)⁻¹)\n        (fun Z => P Z.val) (Classical.decPred _) =\n        ((((Finset.univ : Finset V).powersetCard b).filter P).card : ℝ) /\n          (((Finset.univ : Finset V).powersetCard b).card : ℝ) := by\n    have hsum (f : Finset V → ℝ) :\n        (∑ Z : {Z : Finset V // Z.card = b}, f Z.val) =\n          ∑ Z ∈ (Finset.univ : Finset V).powersetCard b, f Z := by\n      exact (Finset.sum_subtype _ (by simp) _).symm\n    have hcount : Fintype.card {Z : Finset V // Z.card = b} =\n        ((Finset.univ : Finset V).powersetCard b).card := by\n      have hh := hsum (fun _ => 1)\n      simpa using hh\n    simp only [LabelMass, Finset.sum_filter, hcount]\n    rw [hsum (fun Z => if P Z then\n      (((Finset.univ : Finset V).powersetCard b).card : ℝ)⁻¹ else 0),\n      ← Finset.sum_filter]\n    simp [div_eq_mul_inv]\n  let HitFrag := fun (h : H) (Z : {Z : Finset V // Z.card = t}) =>\n    ∃ x, Surv (L h) x ∧ F (L h) x ⊆ Z.val\n  have hterminal_bound : ∀ h : H, Good d h →\n      @LabelMass {Z : Finset V // Z.card = t} _\n        (fun _ => (Fintype.card {Z : Finset V // Z.card = t} : ℝ)⁻¹)\n        (fun Z => ¬ HitFrag h Z) (Classical.decPred _) ≤ η := by\n    intro h hh\n    have hhalf : (1 / 2 : ℝ) ≤ LabelMass μ (Surv (L h)) :=\n      (hstate d le_rfl h hh).2.1\n    have hFc : ∀ x, Surv (L h) x → (F (L h) x).card = r d := by\n      intro x hx\n      simpa only [hlength] using hcard (L h) x (by rw [hlength]; exact hd) hx\n    have hFa : ∀ x, Surv (L h) x → F (L h) x ⊆ E x :=\n      fun x hx => hanchor (L h) x (by rw [hlength]; exact hd) hx\n    have hprofile : ∀ x, Surv (L h) x → ∀ j : ℕ, 1 ≤ j → j ≤ r d →\n        LabelMass μ (fun y => (E y ∩ F (L h) x).card = j) ≤ γ * q ^ j := by\n      intro x hx j hj hjr\n      exact hterminal.2.2.2.2.2.2.2 x (F (L h) x) j (hFa x hx)\n        (by rw [hFc x hx]; exact (hrpos d hd).le)\n        (by rw [hFc x hx]) hj hjr\n    have he := AnchoredTerminalEstimate E (F (L h)) μ (Surv (L h)) q γ α (r d) t\n      hspread.2.2.1 hhalf hFc hFa ⟨hspread.1, hspread.2.1⟩\n      ⟨hγpos, hterminal.2.2.2.1⟩ ⟨hαpos, hαle, hαq⟩ hαn.symm hprofile\n    have hmiss_eq :\n        @LabelMass {Z : Finset V // Z.card = t} _\n          (fun _ => (Fintype.card {Z : Finset V // Z.card = t} : ℝ)⁻¹)\n          (fun Z => ¬ HitFrag h Z) (Classical.decPred _) =\n        ((((Finset.univ : Finset V).powersetCard t).filter\n          (fun W => ∀ x, Surv (L h) x → ¬ F (L h) x ⊆ W)).card : ℝ) /\n          (((Finset.univ : Finset V).powersetCard t).card : ℝ) := by\n      simpa only [HitFrag, not_exists, not_and] using\n        hmass t (fun W => ¬ ∃ x, Surv (L h) x ∧ F (L h) x ⊆ W)\n    rw [hmiss_eq]\n    apply he.trans\n    have hexp : Real.exp (-(α * (Fintype.card V : ℝ)) / 4) ≤\n        Real.exp (-(ℓ : ℝ) * C * q * (n : ℝ) / 4) := by\n      apply Real.exp_le_exp.mpr\n      change -(α * (n : ℝ)) / 4 ≤ _\n      rw [hαn]\n      dsimp [a] at hat\n      nlinarith [hat]\n    have hfrac : 8 * γ * q / α ≤ 8 * γ / (C * (ℓ : ℝ)) := by\n      apply (div_le_div_iff₀ hαpos (mul_pos hCpos hℓR)).2\n      have hh := mul_le_mul_of_nonneg_left hαlower (by positivity : 0 ≤ 8 * γ)\n      nlinarith\n    dsimp only [η]\n    linarith\n  have hcoverage : ∀ h Z, Good d h → HitFrag h Z →\n      ∃ x, E x ⊆ Z.val ∪ Finset.univ.biUnion (fun j => (h j).val) := by\n    intro h Z _ hhit\n    obtain ⟨x, hx, hFx⟩ := hhit\n    refine ⟨κ (L h) x, ?_⟩\n    have hc := hcover (L h) x (by rw [hlength]; exact hd) hx\n    intro v hv\n    rcases Finset.mem_union.mp (hc hv) with hv | hv\n    · exact Finset.mem_union_left _ (hFx hv)\n    · apply Finset.mem_union_right\n      rcases Finset.mem_biUnion.mp hv with ⟨W, hW, hvW⟩\n      have hW' : W ∈ List.ofFn (fun j => (h j).val) := by\n        simpa only [L, List.mem_toFinset, List.mem_reverse] using hW\n      obtain ⟨j, hj⟩ := List.mem_ofFn.mp hW'\n      apply Finset.mem_biUnion.mpr\n      exact ⟨j, Finset.mem_univ _, by simpa only [hj] using hvW⟩\n  have hfinal := SampledUnionHittingTransfer E d k t m (Good d) HitFrag δ η hη\n    hk htn hbudget hm_le hfailure hterminal_bound hcoverage\n  dsimp only [δ, η, d, n] at hfinal\n  linarith","tex_statement":"\\begin{theorem}\nLet $q,\\gamma\\in(0,1]$, let $\\ell$ be a positive integer, and let\n$r_0>r_1>\\cdots>r_{\\ell-1}>r_\\ell=1$ be positive integers.  Let\n$E:\\Omega\\to\\binom V{r_0}$ be an $r_0$-uniform labelled hypergraph, and let\n$C\\ge8$.  Suppose that there is a $(q;r_0,\\dots,r_{\\ell-1},1)$-spread\nprobability distribution $\\mu$ on the labels which is also\n$(q,\\gamma;r_{\\ell-1},1)$-spread.  Let $m\\le |V|$ be an integer satisfying\n$m=2C\\ell q|V|$.  If $W$ is a uniformly chosen $m$-subset of $V$, then\n\\[\n    \\Pr(W\\text{ contains an edge of }E)\n    \\ge\n    1-6\\ell^2\\left(\\frac C4\\right)^{-r_{\\ell-1}/2}\n      -2\\exp\\left(-\\frac{\\ell Cq|V|}{4}\\right)\n      -\\frac{8\\gamma}{C\\ell}.\n\\]\n\\end{theorem}","tex_proof":"\\begin{proof}\nWrite $n=|V|$ and $a=Cqn$. By \\noderef{RoundedSpiroSampleSizes}, the\nintegers $k=\\lceil a\\rceil$ and $t=\\lceil\\ell a\\rceil$ satisfy\n\\[\n n>0,\\quad r_0\\ge\\ell+1,\\quad a>2r_0\\ge\\ell,\\quad\n k,t>0,\\quad k\\ge a,\\quad t\\ge\\ell a,\\quad\n t\\le n,\\quad(\\ell-1)k+t\\le m\\le n.\n\\]\nWhen $\\ell\\ge2$ the same node gives $k\\le n/2$ and $k\\ge2r_0$.\nThese conclusions use the positive total label mass, decreasing integer\nscales, and the full-edge spread profile; they are not consequences of\nfinal-size integrality alone.\n\nPut $d=\\ell-1$. Sample $d$ independent uniform $k$-subsets\n$W_0,\\ldots,W_{d-1}$ and an independent uniform $t$-subset $Z$.\nUse the jointly chosen states of \\noderef{FragmentFiltration}, evaluated at\nthe reversed exposed prefix $L_j=[W_{j-1},\\ldots,W_0]$. Write their survivor\nsets, fragments, and coverage maps as $S_j,F_j,\\kappa_j$. To meet its\nscale hypotheses, note that for $j\u003c\\ell$ strict decrease to $r_\\ell=1$\nimplies $r_j>1$. Its initialization gives $S_0=\\Omega$, and at each\ntransition it gives exactly\n\\[\n S_{j+1}=\\{x\\in S_j:(F_j(x),W_j)\n          \\text{ is }r_{j+1}\\text{-good in }F_j(S_j)\\}.\n\\]\nIn particular the state at level $j$ is a function only of the first $j$\nsamples. Thus fixing that prefix leaves the next sample uniform on\n$\\binom Vk$. No choice of a filtration separately for complete histories\nis being made here.\n\nPut $M_j=\\sum_{x\\in S_j}\\mu(x)$. Call a transition successful when\n\\[\n \\sum_{x\\in S_j\\setminus S_{j+1}}\\mu(x)\\le M_j/(2\\ell).\n\\]\nCall a prefix good when all its transitions are successful. On any good\nlength-$j$ prefix with $j\\le d$, \\noderef{SurvivorMassDomination} gives\n\\[\n M_j\\ge1-j/(2\\ell)\\ge1/2,\\qquad\n \\nu_j(x)=\\mathbf1_{S_j}(x)\\mu(x)/M_j\\le2\\mu(x).\n\\]\nIt also states that $\\nu_j$ is a probability mass supported on $S_j$.\n\nSuppose $j\u003cd$ and fix a good length-$j$ prefix. Then $\\ell\\ge2$.\nSet $p'=k/n$ and $C'=k/(qn)$. Positivity of $q$, supplied by\n\\noderef{DistributionalSmootherSpread}, and $n>0$ imply\n\\[\n p'=C'q,\\quad C'\\ge C\\ge8,\\quad0\u003cp'\\le1/2,\\quad k=p'n,\n \\quad k\\ge2r_0\\ge2r_j.\n\\]\nThe last scale comparison follows by iterating strict decrease.\nThe cardinality and anchor invariants of \\noderef{FragmentFiltration}\ntherefore allow \\noderef{StageExpectedBadMass} at parameters $C',p'$.\nWith\n\\[\n B_j(W)=\\nu_j\\{x\\in S_j:(F_j(x),W)\n                      \\text{ is }r_{j+1}\\text{-bad in }F_j(S_j)\\},\n\\]\nit gives $\\mathbb E B_j(W)\\le3(C'/4)^{-r_{j+1}/2}$.\nBy \\noderef{FiniteUniformMarkov}, the chance that\n$B_j(W)>1/(2\\ell)$ is at most $6\\ell(C'/4)^{-r_{j+1}/2}$.\nThe exact survivor equivalence identifies $B_j(W_j)$ with\n$\\sum_{S_j\\setminus S_{j+1}}\\mu/M_j$; since $M_j>0$, this is exactly the\nfailure event just defined. The exponent $-r_{j+1}/2$ is negative and\n$C'/4\\ge C/4>0$, so the local failure probability is at most\n$\\varepsilon_j=6\\ell(C/4)^{-r_{j+1}/2}$.\nIn particular we have not asserted $2\\ell k\\le n$ or applied\n\\noderef{StageSuccessEstimate} with its unused final-size hypothesis.\n\nThe good-prefix predicates satisfy the hypotheses of\n\\noderef{FiniteFirstFailureBound} on the nonempty finite alphabet\n$X=\\binom Vk$. Its local estimates are the fixed-prefix estimates above.\nIt follows, by finite first-failure summation, that\n\\[\n \\Pr(\\text{the length-}d\\text{ history is bad})\n \\le\\sum_{j\u003cd}\\varepsilon_j\n \\le6\\ell^2(C/4)^{-r_d/2}=:\\Delta.\n\\]\nIndeed $r_{j+1}\\ge r_d$ for each summand, the base $C/4\\ge2$,\nand there are $d\\le\\ell$ summands. All summands are nonnegative.\nFor $\\ell=1$, $d=0$: there is one empty history, it is good,\nand the empty failure sum is zero. The displayed weaker bound by\n$\\Delta\\ge0$ still holds, with no stage-density assumptions needed.\n\nNow fix any good complete history. Its survivor mass is at least $1/2$.\nThe terminal fragments have size $r_d$ and lie inside their original\nedges by \\noderef{FragmentFiltration}. The definition\n\\noderef{StrongTerminalSpread}, applied to $S=F_d(x)$ for each survivor,\ngives for every $1\\le h\\le r_d$\n\\[\n \\mu\\{y:|E(y)\\cap F_d(x)|=h\\}\\le\\gamma q^h.\n\\]\nHere $r_d>1$ ensures $1\\le|F_d(x)|\\le r_d$ as required. The same definition\ngives $0\u003c\\gamma\\le1$.\nSet $\\alpha'=t/n$. The rounded-size inequalities give\n\\[\n 0\u003c\\alpha'\\le1,\\qquad\n \\alpha'\\ge\\ell Cq\\ge8q,\\qquad t=\\alpha'n.\n\\]\nConsequently \\noderef{AnchoredTerminalEstimate} bounds the probability,\nover the independent terminal sample $Z$, of missing every surviving\nfragment by\n\\[\n 2e^{-t/4}+8\\gamma q/\\alpha'\n \\le2e^{-\\ell Cqn/4}+\\frac{8\\gamma}{C\\ell}=:\\eta.\n\\]\nFor the first comparison use $t\\ge\\ell Cqn$ and the increasing exponential.\nFor the second use $\\alpha'\\ge\\ell Cq>0$ and $\\gamma q>0$.\nThis proves the bound for each fixed good history, not merely for an\nunspecified conditional distribution. Also $\\eta\\ge0$.\n\nIf $F_d(x)\\subseteq Z$ for a survivor, the coverage clause of\n\\noderef{FragmentFiltration} yields\n\\[\n E(\\kappa_d(x))\\subseteq Z\\cup\\bigcup_{j\u003cd}W_j.\n\\]\nApply \\noderef{SampledUnionHittingTransfer} with this fragment-hit event,\ngood histories as above, stage error $\\Delta$, terminal error $\\eta$,\nand the budget $dk+t\\le m$ from \\noderef{RoundedSpiroSampleSizes}.\nIts sample-size hypotheses hold: $t\\le n$, and when $d>0$ we have\n$k\\le n/2$; when $d=0$, $\\ell=1$ and $k=t\\le n$.\nThe transfer theorem proves invariance only for the unconditional union\nof the independent fixed-size samples and applies the joint coupling\nof \\noderef{UniformExtensionCoupling} to that law.\nIt requires no invariance of good histories or of the chosen fragments.\nIt gives $\\operatorname{HitProbability}(E,m)\\ge1-\\Delta-\\eta$, which,\nby \\noderef{HitProbability} and the definitions of $d,\\Delta,\\eta$, is\nexactly the claimed bound, at the original final cardinality $m$.\n\\end{proof}","tex_env":"theorem","semantic_closure":["BoundedEdges","DistributionalSmootherSpread","HitProbability","LabelMass","ProbabilityMass","StrongTerminalSpread","UniformEdges"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonZeroEventFromMomentEstimate":{"name":"FiniteJansonZeroEventFromMomentEstimate","title":"FiniteJansonZeroEventFromMomentEstimate","kind":"lemma","is_target":false,"imports":["FiniteJansonExponentialMomentEstimate"],"imported_by":["FiniteJansonDeletionLemma"],"lean_statement":"lemma FiniteJansonZeroEventFromMomentEstimate {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            p ^ (G pair.1 ∪ G pair.2).card\n          else 0))\n    (hmoment :\n      ∀ t : ℝ, 0 ≤ t →\n        Finset.sum ((Finset.univ : Finset V).powerset)\n          (fun Z : Finset V =>\n            (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n              Real.exp\n                (-(t *\n                  (((Finset.univ : Finset Ω).filter\n                    (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))) ≤\n          Real.exp\n            (-\n              ((((Finset.univ : Finset Ω).sum\n                  (fun ω : Ω => p ^ (G ω).card)) ^ 2 /\n                Finset.sum\n                  ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n                  (fun pair : Ω × Ω =>\n                    if (G pair.1 ∩ G pair.2).Nonempty then\n                      p ^ (G pair.1 ∪ G pair.2).card\n                    else 0)) *\n                (1 -\n                  Real.exp\n                    (-(t *\n                      (Finset.sum\n                        ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n                        (fun pair : Ω × Ω =>\n                          if (G pair.1 ∩ G pair.2).Nonempty then\n                            p ^ (G pair.1 ∪ G pair.2).card\n                          else 0) /\n                      (Finset.univ : Finset Ω).sum\n                        (fun ω : Ω => p ^ (G ω).card)))))))) :\n    Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ ω : Ω, ¬ G ω ⊆ Z))\n        (fun Z : Finset V =>\n          p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) ≤\n      Real.exp\n        (-\n          (((Finset.univ : Finset Ω).sum\n              (fun ω : Ω => p ^ (G ω).card)) ^ 2 /\n            Finset.sum\n              ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n              (fun pair : Ω × Ω =>\n                if (G pair.1 ∩ G pair.2).Nonempty then\n                  p ^ (G pair.1 ∪ G pair.2).card\n                else 0))) := by","lean_proof":"classical\n  let S : Finset (Finset V) := (Finset.univ : Finset V).powerset\n  let zero : Finset V → Prop := fun Z => ∀ ω : Ω, ¬ G ω ⊆ Z\n  let μ : ℝ := (Finset.univ : Finset Ω).sum (fun ω : Ω => p ^ (G ω).card)\n  let Δ : ℝ :=\n    Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n      (fun pair : Ω × Ω =>\n        if (G pair.1 ∩ G pair.2).Nonempty then\n          p ^ (G pair.1 ∪ G pair.2).card\n        else 0)\n  let weight : Finset V → ℝ :=\n    fun Z => p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)\n  let momentTerm : ℝ → Finset V → ℝ :=\n    fun t Z =>\n      weight Z *\n        Real.exp\n          (-(t *\n            (((Finset.univ : Finset Ω).filter\n              (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))\n  have hp_nonneg : 0 ≤ p := le_of_lt hp.1\n  have hq_nonneg : 0 ≤ 1 - p := sub_nonneg.mpr (le_of_lt hp.2)\n  have hμ : 0 \u003c μ := by\n    have hprod_nonempty :\n        (((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω)).Nonempty) := by\n      by_contra hne\n      have hempty :\n          ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω)) = ∅ :=\n        Finset.not_nonempty_iff_eq_empty.mp hne\n      rw [hempty] at hDelta\n      simp at hDelta\n    rcases hprod_nonempty with ⟨pair, _hpair⟩\n    have hω : pair.1 ∈ (Finset.univ : Finset Ω) := by simp\n    simpa [μ] using\n      (Finset.sum_pos' (fun ω _hω => pow_nonneg hp_nonneg _)\n        ⟨pair.1, hω, pow_pos hp.1 _⟩)\n  have hzero_le_moment :\n      ∀ t : ℝ, 0 ≤ t →\n        Finset.sum (S.filter zero) weight ≤ Finset.sum S (momentTerm t) := by\n    intro t _ht\n    calc\n      Finset.sum (S.filter zero) weight =\n          Finset.sum (S.filter zero) (momentTerm t) := by\n        refine Finset.sum_congr rfl ?_\n        intro Z hZ\n        have hz : zero Z := (Finset.mem_filter.mp hZ).2\n        have hfilter_empty :\n            ((Finset.univ : Finset Ω).filter (fun ω : Ω => G ω ⊆ Z)) = ∅ := by\n          apply Finset.eq_empty_iff_forall_notMem.mpr\n          intro ω\n          simp [hz ω]\n        simp [momentTerm, weight, hfilter_empty]\n      _ ≤ Finset.sum S (momentTerm t) := by\n        apply Finset.sum_le_sum_of_subset_of_nonneg\n        · exact Finset.filter_subset zero S\n        · intro Z _hZS _hZnot\n          dsimp [momentTerm, weight]\n          exact mul_nonneg\n            (mul_nonneg (pow_nonneg hp_nonneg _) (pow_nonneg hq_nonneg _))\n            (le_of_lt (Real.exp_pos _))\n  have hbound :\n      ∀ t : ℝ, 0 ≤ t →\n        Finset.sum (S.filter zero) weight ≤\n          Real.exp (-(μ ^ 2 / Δ *\n            (1 - Real.exp (-(t * (Δ / μ)))))) := by\n    intro t ht\n    exact (hzero_le_moment t ht).trans\n      (by simpa [S, μ, Δ, weight, momentTerm] using hmoment t ht)\n  have hlim :\n      Tendsto\n        (fun t : ℝ =>\n          Real.exp (-(μ ^ 2 / Δ *\n            (1 - Real.exp (-(t * (Δ / μ))))))) Filter.atTop\n        (𝓝 (Real.exp (-(μ ^ 2 / Δ)))) := by\n    have hB : 0 \u003c Δ / μ := div_pos (by simpa [Δ] using hDelta) hμ\n    have htB : Tendsto (fun t : ℝ => t * (Δ / μ)) Filter.atTop Filter.atTop := by\n      simpa [mul_comm] using tendsto_id.const_mul_atTop hB\n    have h0 :\n        Tendsto (fun t : ℝ => Real.exp (-(t * (Δ / μ)))) Filter.atTop (𝓝 0) :=\n      Real.tendsto_exp_neg_atTop_nhds_zero.comp htB\n    have h1 :\n        Tendsto (fun t : ℝ => 1 - Real.exp (-(t * (Δ / μ)))) Filter.atTop\n          (𝓝 (1 - 0)) :=\n      tendsto_const_nhds.sub h0\n    have h2 :\n        Tendsto (fun t : ℝ => (μ ^ 2 / Δ) * (1 - Real.exp (-(t * (Δ / μ)))))\n          Filter.atTop (𝓝 ((μ ^ 2 / Δ) * (1 - 0))) :=\n      tendsto_const_nhds.mul h1\n    simpa using (Real.continuous_exp.tendsto _).comp h2.neg\n  have hevent :\n      (fun _ : ℝ => Finset.sum (S.filter zero) weight) ≤ᶠ[Filter.atTop]\n        (fun t : ℝ =>\n          Real.exp (-(μ ^ 2 / Δ *\n            (1 - Real.exp (-(t * (Δ / μ))))))) := by\n    filter_upwards [eventually_ge_atTop (0 : ℝ)] with t ht\n    exact hbound t ht\n  have hfinal :\n      Finset.sum (S.filter zero) weight ≤ Real.exp (-(μ ^ 2 / Δ)) :=\n    le_of_tendsto_of_tendsto tendsto_const_nhds hlim hevent\n  simpa [S, zero, μ, Δ, weight] using hfinal","tex_statement":"\\begin{helper}\nLet $Z$ be a Bernoulli-$p$ random subset of a finite set $V$, let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$, and suppose\nthe exponential-moment estimate\n\\[\n    \\sum_{Z\\subseteq V}p^{|Z|}(1-p)^{|V|-|Z|}e^{-tY(Z)}\n    \\le\n    \\exp\\left(\n       -\\frac{\\mu^2}{\\Delta}\\left(1-e^{-t\\Delta/\\mu}\\right)\n    \\right)\n\\]\nholds for every $t\\ge0$, where\n$Y(Z)=\\sum_i\\mathbf 1_{\\{G_i\\subseteq Z\\}}$,\n$\\mu=\\sum_i p^{|G_i|}$, and\n$\\Delta=\\sum_{i,j:G_i\\cap G_j\\ne\\varnothing}p^{|G_i\\cup G_j|}>0$.\nThen\n\\[\n    \\sum_{\\substack{Z\\subseteq V\\\\Y(Z)=0}}\n       p^{|Z|}(1-p)^{|V|-|Z|}\n    \\le\n    \\exp(-\\mu^2/\\Delta).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nFor each fixed subset $Z\\subseteq V$, the value $Y(Z)$ is a nonnegative\ninteger.  If $Y(Z)=0$, then $e^{-tY(Z)}=1$ for every $t\\ge0$.  If\n$Y(Z)>0$, then $e^{-tY(Z)}$ tends to $0$ as $t\\to\\infty$.  Since there are\nonly finitely many subsets of $V$, the limit may be passed through the finite\nsum:\n\\[\n    \\lim_{t\\to\\infty}\n    \\sum_{Z\\subseteq V}p^{|Z|}(1-p)^{|V|-|Z|}e^{-tY(Z)}\n    =\n    \\sum_{\\substack{Z\\subseteq V\\\\Y(Z)=0}}\n       p^{|Z|}(1-p)^{|V|-|Z|}.\n\\]\nThe assumed moment estimate bounds the left-hand expression by\n\\[\n    \\exp\\left(\n       -\\frac{\\mu^2}{\\Delta}\\left(1-e^{-t\\Delta/\\mu}\\right)\n    \\right)\n\\]\nfor every $t\\ge0$.  Because $\\Delta>0$ and, in the Bernoulli Janson setting,\n$\\mu>0$, the factor $e^{-t\\Delta/\\mu}$ tends to $0$.  Passing to the limit in\nthe right-hand side gives $\\exp(-\\mu^2/\\Delta)$.\n\nFinally, $Y(Z)=0$ is exactly the assertion that no label $i$ satisfies\n$G_i\\subseteq Z$, because $Y$ is the sum of the corresponding zero-one\nindicators.  This is the displayed zero-event sum.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonDeletionLemma":{"name":"FiniteJansonDeletionLemma","title":"FiniteJansonDeletionLemma","kind":"lemma","is_target":false,"imports":["FiniteJansonZeroEventFromMomentEstimate"],"imported_by":["WeightedJansonRationalWeights"],"lean_statement":"lemma FiniteJansonDeletionLemma {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            p ^ (G pair.1 ∪ G pair.2).card\n          else 0)) :\n    Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ ω : Ω, ¬ G ω ⊆ Z))\n        (fun Z : Finset V =>\n          p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) ≤\n      Real.exp\n        (-\n          (((Finset.univ : Finset Ω).sum\n              (fun ω : Ω => p ^ (G ω).card)) ^ 2 /\n            Finset.sum\n              ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n              (fun pair : Ω × Ω =>\n                if (G pair.1 ∩ G pair.2).Nonempty then\n                  p ^ (G pair.1 ∪ G pair.2).card\n                else 0))) := by","lean_proof":"exact FiniteJansonZeroEventFromMomentEstimate G p hp hnonempty hDelta\n    (FiniteJansonExponentialMomentEstimate G p hp hnonempty hDelta)","tex_statement":"\\begin{lemma}\nLet $Z$ be obtained from a finite set $V$ by including every element\nindependently with probability $p\\in(0,1)$.  Let\n$(G_i)_{i\\in I}$ be a finite labelled family of nonempty subsets of $V$ and\nput\n\\[\n    Y=\\sum_{i\\in I}\\mathbf 1_{\\{G_i\\subseteq Z\\}}.\n\\]\nDefine\n\\[\n    \\Delta=\n    \\sum_{\\substack{i,j\\in I\\\\G_i\\cap G_j\\ne\\varnothing}}\n       \\Pr(G_i\\cup G_j\\subseteq Z).\n\\]\nIf $\\Delta>0$, then\n\\[\n    \\Pr(Y=0)\\le\n    \\exp\\left(-\\frac{(\\mathbb E Y)^2}{\\Delta}\\right).\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nFor each label write\n\\[\n    A_i=\\{G_i\\subseteq Z\\},\\qquad\n    I_i=\\mathbf 1_{A_i},\\qquad\n    q_i=\\Pr(A_i).\n\\]\nSince $G_i$ is finite and every vertex of $G_i$ is retained independently,\n$q_i=p^{|G_i|}$.  Thus\n\\[\n    \\mu\\coloneqq \\mathbb E Y=\\sum_{i\\in I}q_i .\n\\]\nFor labels with $G_i\\cap G_j\\ne\\varnothing$ the event\n$A_i\\cap A_j$ is exactly $\\{G_i\\cup G_j\\subseteq Z\\}$, so the displayed\n$\\Delta$ is equivalently\n\\[\n    \\Delta=\\sum_{\\substack{i,j\\in I\\\\G_i\\cap G_j\\ne\\varnothing}}\n       \\Pr(A_i\\cap A_j).\n\\]\nThe hypothesis $\\Delta>0$ implies in particular that $\\mu>0$.\n\nWe prove the lower-tail estimate by the finite exponential-moment proof of\nJanson's inequality.  No label is identified with any other label: if two\nlabels carry the same set, they appear as two separate summands throughout\nthe argument and also as separate ordered pairs in $\\Delta$.\n\nFor $s\\ge0$ set\n\\[\n    \\psi(s)=\\mathbb E e^{-sY}.\n\\]\nBecause $I$ is finite, $Y$ takes only finitely many nonnegative integer\nvalues.  Hence $\\psi$ is differentiable and\n\\[\n    -\\psi'(s)=\\mathbb E(Y e^{-sY})\n       =\\sum_{i\\in I}\\mathbb E(I_i e^{-sY}).\n\\]\nFix $i$.  Split\n\\[\n    Y=Y_i+Z_i\n\\]\nwhere\n\\[\n    Y_i=\\sum_{\\substack{j\\in I\\\\G_i\\cap G_j\\ne\\varnothing}} I_j,\n    \\qquad\n    Z_i=\\sum_{\\substack{j\\in I\\\\G_i\\cap G_j=\\varnothing}} I_j .\n\\]\nThe variable $Z_i$ depends only on vertices outside $G_i$, while $I_i$\ndepends only on vertices in $G_i$; therefore $Z_i$ is independent of $I_i$.\nConditioned on $A_i$, the vertices in $G_i$ are fixed to be present and the\nremaining vertices are still independent Bernoulli-$p$ variables.  Thus the\nconditional probability space is a finite product measure on\n$V\\setminus G_i$.  In that conditional product measure, both $e^{-sY_i}$ and\n$e^{-sZ_i}$ are decreasing functions of the remaining vertex indicators:\nturning additional remaining vertices on can only turn more events $A_j$ on,\nso it can only increase $Y_i$ and $Z_i$, and $s\\ge0$ makes\n$x\\mapsto e^{-sx}$ decreasing.  Applying\n\\noderef{FiniteProductHarrisKleitman} to this conditional product measure\ntherefore gives\n\\[\n    \\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\n    \\ge\n    \\mathbb E(e^{-sY_i}\\mid A_i)\\,\n    \\mathbb E(e^{-sZ_i}\\mid A_i).\n\\]\nBy the independence just noted,\n$\\mathbb E(e^{-sZ_i}\\mid A_i)=\\mathbb E(e^{-sZ_i})$.  Also\n$Y_i\\ge0$, so $e^{-s(Y_i+Z_i)}\\le e^{-sZ_i}$ pointwise and therefore\n$\\mathbb E(e^{-sZ_i})\\ge\\psi(s)$.  Multiplying by\n$\\Pr(A_i)=q_i$ gives the lower bound\n\\[\n    \\mathbb E(I_i e^{-sY})\n    =\n    q_i\\,\\mathbb E(e^{-sY_i}e^{-sZ_i}\\mid A_i)\n    \\ge\n    q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i)\\,\\psi(s).\n\\]\nSumming over $i$ and dividing by the positive number $\\psi(s)$ yields\n\\[\n    -(\\log\\psi)'(s)\n    =\n    \\frac{-\\psi'(s)}{\\psi(s)}\n    \\ge\n    \\sum_{i\\in I} q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i).\n\\]\n\nWe next bound the right-hand side in terms of $\\mu$ and $\\Delta$.  For fixed\n$i$, apply finite Jensen, \\texttt{ConvexOn.map\\_sum\\_le} specialized to the\nconvex exponential function, to the finite conditional probability space\ngiven $A_i$: the weights are the conditional probabilities of the finitely\nmany outcomes after forcing $G_i\\subseteq Z$, and the point attached to an\noutcome is $-sY_i$.  This gives\n\\[\n    \\mathbb E(e^{-sY_i}\\mid A_i)\n    \\ge\n    \\exp\\bigl(-s\\,\\mathbb E(Y_i\\mid A_i)\\bigr).\n\\]\nApply \\texttt{ConvexOn.map\\_sum\\_le} for the exponential a second time to the\nfinite label set $I$, with weights $q_i/\\mu$ and points\n$-s\\mathbb E(Y_i\\mid A_i)$.  These weights are nonnegative and sum to $1$\nbecause $\\mu=\\sum_iq_i>0$.  We obtain\n\\[\n    \\sum_{i\\in I} q_i\\,\\mathbb E(e^{-sY_i}\\mid A_i)\n    \\ge\n    \\mu\\exp\\left(\n       -\\frac{s}{\\mu}\\sum_{i\\in I}q_i\\,\\mathbb E(Y_i\\mid A_i)\n    \\right).\n\\]\nFor a fixed $i$,\n\\[\n    q_i\\,\\mathbb E(Y_i\\mid A_i)\n    =\n    \\sum_{\\substack{j\\in I\\\\G_i\\cap G_j\\ne\\varnothing}}\n       q_i\\,\\Pr(A_j\\mid A_i)\n    =\n    \\sum_{\\substack{j\\in I\\\\G_i\\cap G_j\\ne\\varnothing}}\n       \\Pr(A_i\\cap A_j).\n\\]\nAfter summing in $i$, the last expression is exactly $\\Delta$.  Consequently\n\\[\n    -(\\log\\psi)'(s)\\ge \\mu e^{-s\\Delta/\\mu}.\n\\]\n\nIntegrating this differential inequality from $0$ to $t$ gives\n\\[\n    \\log\\psi(t)-\\log\\psi(0)\n    \\le\n    -\\int_0^t \\mu e^{-s\\Delta/\\mu}\\,ds\n    =\n    -\\frac{\\mu^2}{\\Delta}\\left(1-e^{-t\\Delta/\\mu}\\right).\n\\]\nSince $\\psi(0)=1$, this is\n\\[\n    \\psi(t)\\le\n    \\exp\\left(\n       -\\frac{\\mu^2}{\\Delta}\\left(1-e^{-t\\Delta/\\mu}\\right)\n    \\right).\n\\]\nFinally let $t\\to\\infty$.  For each outcome,\n$e^{-tY}$ decreases to $\\mathbf 1_{\\{Y=0\\}}$, and the probability space is\nfinite, so\n\\[\n    \\lim_{t\\to\\infty}\\psi(t)=\\Pr(Y=0).\n\\]\nThe right-hand side tends to $\\exp(-\\mu^2/\\Delta)$.  Therefore\n\\[\n    \\Pr(Y=0)\\le \\exp(-\\mu^2/\\Delta),\n\\]\nwhich is the claimed inequality.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"WeightedJansonRationalWeights":{"name":"WeightedJansonRationalWeights","title":"WeightedJansonRationalWeights","kind":"lemma","is_target":false,"imports":["FiniteJansonDeletionLemma"],"imported_by":["WeightedJansonContinuityFromRational"],"lean_statement":"lemma WeightedJansonRationalWeights {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (a : Ω → ℝ) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (ha : ∀ ω : Ω, 0 ≤ a ω)\n    (hrat : ∀ ω : Ω, ∃ q : ℚ, 0 ≤ q ∧ a ω = (q : ℝ))\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            a pair.1 * a pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n          else 0)) :\n    Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ ω : Ω, 0 \u003c a ω → ¬ G ω ⊆ Z))\n      rw [← Rat.num_div_den (q ω)]\n      calc\n        (D : ℚ) * (((q ω).num : ℚ) / ((q ω).den : ℚ))\n            = (((D / (q ω).den : ℕ) : ℚ) * ((q ω).den : ℚ)) *\n                (((q ω).num : ℚ) / ((q ω).den : ℚ)) := by rw [hD_rat]\n        _ = ((q ω).num : ℚ) * ((D / (q ω).den : ℕ) : ℚ) := by\n          field_simp [Rat.den_nz (q ω)]\n        _ = (b ω : ℚ) := hb_rat.symm\n    have hreal_id : ((D : ℝ) * (q ω : ℝ)) = (b ω : ℝ) := by\n      exact_mod_cast hrat_id\n    rw [hqcast ω]\n    exact hreal_id.symm\n  have hb_pos_iff : ∀ ω, 0 \u003c b ω ↔ 0 \u003c a ω := by\n    intro ω\n    constructor\n    · intro hbpos\n      have hbpos_real : 0 \u003c (b ω : ℝ) := by exact_mod_cast hbpos\n      rw [hb_real ω] at hbpos_real\n      have ha_nonneg : 0 ≤ a ω := ha ω\n      nlinarith [hDpos_real, hbpos_real, ha_nonneg]\n    · intro hapos\n      have hprod_pos : 0 \u003c (D : ℝ) * a ω := mul_pos hDpos_real hapos\n      rw [← hb_real ω] at hprod_pos\n      exact_mod_cast hprod_pos\n  let Ωc := Sigma fun ω : Ω => Fin (b ω)\n  let Gc : Ωc → Finset V := fun x => G x.1\n  have hnonempty_c : ∀ x : Ωc, (Gc x).Nonempty := by\n    intro x\n    exact hnonempty x.1\n  have hevent :\n      (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ x : Ωc, ¬ Gc x ⊆ Z)) =\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ ω : Ω, 0 \u003c a ω → ¬ G ω ⊆ Z)) := by\n    apply Finset.filter_congr\n    intro Z hZ\n    constructor\n    · intro h ω haω hsub\n      have hbω : 0 \u003c b ω := (hb_pos_iff ω).2 haω\n      exact h ⟨ω, ⟨0, hbω⟩⟩ hsub\n    · intro h x hsub\n      exact h x.1 ((hb_pos_iff x.1).1 (lt_of_le_of_lt (Nat.zero_le _) x.2.2)) hsub\n  have hmu_c :\n      (Finset.univ : Finset Ωc).sum (fun x => p ^ (Gc x).card) =\n        (D : ℝ) * (Finset.univ : Finset Ω).sum\n          (fun ω => a ω * p ^ (G ω).card) := by\n    dsimp [Ωc, Gc]\n    calc\n      (∑ x : Sigma fun ω : Ω => Fin (b ω), p ^ (G x.1).card)\n          = ∑ x : Ω, ∑ _y : F ty then p ^ (G x.1 ∪ G y.1).card else 0 :=\n            Fintype.sum_prod_type\n              (fun pair : (Sigma fun ω : Ω => Fin (b ω)) ×\n                  (Sigma fun ω : Ω => Fin (b ω)) =>\n                if (G pair.1.1 ∩ G pair.2.1).Nonempty then\n                  p ^ (G pair.1.1 ∪ G pair.2.1).card else 0)\n      _ = ∑ ω : Ω, ∑ _i : Fin (b ω), ∑ ω' : Ω, ∑ _j : Fin (b ω'),\n              if (G ω ∩ G ω').Nonempty then p ^ (G ω ∪ G ω').card else 0 := by\n            simp_rw [Fintype.sum_sigma]\n      _ = ∑ ω : Ω, ∑ ω' : Ω,\n              (b ω : ℝ) * (b ω' : ℝ) *\n                (if (G ω ∩ G ω').Nonempty then p ^ (G ω ∪ G ω').card else 0) := by\n            refine Finset.sum_congr rfl ?_\n            intro ω hω\n            calc\n              (∑ _i : Fin (b ω), ∑ ω' : Ω, ∑ _j : Fin (b ω'),\n                  if (G ω ∩ G ω').Nonempty then p ^ (G ω ∪ G ω').card else 0)\n                  = (b ω : ℝ) * (∑ ω' : Ω, ∑ _j : Fin (b ω'),\n                      if (G ω ∩ G ω').Nonempty then p ^ (G ω ∪ G ω').card else 0) := by\n                    simp [Finset.sum_const, nsmul_eq_mul]\n              _ = ∑ ω' : Ω, (b ω : ℝ) *\n                    (∑ _j : Fin (b ω'),\n                      if (G ω ∩ G ω').Nonempty then p ^ (G ω ∪ G ω').card else 0) := by\n                    rw [Finset.mul_sum]\n              _ = ∑ ω' : Ω, (b ω : ℝ) * ((b ω' : ℝ) *\n                    (if (G ω ∩ G ω').Nonempty then p ^ (G ω ∪ G ω').card else 0)) := by\n                    refine Finset.sum_congr rfl ?_\n                    intro ω' hω'\n                    simp [Finset.sum_const, nsmul_eq_mul]\n              _ = ∑ ω' : Ω, (b ω : ℝ) * (b ω' : ℝ) *\n                    (if (G ω ∩ G ω').Nonempty then p ^ (G ω ∪ G ω').card else 0) := by\n                    refine Finset.sum_congr rfl ?_\n                    intro ω' hω'\n                    ring\n      _ = (D : ℝ) ^ 2 *\n            (∑ pair : Ω × Ω,\n              if (G pair.1 ∩ G pair.2).Nonempty then\n                a pair.1 * a pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n              else 0) := by\n            rw [Fintype.sum_prod_type]\n            calc\n              (∑ ω : Ω, ∑ ω' : Ω,\n                  (b ω : ℝ) * (b ω' : ℝ) *\n                    (if (G ω ∩ G ω').Nonempty then p ^ (G ω ∪ G ω').card else 0))\n                  = ∑ ω : Ω, ∑ ω' : Ω,\n                      (D : ℝ) ^ 2 *\n                        (if (G ω ∩ G ω').Nonempty then\n                          a ω * a ω' * p ^ (G ω ∪ G ω').card\n                        else 0) := by\n                    refine Finset.sum_congr rfl ?_\n                    intro ω hω\n                    refine Finset.sum_congr rfl ?_\n                    intro ω' hω'\n                    by_cases hinter : (G ω ∩ G ω').Nonempty\n                    · simp [hinter, hb_real, pow_two]\n                      ring\n                    · simp [hinter]\n              _ = (D : ℝ) ^ 2 *\n                    (∑ ω : Ω, ∑ ω' : Ω,\n                      if (G ω ∩ G ω').Nonempty then\n                        a ω * a ω' * p ^ (G ω ∪ G ω').card\n                      else 0) := by\n                    rw [Finset.mul_sum]\n                    refine Finset.sum_congr rfl ?_\n                    intro ω hω\n                    rw [Finset.mul_sum]\n  have hDelta_c_pos : 0 \u003c Δc := by\n    rw [hDelta_c_eq]\n    exact mul_pos (sq_pos_of_pos hDpos_real) hDelta\n  have hDelta_c_pos' :\n      0 \u003c\n        Finset.sum ((Finset.univ : Finset Ωc).product (Finset.univ : Finset Ωc))\n          (fun pair : Ωc × Ωc =>\n            if (Gc pair.1 ∩ Gc pair.2).Nonempty then\n              p ^ (Gc pair.1 ∪ Gc pair.2).card\n            else 0) := by\n    change 0 \u003c Δc\n    exact hDelta_c_pos\n  have hJ :=\n    FiniteJansonDeletionLemma (Ω := Ωc) (V := V) Gc p hp hnonempty_c hDelta_c_pos'\n  rw [← hevent]\n  refine le_trans hJ ?_\n  have hden_nonzero : Δ ≠ 0 := ne_of_gt hDelta\n  have hden_c_nonzero : Δc ≠ 0 := ne_of_gt hDelta_c_pos\n  apply Real.exp_le_exp.mpr\n  rw [hmu_c]\n  change -(((D : ℝ) * (Finset.univ : Finset Ω).sum (fun ω => a ω * p ^ (G ω).card)) ^ 2 /\n        Δc) ≤\n    -(((Finset.univ : Finset Ω).sum (fun ω => a ω * p ^ (G ω).card)) ^ 2 / Δ)\n  rw [hDelta_c_eq]\n  field_simp [hD_ne_real, hden_nonzero]\n  exact le_rfl","tex_statement":"\\begin{lemma}\nLet $Z$ be obtained from a finite set $V$ by including every element\nindependently with probability $p\\in(0,1)$.  Let\n$(G_\\omega)_{\\omega\\in\\Omega}$ be a finite labelled family of nonempty subsets\nof $V$.  Let $a_\\omega\\ge0$ for every $\\omega\\in\\Omega$, and suppose moreover\nthat every $a_\\omega$ is rational.  Define\n\\[\n  X=\\sum_{\\omega\\in\\Omega}\n      a_\\omega\\mathbf 1_{\\{G_\\omega\\subseteq Z\\}}\n\\]\nand\n\\[\n  \\Delta=\n  \\sum_{\\substack{\\omega,\\omega'\\in\\Omega\\\\\n                  G_\\omega\\cap G_{\\omega'}\\ne\\varnothing}}\n      a_\\omega a_{\\omega'}p^{|G_\\omega\\cup G_{\\omega'}|}.\n\\]\nIf $\\Delta>0$, then\n\\[\n  \\Pr\\bigl(\\forall \\omega,\\ a_\\omega>0\\Rightarrow\n        G_\\omega\\nsubseteq Z\\bigr)\n  \\le\n  \\exp\\left(-\\frac{(\\sum_\\omega a_\\omega p^{|G_\\omega|})^2}{\\Delta}\\right),\n\\]\nwhere the probability is with respect to the above Bernoulli-$p$ random\nsubset $Z$ of $V$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nChoose a common positive integer denominator $D$ for the finitely many\nrational weights and write $D a_\\omega=b_\\omega\\in\\mathbb N$ for every\n$\\omega$.  Since the weights are nonnegative, each $b_\\omega$ is\nnonnegative, and $b_\\omega=0$ exactly when $a_\\omega=0$.  Form a new finite\nlabelled family by replacing each label $\\omega$ by exactly $b_\\omega$\ndistinct copies, all carrying the same set $G_\\omega$; labels with\n$b_\\omega=0$ contribute no copies.\n\nLet $Y$ be the unweighted count for this copied family.  For every outcome\n$Z$,\n\\[\n  Y(Z)=\\sum_\\omega b_\\omega {\\bf 1}_{\\{G_\\omega\\subseteq Z\\}}\n      =D\\sum_\\omega a_\\omega{\\bf 1}_{\\{G_\\omega\\subseteq Z\\}}.\n\\]\nTherefore $Y=0$ is exactly the positive-support zero event: no label with\n$a_\\omega>0$ has $G_\\omega\\subseteq Z$.  Zero-weight labels have been\ngiven no copies, so they impose no condition on this event.\n\nThe copied family is finite and still consists of nonempty subsets of $V$.\nApplying \\noderef{FiniteJansonDeletionLemma} to it gives\n\\[\n  \\Pr(Y=0)\\le\n  \\exp\\left(-\\frac{(\\mathbb EY)^2}{\\Delta_Y}\\right),\n\\]\nwhere\n\\[\n  \\mathbb EY\n  =\\sum_\\omega b_\\omega p^{|G_\\omega|}\n  =D\\sum_\\omega a_\\omega p^{|G_\\omega|}\n\\]\nand, because duplicate labels are counted as distinct ordered labels,\n\\[\n  \\Delta_Y\n  =\\sum_{\\omega,\\omega':\\,G_\\omega\\cap G_{\\omega'}\\ne\\varnothing}\n      b_\\omega b_{\\omega'}p^{|G_\\omega\\cup G_{\\omega'}|}\n  =D^2\\Delta .\n\\]\nThe hypothesis $\\Delta>0$ gives $\\Delta_Y=D^2\\Delta>0$, so the cited theorem\napplies.\nSubstituting the two displayed identities into the exponent cancels the\nfactor $D^2$ and yields exactly the claimed inequality.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"WeightedJansonContinuityFromRational":{"name":"WeightedJansonContinuityFromRational","title":"WeightedJansonContinuityFromRational","kind":"lemma","is_target":false,"imports":["WeightedJansonRationalWeights"],"imported_by":["WeightedJansonInequality"],"lean_statement":"lemma WeightedJansonContinuityFromRational {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (a : Ω → ℝ) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (ha : ∀ ω : Ω, 0 ≤ a ω)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            a pair.1 * a pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n          else 0))\n    (hrational :\n      ∀ b : Ω → ℝ,\n        (∀ ω : Ω, 0 ≤ b ω) →\n        (∀ ω : Ω, 0 \u003c b ω ↔ 0 \u003c a ω) →\n        (∀ ω : Ω, ∃ q : ℚ, 0 ≤ q ∧ b ω = (q : ℝ)) →\n        0 \u003c\n          Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n            (fun pair : Ω × Ω =>\n              if (G pair.1 ∩ G pair.2).Nonempty then\n                b pair.1 * b pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n              else 0) →\n        Finset.sum\n            (((Finset.univ : Finset V).powerset).filter\n              (fun Z : Finset V => ∀ ω : Ω, 0 \u003c b ω → ¬ G ω ⊆ Z))\n            (fun Z : Finset V =>\n              p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) ≤\n          Real.exp\n            (-\n              (((Finset.univ : Finset Ω).sum\n                  (fun ω : Ω => b ω * p ^ (G ω).card)) ^ 2 /\n                Finset.sum\n                  ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n                  (fun pair : Ω × Ω =>\n                    if (G pair.1 ∩ G pair.2).Nonempty then\n                      b pair.1 * b pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n                    else 0)))) :\n    Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ ω : Ω, 0 \u003c a ω → ¬ G ω ⊆ Z))\n        (fun Z : Finset V =>\n          p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) ≤\n      Real.exp\n        (-\n          (((Finset.univ : Finset Ω).sum\n              (fun ω : Ω => a ω * p ^ (G ω).card)) ^ 2 /\n            Finset.sum\n              ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n              (fun pair : Ω × Ω =>\n                if (G pair.1 ∩ G pair.2).Nonempty then\n                  a pair.1 * a pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n                else 0))) := by","lean_proof":"classical\n  let ε : ℕ → ℝ := fun n => (1 : ℝ) / (((n + 1 : ℕ) : ℝ))\n  have hε_tendsto : Tendsto ε atTop tendsto_const_nhds\n    · have hapos : 0 \u003c a ω := lt_of_le_of_ne' (ha ω) hzero\n      have hupper :\n          Tendsto (fun n : ℕ => a ω + ε n) atTop (nhds (a ω)) := by\n        simpa using tendsto_const_nhds.add hε_tendsto\n      have hlower :\n          Tendsto (fun n : ℕ => a ω - ε n) atTop (nhds (a ω)) := by\n        simpa [sub_eq_add_neg] using tendsto_const_nhds.add hε_tendsto.neg\n      refine tendsto_of_tendsto_of_tendsto_of_le_of_le hlower hupper ?_ ?_\n      · intro n\n        exact le_trans (le_max_right _ _) (hq_spec n ω hapos).1.le\n      · intro n\n        exact (hq_spec n ω hapos).2.le\n  let zeroEvent (c : Ω → ℝ) : Finset (Finset V) :=\n    ((Finset.univ : Finset V).powerset).filter\n      (fun Z : Finset V => ∀ ω : Ω, 0 \u003c c ω → ¬ G ω ⊆ Z)\n  have hzeroEvent : ∀ n, zeroEvent (b n) = zeroEvent a := by\n    intro n\n    dsimp [zeroEvent]\n    apply Finset.filter_congr\n    intro Z hZ\n    constructor\n    · intro h ω haω\n      exact h ω ((hb_pos_iff n ω).2 haω)\n    · intro h ω hbω\n      exact h ω ((hb_pos_iff n ω).1 hbω)\n  let M : (Ω → ℝ) → ℝ := fun c =>\n    Finset.sum (Finset.univ : Finset Ω) (fun ω => c ω * p ^ (G ω).card)\n  let Δ : (Ω → ℝ) → ℝ := fun c =>\n    Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n      (fun pair : Ω × Ω =>\n        if (G pair.1 ∩ G pair.2).Nonempty then\n          c pair.1 * c pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n        else 0)\n  have hM_tendsto : Tendsto (fun n : ℕ => M (b n)) atTop (nhds (M a)) := by\n    dsimp [M]\n    refine tendsto_finset_sum _ ?_\n    intro ω hω\n    exact (hb_tendsto ω).mul tendsto_const_nhds\n  have hΔ_tendsto : Tendsto (fun n : ℕ => Δ (b n)) atTop (nhds (Δ a)) := by\n    dsimp [Δ]\n    refine tendsto_finset_sum _ ?_\n    intro pair hpair\n    by_cases hinter : (G pair.1 ∩ G pair.2).Nonempty\n    · simpa [hinter] using\n        (((hb_tendsto pair.1).mul (hb_tendsto pair.2)).mul tendsto_const_nhds)\n    · simpa [hinter] using (tendsto_const_nhds : Tendsto (fun _ : ℕ => (0 : ℝ)) atTop (nhds 0))\n  have hΔa_eq :\n      Δ a =\n        Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n          (fun pair : Ω × Ω =>\n            if (G pair.1 ∩ G pair.2).Nonempty then\n              a pair.1 * a pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n            else 0) := rfl\n  have hΔ_pos_eventually : ∀ᶠ n : ℕ in atTop, 0 \u003c Δ (b n) := by\n    have hΔpos_nhds : ∀ᶠ x : ℝ in nhds (Δ a), 0 \u003c x := by\n      simpa [hΔa_eq] using eventually_gt_nhds hDelta\n    exact hΔ_tendsto.eventually hΔpos_nhds\n  have hright_tendsto :\n      Tendsto\n        (fun n : ℕ => Real.exp (-((M (b n)) ^ 2 / Δ (b n)))) atTop\n        (nhds (Real.exp (-((M a) ^ 2 / Δ a)))) := by\n    have hquot :\n        Tendsto (fun n : ℕ => (M (b n)) ^ 2 / Δ (b n)) atTop\n          (nhds ((M a) ^ 2 / Δ a)) := by\n      exact (hM_tendsto.pow 2).div hΔ_tendsto (ne_of_gt (by simpa [hΔa_eq] using hDelta))\n    exact (Real.continuous_exp.tendsto _).comp hquot.neg\n  have hinequality_eventually :\n      (fun _n : ℕ =>\n        Finset.sum\n          (((Finset.univ : Finset V).powerset).filter\n            (fun Z : Finset V => ∀ ω : Ω, 0 \u003c a ω → ¬ G ω ⊆ Z))\n          (fun Z : Finset V =>\n            p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card))) ≤ᶠ[atTop]\n      (fun n : ℕ => Real.exp (-((M (b n)) ^ 2 / Δ (b n)))) := by\n    filter_upwards [hΔ_pos_eventually] with n hnΔ\n    have hrat_n :=\n      hrational (b n) (hb_nonneg n) (hb_pos_iff n) (hb_rat n) (by simpa [Δ] using hnΔ)\n    change\n      Finset.sum (zeroEvent a)\n        (fun Z : Finset V => p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) ≤\n        Real.exp (-((M (b n)) ^ 2 / Δ (b n)))\n    rw [← hzeroEvent n]\n    simpa [zeroEvent, hzeroEvent n, M, Δ] using hrat_n\n  have hleft_tendsto :\n      Tendsto\n        (fun _n : ℕ =>\n          Finset.sum\n            (((Finset.univ : Finset V).powerset).filter\n              (fun Z : Finset V => ∀ ω : Ω, 0 \u003c a ω → ¬ G ω ⊆ Z))\n            (fun Z : Finset V =>\n              p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card))) atTop\n        (nhds\n          (Finset.sum\n            (((Finset.univ : Finset V).powerset).filter\n              (fun Z : Finset V => ∀ ω : Ω, 0 \u003c a ω → ¬ G ω ⊆ Z))\n            (fun Z : Finset V =>\n              p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)))) :=\n    tendsto_const_nhds\n  have hlimit :=\n    le_of_tendsto_of_tendsto hleft_tendsto hright_tendsto hinequality_eventually\n  change\n    Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ ω : Ω, 0 \u003c a ω → ¬ G ω ⊆ Z))\n        (fun Z : Finset V =>\n          p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) ≤\n      Real.exp (-((M a) ^ 2 / Δ a))\n  exact hlimit","tex_statement":"\\begin{lemma}\nAssume the weighted Janson lower-tail bound has already been proved for\nevery nonnegative rational weight vector with the same positive support as a\ngiven nonnegative real vector $(a_\\omega)_{\\omega\\in\\Omega}$.  Then the\nbound holds for the real vector $(a_\\omega)$ itself.\n\\end{lemma}","tex_proof":"\\begin{proof}\nDelete the labels with $a_\\omega=0$.  They do not contribute to the weighted\nrandom variable, to its expectation, or to any summand of $\\Delta$, and the\nzero event in the statement only tests labels with positive weight.  Since\nthe original $\\Delta$ is positive, the same positive value remains after\nthis deletion.  Thus it is enough to argue on the finite positive support,\nwhere every $a_\\omega$ is strictly positive.\n\nChoose positive rational numbers $b^{(m)}_\\omega$ with\n$b^{(m)}_\\omega\\to a_\\omega$ for every remaining label $\\omega$; this is\npossible because the positive rationals are dense in the positive reals.\nExtend them by zero on the deleted labels.  For every $m$ the positive\nsupport of $b^{(m)}$ is exactly the positive support of $a$, so the zero\nevent\n\\[\n  \\forall \\omega,\\ b^{(m)}_\\omega>0\\Rightarrow G_\\omega\\nsubseteq Z\n\\]\nis the same event as the zero event for $a$.\n\nThe expectation\n\\[\n  M(c)=\\sum_\\omega c_\\omega p^{|G_\\omega|}\n\\]\nis a finite linear function of the coordinates $c_\\omega$, and\n\\[\n  \\Delta(c)=\n  \\sum_{\\omega,\\omega':\\,G_\\omega\\cap G_{\\omega'}\\ne\\varnothing}\n      c_\\omega c_{\\omega'}p^{|G_\\omega\\cup G_{\\omega'}|}\n\\]\nis a finite polynomial function of those coordinates.  Hence\n$M(b^{(m)})\\to M(a)$ and $\\Delta(b^{(m)})\\to\\Delta(a)$.  Because\n$\\Delta(a)>0$, all sufficiently large $m$ also satisfy\n$\\Delta(b^{(m)})>0$.\n\nFor those $m$, the rational-weight hypothesis gives\n\\[\n  \\Pr(X_a=0)=\\Pr(X_{b^{(m)}}=0)\n  \\le\n  \\exp\\left(-\\frac{M(b^{(m)})^2}{\\Delta(b^{(m)})}\\right).\n\\]\nDivision is continuous at positive denominators and the exponential function\nis continuous, so the right-hand side tends to\n\\[\n  \\exp\\left(-\\frac{M(a)^2}{\\Delta(a)}\\right).\n\\]\nTaking the limit in the displayed inequalities therefore gives the desired\nbound for the original real weights.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"WeightedJansonInequality":{"name":"WeightedJansonInequality","title":"WeightedJansonInequality","kind":"lemma","is_target":false,"imports":["WeightedJansonContinuityFromRational"],"imported_by":["ContainmentBinomialHitting","ContainmentHitting"],"lean_statement":"lemma WeightedJansonInequality {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (a : Ω → ℝ) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (ha : ∀ ω : Ω, 0 ≤ a ω)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            a pair.1 * a pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n          else 0)) :\n    Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ ω : Ω, 0 \u003c a ω → ¬ G ω ⊆ Z))\n        (fun Z : Finset V =>\n          p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) ≤\n      Real.exp\n        (-\n          (((Finset.univ : Finset Ω).sum\n              (fun ω : Ω => a ω * p ^ (G ω).card)) ^ 2 /\n            Finset.sum\n              ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n              (fun pair : Ω × Ω =>\n                if (G pair.1 ∩ G pair.2).Nonempty then\n                  a pair.1 * a pair.2 * p ^ (G pair.1 ∪ G pair.2).card\n                else 0))) := by","lean_proof":"exact WeightedJansonContinuityFromRational G a p hp hnonempty ha hDelta\n    (by\n      intro b hb hsupport hrat hbDelta\n      simpa using\n        (WeightedJansonRationalWeights (Ω := Ω) (V := V) G b p hp hnonempty hb hrat\n          hbDelta))","tex_statement":"\\begin{lemma}\nLet $Z$ be obtained from a finite set $V$ by including every element\nindependently with probability $p\\in(0,1)$.  Let\n$(G_\\omega)_{\\omega\\in\\Omega}$ be a finite labelled family of nonempty subsets\nof $V$, and let $a_\\omega\\ge0$ for every $\\omega\\in\\Omega$.  Put\n\\[\n    X=\\sum_{\\omega\\in\\Omega}\n       a_\\omega\\mathbf 1_{\\{G_\\omega\\subseteq Z\\}}\n\\]\nand\n\\[\n    \\Delta=\n    \\sum_{\\substack{\\omega,\\omega'\\in\\Omega\\\\\n                    G_\\omega\\cap G_{\\omega'}\\ne\\varnothing}}\n      a_\\omega a_{\\omega'}\n      \\Pr(G_\\omega\\cup G_{\\omega'}\\subseteq Z).\n\\]\nIf $\\Delta>0$, then\n\\[\n    \\Pr(X=0)\\le\n    \\exp\\left(-\\frac{(\\mathbb E X)^2}{\\Delta}\\right).\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nThis is the weighted labelled form of the standard Janson lower-tail\ninequality.  The unweighted input is \\noderef{FiniteJansonDeletionLemma}.\nApplied to events $A_i=\\{G_i\\subseteq Z\\}$, its\ndependency term is\n\\[\n    \\Delta_Y=\\sum_{i,j:\\,G_i\\cap G_j\\ne\\varnothing}\\Pr(A_i\\cap A_j),\n\\]\nand $A_i\\cap A_j$ is precisely the event\n$G_i\\cup G_j\\subseteq Z$.\n\nFirst suppose all weights $a_\\omega$ are positive rational numbers.  Choose a\ncommon positive integer denominator $D$ and write\n$Da_\\omega=b_\\omega\\in\\mathbb N$ for every $\\omega$.  Replace the single\nlabel $\\omega$ by $b_\\omega$ distinct copies, all carrying the same set\n$G_\\omega$.  For this copied unweighted family the counting random variable is\n\\[\n    Y=\\sum_{\\omega\\in\\Omega}b_\\omega\n      \\mathbf 1_{\\{G_\\omega\\subseteq Z\\}}=D X.\n\\]\nThus $\\Pr(Y=0)=\\Pr(X=0)$ and\n$\\mathbb E Y=D\\,\\mathbb E X$.  Its Janson dependency sum is\n\\[\n    \\Delta_Y\n    =\\sum_{\\omega,\\omega':\\,G_\\omega\\cap G_{\\omega'}\\ne\\varnothing}\n      b_\\omega b_{\\omega'}\n      \\Pr(G_\\omega\\cup G_{\\omega'}\\subseteq Z)\n    =D^2\\Delta .\n\\]\nApplying the unweighted inequality gives\n\\[\n    \\Pr(X=0)=\\Pr(Y=0)\n    \\le\n    \\exp\\left(-\\frac{D^2(\\mathbb E X)^2}{D^2\\Delta}\\right)\n    =\n    \\exp\\left(-\\frac{(\\mathbb E X)^2}{\\Delta}\\right).\n\\]\n\nIf some rational weights are zero, delete their copied labels.  This does not\nchange $X$, its zero event, its expectation, or the summands in $\\Delta$ that\ncan be nonzero.  Hence the same argument proves the assertion for all\nnonnegative rational weights with $\\Delta>0$.\n\nFor real nonnegative weights, first delete every label with $a_\\omega=0$.\nThose labels contribute neither to $X$ nor to $\\mathbb E X$, and every\nsummand of $\\Delta$ containing one of them is zero.  Since the hypothesis\n$\\Delta>0$ remains true after deleting all zero-weight labels, the remaining\nindex set is nonempty and all remaining weights are strictly positive.  For\nthis reduced family the event $X=0$ is exactly the event that no remaining\nset $G_\\omega$ is contained in $Z$; it depends only on the support of the\npositive weights, not on their magnitudes.\n\nChoose positive rational vectors $a^{(m)}_\\omega$ on this fixed reduced index\nset with $a^{(m)}_\\omega\\to a_\\omega$ for every $\\omega$.  The same zero event\nis used for all $m$, because all approximating weights are positive.  The\nrational case therefore gives, for every $m$ large enough that\n$\\Delta(a^{(m)})>0$,\n\\[\n    \\Pr(X=0)\\le\n    \\exp\\left(\n      -\\frac{(\\mathbb E X(a^{(m)}))^2}{\\Delta(a^{(m)})}\n    \\right).\n\\]\nThe expectation is a linear function of the finitely many weights, and\n$\\Delta$ is a polynomial in those weights.  Hence\n$\\mathbb E X(a^{(m)})\\to\\mathbb E X(a)$ and\n$\\Delta(a^{(m)})\\to\\Delta(a)>0$.  By continuity of division on positive\ndenominators and continuity of the exponential function, the right-hand side\nconverges to the desired one.  Passing to the limit gives\n\\[\n    \\Pr(X=0)\\le\n    \\exp\\left(-\\frac{(\\mathbb E X)^2}{\\Delta}\\right)\n\\]\nfor the original real weights.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"ContainmentBinomialHitting":{"name":"ContainmentBinomialHitting","title":"ContainmentBinomialHitting","kind":"lemma","is_target":false,"imports":["BoundedEdges","ContainmentSpread","ProbabilityMass","WeightedJansonInequality"],"imported_by":["ContainmentHitting"],"lean_statement":"lemma ContainmentBinomialHitting {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (F : Ω → Finset V) (ν : Ω → ℝ) (q α : ℝ) (r : ℕ)\n    (hbounded : BoundedEdges F r)\n    (hcontain : ContainmentSpread F ν q)\n    (hq : 0 \u003c q)\n    (hα : 0 \u003c α ∧ α ≤ 1)\n    (hlarge : 2 * (r : ℝ) * q ≤ α) :\n    Finset.sum\n      (((Finset.univ : Finset V).powerset).filter\n        (fun Z : Finset V => ∀ x : Ω, ¬ F x ⊆ Z))\n      (fun Z : Finset V =>\n        α ^ Z.ca
