set.mem_powerset, Finset.nonempty_iff_ne_empty]\n      have hcover (y : Ω) :\n          (if (F x ∩ F y).Nonempty then ν y / α ^ (F x ∩ F y).card else 0) ≤\n          ∑ T ∈ S, if T ⊆ F y then ν y / α ^ T.card else 0 := by\n        split_ifs with hi\n        · have hm : F x ∩ F y ∈ S := (hS _).mpr ⟨hi, Finset.inter_subset_left⟩\n          have hh := Finset.single_le_sum\n            (f := fun T : Finset V => if T ⊆ F y then ν y / α ^ T.card else 0)\n            (s := S) (fun T _ => by\n              dsimp only\n              split_ifs\n              · exact div_nonneg (hν y) (pow_nonneg hα.1.le _)\n              · exact le_rfl) hm\n          simpa only [if_pos Finset.inter_subset_right] using hh\n        · apply Finset.sum_nonneg\n          intro T _\n          split_ifs\n          · exact div_nonneg (hν y) (pow_nonneg hα.1.le _)\n          · exact le_rfl\n      calc\n        _ ≤ ∑ y, ∑ T ∈ S, if T ⊆ F y then ν y / α ^ T.card else 0 :=\n          Finset.sum_le_sum (fun y _ => hcover y)\n        _ = ∑ T ∈ S, LabelMass ν (fun y => T ⊆ F y) / α ^ T.card := by\n          rw [Finset.sum_comm]\n          apply Finset.sum_congr rfl\n          intro T _\n          simp only [LabelMass, Finset.sum_div, Finset.sum_filter, ite_div, zero_div]\n        _ ≤ ∑ T ∈ S, z ^ T.card := by\n          apply Finset.sum_le_sum\n          intro T _\n          simpa only [z, div_pow] using\n            (div_le_div_of_nonneg_right (hcontain.2 T) (pow_nonneg hα.1.le T.card))\n        _ = (1 + z) ^ (F x).card - 1 := by\n          have hp := Finset.prod_one_add (R := ℝ) (f := fun _ : V => z) (F x)\n          simp only [Finset.prod_const] at hp\n          have he := Finset.sum_erase_add (s := (F x).powerset)\n            (f := fun T : Finset V => z ^ T.card) (by simp : ∅ ∈ (F x).powerset)\n          simp only [Finset.card_empty, pow_zero] at he\n          dsimp [S]\n          linarith\n        _ ≤ (1 + z) ^ r - 1 := by\n          exact sub_le_sub_right (pow_le_pow_right₀ (by linarith : 1 ≤ 1 + z) (hbounded x)) 1\n    have hDpower : D ≤ (1 + z) ^ r - 1 := by\n      calc\n        D = ∑ x, ∑ y, if (F x ∩ F y).Nonempty then\n              a x * a y * α ^ (F x ∪ F y).card else 0 := by\n          simpa only [D] using (Finset.sum_product'\n            (s := (Finset.univ : Finset Ω)) (t := (Finset.univ : Finset Ω))\n            (f := fun x y : Ω => if (F x ∩ F y).Nonempty then\n              a x * a y * α ^ (F x ∪ F y).card else 0))\n        _ = ∑ x, ν x * ∑ y, if (F x ∩ F y).Nonempty then\n              ν y / α ^ (F x ∩ F y).card else 0 := by\n          apply Finset.sum_congr rfl\n          intro x _\n          rw [Finset.mul_sum]\n          apply Finset.sum_congr rfl\n          intro y _\n          split_ifs\n          · rw [hpair]\n            ring\n          · ring\n        _ ≤ ∑ x, ν x * ((1 + z) ^ r - 1) :=\n          Finset.sum_le_sum (fun x _ => mul_le_mul_of_nonneg_left (hrow x) (hν x))\n        _ = (1 + z) ^ r - 1 := by rw [← Finset.sum_mul, hsum, one_mul]\n    have hpow : (1 + z) ^ r ≤ Real.exp ((r : ℝ) * z) := by\n      calc\n        _ ≤ (Real.exp z) ^ r := pow_le_pow_left₀ (by linarith)\n          (by linarith [Real.add_one_le_exp z]) r\n        _ = _ := (Real.exp_nat_mul z r).symm\n    have he := Real.exp_bound_div_one_sub_of_interval (mul_nonneg hr.le hz)\n      (show (r : ℝ) * z \u003c 1 by linarith)\n    have hfinal : Real.exp ((r : ℝ) * z) - 1 ≤ 2 * (r : ℝ) * z := by\n      have hden : 0 \u003c 1 - (r : ℝ) * z := by linarith\n      have hb : 1 / (1 - (r : ℝ) * z) ≤ 1 + 2 * (r : ℝ) * z := by\n        apply (div_le_iff₀ hden).mpr\n        nlinarith [mul_nonneg (mul_nonneg hr.le hz) (show 0 ≤ 1 - 2 * (r : ℝ) * z by linarith)]\n      linarith\n    have hh := hDpower.trans ((sub_le_sub_right hpow 1).trans hfinal)\n    simpa only [z, mul_div_assoc] using hh\n  have hj := WeightedJansonInequality F a α ⟨hα.1, hαlt⟩ hne ha hDpos\n  rw [hmean, one_pow] at hj\n  apply le_trans (b := Real.exp (-(1 / D)))\n  · apply le_trans (b := Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ x : Ω, 0 \u003c a x → ¬ F x ⊆ Z))\n        (fun Z => α ^ Z.card * (1 - α) ^ (Fintype.card V - Z.card)))\n    · apply Finset.sum_le_sum_of_subset_of_nonneg\n      · intro Z hZ\n        exact Finset.mem_filter.mpr ⟨(Finset.mem_filter.mp hZ).1,\n          fun x _ => (Finset.mem_filter.mp hZ).2 x⟩\n      · intro Z _ _\n        exact mul_nonneg (pow_nonneg hα.1.le _) (pow_nonneg (sub_nonneg.mpr hα.2) _)\n    · exact hj\n  · apply Real.exp_le_exp.mpr\n    apply neg_le_neg\n    apply (le_div_iff₀ hDpos).mpr\n    have hd := (le_div_iff₀ hα.1).mp hDupper\n    rw [div_mul_eq_mul_div]\n    exact (div_le_iff₀ (mul_pos (mul_pos (by norm_num) hr) hq)).mpr (by nlinarith)","tex_statement":"\\begin{lemma}\nLet $F:\\Omega\\to2^V$ be an $r$-bounded labelled family on a finite set $V$,\nlet $\\nu$ be a probability distribution on $\\Omega$, and suppose that\n$(F,\\nu)$ is $q$-containment-spread.  Let $q>0$ and let\n$\\alpha\\in(0,1]$ satisfy $\\alpha\\ge2rq$.  If $Z$ is the binomial random\nsubset of $V$ obtained by keeping each element independently with probability\n$\\alpha$, then\n\\[\n  \\Pr(F(x)\\nsubseteq Z\\text{ for every }x\\in\\Omega)\n  \\le\n  \\exp\\left(-\\frac{\\alpha}{2rq}\\right).\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nIf some label $x$ has $F(x)=\\varnothing$, then $F(x)\\subseteq Z$ for every\noutcome $Z$, so the event that all labelled sets are missed is empty and the\nleft side is $0$.  The desired inequality is then immediate.  Hence we may\nassume from now on that every labelled set $F(x)$ is nonempty.\n\nWe next split off the endpoint $\\alpha=1$.  In that case the binomial set is\n$Z=V$ with probability $1$.  Since \\noderef{ContainmentSpread} says that\n$\\nu$ is a probability distribution, equivalently a probability mass in the\nsense of \\noderef{ProbabilityMass}, the total mass is $1$ and therefore some\nlabel has positive mass.  Its edge is a subset of $V$, so the miss event is\nagain empty.  Thus the asserted bound holds when $\\alpha=1$.  We may therefore\nassume $0\u003c\\alpha\u003c1$, which is the probability range required by\n\\noderef{WeightedJansonInequality}.\n\nFor every label put\n\\[\n  a_x=\\nu(x)\\alpha^{-|F(x)|}.\n\\]\nThe mass and nonnegativity clauses of \\noderef{ContainmentSpread}, together\nwith $\\alpha>0$, imply $a_x\\ge0$.  The associated weighted containment random\nvariable\n\\[\n  X=\\sum_{x:F(x)\\subseteq Z}a_x\n\\]\nhas expectation\n\\[\n  \\sum_x \\nu(x)\\alpha^{-|F(x)|}\\Pr(F(x)\\subseteq Z)\n  =\\sum_x\\nu(x)=1.\n\\]\nThe event that every labelled set is missed is contained in the positive-weight\nzero event $X=0$, because any contained label with $a_x>0$ contributes a\npositive summand to $X$.\n\nBefore applying \\noderef{WeightedJansonInequality}, we verify its hypothesis\n$\\Delta>0$.  Since $\\nu$ is a probability mass by\n\\noderef{ContainmentSpread} and \\noderef{ProbabilityMass}, the sum of the\nnonnegative numbers $\\nu(x)$ is $1$, so there is a label $x_0$ with\n$\\nu(x_0)>0$.  The edge $F(x_0)$ is nonempty by the standing assumption, hence\n$F(x_0)\\cap F(x_0)$ is nonempty.  The diagonal summand of $\\Delta$\ncorresponding to $(x_0,x_0)$ is\n\\[\n  a_{x_0}^2\\,\\Pr(F(x_0)\\subseteq Z)\n  =\n  \\nu(x_0)^2\\alpha^{-2|F(x_0)|}\\alpha^{|F(x_0)|}\n  =\n  \\nu(x_0)^2\\alpha^{-|F(x_0)|},\n\\]\nwhich is strictly positive because $\\nu(x_0)>0$ and $\\alpha>0$.  All other\nsummands in $\\Delta$ are nonnegative, so $\\Delta>0$.\n\nIt remains to bound the weighted Janson overlap term.  For fixed $x$ and\n$t\\ge1$, if $|F(x)\\cap F(y)|=t$, then some $t$-set $T\\subseteq F(x)$ is\ncontained in $F(y)$.  Taking the union bound over the at most\n$\\binom{|F(x)|}{t}$ possible choices of $T$ and applying\n\\noderef{ContainmentSpread} gives\n\\[\n  \\nu\\{y:|F(x)\\cap F(y)|=t\\}\\le \\binom{|F(x)|}{t}q^t .\n\\]\nFor a pair with $s=|F(x)\\cap F(y)|\\ge1$, the corresponding Janson summand is\n\\[\n  \\nu(x)\\alpha^{-|F(x)|}\\nu(y)\\alpha^{-|F(y)|}\n  \\alpha^{|F(x)\\cup F(y)|}\n  =\\nu(x)\\nu(y)\\alpha^{-s}.\n\\]\nUsing the preceding mass estimate for each fixed $x$ and then\n\\noderef{BoundedEdges}, we obtain\n\\[\n  \\Delta\n  \\le\n  \\sum_x\\nu(x)\\sum_{t=1}^{|F(x)|}\n    \\binom{|F(x)|}{t}\\left(\\frac q\\alpha\\right)^t\n  \\le\n  \\left(1+\\frac q\\alpha\\right)^r-1 .\n\\]\nThe elementary bound $(1+z)^r\\le e^{rz}$ for $z\\ge0$ gives\n\\[\n  \\Delta\\le e^{rq/\\alpha}-1.\n\\]\nSince $\\alpha\\ge2rq$, we have $rq/\\alpha\\le1/2$, and\n$e^z-1\\le2z$ for $0\\le z\\le1/2$ yields\n\\[\n  \\Delta\\le\\frac{2rq}{\\alpha}.\n\\]\nHere the denominator is positive: the positive-mass label $x_0$ has nonempty\nedge and \\noderef{BoundedEdges} gives $1\\le |F(x_0)|\\le r$, while $q>0$ and\n$\\alpha>0$.\nApplying \\noderef{WeightedJansonInequality} with parameter $\\alpha$, weights\n$a_x$, expectation $1$, and the overlap bound above gives\n\\[\n  \\Pr(F(x)\\nsubseteq Z\\text{ for every }x)\n  \\le\n  \\Pr(X=0)\n  \\le\n  \\exp\\left(-\\frac{1}{\\Delta}\\right)\n  \\le\n  \\exp\\left(-\\frac{\\alpha}{2rq}\\right),\n\\]\nwhere the last inequality follows from $0\u003c\\Delta\\le2rq/\\alpha$, positivity of\n$2rq/\\alpha$, and monotonicity of the exponential function.\nas required.\n\\end{proof}","tex_env":"lemma","semantic_closure":["BoundedEdges","ContainmentSpread","LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"ContainmentHitting":{"name":"ContainmentHitting","title":"ContainmentHitting","kind":"lemma","is_target":false,"imports":["BinomialMedianAtMean","BoundedEdges","ContainmentBinomialHitting","ContainmentBinomialToUniformTransfer","ContainmentSpread","HitProbability","ProbabilityMass","UniformExtensionCoupling","WeightedJansonInequality"],"imported_by":["IntermediateStoppingEstimate"],"lean_statement":"lemma ContainmentHitting {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (F : Ω → Finset V) (ν : Ω → ℝ) (q α : ℝ) (r m : ℕ)\n    (hbounded : BoundedEdges F r)\n    (hcontain : ContainmentSpread F ν q)\n    (hq : 0 \u003c q)\n    (hα : 0 \u003c α ∧ α ≤ 1)\n    (hlarge : 2 * (r : ℝ) * q ≤ α)\n    (hm : (m : ℝ) = α * (Fintype.card V : ℝ)) :\n    ((((Finset.univ : Finset V).powersetCard m).filter\n      (fun W : Finset V => ∀ x : Ω, ¬ F x ⊆ W)).card : ℝ) /\n      ((((Finset.univ : Finset V).powersetCard m).card : ℝ)) ≤\n      2 * Real.exp (-(α / (2 * (r : ℝ) * q))) := by","lean_proof":"refine ContainmentBinomialToUniformTransfer F α\n    (Real.exp (-(α / (2 * (r : ℝ) * q)))) m ?_ hm ?_\n  · exact ⟨le_of_lt hα.1, hα.2⟩\n  · exact ContainmentBinomialHitting F ν q α r hbounded hcontain hq hα hlarge","tex_statement":"\\begin{lemma}\nLet $F:\\Omega\\to2^V$ be an $r$-bounded labelled family on an\n$n$-element set $V$, let $\\nu$ be a probability distribution on the labels,\nand suppose that $(F,\\nu)$ is $q$-containment-spread.  Let\n$q>0$ and let $\\alpha\\in(0,1]$ satisfy $\\alpha\\ge2rq$.  If\n$W$ is chosen uniformly from $\\binom V{\\alpha n}$, then\n\\[\n    \\Pr(F(x)\\nsubseteq W\\text{ for every }x\\in\\Omega)\n    \\le\n    2\\exp\\left(-\\frac{\\alpha}{2rq}\\right).\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nIf some label has $F(x)=\\varnothing$, then every set $W$ contains $F(x)$ and\nthe miss probability is $0$, so the desired inequality is immediate.  We may\ntherefore assume that every labelled fragment is nonempty.  If\n$\\alpha=1$, then the displayed size $\\alpha n$ is $n$, so the only member of\n$\\binom V{\\alpha n}$ is $V$ itself; since every $F(x)$ is a subset of $V$, the\nmiss probability is again $0$.  Thus the only nontrivial case is\n$0\u003c\\alpha\u003c1$.\n\nLet $Z$ be the binomial random subset of $V$ obtained by including each\nvertex independently with probability $\\alpha$.  For each label $x$ define\n\\[\n    a_x=\\nu(x)\\alpha^{-|F(x)|}.\n\\]\nLet\n\\[\n    X=\\sum_{x:F(x)\\subseteq Z} a_x .\n\\]\nBecause $\\Pr(F(x)\\subseteq Z)=\\alpha^{|F(x)|}$, the expectation is\n\\[\n    \\mathbb E X\n    =\\sum_x \\nu(x)\\alpha^{-|F(x)|}\\alpha^{|F(x)|}\n    =\\sum_x\\nu(x)=1,\n\\]\nwhere the last equality is exactly the total-mass part of\n\\noderef{ContainmentSpread}.\n\nLet\n\\[\n    A=\\{F(x)\\nsubseteq Z\\text{ for every }x\\in\\Omega\\}\n\\]\nbe the event that the binomial set misses every labelled fragment, and let\n\\[\n    A_+=\\{F(x)\\nsubseteq Z\\text{ for every }x\\in\\Omega\n          \\text{ with }a_x>0\\}.\n\\]\nThen $A\\subseteq A_+$.  Since all weights are nonnegative, $X=0$ is exactly\nthe event $A_+$: if some positive-weight label is contained in $Z$, then its\npositive summand makes $X>0$, while if no positive-weight label is contained,\nall contained labels have weight $0$ and hence the sum is $0$.  Notice that\nwe do not claim $A=A_+$; a zero-mass label may be contained while $X=0$.\nThus\n\\[\n    \\Pr(A)\\le \\Pr(A_+)=\\Pr(X=0).\n\\]\n\nWe estimate the Janson overlap term.  For fixed $x$ and $t\\ge1$, if\n$|F(x)\\cap F(y)|=t$, then some $t$-subset $T\\subseteq F(x)$ is contained in\n$F(y)$.  There are at most $\\binom{|F(x)|}{t}$ choices for such a set $T$,\nand \\noderef{ContainmentSpread} gives, for each fixed $T$,\n\\[\n    \\nu\\{y:T\\subseteq F(y)\\}\\le q^t .\n\\]\nTherefore\n\\[\n    \\nu\\{y:|F(x)\\cap F(y)|=t\\}\n    \\le \\binom{|F(x)|}{t}q^t .\n\\]\nThe family is $r$-bounded by \\noderef{BoundedEdges}, so $|F(x)|\\le r$.\nConsequently the usual weighted Janson second-moment sum satisfies\n\\[\n    \\Delta\n    \\le\n    \\sum_x\\nu(x)\\sum_{t=1}^{|F(x)|}\n      \\binom{|F(x)|}{t}\\left(\\frac q\\alpha\\right)^t\n    \\le\n    \\left(1+\\frac q\\alpha\\right)^r-1\n    \\le\n    \\exp\\left(\\frac{rq}{\\alpha}\\right)-1 .\n\\]\nSince $\\alpha\\ge2rq$, we have $rq/\\alpha\\le1/2$, and the elementary\ninequality $e^z-1\\le2z$ for $0\\le z\\le1/2$ gives\n\\[\n    \\Delta\\le\\frac{2rq}{\\alpha}.\n\\]\nWe now apply \\noderef{WeightedJansonInequality}.  Its Bernoulli parameter\nhypothesis is satisfied by the nontrivial-case reduction\n$0\u003c\\alpha\u003c1$.  Its labelled sets are the nonempty fragments $F(x)$, and its weights\nare the nonnegative numbers $a_x=\\nu(x)\\alpha^{-|F(x)|}$, nonnegative because\n$\\nu$ is a probability mass by \\noderef{ContainmentSpread} and\n$\\alpha^{-|F(x)|}>0$.  The random variable $X$ is exactly the weighted sum\nrequired in that node.  The overlap term $\\Delta$ is the one estimated above:\nwhen $s=|F(x)\\cap F(y)|\\ge1$, the summand is\n\\[\n    \\nu(x)\\alpha^{-|F(x)|}\\nu(y)\\alpha^{-|F(y)|}\n    \\alpha^{|F(x)\\cup F(y)|}\n    =\n    \\nu(x)\\nu(y)\\alpha^{-s}.\n\\]\nMoreover $\\Delta>0$ in the remaining nonempty positive-mass case, since\nthere is some label $x$ with $\\nu(x)>0$, the diagonal pair $(x,x)$ has\n$F(x)\\cap F(x)\\ne\\varnothing$, and its contribution is\n$\\nu(x)^2\\alpha^{-|F(x)|}>0$.  Therefore\n\\noderef{WeightedJansonInequality}, together with $\\mathbb E X=1$ and\n$\\Delta\\le2rq/\\alpha$, yields\n\\[\n    \\Pr(F(x)\\nsubseteq Z\\text{ for every }x)\n    \\le\n    \\Pr(X=0)\n    \\le\n    \\exp\\left(-\\frac{\\alpha}{2rq}\\right).\n\\]\n\nFinally pass from the binomial set $Z$ to a uniform set of size $\\alpha n$.\nBy the paper's standing random-set-size convention, the displayed size\n$\\alpha n$ is an integer.  The random variable $|Z|$ is the size of a\nbinomial random subset with retention probability $\\alpha$, and its mean is\n$\\alpha n=m$.  Since $0\u003c\\alpha\u003c1$, the hypotheses of\n\\noderef{BinomialMedianAtMean} hold, so\n\\[\n    \\Pr(|Z|\\le m)\\ge\\frac12 .\n\\]\nLet $B=\\{|Z|\\le m\\}$, and let $\\mu_B$ be the law of $Z$ conditioned on $B$:\n\\[\n    \\mu_B(U)=\\Pr(Z=U\\mid B).\n\\]\nThis is a probability mass by the definition in \\noderef{ProbabilityMass},\nbecause it is obtained by restricting a probability mass to an event of\npositive probability and renormalizing by $\\Pr(B)$.  The original binomial\nlaw is invariant under every permutation of $V$, since it assigns to a set\n$U$ the probability\n\\[\n    \\alpha^{|U|}(1-\\alpha)^{|V|-|U|},\n\\]\nwhich depends only on $|U|$.  The conditioning event $B$ also depends only on\n$|U|$.  Hence the conditioned law $\\mu_B$ is permutation-invariant.  It is\nsupported on subsets of size at most $m$ by definition of $B$, and\n$m\\le |V|$ because $\\alpha\\le1$ and $m=\\alpha n$.\n\nApply \\noderef{UniformExtensionCoupling} to $\\mu_B$.  We obtain a joint\nprobability mass on pairs $(U,W)$ such that the first marginal is the\nconditioned law of $Z$, the second marginal is uniform on the $m$-subsets of\n$V$, and positive mass occurs only when $U\\subseteq W$.  On every coupled\npair with $U\\subseteq W$, if $W$ misses every fragment, then $U$ also misses\nevery fragment: indeed $F(x)\\subseteq U$ and $U\\subseteq W$ would imply\n$F(x)\\subseteq W$.  Therefore, under this coupling,\n\\[\n    \\{F(x)\\nsubseteq W\\text{ for every }x\\}\n    \\subseteq\n    \\{F(x)\\nsubseteq U\\text{ for every }x\\}.\n\\]\nUsing the two marginal identities from \\noderef{UniformExtensionCoupling},\nthe left-hand probability is the miss probability for a uniform $m$-set, and\nthe right-hand probability is the conditional binomial miss probability\n$\\Pr(A\\mid B)$.  Thus\n\\[\n    \\Pr(F(x)\\nsubseteq W\\text{ for every }x)\n    \\le \\Pr(A\\mid B)\n    =\\frac{\\Pr(A\\cap B)}{\\Pr(B)}\n    \\le \\frac{\\Pr(A)}{\\Pr(B)}\n    \\le 2\\Pr(A).\n\\]\nSubstituting the binomial miss bound for $\\Pr(A)$ gives\n\\[\n    \\Pr(F(x)\\nsubseteq W\\text{ for every }x)\n    \\le\n    2\\exp\\left(-\\frac{\\alpha}{2rq}\\right),\n\\]\nas claimed.\n\\end{proof}","tex_env":"lemma","semantic_closure":["BoundedEdges","ContainmentSpread","LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"IntermediateStoppingEstimate":{"name":"IntermediateStoppingEstimate","title":"IntermediateStoppingEstimate","kind":"lemma","is_target":false,"imports":["AuxiliaryRandomSetSizeConvention","ContainmentHitting","ContainmentSpread","DistributionalSmootherSpread","FiniteFirstFailureBound","FragmentFiltration","HitProbability","LargestEdgeScale","ProbabilityMass","RoundedSpiroSampleSizes","SampledUnionHittingTransfer","SpiroGoodHistoryEstimate","StageSuccessEstimate","SurvivorMassDomination","UniformEdges","UniformExtensionCoupling"],"imported_by":["SpiroTheorem27"],"lean_statement":"lemma IntermediateStoppingEstimate {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq Ω] [DecidableEq V]\n    (E : Ω → Finset V) (μ : Ω → ℝ) (q C : ℝ) (r : ℕ → ℕ)\n    (ℓ m : ℕ)\n    (hunif : UniformEdges E (r 0))\n    (hspread : DistributionalSmootherSpread E μ q r (ℓ + 1))\n    (hcontain : ContainmentSpread E μ q)\n    (hC : 8 ≤ C)\n    (hlast : 0 \u003c ℓ ∧ r ℓ = 1)\n    (hm_le : m ≤ Fintype.card V)\n    (hm : (m : ℝ) = 2 * C * (ℓ : ℝ) * q * (Fintype.card V : ℝ)) :\n    ∀ i : ℕ, i \u003c ℓ → 4 * (r i : ℝ) ≤ C * (ℓ : ℝ) →\n      1 - 6 * (ℓ : ℝ) ^ 2 * (C / 4) ^ (-(r i : ℝ) / 2)\n        - 2 * Real.exp (-(C * (ℓ : ℝ)) / (4 * (r i : ℝ)))\n        ≤ HitProbability E m := by","lean_proof":"classical\n  intro i hi hstop\n  let n := Fintype.card V\n  let a := C * q * (n : ℝ)\n  let k := Nat.ceil a\n  let t := Nat.ceil ((ℓ : ℝ) * a)\n  obtain ⟨hn, hrzero, ha, hℓa, hkpos, htpos, hak, hat, htn, hbudget, hstage⟩ :=\n    RoundedSpiroSampleSizes E μ q C r ℓ m hunif hspread hC hlast hm_le hm\n  change 0 \u003c n at hn\n  change 0 \u003c k at hkpos\n  change 0 \u003c t at htpos\n  change a ≤ (k : ℝ) at hak\n  change (ℓ : ℝ) * a ≤ (t : ℝ) at hat\n  change t ≤ n at htn\n  change (ℓ - 1) * k + t ≤ m at hbudget\n  change 2 ≤ ℓ → (k : ℝ) ≤ (n : ℝ) / 2 ∧ 2 * r 0 ≤ k at hstage\n  have hnR : (0 : ℝ) \u003c n := by exact_mod_cast hn\n  have hq : 0 \u003c q := hspread.1\n  have hk : k ≤ n := by\n    by_cases htwo : 2 ≤ ℓ\n    · have hh := (hstage htwo).1\n      have : (k : ℝ) ≤ n := by linarith\n      exact_mod_cast this\n    · have he : ℓ = 1 := by omega\n      have hkt : k = t := by simp [k, t, he]\n      exact hkt ▸ htn\n  have hibudget : i * k + t ≤ m :=\n    (Nat.add_le_add_right (Nat.mul_le_mul_right k (by omega : i ≤ ℓ - 1)) t).trans\n      hbudget\n  have hdec : ∀ j, j \u003c ℓ → r (j + 1) \u003c r j :=\n    fun j hj => hspread.2.2.2.2.2.1 j (by omega)\n  have hmono (b j : ℕ) (hbj : b ≤ j) (hj : j ≤ ℓ) : r j ≤ r b := by\n    induction j with\n    | zero =>\n      have hb : b = 0 := by omega\n      subst b\n      exact le_rfl\n    | succ j ih =>\n      by_cases hb : b = j + 1\n      · subst b; exact le_rfl\n      · exact (hdec j (by omega)).le.trans (ih (by omega) (by omega))\n  have hrpos (j : ℕ) (hj : j \u003c ℓ) : 1 \u003c r j := by\n    have hh := hmono (j + 1) ℓ (by omega) le_rfl\n    rw [hlast.2] at hh\n    exact hh.trans_lt (hdec j hj)\n  obtain ⟨Surv, F, κ, hinit, hsub, hanchor, hcard, hcover, hstep⟩ :=\n    FragmentFiltration E r ℓ hunif hlast.1 hrpos\n      (fun j hj => hdec j (by omega))\n  obtain ⟨Good, hgoodzero, hgoodstep, hstate, hfailure⟩ :=\n    SpiroGoodHistoryEstimate E μ q C r ℓ i k hspread hC hlast.1 hi hn hkpos hk\n      hak (fun hip => hstage (by omega))\n      Surv F (fun x => (hinit x).1) hsub hanchor hcard hstep\n  let H := Fin i → {W : Finset V // W.card = k}\n  let L := fun h : H => (List.ofFn (fun j => (h j).val)).reverse\n  have hlength (h : H) : (L h).length = i := by simp [L]\n  let α : ℝ := (t : ℝ) / (n : ℝ)\n  have hαpos : 0 \u003c α := div_pos (by exact_mod_cast htpos) hnR\n  have hαle : α ≤ 1 := (div_le_one hnR).2 (by exact_mod_cast htn)\n  have hαn : α * (n : ℝ) = (t : ℝ) := by\n    dsimp [α]\n    exact div_mul_cancel₀ _ hnR.ne'\n  have hαlower : C * (ℓ : ℝ) * q ≤ α := by\n    apply (le_div_iff₀ hnR).2\n    dsimp [a] at hat\n    nlinarith [hat]\n  have hαlarge : 2 * (r i : ℝ) * (2 * q) ≤ α := by\n    have hh := mul_le_mul_of_nonneg_right hstop hspread.1.le\n    nlinarith\n  let δ : ℝ := 6 * (ℓ : ℝ) ^ 2 * (C / 4) ^ (-(r i : ℝ) / 2)\n  let η : ℝ := 2 * Real.exp (-(C * (ℓ : ℝ)) / (4 * (r i : ℝ)))\n  have hη : 0 ≤ η := by dsimp [η]; positivity\n  -- Express uniform-subset probabilities in the subtype sample space.\n  have hmass (b : ℕ) (P : Finset V → Prop) :\n      @LabelMass {Z : Finset V // Z.card = b} _\n        (fun _ => (Fintype.card {Z : Finset V // Z.card = b} : ℝ)⁻¹)\n        (fun Z => P Z.val) (Classical.decPred _) =\n        ((((Finset.univ : Finset V).powersetCard b).filter P).card : ℝ) /\n          (((Finset.univ : Finset V).powersetCard b).card : ℝ) := by\n    have hsum (f : Finset V → ℝ) :\n        (∑ Z : {Z : Finset V // Z.card = b}, f Z.val) =\n          ∑ Z ∈ (Finset.univ : Finset V).powersetCard b, f Z := by\n      exact (Finset.sum_subtype _ (by simp) _).symm\n    have hcount : Fintype.card {Z : Finset V // Z.card = b} =\n        ((Finset.univ : Finset V).powersetCard b).card := by\n      have hh := hsum (fun _ => 1)\n      simpa using hh\n    simp only [LabelMass, Finset.sum_filter, hcount]\n    rw [hsum (fun Z => if P Z then\n      (((Finset.univ : Finset V).powersetCard b).card : ℝ)⁻¹ else 0),\n      ← Finset.sum_filter]\n    simp [div_eq_mul_inv]\n  let HitFrag := fun (h : H) (Z : {Z : Finset V // Z.card = t}) =>\n    ∃ x, Surv (L h) x ∧ F (L h) x ⊆ Z.val\n  have hterminal_bound : ∀ h : H, Good i h →\n      @LabelMass {Z : Finset V // Z.card = t} _\n        (fun _ => (Fintype.card {Z : Finset V // Z.card = t} : ℝ)⁻¹)\n        (fun Z => ¬ HitFrag h Z) (Classical.decPred _) ≤ η := by\n    intro h hh\n    let S := Surv (L h)\n    let M := LabelMass μ S\n    let ν := fun x => if S x then μ x / M else 0\n    have hνstate := (hstate i le_rfl h hh).2.2\n    change ProbabilityMass ν ∧ (∀ x, ¬ S x → ν x = 0) ∧\n      ∀ x, ν x ≤ 2 * μ x at hνstate\n    obtain ⟨hνprob, hνsupp, hνdom⟩ := hνstate\n    let A := {x : Ω // S x}\n    let f : A 4r_i\\le C\\ell$, and write $n=|V|$, $a=Cqn$.\nThe hypotheses on the probability mass, uniform edges, decreasing scales,\n$C$, and final cardinality satisfy \\noderef{RoundedSpiroSampleSizes}.\nThus for $k=\\lceil a\\rceil$ and $t=\\lceil\\ell a\\rceil$ one has\n\\[\n n>0,\\quad r_0\\ge\\ell+1,\\quad a>2r_0\\ge\\ell,\\quad k,t>0,\\quad\n k\\ge a,\\quad t\\ge\\ell a,\\quad t\\le n,\\quad(\\ell-1)k+t\\le m.\n\\]\nIf $\\ell\\ge2$, also $k\\le n/2$ and $k\\ge2r_0$.\nIf $\\ell=1$, $k=t\\le n$. In either case $k,t\\le n$, and\n$ik+t\\le(\\ell-1)k+t\\le m\\le n$.\n\nTake independent uniform $k$-subsets $W_0,\\ldots,W_{i-1}$ and an\nindependent uniform $t$-subset $Z$. Use the jointly defined, history-indexed\nstates of \\noderef{FragmentFiltration}, evaluated at\n$L_j=[W_{j-1},\\ldots,W_0]$, and denote them by $S_j,F_j,\\kappa_j$.\nIts hypotheses hold since the decreasing scales ending at $r_\\ell=1$\ngive $r_j>1$ for $j\u003c\\ell$. In particular $S_0=\\Omega$, the survivor\nsets decrease, fragments at level $j$ have size $r_j$ and lie inside\n$E(x)$, and\n\\[\n E(\\kappa_j(x))\\subseteq F_j(x)\\cup\\bigcup_{h\u003cj}W_h\n \\quad (x\\in S_j).\n\\]\nThe survivor iff in that node defines $S_{j+1}$ by\n$r_{j+1}$-goodness in $F_j(S_j)$, and every state is determined by\nthe prefix already exposed.\n\nWrite $M_j=\\sum_{x\\in S_j}\\mu(x)$ and call transition $j$ successful\nif $\\sum_{S_j\\setminus S_{j+1}}\\mu\\le M_j/(2\\ell)$.\nA good prefix has all transitions successful. For any good prefix of\nlength $j\\le i$, \\noderef{SurvivorMassDomination} gives\n\\[\n M_j\\ge1-j/(2\\ell)\\ge1/2\n\\]\nand states that $\\nu_j(x)=\\mathbf1_{S_j}(x)\\mu(x)/M_j$ is a probability\nmass supported on $S_j$ with $\\nu_j\\le2\\mu$.\nFor an actual transition $j\u003ci$, one necessarily has $\\ell\\ge2$.\nPut $p'=k/n$ and $C'=k/(qn)$. Positivity of $q$ from\n\\noderef{DistributionalSmootherSpread} gives\n\\[\n C'\\ge C\\ge8,\\qquad p'=C'q\\in(0,1/2],\\qquad\n k=p'n,\\qquad k\\ge2r_0\\ge2r_j.\n\\]\nFor each fixed good prefix, the next sample is still uniform in\n$\\binom Vk$ because the states are causal functions of the prefix.\nThe support, domination, cardinality, and anchor conditions therefore\nallow \\noderef{StageExpectedBadMass} to bound the expected\n$\\nu_j$-mass of $r_{j+1}$-bad labels by $3(C'/4)^{-r_{j+1}/2}$.\nApplying \\noderef{FiniteUniformMarkov} with threshold $1/(2\\ell)$ gives\nfailure probability at most $6\\ell(C'/4)^{-r_{j+1}/2}$.\nIndeed the survivor equivalence makes that bad mass exactly\n$\\sum_{S_j\\setminus S_{j+1}}\\mu/M_j$, and $M_j>0$ makes the threshold\nequivalent to failure of the success inequality.\nSince the exponent is negative and $C'\\ge C>0$, this is at most\n$6\\ell(C/4)^{-r_{j+1}/2}$.\nNo inequality $2\\ell k\\le n$ is used.\n\nApply \\noderef{FiniteFirstFailureBound} to the good-prefix predicates\non the nonempty alphabet $\\binom Vk$. Summing the local bounds yields\n\\[\n \\Pr(\\text{bad length-}i\\text{ history})\n \\le\\sum_{j\u003ci}6\\ell(C/4)^{-r_{j+1}/2}\n \\le6\\ell^2(C/4)^{-r_i/2}=:\\Delta_i.\n\\]\nFor the last inequality, $r_{j+1}\\ge r_i$, $C/4\\ge2$, and $i\\le\\ell$.\nIf $i=0$, there is only the empty history, no transitions, and no failure;\nthe empty sum is zero and the weaker bound by $\\Delta_i\\ge0$ holds.\nThis also covers the only possible stop when $\\ell=1$.\n\nFix a good length-$i$ history. Its survivor mass is at least $1/2$.\nRestrict $\\nu_i$ to the label space $S_i$ and restrict $F_i$ likewise.\nFor every nonempty $T\\subseteq V$, the anchor property and\n\\noderef{ContainmentSpread} imply\n\\[\n \\begin{split}\n \\nu_i\\{x\\in S_i:T\\subseteq F_i(x)\\}\n &\\le2\\mu\\{x\\in S_i:T\\subseteq E(x)\\}\\\\\n &\\le2\\mu\\{x:T\\subseteq E(x)\\}\n \\le2q^{|T|}\\le(2q)^{|T|}.\n \\end{split}\n\\]\nThe first two inequalities follow by summing nonnegative weights, using\n\\noderef{LabelMass} and \\noderef{ProbabilityMass}. The last follows from\n$|T|\\ge1$, since $2\\le2^{|T|}$ and $q^{|T|}\\ge0$.\nFor $T=\\varnothing$, use normalization instead: the mass is exactly one,\nequal to $(2q)^0$. Thus the restricted fragment family is\n$2q$-containment-spread and $r_i$-bounded.\n\nPut $\\alpha'=t/n$. Then $t=\\alpha'n$ and\n\\[\n 0\u003c\\alpha'\\le1,\\qquad\n \\alpha'\\ge\\ell Cq\\ge4r_iq=2r_i(2q).\n\\]\nThe second inequality uses $4r_i\\le C\\ell$ and $q>0$.\nApply \\noderef{ContainmentHitting} to this restricted family, containment\nparameter $2q>0$, density $\\alpha'$, and cardinality $t$. It gives\n\\[\n \\Pr_Z(F_i(x)\\nsubseteq Z\\text{ for every }x\\in S_i)\n \\le2\\exp\\!\\left(-\\frac{\\alpha'}{4r_iq}\\right)\n \\le2\\exp\\!\\left(-\\frac{C\\ell}{4r_i}\\right)=:\\eta_i.\n\\]\nHere $r_i>0$, so $4r_iq>0$; divide $\\alpha'\\ge C\\ell q$ by this\npositive denominator and use monotonicity of the exponential.\nThis is a bound for every fixed good history. Also $\\eta_i\\ge0$.\n\nIf $Z$ contains $F_i(x)$ for a surviving $x$, the coverage invariant gives\n$E(\\kappa_i(x))\\subseteq Z\\cup\\bigcup_{j\u003ci}W_j$.\nAll assumptions of \\noderef{SampledUnionHittingTransfer} now hold, with\n$d=i$, stage error $\\Delta_i$, terminal error $\\eta_i$, and budget\n$ik+t\\le m$. That theorem constructs the unconditional law of the union,\nproves its normalization, size bound, and permutation invariance, and uses\n\\noderef{UniformExtensionCoupling} to couple it below a uniform\n$m$-subset. It does not condition that law on success or require\npermutation invariance of fragment choices. It concludes\n$\\operatorname{HitProbability}(E,m)\\ge1-\\Delta_i-\\eta_i$.\nBy \\noderef{HitProbability} this is the claimed hitting bound, without\nenlarging $m$ or assuming auxiliary integrality.\n\\end{proof}","tex_env":"lemma","semantic_closure":["BoundedEdges","ContainmentSpread","DistributionalSmootherSpread","HitProbability","LabelMass","ProbabilityMass","UniformEdges"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstanti 0$-uniform\n$(q;r_0,\\dots,r_{\\ell-1},1)$-Spiro-spread labelled hypergraph, and let\n$C\\ge8$.  Let $m\\le |V|$ be an integer satisfying $m=2C\\ell q|V|$.\nIf $W$ is a uniformly chosen $m$-subset of $V$, then\n\\[\n    \\Pr(W\\text{ contains an edge of }E)\n    \\ge\n    1-6\\ell^2\\left(\\frac C4\\right)^{-r_{\\ell-1}/2}\n      -\\frac{40}{C\\ell}.\n\\]\nMoreover, for every integer $i$ with $0\\le i\u003c\\ell$ such that\n$4r_i\\le C\\ell$,\n\\[\n    \\Pr(W\\text{ contains an edge of }E)\n    \\ge\n    1-6\\ell^2\\left(\\frac C4\\right)^{-r_i/2}\n      -2\\exp\\left(-\\frac{C\\ell}{4r_i}\\right).\n\\]\n\\end{theorem}","tex_proof":"\\begin{proof}\nLet $\\mu$ be the uniform probability distribution on the finite nonempty\nlabel set $\\Omega$.  Applying \\noderef{SpiroToDistributionalSpread} to the\nSpiro-spread labelled hypergraph gives three statement-level facts about this\nsame distribution.  First, $\\mu$ is\n$(q;r_0,\\ldots,r_{\\ell-1},1)$-spread in the sense required by the\nstrengthened theorem.  Second, because the final two scales are\n$r_{\\ell-1}$ and $1$, $\\mu$ is $(q,1;r_{\\ell-1},1)$-spread.  Third, because\nthere is a genuine final interval ending at $1$, the pair $(E,\\mu)$ is\n$q$-containment-spread.\n\nWe prove the terminal bound first.  The hypotheses of\n\\noderef{StrongSpiroTheorem} are now exactly present with $\\gamma=1$: the\nuniformity of $E$ is part of the current theorem statement, the distributional\nand terminal spread hypotheses are the first two consequences of\n\\noderef{SpiroToDistributionalSpread}, the assumptions $C\\ge8$, $\\ell>0$,\n$r_\\ell=1$, $m\\le |V|$, and $m=2C\\ell q|V|$ are the remaining hypotheses, and\n$0\u003c1\\le1$.  Hence\n\\[\n    \\Pr(W\\text{ contains an edge of }E)\n    \\ge\n    1-6\\ell^2\\left(\\frac C4\\right)^{-r_{\\ell-1}/2}\n      -2\\exp\\left(-\\frac{\\ell Cq|V|}{4}\\right)\n      -\\frac{8}{C\\ell}.\n\\]\nIt remains only to absorb the exponential error into the displayed\n$40/(C\\ell)$ term.\n\nBy \\noderef{LargestEdgeScale}, applied to the uniform distribution $\\mu$ and\nto the profile bound on the whole edge $E(x)$ supplied by\n\\noderef{SpiroToDistributionalSpread}, we have\n\\[\n    r_0\\le e q|V|.\n\\]\nSince the scale sequence is positive, $r_0\\ge1$, so\n$q|V|\\ge 1/e$.  Using the elementary estimate $e\u003c3$ in the weaker form\n$1/e>1/3$, we get $q|V|>1/3$.  Put\n$x=\\ell Cq|V|/4$.  The parameters are positive, so $x>0$, and the elementary\ncalculus inequality $\\exp(-x)\\le 1/x$ gives\n\\[\n    2\\exp\\left(-\\frac{\\ell Cq|V|}{4}\\right)\n    \\le\n    \\frac{8}{C\\ell q|V|}\n    \\le\n    \\frac{24}{C\\ell}.\n\\]\nTherefore the two final error terms in the previous lower bound have total\nsize at most\n\\[\n    \\frac{24}{C\\ell}+\\frac{8}{C\\ell}\n    =\n    \\frac{32}{C\\ell}\n    \\le\n    \\frac{40}{C\\ell}.\n\\]\nSubstituting this weaker error bound proves the first conclusion.\n\nNow fix an index $i$ with $0\\le i\u003c\\ell$ and $4r_i\\le C\\ell$.  The third\nconsequence of \\noderef{SpiroToDistributionalSpread} gives the original\ncontainment-spread estimate for the uniform label distribution.  Thus all\nhypotheses of \\noderef{IntermediateStoppingEstimate} are satisfied: the\nuniformity, distributional spread, containment spread, numerical assumptions\non $C$, the final scale condition, and the displayed size and feasibility of\n$m$ are exactly the hypotheses already listed above.  Applying that lemma at\nthe chosen index gives\n\\[\n    \\Pr(W\\text{ contains an edge of }E)\n    \\ge\n    1-6\\ell^2\\left(\\frac C4\\right)^{-r_i/2}\n      -2\\exp\\left(-\\frac{C\\ell}{4r_i}\\right).\n\\]\nSince the index $i$ was arbitrary subject to $i\u003c\\ell$ and $4r_i\\le C\\ell$,\nthis proves the entire ``moreover'' conclusion.\n\\end{proof}","tex_env":"theorem","semantic_closure":["BoundedEdges","HitProbability","MAtLeastCount","SpiroSpread","UniformEdges"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""}},"provenance":{"project":"strong-spiro-theorem","cycle":117,"phase":"Complete","reported_closed_nodes":82,"proof_nodes":67,"definition_nodes":14,"preamble_nodes":1,"exported_at":"2026-10-20T17:21:54.269Z","snapshot_sha256":"1a29d60e63f078fd0a3abcfbfeb58ea64a1713abe2017e97b6b7ab2f7fee3966","method":"Lean/TeX panels and semantic-closure links exported from the completed live tablet viewer","validation":"All 82 nodes report closed; all 81 ordinary source panels and their semantic closures are present; no sorry, admit, or sorryAx tokens; dependency references resolve and the import graph is acyclic.","scope":"A static reading snapshot, not a standalone Lake checkout. The live viewer does not expose Preamble source, Lake/toolchain files, the final Git revision, or target axiom probes; those are not reconstructed or claimed here."}}</script>
<script>

let tablet = null;
let nodeNames = [];
let activeNode = "";
const BUILD_INFO_ROUTE = "build-info";

const $ = (id) => document.getElementById(id);

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function nodeExists(name) {
  return tablet && tablet.nodes && Object.prototype.hasOwnProperty.call(tablet.nodes, name);
}

function nodeHref(name) {
  return `#${encodeURIComponent(name)}`;
}

function kindBadge(kind) {
  return `<span class="badge">${escapeHtml(kind || "node")}</span>`;
}

function nodeLink(name, extraClass = "") {
  const node = tablet.nodes[name];
  const active = name === activeNode ? " active" : "";
  return `<a class="node-link${active} ${extraClass}" href="${nodeHref(name)}"><span class="node-name">${escapeHtml(name)}</span>${kindBadge(node ? node.kind : "")}</a>`;
}

function compactNodeAnchor(name) {
  const active = name === activeNode ? " active" : "";
  return `<a class="${active}" href="${nodeHref(name)}">${escapeHtml(name)}</a>`;
}

function renderNodeReferences(escaped) {
  return escaped.replace(/\\noderef\{([A-Za-z0-9_']+)\}/g, (_m, name) => {
    if (!nodeExists(name)) return `<span class="missing-ref">${escapeHtml(name)}</span>`;
    return `<a class="node-ref" href="${nodeHref(name)}">${escapeHtml(name)}</a>`;
  });
}

function stripOuterEnv(raw) {
  const text = String(raw || "").trim();
  const match = text.match(/^\\begin\{([A-Za-z*]+)\}(?:\[[^\]]*\])?([\s\S]*)\\end\{\1\}$/);
  if (!match) return { env: "", body: text };
  return { env: match[1], body: match[2].trim() };
}

function stripLatexLabels(text) {
  return String(text || "").replace(/\\label\{[^{}]*\}/g, "");
}

function renderTextChunk(text) {
  const tokens = [];
  const protect = (html) => {
    const key = `%%TRELLIS_HTML_TOKEN_${tokens.length}%%`;
    tokens.push(html);
    return key;
  };
  let source = stripLatexLabels(text);
  source = source
    .replace(/\\noderef\{([A-Za-z0-9_']+)\}/g, (_m, name) => {
      if (!nodeExists(name)) return protect(`<span class="missing-ref">${escapeHtml(name)}</span>`);
      return protect(`<a class="node-ref" href="${nodeHref(name)}">${escapeHtml(name)}</a>`);
    })
    .replace(/\\(?:emph|textit)\{([^{}]*)\}/g, (_m, inner) => protect(`<em>${escapeHtml(inner)}</em>`))
    .replace(/\\textbf\{([^{}]*)\}/g, (_m, inner) => protect(`<strong>${escapeHtml(inner)}</strong>`))
    .replace(/\\'([A-Za-z])/g, (_m, letter) => {
      const accents = {
        a: "&aacute;", e: "&eacute;", i: "&iacute;", o: "&oacute;", u: "&uacute;", y: "&yacute;",
        A: "&Aacute;", E: "&Eacute;", I: "&Iacute;", O: "&Oacute;", U: "&Uacute;", Y: "&Yacute;"
      };
      return protect(accents[letter] || escapeHtml(letter));
    })
    .replace(/``/g, '"')
    .replace(/''/g, '"')
    .replace(/\\([%&_#$])/g, "$1")
    .replace(/~/g, " ");
  let escaped = escapeHtml(source);
  tokens.forEach((html, index) => {
    escaped = escaped.replaceAll(`%%TRELLIS_HTML_TOKEN_${index}%%`, html);
  });
  return escaped;
}

function renderInlineTexContent(text) {
  const parts = String(text || "").split(/(\\\([\s\S]*?\\\))/g);
  return parts.map((part) => {
    if (!part) return "";
    if (part.startsWith("\\(") && part.endsWith("\\)")) {
      return escapeHtml(part);
    }
    const collapsed = part.replace(/\s*\n\s*/g, " ");
    return renderTextChunk(collapsed);
  }).join("");
}

function normalizeDisplayMath(text) {
  return stripLatexLabels(text).replace(
    /(\\begin\{aligned\})([\s\S]*?)(\\tag\{[^}]+\})(\s*\\end\{aligned\})/g,
    (_match, begin, body, tag, end) => `${begin}${body}${end}${tag}`
  );
}

function renderTexParagraphs(body) {
  const parts = String(body || "").split(/(\\\[[\s\S]*?\\\])/g);
  return parts.map((part) => {
    if (!part || !part.trim()) return "";
    if (part.startsWith("\\[") && part.endsWith("\\]")) {
      return `<div class="math-block">${escapeHtml(normalizeDisplayMath(part))}</div>`;
    }
    return part
      .split(/\n\s*\n/g)
      .map((paragraph) => paragraph.trim())
      .filter(Boolean)
      .map((paragraph) => `<p>${renderInlineTexContent(paragraph)}</p>`)
      .join("");
  }).join("");
}

function splitLatexItems(body) {
  const matches = Array.from(String(body || "").matchAll(/\\item(?:\[[^\]]*\])?/g));
  if (!matches.length) return [];
  return matches.map((match, index) => {
    const start = match.index + match[0].length;
    const end = index + 1 < matches.length ? matches[index + 1].index : body.length;
    return body.slice(start, end).trim();
  }).filter(Boolean);
}

function renderLatexList(env, body) {
  const tag = env === "enumerate" ? "ol" : "ul";
  const items = splitLatexItems(body);
  if (!items.length) return renderTexParagraphs(body);
  return `<${tag} class="latex-list">${items.map((item) => `<li>${renderTexBody(item)}</li>`).join("")}</${tag}>`;
}

function renderTexBody(body) {
  const text = stripLatexLabels(body);
  const pattern = /\\begin\{(enumerate|itemize)\}(?:\[[^\]]*\])?([\s\S]*?)\\end\{\1\}/g;
  let html = "";
  let lastIndex = 0;
  let match = null;
  while ((match = pattern.exec(text)) !== null) {
    html += renderTexParagraphs(text.slice(lastIndex, match.index));
    html += renderLatexList(match[1], match[2]);
    lastIndex = match.index + match[0].length;
  }
  html += renderTexParagraphs(text.slice(lastIndex));
  return html;
}

function renderTex(raw) {
  if (!raw || !raw.trim()) return `<div class="empty">No TeX content.</div>`;
  const { env, body } = stripOuterEnv(raw);
  const rendered = renderTexBody(body);
  const title = env ? `<div class="tex-env-title">${escapeHtml(env[0].toUpperCase() + env.slice(1))}</div>` : "";
  return `<div class="tex-render">${title}<div class="tex-body">${rendered || renderInlineTexContent(body)}</div></div>`;
}

// Matches one Lean identifier, including namespace dots and the unicode
// letters/digits/subscripts Lean allows, so a linkable ASCII node name is
// never matched as a mere prefix of a longer identifier (e.g. `Hole₁`).
const LEAN_IDENT_RE = /[\p{L}_][\p{L}\p{N}_']*(?:\.[\p{L}_][\p{L}\p{N}_']*)*/gu;

// Linkify node names in raw (unescaped) Lean text. Working on the raw text
// and escaping segment-by-segment sidesteps the escapeHtml quirk that a
// prime in an identifier becomes `&#39;` in escaped text. Only whole
// identifier tokens (or the leading segment of a dotted token, for
// references like `NodeName.aux`) are linked, so node names that are
// prefixes of other names never match inside them.
function linkifyLean(raw, linkNames) {
  const text = String(raw);
  let html = "";
  let last = 0;
  for (const match of text.matchAll(LEAN_IDENT_RE)) {
    const token = match[0];
    html += escapeHtml(text.slice(last, match.index));
    last = match.index + token.length;
    let target = "";
    if (linkNames.has(token)) {
      target = token;
    } else {
      const head = token.split(".", 1)[0];
      if (head !== token && linkNames.has(head)) target = head;
    }
    if (target) {
      const rest = token.slice(target.length);
      html += `<a class="lean-ref" href="${nodeHref(target)}">${escapeHtml(target)}</a>${escapeHtml(rest)}`;
    } else {
      html += escapeHtml(token);
    }
  }
  html += escapeHtml(text.slice(last));
  return html;
}

// `linkNames` (a Set of node names) is only passed for node Lean content
// (statements/proofs); #print axioms output, stderr, and build-info TOML
// call this without it and stay unlinkified.
function renderLean(raw, linkNames) {
  if (!raw || !raw.trim()) return `<div class="empty">No Lean content.</div>`;
  const body = linkNames && linkNames.size
    ? linkifyLean(raw, linkNames)
    : escapeHtml(raw);
  return `<pre><code>${body}</code></pre>`;
}

// Long pill rows (a heavily-used lemma is imported by hundreds of nodes)
// collapse behind a "+N more" toggle so the page head stays readable.
const PILL_LIMIT = 24;

function pillRow(labelHtml, pills) {
  if (!pills.length) return "";
  const head = pills.slice(0, PILL_LIMIT).join("");
  const rest = pills.slice(PILL_LIMIT);
  const restHtml = rest.length
    ? `<span class="pill-rest" hidden>${rest.join("")}</span><button type="button" class="pill pill-more">+${rest.length} more</button>`
    : "";
  return `<div class="links-row">${labelHtml}${head}${restHtml}</div>`;
}

function nodePillAnchors(names) {
  return (names || []).filter(nodeExists).map((name) => `<a class="pill" href="${nodeHref(name)}">${escapeHtml(name)}</a>`);
}

function renderLinks(label, names) {
  const pills = nodePillAnchors(names);
  if (!pills.length) return "";
  return pillRow(`<span class="pill pill-label">${escapeHtml(label)}</span>`, pills);
}

function renderNodePills(names) {
  return pillRow("", nodePillAnchors(names));
}

function renderTextPills(names) {
  const filtered = (names || []).filter(Boolean);
  if (!filtered.length) return "";
  return `<div class="links-row">${filtered.map((name) => `<span class="pill">${escapeHtml(name)}</span>`).join("")}</div>`;
}

function mathlibDocsUrl(moduleName) {
  return `https://leanprover-community.github.io/mathlib4_docs/${encodeURIComponent(moduleName).replaceAll(".", "/")}.html`;
}

function renderMathlibPills(names) {
  const pills = (names || []).filter(Boolean).map((name) => `<a class="pill" href="${mathlibDocsUrl(name)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`);
  return pillRow("", pills);
}

function renderInfoTable(rows) {
  const body = rows
    .filter((row) => row && row.length === 2)
    .map(([label, value]) => `<tr><th>${escapeHtml(label)}</th><td>${value}</td></tr>`)
    .join("");
  return `<table class="info-table"><tbody>${body}</tbody></table>`;
}

function renderInlineCode(value) {
  return `<code>${escapeHtml(value || "")}</code>`;
}

function renderStringList(items) {
  const filtered = (items || []).filter(Boolean);
  if (!filtered.length) return `<span class="empty">None</span>`;
  return `<ul class="build-info-list">${filtered.map((item) => `<li>${renderInlineCode(item)}</li>`).join("")}</ul>`;
}

function extractNodeReferences(text) {
  const refs = [];
  const pattern = /\\noderef\{([A-Za-z0-9_']+)\}/g;
  let match = null;
  while ((match = pattern.exec(String(text || ""))) !== null) {
    refs.push(match[1]);
  }
  return refs;
}

function directDependencies(node) {
  const seen = new Set();
  const add = (name) => {
    if (name && name !== node.name && nodeExists(name)) seen.add(name);
  };
  (node.imports || []).forEach(add);
  extractNodeReferences(node.tex_statement).forEach(add);
  extractNodeReferences(node.tex_proof).forEach(add);
  return Array.from(seen).sort((a, b) => a.localeCompare(b));
}

function renderSemanticClosureNote() {
  return `
    <div class="closure-note">
      <p>These are the additional nodes whose statements must be read to verify that the Lean statement of this node genuinely corresponds to its claimed natural-language mathematical meaning. This list is generated by Trellis's Lean semantic-payload walk: starting at the node's Lean declaration, theorem/axiom/etc. types are walked, definition types and values are walked, inductive types and constructors are walked, theorem proof bodies are not walked, external Mathlib constants stop at the boundary, and generated constants are collapsed to their top-level tablet node.</p>
    </div>
  `;
}

function renderSourceLinks(node){const links=[];const download=(text,name,label)=>`<a download="${escapeHtml(name)}" href="data:text/plain;charset=utf-8,${encodeURIComponent(text)}">${label}</a>`;if(node.tex_statement)links.push(download([node.tex_statement,node.tex_proof].filter(Boolean).join('\n\n'),node.name+'.tex','TeX excerpt'));if(node.lean_statement)links.push(download([node.lean_statement,node.lean_proof].filter(Boolean).join('\n\n-- BODY\n'),node.name+'.lean.txt','Lean excerpt'));return links.join('');}

function renderNodePanel(name, opts = {}) {
  const node = tablet.nodes[name];
  if (!node) return "";
  const header = opts.root
    ? ""
    : `<div class="node-panel-header"><h3><a href="${nodeHref(name)}">${escapeHtml(name)}</a></h3>${kindBadge(node.kind)}</div>`;
  const isDefinition = node.kind === "definition";
  // Node names cited by this node's Lean text link to their nodes. The safe
  // link set is the node's Tablet imports: exactly what the Lean is entitled
  // to cite, and already filtered to names that exist as nodes.
  const leanLinkNames = new Set((node.imports || []).filter(nodeExists));
  const leanMain = isDefinition && node.lean_proof
    ? `${node.lean_statement}\n-- BODY\n${node.lean_proof}`
    : node.lean_statement;
  const texHeading = isDefinition ? "TeX Definition" : "TeX Statement";
  const leanHeading = isDefinition ? "Lean Definition" : "Lean Statement";
  const leanProofLines = node.lean_proof ? node.lean_proof.split("\n").length : 0;
  const proofMetaParts = [];
  if (node.tex_proof) proofMetaParts.push("natural language");
  if (node.lean_proof) proofMetaParts.push(`Lean, ${leanProofLines} line${leanProofLines === 1 ? "" : "s"}`);
  const proofMeta = proofMetaParts.length
    ? `<span class="proof-summary-meta">${escapeHtml(proofMetaParts.join(" + "))}</span>`
    : "";
  // One disclosure for both proof registers: on a wide screen they sit in
  // side-by-side columns (each capped to the viewport and independently
  // scrollable, so Lean and natural language can be read against each
  // other); on a narrow screen the columns stack via the .subgrid rules.
  const proofBlocks = isDefinition ? "" : `
      <details class="proof"${opts.openProofs ? " open" : ""}>
        <summary>Proof${proofMeta}</summary>
        <div class="subgrid proof-columns">
          <section class="block">
            <h4>Natural-Language Proof</h4>
            ${renderTex(node.tex_proof)}
          </section>
          <section class="block">
            <h4>Lean Proof</h4>
            ${renderLean(node.lean_proof, leanLinkNames)}
          </section>
        </div>
      </details>
  `;
  return `
    <article class="node-panel" id="panel-${escapeHtml(name)}">
      ${header}
      ${node.source_note ? `<p class="closure-note">${escapeHtml(node.source_note)}</p>` : ""}
      <div class="subgrid">
        <section class="block">
          <h4>${texHeading}</h4>
          ${renderTex(node.tex_statement)}
        </section>
        <section class="block">
          <h4>${leanHeading}</h4>
          ${renderLean(leanMain, leanLinkNames)}
        </section>
      </div>
      ${proofBlocks}
    </article>
  `;
}

function renderBuildInfo(){activeNode=BUILD_INFO_ROUTE;const p=tablet.provenance;document.title=`Snapshot Info - ${tablet.title}`;$('mainContent').innerHTML=`<header class="node-header"><div><h2>Snapshot Info</h2><div class="meta-line"><span>Trellis cycle ${p.cycle}</span><span>${p.reported_closed_nodes}/${p.reported_closed_nodes} nodes reported closed</span></div></div></header><section class="block"><h4>Completed tablet</h4>${renderInfoTable([['Project',escapeHtml(p.project)],['Phase',escapeHtml(p.phase)],['Proof nodes',String(p.proof_nodes)],['Definition nodes',String(p.definition_nodes)],['Preamble nodes',String(p.preamble_nodes)],['Exported',escapeHtml(p.exported_at)],['Snapshot SHA-256',renderInlineCode(p.snapshot_sha256)]])}</section><section class="block"><h4>Provenance</h4><p>${escapeHtml(p.method)}</p><p>${escapeHtml(p.scope)}</p></section><section class="block"><h4>Export validation</h4><p>${escapeHtml(p.validation)}</p></section><section class="block"><h4>Download</h4><p><a download="tablet.json" href="data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify(tablet,null,2))}">Viewer data</a> · <a download="provenance.json" href="data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify(p,null,2))}">Provenance</a> · <a href="https://github.com/tkelly36/strong-spiro-theorem-formalization/blob/main/snapshot/live-tablet.json">Original exported panels</a></p></section><section class="block"><h4>Raw metadata</h4>${renderLean(JSON.stringify(p,null,2))}</section>`;renderSidebar();$('mainContent').focus({preventScroll:true});}

function renderMain(name) {
  if (name === BUILD_INFO_ROUTE) {
    renderBuildInfo();
    return;
  }
  const node = tablet.nodes[name] || tablet.nodes[nodeNames[0]];
  if (!node) {
    $("mainContent").innerHTML = `<div class="warning">No nodes found.</div>`;
    return;
  }
  activeNode = node.name;
  document.title = `${node.name} - ${tablet.title}`;
  const closure = (node.semantic_closure || []).filter(nodeExists);
  const deps = directDependencies(node);
  const mathlibImports = node.mathlib_imports || [];
  const closureItems = closure.length
    ? closure.map((dep) => renderNodePanel(dep)).join("")
    : `<p class="empty">The semantic closure of this node has no additional tablet nodes.</p>`;
  const closureWarning = node.semantic_closure_error
    ? `<p class="warning">${escapeHtml(node.semantic_closure_error)}</p>`
    : "";
  $("mainContent").innerHTML = `
    <header class="node-header">
      <div>
        <h2>${escapeHtml(node.name)}</h2>
        <div class="meta-line">
          <span>${escapeHtml(node.kind || "node")}</span><span>${escapeHtml(node.reported_status || "")}</span><span>cycle 117</span>
          ${node.is_target ? "<span>paper target</span>" : ""}
          <span>uses ${(node.imports || []).length} nodes</span>
          <span>used by ${(node.imported_by || []).length} nodes</span>
          <span>${closure.length} semantic-closure nodes</span>
        </div>
      </div>
      <div class="source-links">${renderSourceLinks(node)}</div>
    </header>
    ${renderLinks("Uses", node.imports)}
    ${renderLinks("Used by", node.imported_by)}
    ${renderNodePanel(node.name, { root: true })}
    <h2 class="section-title">Semantic Closure</h2>
    ${renderSemanticClosureNote()}
    ${closureWarning}
    ${renderNodePills(closure)}
    ${closureItems}
    <h2 class="section-title">Tablet Dependencies</h2>
    ${renderNodePills(deps) || `<p class="empty">This node has no direct tablet dependencies.</p>`}

  `;
  renderSidebar();
  const activeLink = document.querySelector("#allNodeList .node-link.active");
  if (activeLink && activeLink.scrollIntoView) activeLink.scrollIntoView({ block: "nearest" });
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([$("mainContent")]).catch(() => {});
  }
  $("mainContent").focus({ preventScroll: true });
}

function buildTree(root) {
  const seen = new Set();
  function walk(name) {
    const node = tablet.nodes[name];
    if (!node) return "";
    const repeated = seen.has(name);
    seen.add(name);
    const children = repeated ? [] : (node.imports || []).filter(nodeExists);
    return `<li class="${repeated ? "repeated" : ""}">${compactNodeAnchor(name)}${children.length ? `<ul>${children.map(walk).join("")}</ul>` : ""}</li>`;
  }
  return `<ul class="tree">${walk(root)}</ul>`;
}

function renderSidebar() {
  $("siteTitle").textContent = tablet.title || "Trellis Tablet";
  const buildLink = $("buildInfoLink");
  if (buildLink) {
    buildLink.classList.toggle("active", activeNode === BUILD_INFO_ROUTE);
  }
  $("targetList").innerHTML = (tablet.targets || [])
    .filter((target) => nodeExists(target.node))
    .map((target) => {
      const active = target.node === activeNode ? " active" : "";
      const label = target.label ? `<span class="badge">${escapeHtml(target.label)}</span>` : kindBadge(tablet.nodes[target.node].kind);
      return `<a class="target-link${active}" href="${nodeHref(target.node)}"><span class="node-name">${escapeHtml(target.node)}</span>${label}</a>`;
    })
    .join("");

  $("dependencyOutline").innerHTML = (tablet.targets || [])
    .filter((target) => nodeExists(target.node))
    .map((target) => {
      const open = "";
      const label = target.label ? ` <span class="badge">${escapeHtml(target.label)}</span>` : "";
      return `<details${open}><summary>${escapeHtml(target.node)}${label}</summary>${buildTree(target.node)}</details>`;
    })
    .join("");

  const query = $("nodeSearch").value.trim().toLowerCase();
  const counter = $("nodeCount");
  if (!query) {
    if (counter) counter.textContent = `${nodeNames.length} nodes`;
    $("allNodeList").innerHTML = nodeNames.map((name) => nodeLink(name)).join("");
    return;
  }
  const { nameHits, textHits } = searchMatches(query);
  if (counter) counter.textContent = `${nameHits.length + textHits.length} of ${nodeNames.length} nodes`;
  const divider = textHits.length
    ? `<div class="list-divider">statement matches</div>`
    : "";
  $("allNodeList").innerHTML =
    nameHits.map((name) => nodeLink(name)).join("") +
    divider +
    textHits.map((name) => nodeLink(name)).join("");
}

// Name matches rank ahead of statement-text matches; the two groups are
// shown with a divider so a reader can search by what a node says, not
// only what it is called.
function searchMatches(query) {
  const nameHits = [];
  const textHits = [];
  for (const name of nodeNames) {
    if (name.toLowerCase().includes(query)) {
      nameHits.push(name);
    } else {
      const node = tablet.nodes[name];
      if (((node && node.tex_statement) || "").toLowerCase().includes(query)) textHits.push(name);
    }
  }
  return { nameHits, textHits };
}

function routeFromHash() {
  const raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (raw === BUILD_INFO_ROUTE) return BUILD_INFO_ROUTE;
  return nodeExists(raw) ? raw : ((tablet.targets || []).find((t) => nodeExists(t.node)) || {}).node || nodeNames[0];
}

function firstSearchMatch() {
  const query = $("nodeSearch").value.trim().toLowerCase();
  if (!query) return "";
  const { nameHits, textHits } = searchMatches(query);
  return nameHits[0] || textHits[0] || "";
}

async function boot() {
  tablet = JSON.parse($("tabletData").textContent);
  nodeNames = Object.keys(tablet.nodes || {}).sort((a, b) => a.localeCompare(b));
  $("nodeSearch").addEventListener("input", renderSidebar);
  $("nodeSearch").addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    const match = firstSearchMatch();
    if (!match) return;
    event.preventDefault();
    location.hash = encodeURIComponent(match);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "/" || event.ctrlKey || event.metaKey || event.altKey) return;
    const target = event.target;
    if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;
    event.preventDefault();
    $("nodeSearch").focus();
    $("nodeSearch").select();
  });
  document.addEventListener("click", (event) => {
    const moreButton = event.target && event.target.closest ? event.target.closest("button.pill-more") : null;
    if (moreButton) {
      const rest = moreButton.parentElement ? moreButton.parentElement.querySelector(".pill-rest") : null;
      if (rest) rest.hidden = false;
      moreButton.remove();
      return;
    }
    const link = event.target && event.target.closest ? event.target.closest("a") : null;
    if (!link) return;
    const rawHref = link.getAttribute("href") || "";
    const directName = rawHref.startsWith("#") ? decodeURIComponent(rawHref.slice(1)) : rawHref;
    if (/^[A-Za-z0-9_']+$/.test(directName) && nodeExists(directName)) {
      event.preventDefault();
      location.hash = encodeURIComponent(directName);
    }
  });
  window.addEventListener("hashchange", () => renderMain(routeFromHash()));
  renderMain(routeFromHash());
}

boot().catch((err) => {
  $("mainContent").innerHTML = `<div class="warning">Could not load tablet viewer data: ${escapeHtml(err && err.message ? err.message : err)}</div>`;
});
</script>
</body>
</html>
