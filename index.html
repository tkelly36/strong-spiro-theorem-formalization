<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spiro Formalization Viewer</title>
  <style>

:root {
  color-scheme: light;
  --bg: #f7f7f4;
  --panel: #ffffff;
  --panel-soft: #fbfbf8;
  --ink: #202124;
  --muted: #626a73;
  --line: #d9ddd5;
  --accent: #0f6b63;
  --accent-weak: #e3f1ee;
  --code-bg: #f2f4f4;
  --warn: #8a4b00;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.45;
}

a {
  color: var(--accent);
  text-decoration: none;
}

a:hover { text-decoration: underline; }

.app-shell {
  display: grid;
  grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
  border-right: 1px solid var(--line);
  background: #ecefe9;
  padding: 18px 14px 24px;
}

.brand { margin-bottom: 16px; }

.eyebrow {
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.brand h1 {
  margin: 4px 0 0;
  font-size: 1.05rem;
  line-height: 1.25;
  font-weight: 700;
}

.search-label {
  display: block;
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 5px;
}

.search-input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font: inherit;
  background: var(--panel);
}

.nav-section {
  margin-top: 18px;
}

.nav-section h2 {
  margin: 0 0 7px;
  font-size: 0.78rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.target-list,
.all-node-list {
  display: grid;
  gap: 3px;
}

.node-link,
.target-link {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 8px;
  border-radius: 5px;
  padding: 5px 7px;
  color: var(--ink);
}

.node-link:hover,
.target-link:hover {
  background: rgba(15, 107, 99, 0.08);
  text-decoration: none;
}

.node-link.active,
.target-link.active {
  background: var(--accent-weak);
  color: #063d39;
  font-weight: 650;
}

.node-name {
  overflow-wrap: anywhere;
}

.badge {
  justify-self: end;
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 6px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 500;
}

.dependency-outline details {
  border-left: 1px solid var(--line);
  margin-left: 4px;
  padding-left: 8px;
}

.dependency-outline details + details { margin-top: 6px; }

.dependency-outline summary {
  cursor: pointer;
  color: var(--ink);
  font-weight: 650;
  padding: 4px 0;
}

.tree {
  list-style: none;
  margin: 0;
  padding: 0 0 0 9px;
}

.tree ul {
  list-style: none;
  margin: 0;
  padding: 0 0 0 14px;
  border-left: 1px solid var(--line);
}

.tree li {
  margin: 1px 0;
}

.tree a {
  display: inline-block;
  max-width: 100%;
  border-radius: 4px;
  padding: 2px 4px;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.tree a:hover {
  background: rgba(15, 107, 99, 0.08);
  text-decoration: none;
}

.tree .repeated > a {
  color: var(--muted);
}

.content {
  min-width: 0;
  padding: 30px min(5vw, 56px) 64px;
}

.node-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 18px;
}

.node-header h2 {
  margin: 0;
  font-size: 1.8rem;
  line-height: 1.15;
  overflow-wrap: anywhere;
}

.meta-line {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.86rem;
}

.source-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.source-links a,
.pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  background: var(--panel);
  color: var(--accent);
  font-size: 0.82rem;
}

.section-title {
  margin: 30px 0 10px;
  font-size: 1rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.node-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  margin: 14px 0;
  overflow: hidden;
}

.node-panel-header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  padding: 11px 14px;
  background: var(--panel-soft);
  border-bottom: 1px solid var(--line);
}

.node-panel-header h3 {
  margin: 0;
  font-size: 1rem;
  overflow-wrap: anywhere;
}

.subgrid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 0;
}

.block {
  min-width: 0;
  padding: 14px;
  border-bottom: 1px solid var(--line);
}

.block:nth-child(odd) {
  border-right: 1px solid var(--line);
}

.block h4 {
  margin: 0 0 9px;
  font-size: 0.78rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.tex-render {
  overflow-wrap: anywhere;
}

.tex-env-title {
  font-weight: 700;
  margin-bottom: 8px;
}

.tex-body p {
  margin: 0.6em 0;
}

.latex-list {
  margin: 0.65em 0 0.65em 1.35em;
  padding: 0;
}

.latex-list li {
  margin: 0.45em 0;
  padding-left: 0.25em;
}

.latex-list p {
  margin: 0.35em 0;
}

.math-block {
  margin: 0.75em 0;
  overflow-x: auto;
  overflow-y: hidden;
}

.info-table {
  width: 100%;
  border-collapse: collapse;
  margin: 0.4em 0 1em;
  font-size: 0.92rem;
}

.info-table th,
.info-table td {
  vertical-align: top;
  text-align: left;
  border-bottom: 1px solid var(--line);
  padding: 7px 8px;
}

.info-table th {
  width: 13rem;
  color: var(--muted);
  font-weight: 650;
}

.build-info-list {
  margin: 0.5em 0 1em 1.25em;
  padding: 0;
}

.build-info-list li {
  margin: 0.25em 0;
}

pre {
  margin: 0;
  overflow: auto;
  background: var(--code-bg);
  border-radius: 6px;
  padding: 12px;
  font-size: 0.82rem;
  line-height: 1.45;
}

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

details.proof {
  padding: 0;
}

details.proof summary {
  cursor: pointer;
  padding: 12px 14px;
  color: var(--ink);
  background: var(--panel-soft);
  border-bottom: 1px solid var(--line);
  font-weight: 650;
}

details.proof[open] summary {
  border-bottom: 1px solid var(--line);
}

details.proof .proof-body {
  padding: 14px;
}

.proof-summary-meta {
  margin-left: 10px;
  color: var(--muted);
  font-weight: 400;
  font-size: 0.85em;
}

details.proof .proof-columns .block {
  border-bottom: 0;
}

@media (min-width: 901px) {
  /* Side-by-side proof registers: cap each column to the viewport and let it
     scroll on its own, so the natural-language and Lean proofs stay in view
     together instead of scrolling apart. */
  details.proof .proof-columns .block {
    max-height: 80vh;
    overflow: auto;
  }
}

pre a.lean-ref {
  color: var(--accent);
  text-decoration: underline dotted;
  text-underline-offset: 2px;
}

pre a.lean-ref:hover {
  text-decoration: underline;
}

.pill-label {
  color: var(--muted);
}

.pill-rest {
  display: contents;
}

.pill-rest[hidden] {
  display: none;
}

button.pill-more {
  font: inherit;
  font-size: 0.82rem;
  cursor: pointer;
  color: var(--muted);
}

.node-count {
  margin: 6px 0 8px;
  color: var(--muted);
  font-size: 0.78rem;
}

.list-divider {
  margin: 8px 0 3px;
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.links-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 0;
}

.closure-note {
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.45;
  margin: 0 0 12px;
  max-width: 920px;
}

.closure-note p {
  margin: 0.35em 0;
}

.warning {
  color: var(--warn);
  background: #fff8e8;
  border: 1px solid #ead7a1;
  border-radius: 6px;
  padding: 10px 12px;
}

.empty {
  color: var(--muted);
  font-style: italic;
}

.loading {
  color: var(--muted);
}

@media (max-width: 900px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: relative;
    height: auto;
    max-height: 55vh;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .content {
    padding: 22px 16px 48px;
  }
  .node-header {
    display: block;
  }
  .source-links {
    justify-content: flex-start;
    margin-top: 12px;
  }
  .subgrid {
    grid-template-columns: 1fr;
  }
  .block:nth-child(odd) {
    border-right: 0;
  }
}

       ring\n  rw [hconst] at h\n  linarith","tex_statement":"\\begin{helper}\nLet $m\u003cn$ be nonnegative integers and let $p\\in[0,1]$.  Then\n\\[\n  \\sum_{k=0}^{m}\\binom nk p^k(1-p)^{n-k}\n  =\n  n\\binom{n-1}{m}\n  \\int_p^1 x^m(1-x)^{n-1-m}\\,dx .\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nDefine, for $x\\in[0,1]$,\n\\[\n  B_{m,n}(x)=\\sum_{k=0}^{m}\\binom nk x^k(1-x)^{n-k}.\n\\]\nEach summand is a polynomial in $x$, so the finite sum may be\ndifferentiated term by term.  For the summand with index $k$, the product\nrule gives\n\\[\n  \\frac{d}{dx}\\bigl(x^k(1-x)^{n-k}\\bigr)\n  =\n  kx^{k-1}(1-x)^{n-k}-(n-k)x^k(1-x)^{n-k-1},\n\\]\nwith the first term interpreted as $0$ when $k=0$ and the second term as\n$0$ when $k=n$.  Since $m\u003cn$, every exponent that remains below is a\nnonnegative integer.  Therefore\n\\[\n  B'_{m,n}(x)\n  =\n  \\sum_{k=1}^{m} k\\binom nk x^{k-1}(1-x)^{n-k}\n  -\n  \\sum_{k=0}^{m} (n-k)\\binom nk x^k(1-x)^{n-k-1}.\n\\]\nUsing the elementary identities\n\\[\n  k\\binom nk=n\\binom{n-1}{k-1}\\quad(1\\le k\\le m)\n  \\qquad\\text{and}\\qquad\n  (n-k)\\binom nk=n\\binom{n-1}{k}\\quad(0\\le k\\le m),\n\\]\nand reindexing the first sum by $j=k-1$, this becomes\n\\[\n  B'_{m,n}(x)\n  =\n  n\\sum_{j=0}^{m-1}\\binom{n-1}{j}x^j(1-x)^{n-1-j}\n  -\n  n\\sum_{k=0}^{m}\\binom{n-1}{k}x^k(1-x)^{n-1-k}.\n\\]\nThe first sum is exactly the initial segment of the second sum through\nindex $m-1$, so all matching terms cancel and only the index $m$ term of\nthe second sum remains.  Hence, for all $x\\in[0,1]$,\n\\[\n  B'_{m,n}(x)\n  =\n  -\\,n\\binom{n-1}{m}x^m(1-x)^{n-1-m}.\n\\]\nThe fundamental theorem of calculus applied on the interval $[p,1]$ gives\n\\[\n  B_{m,n}(1)-B_{m,n}(p)\n  =\n  \\int_p^1 B'_{m,n}(x)\\,dx\n  =\n  -\\,n\\binom{n-1}{m}\\int_p^1 x^m(1-x)^{n-1-m}\\,dx .\n\\]\nBecause $m\u003cn$, each term in $B_{m,n}(1)$ contains a positive power of\n$1-1=0$, so $B_{m,n}(1)=0$.  Moving the remaining term to the other side\ntherefore yields exactly\n\\[\n  B_{m,n}(p)\n  =\n  n\\binom{n-1}{m}\\int_p^1 x^m(1-x)^{n-1-m}\\,dx .\n\\]\nExpanding the definition of $B_{m,n}(p)$ is the displayed identity.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"BinomialCardinalityOverflow":{"name":"BinomialCardinalityOverflow","title":"Binomial cardinality overflow","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["AnchoredTerminalEstimate"],"lean_statement":"lemma BinomialCardinalityOverflow {V : Type v} [Fintype V] [DecidableEq V]\n    (α : ℝ) (a : ℕ)\n    (hα : 0 \u003c α ∧ α ≤ 1)\n    (ha : (a : ℝ) = α * (Fintype.card V : ℝ)) :\n    Finset.sum (((Finset.univ : Finset V).powerset).filter\n      (fun Z : Finset V => a \u003c Z.card))\n      (fun Z : Finset V =>\n        (3 * α / 8) ^ Z.card *\n          (1 - 3 * α / 8) ^ (Fintype.card V - Z.card)) ≤\n      Real.exp (-(α * (Fintype.card V : ℝ)) / 4) := by","lean_proof":"classical\n  let β : ℝ := 3 * α / 8\n  let c : ℝ := 8 / 3\n  let wt : Finset V → ℝ := fun Z =>\n    β ^ Z.card * (1 - β) ^ (Fintype.card V - Z.card)\n  have hc : 0 \u003c c := by norm_num [c]\n  have hc_one : 1 ≤ c := by norm_num [c]\n  have hβ : 0 ≤ β ∧ β ≤ 1 := by dsimp [β]; constructor \u003c;> linarith [hα.1, hα.2]\n  have hwt : ∀ Z : Finset V, 0 ≤ wt Z := by\n    intro Z\n    exact mul_nonneg (pow_nonneg hβ.1 _) (pow_nonneg (sub_nonneg.mpr hβ.2) _)\n  have hmgf : (∑ Z : Finset V, wt Z * c ^ Z.card) =\n      (1 + 5 * α / 8) ^ Fintype.card V := by\n    calc\n      (∑ Z : Finset V, wt Z * c ^ Z.card) =\n          ∑ Z : Finset V, (β * c) ^ Z.card * (1 - β) ^ (Fintype.card V - Z.card) := by\n        refine Finset.sum_congr rfl ?_\n        intro Z _\n        dsimp [wt]\n        rw [mul_pow]\n        ring\n      _ = (β * c + (1 - β)) ^ Fintype.card V := by\n        simpa using Finset.sum_pow_mul_eq al.exp ((Fintype.card V : ℝ) * (5 * α / 8)) / c ^ a :=\n        div_le_div_of_nonneg_right hnum (pow_nonneg hc.le _)\n      _ = Real.exp ((Fintype.card V : ℝ) * (5 * α / 8) - (a : ℝ) * Real.log c) := by\n        rw [hden, Real.exp_sub]\n      _ ≤ Real.exp (-(α * (Fintype.card V : ℝ)) / 4) := by\n        apply Real.exp_le_exp.mpr\n        rw [ha]\n        have hcoef : (1 / 4 : ℝ) ≤ Real.log c - 5 / 8 := by linarith\n        have hprod := mul_le_mul_of_nonneg_left hcoef\n          (mul_nonneg hα.1.le (Nat.cast_nonneg (Fintype.card V)))\n        nlinarith\n  exact hmarkov.trans hbound","tex_statement":"\\begin{lemma}[Binomial cardinality overflow]\nLet $V$ be an $n$-element set, let $0\u003c\\alpha\\le1$, and let $a$ be a\nnonnegative integer with $a=\\alpha n$.  Put $\\beta=3\\alpha/8$.  Then\n\\[\n \\sum_{\\substack{Z\\subseteq V:\\ |Z|>a}}\n       \\beta^{|Z|}(1-\\beta)^{n-|Z|}\n \\le \\exp(-\\alpha n/4).\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nPut $w(Z)=\\beta^{|Z|}(1-\\beta)^{n-|Z|}$, and $c=8/3>1$.\nSince $0\u003c\\beta\\le3/8$, all weights are nonnegative.  Expanding the\nproduct over the vertices gives\n$\\sum_{Z\\subseteq V}w(Z)=(\\beta+(1-\\beta))^n=1$ and\n\\[\n \\sum_{Z\\subseteq V}w(Z)c^{|Z|}\n =(\\beta c+1-\\beta)^n=(1+5\\alpha/8)^n.\n\\]\nFor every $Z$ with $|Z|>a$ we have $1\\le c^{|Z|-a}$.\nMultiplying by $w(Z)$ and summing, and then including the nonnegative\nterms for $|Z|\\le a$, gives the exponential Markov bound directly:\n\\[\n \\sum_{|Z|>a}w(Z)\n \\le c^{-a}\\sum_{Z\\subseteq V}w(Z)c^{|Z|}\n =\\exp(-a\\log c)(1+5\\alpha/8)^n\n \\le\\exp\\bigl(-\\alpha n(\\log(8/3)-5/8)\\bigr).\n\\]\nFor the last step, $1+t\\le e^t$ for $t\\ge0$: the function\n$e^t-1-t$ is zero at $0$ and has derivative $e^t-1\\ge0$ thereon.\nRaise this inequality with $t=5\\alpha/8$ to the integer power $n$,\nand use $a=\\alpha n$.\n\nFor completeness, if $x\\ge1$, the function\n$f(x)=\\log x-2(x-1)/(x+1)$ has $f(1)=0$ and derivative\n\\[\n f'(x)=\\frac{(x-1)^2}{x(x+1)^2}\\ge0.\n\\]\nConsequently $\\log(8/3)\\ge10/11>7/8$, and hence\n$\\log(8/3)-5/8\\ge1/4$.  As $\\alpha n\\ge0$ and the exponential is\nincreasing, the preceding bound is at most $\\exp(-\\alpha n/4)$.\nAll identities remain valid for $n=0$; then the overflow event is empty.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"BinomialMedianAtMeanBoundary":{"name":"BinomialMedianAtMeanBoundary","title":"BinomialMedianAtMeanBoundary","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["BinomialMedianAtMean"],"lean_statement":"lemma BinomialMedianAtMeanBoundary {V : Type v} [Fintype V] [DecidableEq V]\n    (α : ℝ) (m : ℕ)\n    (_hα : 0 ≤ α ∧ α ≤ 1)\n    (hm : (m : ℝ) = α * (Fintype.card V : ℝ))\n    (hboundary : α = 0 ∨ α = 1) :\n    Finset.sum (((Finset.univ : Finset V).powerset).filter\n      (fun Z : Finset V => Z.card ≤ m))\n      (fun Z : Finset V =>\n        α ^ Z.card * (1 - α) ^ (Fintype.card V - Z.card)) ≥ (1 / 2 : ℝ) := by","lean_proof":"rcases hboundary with rfl | rfl\n  · have hm0 : m = 0 := by\n      have hmR : (m : ℝ) = 0 := by simpa using hm\n      exact_mod_cast hmR\n    subst m\n    have hsum : Finset.sum (((Finset.univ : Finset V).powerset).filter\n        (fun Z : Finset V => Z.card ≤ 0))\n        (fun Z : Finset V =>\n          (0 : ℝ) ^ Z.card * (1 - (0 : ℝ)) ^ (Fintype.card V - Z.card)) = 1 := by\n      rw [Finset.sum_eq_single (∅ : Finset V)]\n      · simp\n      · intro Z hZ hZne\n        have hcard : Z.card = 0 :=\n          Nat.eq_zero_of_le_zero (Finset.mem_filter.mp hZ).2\n        exact (hZne (Finset.card_eq_zero.mp hcard)).elim\n      · intro hnot\n        exfalso\n        apply hnot\n        simp\n    rw [hsum]\n    norm_num\n  · have hmn : m = Fintype.card V := by\n      have hmR : (m : ℝ) = (Fintype.card V : ℝ) := by simpa using hm\n      e       ∀ (A B : ℕ) (e : ℝ), 0 \u003c A → A ≤ B → 0 ≤ e → e \u003c (A : ℝ) →\n        ((A : ℝ) - e) ^ A * ((B : ℝ) + e) ^ B ≤\n          ((A : ℝ) + e) ^ A * ((B : ℝ) - e) ^ B := by\n    intro A B e hApos hAB he0 heA\n    have hABr : (A : ℝ) ≤ (B : ℝ) := by exact_mod_cast hAB\n    have hphi := phi_mono_core e (A : ℝ) (B : ℝ) he0 heA hABr\n    have hAp : 0 \u003c (A : ℝ) + e := by positivity\n    have hBp : 0 \u003c (B : ℝ) + e := by\n      have : 0 \u003c (B : ℝ) := by exact_mod_cast (lt_of_lt_of_le hApos hAB)\n      positivity\n    have hAm : 0 \u003c (A : ℝ) - e := sub_pos.mpr heA\n    have hBm : 0 \u003c (B : ℝ) - e := sub_pos.mpr (lt_of_lt_of_le heA hABr)\n    have hra_pos : 0 \u003c ((A : ℝ) - e) / ((A : ℝ) + e) := div_pos hAm hAp\n    have hrb_pos : 0 \u003c ((B : ℝ) - e) / ((B : ℝ) + e) := div_pos hBm hBp\n    have hlog :\n        Real.log ((((A : ℝ) - e) / ((A : ℝ) + e)) ^ A) ≤\n          Real.log ((((B : ℝ) - e) / ((B : ℝ) + e)) ^ B) := by\n      rw [Real.log_pow, Real.log_pow]\n      simpa using hphi\n    have hratio :\n        (((A : ℝ) - e) / ((A : ℝ) + e)) ^ A ≤\n          (((B : ℝ) - e) / ((B : ℝ) + e)) ^ B := by\n      exact (Real.log_le_log_iff (pow_pos hra_pos A) (pow_pos hrb_pos B)).mp hlog\n    have hdenpos : 0 \u003c ((A : ℝ) + e) ^ A * ((B : ℝ) + e) ^ B :=\n      mul_pos (pow_pos hAp A) (pow_pos hBp B)\n    have hmul := mul_le_mul_of_nonneg_right hratio hdenpos.le\n    have hrewrite :\n        (((A : ℝ) - e) / ((A : ℝ) + e)) ^ A *\n            (((A : ℝ) + e) ^ A * ((B : ℝ) + e) ^ B) =\n          ((A : ℝ) - e) ^ A * ((B : ℝ) + e) ^ B := by\n      rw [div_pow]\n      field_simp [hAp.ne']\n    have hrewriteR :\n        (((B : ℝ) - e) / ((B : ℝ) + e)) ^ B *\n            (((A : ℝ) + e) ^ A * ((B : ℝ) + e) ^ B) =\n          ((A : ℝ) + e) ^ A * ((B : ℝ) - e) ^ B := by\n      rw [div_pow]\n      field_simp [hBp.ne']\n    rwa [hrewrite, hrewriteR] at hmul\n  let B : ℕ := n - 1 - m\n  have hmn1 : 2 * m ≤ n - 1 := by omega\n  have hAB : m ≤ B := by\n    dsimp       rw [hone, div_pow]\n      field_simp [hden_ne]\n      ring\n    rw [hrewriteL, hrewriteR]\n    exact div_le_div_of_nonneg_right hnum (pow_nonneg hdenpos.le (m + B))","tex_statement":"\\begin{helper}\nLet $m,n$ be nonnegative integers with $0\u003cm$ and $2m\u003cn$.  For every real\n$e$ with $0\\le e\\le m$, put\n\\[\n  f(x)=x^m(1-x)^{\\,n-1-m}.\n\\]\nThen the two points symmetric around $x_0=m/(n-1)$ satisfy\n\\[\n  f\\!\\left(\\frac{m-e}{n-1}\\right)\n  \\le\n  f\\!\\left(\\frac{m+e}{n-1}\\right).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nSet\n\\[\n  a=m,\\qquad b=n-1-m.\n\\]\nThe hypothesis $2m\u003cn$ implies $2m\\le n-1$, and therefore $a\\le b$.\nAlso $a>0$, and hence $a+b=n-1>0$.  The two arguments of $f$ are\n\\[\n  x_-=\\frac{a-e}{a+b},\\qquad x_+=\\frac{a+e}{a+b}.\n\\]\nSince $0\\le e\\le a\\le b$, all four quantities $a-e$, $a+e$, $b-e$, and\n$b+e$ are nonnegative, and $a+b$ is positive.  Rewriting $1-x_\\pm$ gives\n\\[\n  1-x_-=\\frac{b+e}{a+b},\n  \\qquad\n  1-x_+=\\frac{b-e}{a+b}.\n\\]\nThus the desired inequality is equivalent, after multiplying by the\npositive common denominator $(a+b)^{a+b}$, to\n\\[\n  (a-e)^a(b+e)^b\\le (a+e)^a(b-e)^b.        \\tag{1}\n\\]\n\nIf $e=a$, then the left side of (1) is $0$ because $a>0$, while the right\nside is nonnegative, so (1) holds.  We may therefore assume $0\\le e\u003ca$.\nThen $a-e$, $a+e$, $b-e$, and $b+e$ are all positive.  Dividing (1) by\nthe positive quantity $(a+e)^a(b+e)^b$, it is enough to prove\n\\[\n  \\left(\\frac{a-e}{a+e}\\right)^a\n  \\le\n  \\left(\\frac{b-e}{b+e}\\right)^b.          \\tag{2}\n\\]\nBoth fractions lie in $(0,1]$.  Taking logarithms, (2) follows from\n\\[\n  a\\log\\!\\left(\\frac{a-e}{a+e}\\right)\n  \\le\n  b\\log\\!\\left(\\frac{b-e}{b+e}\\right).     \\tag{3}\n\\]\n\nFor fixed $e$, define\n\\[\n  \\Phi(c)=c\\log\\!\\left(\\frac{c-e}{c+e}\\right)\n  \\qquad(c>e).\n\\]\nWe show that $\\Phi$ is increasing on $(e,\\infty)$.  Its derivative is\n\\[\n  \\Phi'(c)\n   =\n  \\log\\!\\left(\\frac{c-e}{c+e}\\right)\n  +c\\left(\\frac1{c-e}-\\frac1{c+e}\\right)\n  =\n  \\log\\!\\left(\\frac{c-e}{c+e}\\right)\n  +\\frac{2ce}{c^2-e^2}.\n\\]\nPut $u=e/c$.  Then $0\\le u\u003c1$, and this derivative becomes\n\\[\n  \\log\\!\\left(\\frac{1-u}{1+u}\\right)+\\frac{2u}{1-u^2}.\n\\]\nIt is nonnegative because\n\\[\n  -\\log\\!\\left(\\frac{1-u}{1+u}\\right)\n  =\n  \\int_{-u}^{u}\\frac{ds}{1-s}.\n\\]\nHere the equality is the fundamental theorem of calculus for $\\log$ after\nthe substitution $t=1-s$.  Pair $s$ with $-s$.  For $0\\le s\\le u$,\n\\[\n  \\frac1{1-s}+\\frac1{1+s}\n  =\n  \\frac2{1-s^2}\n  \\le\n  \\frac2{1-u^2}.\n\\]\nIntegrating this paired inequality for $0\\le s\\le u$ gives\n\\[\n  -\\log\\!\\left(\\frac{1-u}{1+u}\\right)\n  \\le\n  \\frac{2u}{1-u^2}.\n\\]\nHence $\\Phi'(c)\\ge0$, so $\\Phi$ is increasing on $(e,\\infty)$.\n\nSince $e\u003ca\\le b$, both $a$ and $b$ lie in the interval $(e,\\infty)$, and\nthe monotonicity of $\\Phi$ gives (3).  Exponentiating (3) gives (2), and\nundoing the earlier positive divisions gives (1).  Reversing the initial\nrewriting by the common positive denominator proves\n\\[\n  f(x_-)\\le f(x_+),\n\\]\nwhich is the claimed comparison.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"BinomialUpperFirstPairComparison":{"name":"BinomialUpperFirstPairComparison","title":"BinomialUpperFirstPairComparison","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["BinomialUpperPairedTermComparison","BinomialMedianAtMean"],"lean_statement":"lemma BinomialUpperFirstPairComparison (m q : ℕ) (hq : 0 \u003c q) :\n    ((Nat.choose (m + q) (m + 1) : ℕ) : ℝ) *\n        (m : ℝ) ^ (m + 1) * (q : ℝ) ^ (q - 1) ≤\n      ((Nat.choose (m + q) m : ℕ) : ℝ) *\n        (m : ℝ) ^ m * (q : ℝ) ^ q := by","lean_proof":"have hchooseNat :\n      Nat.choose (m + q) (m + 1) * (m + 1) =\n        Nat.choose (m + q) m * q := by\n    simpa [Nat.add_sub_cancel_left] using Nat.choose_succ_right_eq (m + q) m\n  have hchoose :\n      ((Nat.choose (m + q) (m + 1) : ℕ) : ℝ) * (m + 1 : ℝ) =\n        ((Nat.choose (m + q) m : ℕ) : ℝ) * (q : ℝ) := by\n    exact_mod_cast hchooseNat\n  have hqpred : q = q - 1 + 1 := (Nat.sub_add_cancel hq).symm\n  have hmul :\n      ((Nat.choose (m + q) (m + 1) : ℕ) : ℝ) * (m : ℝ) ≤\n        ((Nat.choose (m + q) m : ℕ) : ℝ) * (q : ℝ) := by\n    calc\n      ((Nat.choose (m + q) (m + 1) : ℕ) : ℝ) * (m : ℝ)\n          ≤ ((Nat.choose (m + q) (m + 1) : ℕ) : ℝ) * (m + 1 : ℝ) := by\n            gcongr\n            norm_num\n      _ = ((Nat.choose (m + q) m : ℕ) : ℝ) * (q : ℝ) := hchoose\n  have hpow_nonneg : (0 : ℝ) ≤ (m : ℝ) ^ m * (q : ℝ) ^ (q - 1) := by\n    positivity\n  calc\n    ((Nat.choose (m + q) (m + 1) : ℕ) : ℝ) *\n        (m : ℝ) ^ (m + 1) * (q : ℝ) ^ (q - 1)\n        = (((Nat.choose (m + q) (m + 1) : ℕ) : ℝ) * (m : ℝ)) *\n            ((m : ℝ) ^ m * (q : ℝ) ^ (q - 1)) := by\n          rw [pow_succ]\n          ring\n    _ ≤ (((Nat.choose (m + q) m : ℕ) : ℝ) * (q : ℝ)) *\n            ((m : ℝ) ^ m * (q : ℝ) ^ (q - 1)) := by\n          exact mul_le_mul_of_nonneg_right hmul hpow_nonneg\n    _ = ((Nat.choose (m + q) m : ℕ) : ℝ) *\n        (m : ℝ) ^ m * (q : ℝ) ^ q := by\n          rw [hqpred, pow_succ]\n          rw [Nat.add_sub_cancel_right]\n          ring_nf","tex_statement":"\\begin{helper}\nLet $m$ and $q$ be nonnegative integers with $0\u003cq$.  Then the first\nupper-half paired unnormalized binomial terms satisfy\n\\[\n    \\binom{m+q}{m+1}m^{m+1}q^{q-1}\n    \\le\n    \\binom{m+q}{m}m^m q^q .\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nThe standard binomial recurrence gives\n\\[\n    \\binom{m+q}{m+1}(m+1)=\\binom{m+q}{m}q .\n\\]\nSince $m\\le m+1$ and the binomial coefficient is nonnegative, this implies\n\\[\n    \\binom{m+q}{m+1}m\\le \\binom{m+q}{m}q .\n\\]\nThe remaining factor $m^m q^{q-1}$ is nonnegative.  Multiplying the last\ninequality by this factor gives\n\\[\n    \\binom{m+q}{m+1}m\\cdot m^m q^{q-1}\n    \\le\n    \\binom{m+q}{m}q\\cdot m^m q^{q-1}.\n\\]\nBecause $0\u003cq$, we have $q=(q-1)+1$, so the left side is\n$\\binom{m+q}{m+1}m^{m+1}q^{q-1}$ and the right side is\n$\\binom{m+q}{m}m^m q^q$.  This is the claimed comparison.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"BinomialUpperPairRatioAlgebra":{"name":"BinomialUpperPairRatioAlgebra","title":"BinomialUpperPairRatioAlgebra","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["BinomialUpperPairedTermComparison","BinomialMedianAtMean"],"lean_statement":"lemma BinomialUpperPairRatioAlgebra (m q d : ℕ)\n    (hq : 0 \u003c q) (hqm : q ≤ m) (hd1 : 1 ≤ d) (hdq : d \u003c q) :\n    ((q + d : ℕ) : ℝ) * ((q - d : ℕ) : ℝ) * ((m : ℝ) ^ 2) ≤\n      (((m + 1 + d : ℕ) : ℝ) * (((m + 1 - d : ℕ) : ℝ)) * ((q : ℝ) ^ 2)) := by","lean_proof":"have hdleq : d ≤ q := le_of_lt hdq\n  have hdlem : d ≤ m := hdleq.trans hqm\n  have hdlem1 : d ≤ m + 1 := hdlem.trans (Nat.le_succ m)\n  rw [Nat.cast_sub hdleq, Nat.cast_sub hdlem1]\n  norm_num [pow_two]\n  have hqmR : (q : ℝ) ≤ m := by exact_mod_cast hqm\n  have hnonneg :\n      (0 : ℝ) ≤ (2 * (m : ℝ) + 1) * (q : ℝ) ^ 2 +\n        (((m : ℝ) ^ 2 - (q : ℝ) ^ 2) * (d : ℝ) ^ 2) := by\n    have h1 : (0 : ℝ) ≤ 2 * (m : ℝ) + 1 := by positivity\n    have h2 : (0 : ℝ) ≤ (q : ℝ) ^ 2 := sq_nonneg _\n    have h3 : (0 : ℝ) ≤ (m : ℝ) ^ 2 - (q : ℝ) ^ 2 := by nlinarith [hqmR]\n    have h4 : (0 : ℝ) ≤ (d : ℝ) ^ 2 := sq_nonneg _\n    positivity\n  nlinarith","tex_statement":"\\begin{helper}\nLet $m,q,d$ be nonnegative integers with $0\u003cq$, $q\\le m$, $1\\le d$, and\n$d\u003cq$.  Then\n\\[\n    (q+d)(q-d)m^2\\le (m+1+d)(m+1-d)q^2 .\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nSince $d\u003cq\\le m$, all displayed subtractions are ordinary nonnegative\ninteger subtractions.  It is enough to show that the difference between the\nright-hand side and the left-hand side is nonnegative.  Expanding and\ncollecting terms gives\n\\[\n\\begin{aligned}\n &(m+1+d)(m+1-d)q^2-(q+d)(q-d)m^2\\\\\n &=\\bigl((m+1)^2-d^2\\bigr)q^2-\\bigl(q^2-d^2\\bigr)m^2\\\\\n &=(2m+1)q^2+(m^2-q^2)d^2 .\n\\end{aligned}\n\\]\nThe first summand is nonnegative because $2m+1\\ge0$ and $q^2\\ge0$.  The\nsecond summand is nonnegative because $q\\le m$ implies $q^2\\le m^2$, and\n$d^2\\ge0$.  Hence the whole difference is nonnegative, which is exactly the\nclaimed inequality.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"BoundedEdges":{"name":"BoundedEdges","title":"BoundedEdges","kind":"definition","is_target":false,"imports":["Preamble"],"imported_by":["DistributionalSmootherSpread","SpiroSpread","SpiroToDistributionalSpread","ContainmentBinomialHitting","ContainmentHitting"],"lean_statement":"def BoundedEdges {Ω : Type u} {V : Type v} (E : Ω → Finset V) (r : ℕ) : Prop :=","lean_proof":"∀ x : Ω, (E x).card ≤ r","tex_statement":"\\begin{definition}\nA labelled family of finite edges $E:\\Omega\\to 2^V$ is $r$-bounded if every\nlabelled edge has cardinality at most $r$.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteBernoulliBooleanPowersetTransport":{"name":"FiniteBernoulliBooleanPowersetTransport","title":"FiniteBernoulliBooleanPowersetTransport","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["FiniteBernoulliResidualBooleanPowersetTransport","FiniteJansonFixedLabelSeparation"],"lean_statement":"lemma FiniteBernoulliBooleanPowersetTransport {V : Type v}\n    [Fintype V] [DecidableEq V] (p : ℝ) (H : Finset V → ℝ) :\n    (Finset.univ : Finset (V → Bool)).sum\n      (fun x : V → Bool =>\n        ((Finset.univ : Finset V).prod\n          (fun v : V => if x v then p else 1 - p)) *\n        H ((Finset.univ : Finset V).filter (fun v : V => x v))) =\n    ((Finset.univ : Finset V).powerset).sum\n      (fun Z : Finset V =>\n        (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) * H Z) := by","lean_proof":"classical\n  let e : (V → Bool) ≃ {Z : Finset V // Z ∈ (Finset.univ : Finset V).powerset} := {\n    toFun x := ⟨(Finset.univ : Finset V).filter (fun v : V => x v), by simp⟩\n    invFun Z := fun v : V => decide (v ∈ Z.val)\n    left_inv := by\n      intro x\n      ext v\n      by_cases hx : x v \u003c;> simp [hx]\n    right_inv := by\n      intro Z\n      ext v\n      simp\n  }\n  have hweight : ∀ x : V → Bool,\n      (Finset.univ : Finset V).prod (fun v : V => if x v then p else 1 - p) =\n        p ^ ((Finset.univ : Finset V).filter (fun v : V => x v = true)).card *\n          (1 - p) ^ (Fintype.card V -\n            ((Finset.univ : Finset V).filter (fun v : V => x v = true)).card) := by\n    intro x\n    calc\n      (Finset.univ : Finset V).prod (fun v : V => if x v then p else 1 - p)\n          = ((Finset.univ : Finset V).filter (fun v : V => x v = true)).prod\n              (fun _ => p) *\n            ((Finset.univ : Finset V).filter (fun v : V => ¬ x v = true)).prod\n              (fun _ => 1 - p) := by\n              rw [← Finset.prod_filter_mul_prod_filter_not\n                (s := (Finset.univ : Finset V)) (p := fun v : V => x v = true)]\n              congr 1\n              · apply Finset.prod_congr rfl\n                intro v hv\n                simp at hv\n                simp [hv]\n              · apply Finset.prod_congr rfl\n                intro v hv\n Z.val\n            ext v\n            by_cases hv : v ∈ Z.val \u003c;> simp [hv]\n          rw [hfilter]\n          rw [hweight (e.symm Z)]\n          simp [hfilter]\n    _ =\n      ((Finset.univ : Finset V).powerset).sum\n        (fun Z : Finset V =>\n          (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) * H Z) := by\n        simpa using (Finset.sum_attach ((Finset.univ : Finset V).powerset)\n          (fun Z : Finset V =>\n            (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) * H Z))","tex_statement":"\\begin{helper}\nLet $V$ be a finite set, let $p$ be a real number, and let\n$H$ be any real-valued function on subsets of $V$.  Then\n\\[\n  \\sum_{x:V\\to\\{0,1\\}}\n    \\left(\\prod_{v\\in V} (x(v)?p:1-p)\\right)\n    H(\\{v\\in V:x(v)=1\\})\n  =\n  \\sum_{Z\\subseteq V}\n    p^{|Z|}(1-p)^{|V|-|Z|}H(Z).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nAssociate to each Boolean atom $x:V\\to\\{0,1\\}$ the subset\n$Z(x)=\\{v\\in V:x(v)=1\\}$.  This is a bijection from Boolean atoms to\nsubsets of $V$: its inverse sends a subset $Z$ to the atom whose value at\n$v$ is $1$ exactly when $v\\in Z$.\n\nFor a fixed atom $x$, split the product over $V$ into the coordinates where\n$x(v)=1$ and the coordinates where $x(v)=0$.  The first subproduct is\n$p^{|Z(x)|}$ and the second is $(1-p)^{|V|-|Z(x)|}$, because the two\ncoordinate classes partition $V$.  Therefore the summand indexed by $x$\nis exactly\n\\[\n  p^{|Z(x)|}(1-p)^{|V|-|Z(x)|}H(Z(x)).\n\\]\nReindexing the finite sum along the displayed bijection gives precisely the\nsum over all subsets $Z\\subseteq V$ on the right-hand side.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteBernoulliResidualConditioning":{"name":"FiniteBernoulliResidualConditioning","title":"FiniteBernoulliResidualConditioning","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["FiniteBernoulliPowersetIdentities","FiniteJansonFixedLabelSeparation"],"lean_statement":"lemma FiniteBernoulliResidualConditioning {V : Type v} [Fintype V] [DecidableEq V]\n    (A : Finset V) (p : ℝ) (F : Finset V → ℝ) :\n    (((Finset.univ : Finset V).powerset).filter\n        (fun Z : Finset V => A ⊆ Z)).sum\n      (fun Z : Finset V =>\n        (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) * F Z) =\n      p ^ A.card *\n        (((Finset.univ : Finset V) \\ A).powerset).sum\n          (fun X : Finset V =>\n            (p ^ X.card * (1 - p) ^\n                (((Finset.univ : Finset V) \\ A).card - X.card)) *\n              F (A ∪ X)) := by","lean_proof":"classical\n  have hA : A ⊆ (Finset.univ : Finset V) := by\n    intro x _hx\n    simp\n  have hfilter :\n      ((Finset.univ : Finset V).powerset.filter fun Z : Finset V => A ⊆ Z) =\n        Finset.Icc A (Finset.univ : Finset V) := by\n    ext Z\n    simp [and_comm]\n  rw [hfilter]\n  rw [Finset.Icc_eq_image_powerset hA]\n  rw [Finset.sum_image]\n  · calc\n      (∑ x ∈ ((Finset.univ : Finset V) \\ A).powerset,\n          (p ^ (A ∪ x).card * (1 - p) ^ (Fintype.card V - (A ∪ x).card)) *\n            F (A ∪ x))\n          = ∑ x ∈ ((Finset.univ : Finset V) \\ A).powerset,\n              p ^ A.card *\n                ((p ^ x.card *\n                    (1 - p) ^ (((Finset.univ : Finset V) \\ A).card - x.card)) *\n                  F (A ∪ x)) := by\n            refine Finset.sum_congr rfl ?_\n            intro x hx\n            have hxsub : x ⊆ (Finset.univ : Finset V) \\ A := Finset.mem_powerset.mp hx\n            have hdisj : Disjoint A x := by\n              rw [Finset.disjoint_left]\n              intro a haA hax\n              have := hxsub hax\n              simp [haA] at this\n            have hcard_union : (A ∪ x).card = A.card + x.card := by\n              simpa [Nat.add_comm] using Finset.card_union_of_disjoint hdisj\n            have hcard_sdiff :\n                ((Finset.univ : Finset V) \\ A).card + A.card = Fintype.card V := by\n              have h := Finset.card_sdiff_add_card_eq_card hA\n              rw [Fintype.card]\n              simpa [Nat.add_comm] using h\n            have hxcard_le : x.card ≤ ((Finset.univ : Finset V) \\ A).card :=\n              Finset.card_le_card hxsub\n            have hexp :\n                Fintype.card V - (A.card + x.card) =\n                  ((Finset.univ : Finset V) \\ A).card - x.card := by\n              omega\n            rw [hcard_union, hexp, pow_add]\n            ring\n        _ = p ^ A.card *\n            ∑ x ∈ ((Finset.univ : Finset V) \\ A).powerset,\n              (p ^ x.card *\n                  (1 - p) ^ (((Finset.univ : Finset V) \\ A).card - x.card)) *\n                F (A ∪ x) := by\n            rw [Finset.mul_sum]\n  · intro T hT U hU hEq\n    ext x\n    by_cases hxA : x ∈ A\n    · have hTnot : x ∉ T := by\n        intro hxT\n        have hTsub : T ⊆ (Finset.univ : Finset V) \\ A := Finset.mem_powerset.mp hT\n        have := hTsub hxT\n        simp [hxA] at this\n      have hUnot : x ∉ U := by\n        intro hxU\n        have hUsub : U ⊆ (Finset.univ : Finset V) \\ A := Finset.mem_powerset.mp hU\n        have := hUsub hxU\n        simp [hxA] at this\n      simp [hTnot, hUnot]\n    · have hxEq : x ∈ A ∪ T ↔ x ∈ A ∪ U := by\n        have hEq' : A ∪ T = A ∪ U := hEq\n        rw [hEq']\n      simpa [hxA] using hxEq","tex_statement":"\\begin{helper}\nLet $V$ be a finite set, let $A\\subseteq V$, let $p$ be a real number, and\nlet $F$ be any real-valued function on subsets of $V$.  Then\n\\[\n  \\sum_{\\substack{Z\\subseteq V\\\\ A\\subseteq Z}}\n    p^{|Z|}(1-p)^{|V|-|Z|}F(Z)\n  =\n  p^{|A|}\n  \\sum_{X\\subseteq V\\setminus A}\n    p^{|X|}(1-p)^{|V\\setminus A|-|X|}F(A\\cup X).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nEvery subset $Z\\subseteq V$ with $A\\subseteq Z$ is uniquely of the form\n$Z=A\\cup X$ with $X\\subseteq V\\setminus A$, namely\n$X=Z\\setminus A$.  Conversely, if $X\\subseteq V\\setminus A$, then\n$A\\cup X\\subseteq V$ and contains $A$.  This gives a bijection between the\nsummation domain on the left and the residual subsets $X\\subseteq V\\setminus A$.\n\nFor such an $X$, the sets $A$ and $X$ are disjoint.  Hence\n$|A\\cup X|=|A|+|X|$.  Also $|V|=|A|+|V\\setminus A|$, because $A\\subseteq V$.\nTherefore\n\\[\n  |V|-|A\\cup X|\n  =\n  |V\\setminus A|-|X|.\n\\]\nSubstituting $Z=A\\cup X$ into the Bernoulli atom weight gives\n\\[\n  p^{|Z|}(1-p)^{|V|-|Z|}\n  =\n  p^{|A|+|X|}(1-p)^{|V\\setminus A|-|X|}\n  =\n  p^{|A|}p^{|X|}(1-p)^{|V\\setminus A|-|X|}.\n\\]\nThus each left-hand summand transported through the bijection is\n$p^{|A|}$ times the corresponding residual Bernoulli summand, and this\ncommon factor may be pulled outside the finite sum.  The displayed identity\nfollows.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonConditionalJensenMoment":{"name":"FiniteJansonConditionalJensenMoment","title":"FiniteJansonConditionalJensenMoment","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["FiniteJansonFixedLabelSeparation"],"lean_statement":"lemma FiniteJansonConditionalJensenMoment {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (i : Ω) :\n    ∀ s : ℝ, 0 ≤ s →\n      Real.exp (-(s * (((Finset.univ : Finset Ω).sum\n        (fun j : Ω => if (G i ∩ G j).Nonempty then p ^ (G i ∪ G j).card else 0)) /\n          p ^ (G i).card))) ≤\n      (Finset.univ :\n          Finset {X : Finset V // X ∈ ((Finset.univ : Finset V) \\ G i).powerset}).sum\n        (fun X =>\n          (p ^ X.val.card *\n              (1 - p) ^ (((Finset.univ : Finset V) \\ G i).card - X.val.card)) *\n            Real. 003cp\u003c1$, and let $(G_j)_{j\\in I}$ be a finite labelled family of subsets of\n$V$.  Fix a label $i$ and write $R=V\\setminus G_i$.  For a residual subset\n$X\\subseteq R$, set\n\\[\n  Y_i(X)=|\\{j:G_i\\cap G_j\\ne\\varnothing,\\;G_j\\subseteq G_i\\cup X\\}|\n\\]\nand\n\\[\n  D_i=\\sum_{j:G_i\\cap G_j\\ne\\varnothing}p^{|G_i\\cup G_j|}.\n\\]\nIf $s\\ge0$, then\n\\[\n  \\exp\\!\\left(-s\\,{D_i\\over p^{|G_i|}}\\right)\n  \\le\n  \\sum_{X\\subseteq R}\n    p^{|X|}(1-p)^{|R|-|X|}\\exp(-sY_i(X)).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nThe residual Bernoulli weights\n\\[\n  w_X=p^{|X|}(1-p)^{|R|-|X|}\n\\]\nare nonnegative and sum to one, since\n\\[\n  \\sum_{X\\subseteq R}p^{|X|}(1-p)^{|R|-|X|}\n  =(p+(1-p))^{|R|}=1.\n\\]\nApplying finite Jensen, \\texttt{ConvexOn.map\\_sum\\_le} specialized to the\nconvex exponential function, to the residual subsets with weights $w_X$\nand points $-sY_i(X)$ gives\n\\[\n  \\exp\\!\\left(-s\\sum_{X\\subseteq R}w_XY_i(X)\\right)\n  \\le\n  \\sum_{X\\subseteq R}w_X\\exp(-sY_i(X)).\n\\]\nIt remains to compute the residual first moment.\n\nExpanding $Y_i(X)$ and interchanging the two finite sums gives\n\\[\n  \\sum_{X\\subseteq R}w_XY_i(X)\n  =\n  \\sum_{j:G_i\\cap G_j\\ne\\varnothing}\n  \\sum_{\\substack{X\\subseteq R\\\\G_j\\subseteq G_i\\cup X}} w_X .\n\\]\nFor a fixed $j$, because $X\\subseteq R=V\\setminus G_i$, the condition\n$G_j\\subseteq G_i\\cup X$ is equivalent to $G_j\\setminus G_i\\subseteq X$.\nHence the inner sum is\n\\[\n  \\sum_{\\substack{X\\subseteq R\\\\G_j\\setminus G_i\\subseteq X}}\n    p^{|X|}(1-p)^{|R|-|X|}\n  =\n  p^{|G_j\\setminus G_i|},\n\\]\nby the binomial expansion on the remaining coordinates\n$R\\setminus(G_j\\setminus G_i)$.  Finally\n\\[\n  p^{|G_j\\setminus G_i|}\n  =\n  {p^{|G_i\\cup G_j|}\\over p^{|G_i|}},\n\\]\nbecause $G_i\\subseteq G_i\\cup G_j$ and\n$|G_i\\cup G_j|-|G_i|=|G_j\\setminus G_i|$, while $p^{|G_i|}>0$.\nSumming over the intersecting labels yields\n\\[\n  \\sum_{X\\subseteq R}w_XY_i(X)=D_i/p^{|G_i|}.\n\\]\nSubstituting this identity into the Jensen inequality proves the displayed\nclaim.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonResidualFactorsDecreasing":{"name":"FiniteJansonResidualFactorsDecreasing","title":"FiniteJansonResidualFactorsDecreasing","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["FiniteJansonBooleanHarrisDisjointComparison","FiniteJansonFixedLabelSeparation"],"lean_statement":"lemma FiniteJansonResidualFactorsDecreasing {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (i : Ω) :\n    ∀ s : ℝ, 0 ≤ s →\n      ∀ X Y : Finset V, X ⊆ Y →\n        Real.exp\n            (-(s *\n              (((Finset.univ : Finset Ω).filter\n                (fun j : Ω =>\n                  (G i ∩ G j).Nonempty ∧ G j ⊆ G i ∪ Y)).card : ℝ))) ≤\n          Real.exp\n            (-(s *\n              (((Finset.univ : Finset Ω).filter\n                (fun j : Ω =>\n                  (G i ∩ G j).Nonempty ∧ G j ⊆ G i ∪ X)).card : ℝ))) ∧\n        Real.exp\n            (-(s *\n              (((Finset.univ : Finset Ω).filter\n                (fun j : Ω =>\n                  ¬ (G i ∩ G j).Nonempty ∧ G j ⊆ G i ∪ Y)).card : ℝ))) ≤\n          Real.exp\n            (-(s *\n              (((Finset.univ : Finset Ω).filter\n                (fun j : Ω =>\n                  ¬ (G i ∩ G j).Nonempty ∧ G j ⊆ G i ∪ X)).card : ℝ))) := by","lean_proof":"classical\n  intro s hs X Y hXY\n  constructor\n  · apply Real.exp_le_exp.mpr\n    have hcard :\n        (((Finset.univ : Finset Ω).filter\n          (fun j : Ω =>\n            (G i ∩ G j).Nonempty ∧ G j ⊆ G i ∪ X)).card : ℝ) ≤\n          (((Finset.univ : Finset Ω).filter\n            (fun j : Ω =>\n              (G i ∩ G j).Nonempty ∧ G j ⊆ G i ∪ Y j\\subseteq G_i\\cup X$, then $G_j\\subseteq G_i\\cup Y$, because\n$G_i\\cup X\\subseteq G_i\\cup Y$.  Therefore the set of intersecting labels\ncounted for $X$ is contained in the set of intersecting labels counted for\n$Y$, and the same containment holds for the disjoint labels.  The two\ncorresponding cardinalities are thus weakly larger at $Y$ than at $X$.\n\nSince $s\\ge0$, multiplying these cardinality inequalities by $s$ preserves\nthe order, and then applying the negative sign reverses it.  The exponential\nfunction is increasing, so the two displayed exponential factors at $Y$ are\nat most the corresponding factors at $X$.  This proves the claimed\ndecreasing property for both residual factors.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteProductHarrisKleitman":{"name":"FiniteProductHarrisKleitman","title":"FiniteProductHarrisKleitman","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["FiniteJansonBooleanHarrisDisjointComparison","FiniteJansonFixedLabelSeparation","FiniteJansonOneLabelNumeratorSeparation","FiniteJansonNumeratorLowerBound","FiniteJansonLogDerivativeBound"],"lean_statement":"lemma FiniteProductHarrisKleitman {V : Type u} [Fintype V] [DecidableEq V]\n    (p : ℝ) (hp : 0 ≤ p ∧ p ≤ 1)\n    (f g : (V → Bool) → ℝ)\n    (hf : ∀ x y : V → Bool, (∀ v : V, x v = true → y v = true) → f y ≤ f x)\n    (hg : ∀ x y : V → Bool, (∀ v : V, x v = true → y v = true) → g y ≤ g x) :\n    (Finset.univ : Finset (V → Bool)).sum\n        (fun x : V → Bool =>\n          ((Finset.univ : Finset V).prod\n              (fun v : V => if x v then p else 1 - p)) * (f x * g x)) ≥\n      ((Finset.univ : Finset (V → Bool)).sum\n          (fun x : V → Bool =>\n            ((Finset.univ : Finset V).prod\n                (fun v : V => if x v then p else 1 - p)) * f x)) *\n        ((Finset.univ : Finset (V → Bool)).sum\n          (fun x : V → Bool =>\n            ((Finset.univ : Finset V).prod\n                (fun v : V => if x v then p else 1 - p)) * g x)) := by","lean_proof":"classical\n  let μ : (V → Bool) → ℝ :=\n    fun x => (Finset.univ : Finset V).prod (fun v : V => if x v then p else 1 - p)\n  let F : (V → Bool)ᵒᵈ → ℝ :=\n    fun x => ((Finset.univ : Finset (V → Bool)).sum fun y => |f y|) + f (OrderDual.ofDual x)\n  let G : (V → Bool)ᵒᵈ → ℝ :=\n    fun x => ((Finset.univ : Finset (V → Bool)).sum fun y => |g y|) + g (OrderDual.ofDual x)\n  have hμ_nonneg : 0 ≤ fun x : (V → Bool)ᵒᵈ => μ (OrderDual.ofDual x) := by\n    intro x\n    dsimp [μ]\n    exact Finset.prod_nonneg fun v _ => by\n      by_cases hx : OrderDual.ofDual x v\n      · simp [hx, hp.1]\n      · simp [hx, sub_nonneg.mpr hp.2]\n  have hF_nonneg : 0 ≤ F := by\n    intro x\n    dsimp [F]\n    have habs : |f (OrderDual.ofDual x)| ≤\n        (Finset.univ : Finset (V → Bool)).sum fun y => |f y| := by\n      exact Finset.single_le_sum (fun y _ => abs_nonneg (f y)) (Finset.mem_univ _)\n    have hneg : -((Finset.univ : Finset (V → Bool)).sum fun y => |f y|) ≤\n        f (OrderDual.ofDual x) := by\n      exact neg_le.mp ((neg_le_abs (f (OrderDual.ofDual x))).trans habs)\n    linarith\n  have hG_nonneg : 0 ≤ G := by\n    intro x\n    dsimp [G]\n    have habs : |g (OrderDual.ofDual x)| ≤\n        (Finset.univ : Finset (V → Bool)).sum fun y => |g y| := by\n      exact Finset.single_le_sum (fun y _ => abs_nonneg (g y)) (Finset.mem_univ _)\n    have hneg : -((Finset.univ : Finset (V → Bool)).sum fun y => |g y|) ≤\n        g (OrderDual.ofDual x) := by\n      exact neg_le.mp ((neg_le_abs (g (OrderDual.ofDual x))).trans habs)\n    linarith\n  have hF_mono : Monotone F := by\n    intro x y hxy\n    dsimp [F]\n    gcongr\n    apply hf\n    intro v hv\n    exact Bool.eq_true_of_not_eq_false (fun hyfalse => by\n      have hle : OrderDual.ofDual y v ≤ OrderDual.ofDual x v := hxy v\n      exact Bool.false_eq_true.mp ((by simp [hyfalse] : OrderDual.ofDual x v = false).symm.trans\n        (hle (by simp [hv]))))\n  have hG_mono : Monotone G := by\n    intro x y hxy\n    dsimp [G]\n    gcongr\n    apply hg\n    intro v hv\n    exact Bool.eq_true_of_not_eq_false (fun hyfalse => by\n      have hle : OrderDual.ofDual y v ≤ OrderDual.ofDual x v := hxy v\n      exact Bool.false_eq_true.mp ((by simp [hyfalse] : OrderDual.ofDual x v = false).symm.trans\n        (hle (by simp [hv]))))\n  have hμ_log :\n      ∀ a b : (V → Bool)ᵒᵈ,\n        μ (OrderDual.ofDual a) * μ (OrderDual.ofDual b) ≤\n          μ (OrderDual.ofDual (a ⊓ b)) * μ (OrderDual.ofDual (a ⊔ b)) := by\n    intro a b\n    dsimp [μ]\n    rw [← Finset.prod_mul_distrib, ← Finset.prod_mul_distrib]\n    refine Finset.prod_le_prod (fun v _ => mul_nonneg ?_ ?_) (fun v _ => ?_)\n    · by_cases ha : OrderDual.ofDual a v \u003c;> simp [ha, hp.1, sub_nonneg.mpr hp.2]\n    · by_cases hb : OrderDual.ofDual b v \u003c;> simp [hb, hp.1, sub_nonneg.mpr hp.2]\n    · by_cases ha : OrderDual.ofDual a v \u003c;> by_cases hb : OrderDual.ofDual b v \u003c;>\n        simp [ha, hb, mul_comm]\n  have hμ_sum_base : (∑ x : V → Bool, μ x) = 1 := by\n    dsimp [μ]\n    rw [← Fintype.prod_sum (fun _v : V => fun b : Bool => if b then p else 1 - p)]\n    simp [show p + (1 - p) = (1 : ℝ) by ring]\n  have hμ_sum : (∑ x : (V → Bool)ᵒᵈ, μ (OrderDual.ofDual x)) = 1 := by\n    simpa [hμ_sum_base] using (OrderDual.ofDual (α := V → Bool)).sum_comp μ\n  have hfkg := fkg (μ := fun x : (V → Bool)ᵒᵈ => μ (OrderDual.ofDual x))\n    (f := F) (g := G) hμ_nonneg hF_nonneg hG_nonneg hF_mono hG_mono hμ_log\n  change (∑ x : V → Bool, μ x * (f x * g x)) ≥\n      (∑ x : V → Bool, μ x * f x) * (∑ x : V → Bool, μ x * g x)\n  change (∑ x : V → Bool, μ x * f x) * (∑ x : V → Bool, μ x * g x) ≤\n      ∑ x : V → Bool, μ x * (f x * g x)\n  let Cf : ℝ := (Finset.univ : Finset (V → Bool)).sum fun y => |f y|\n  let Cg : ℝ := (Finset.univ : Finset (V → Bool)).sum fun y => |g y|\n  have hsumF : (∑ x : (V → Bool)ᵒᵈ, μ (OrderDual.ofDual x) * F x) =\n      Cf + ∑ x : V → Bool, μ x * f x := by\n    calc\n      (∑ x : (V → Bool)ᵒᵈ, μ (OrderDual.ofDual x) * F x)\n          = ∑ x : V → Bool, μ x * (Cf + f x) := by\n            simpa [F, Cf] using\n              (OrderDual.ofDual (α := V → Bool)).sum_comp\n                (fun x : V → Bool => μ x * (Cf + f x))\n      _ = Cf * (∑ x : V → Bool, μ x) + ∑ x : V → Bool, μ x * f x := by\n            simp_rw [mul_add]\n            rw [Finset.sum_add_distrib]\n            congr 1\n            rw [← Finset.sum_mul]\n            ring\n      _ = Cf + ∑ x : V → Bool, μ x * f x := by\n            rw [hμ_sum_base]\n            ring\n  have hsumG : (∑ x : (V → Bool)ᵒᵈ, μ (OrderDual.ofDual x) * G x) =\n      Cg + ∑ x : V → Bool, μ x * g x := by\n    calc\n      (∑ x : (V → Bool)ᵒᵈ, μ (OrderDual.ofDual x) * G x)\n          = ∑ x : V → Bool, μ x * (Cg + g x) := by\n            simpa [G, Cg] using\n              (OrderDual.ofDual (α := V → Bool)).sum_comp\n                (fun x : V → Bool => μ x * (Cg + g x))\n      _ = Cg * (∑ x : V → Bool, μ x) + ∑ x : V → Bool, μ x * g x := by\n            simp_rw [mul_add]\n            rw [Finset.sum_add_distrib]\n            congr 1\n            rw [← Finset.sum_mul]\n            ring\n      _ = Cg + ∑ x : V → Bool, μ x * g x := by\n            rw [hμ_sum_base]\n            ring\n  have hsumFG :\n      (∑ x : (V → Bool)ᵒᵈ, μ (OrderDual.ofDual x) * (F x * G x)) =\n        Cf * Cg + Cf * (∑ x : V → Bool, μ x * g x) +\n          Cg * (∑ x : V → Bool, μ x * f x) +\n          ∑ x : V → Bool, μ x * (f x * g x) := by\n    calc\n      (∑ x : (V → Bool)ᵒᵈ, μ (OrderDual.ofDual x) * (F x * G x))\n          = ∑ x : V → Bool, μ x * ((Cf + f x) * (Cg + g x)) := by\n            simpa [F, G, Cf, Cg] using\n              (OrderDual.ofDual (α := V → Bool)).sum_comp\n                (fun x : V → Bool => μ x * ((Cf + f x) * (Cg + g x)))\n      _ = Cf * Cg * (∑ x : V → Bool, μ x) +\n            Cf * (∑ x : V → Bool, μ x * g x) +\n            Cg * (∑ x : V → Bool, μ x * f x) +\n            ∑ x : V → Bool, μ x * (f x * g x) := by\n            simp_rw [mul_add, add_mul]\n            repeat rw [Finset.sum_add_distrib]\n            ring_nf\n            repeat rw [Finset.sum_add_distrib]\n            ring_nf\n            rw [show (∑ x : V → Bool, Cg * μ x * f x) =\n                Cg * ∑ x : V → Bool, μ x * f x by\n              rw [Finset.mul_sum]\n              congr with x\n              ring]\n            rw [show (∑ x : V → Bool, Cf * μ x * g x) =\n                Cf * ∑ x : V → Bool, μ x * g x by\n              rw [Finset.mul_sum]\n              congr with x\n              ring]\n            rw [show (∑ x : V → Bool, Cf * Cg * μ x) =\n                Cf * Cg * ∑ x : V → Bool, μ x by\n              rw [← Finset.mul_sum]]\n            rw [show (∑ x : V → Bool, μ x * g x * f x) =\n                ∑ x : V → Bool, μ x * f x * g x by\n              congr with x\n              ring]\n            ring_nf\n      _ = Cf * Cg + Cf * (∑ x : V → Bool, μ x * g x) +\n            Cg * (∑ x : V → Bool, μ x * f x) +\n            ∑ x : V → Bool, μ x * (f x * g x) := by\n            rw [hμ_sum_base]\n            ring\n  have hshift : (Cf + ∑ x : V → Bool, μ x * f x) *\n        (Cg + ∑ x : V → Bool, μ x * g x) ≤\n      Cf * Cg + Cf * (∑ x : V → Bool, μ x * g x) +\n        Cg * (∑ x : V → Bool, μ x * f x) +\n        ∑ x : V → Bool, μ x * (f x * g x) := by\n    simpa [hsumF, hsumG, hsumFG, hμ_sum] using hfkg\n  nlinarith","tex_statement":"\\begin{lemma}\nLet $V$ be a finite set and let $0\\le p\\le1$.  Give $\\{0,1\\}^V$ the product\nmeasure in which each coordinate is $1$ with probability $p$ and $0$ with\nprobability $1-p$.  If $f,g:\\{0,1\\}^V\\to\\mathbb R$ are both decreasing in\nthe coordinatewise order, then\n\\[\n    \\mathbb E(fg)\\ge \\mathbb E f\\,\\mathbb E g .\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nWe prove the finite product-measure Harris--Kleitman inequality by induction\non $|V|$.  If $V=\\varnothing$, there is only one configuration, so\n$\\mathbb E(fg)=fg=(\\mathbb E f)(\\mathbb E g)$.\n\nAssume the assertion is known for sets with one fewer coordinate and choose\none coordinate $v\\in V$.  Write $W=V\\setminus\\{v\\}$.  For a configuration\n$x\\in\\{0,1\\}^W$, define\n\\[\n    f_0(x)=f(x\\text{ with }v=0),\\quad\n    f_1(x)=f(x\\text{ with }v=1),\n\\]\nand define $g_0,g_1$ in the same way.  Because $f$ and $g$ are decreasing,\neach of $f_0,f_1,g_0,g_1$ is decreasing as a function on $\\{0,1\\}^W$, and\nalso\n\\[\n    f_0(x)\\ge f_1(x),\\qquad g_0(x)\\ge g_1(x)\n\\]\nfor every $x$.\n\nLet $\\mathbb E_W$ denote expectation over the product measure on the\nremaining coordinates $W$, and put\n\\[\n    A_b=\\mathbb E_W f_b,\\qquad B_b=\\mathbb E_W g_b\n    \\quad (b=0,1).\n\\]\nThe pointwise inequalities above imply $A_0\\ge A_1$ and $B_0\\ge B_1$.\nApplying the induction hypothesis on $W$ separately to the pairs\n$(f_0,g_0)$ and $(f_1,g_1)$ gives\n\\[\n    \\mathbb E_W(f_b g_b)\\ge A_bB_b\\qquad (b=0,1).\n\\]\nSplitting according to the value of the coordinate $v$,\n\\[\n\\begin{aligned}\n    \\mathbb E(fg)\n    &=(1-p)\\mathbb E_W(f_0g_0)+p\\mathbb E_W(f_1g_1)\\\\\n    &\\ge (1-p)A_0B_0+pA_1B_1 .\n\\end{aligned}\n\\]\nOn the other hand\n\\[\n    \\mathbb E f=(1-p)A_0+pA_1,\\qquad\n    \\mathbb E g=(1-p)B_0+pB_1 .\n\\]\nTherefore\n\\[\n\\begin{aligned}\n &(1-p)A_0B_0+pA_1B_1\n      -\\bigl((1-p)A_0+pA_1\\bigr)\n       \\bigl((1-p)B_0+pB_1\\bigr)\\\\\n &\\qquad =p(1-p)(A_0-A_1)(B_0-B_1)\\ge0,\n\\end{aligned}\n\\]\nbecause $0\\le p\\le1$, $A_0\\ge A_1$, and $B_0\\ge B_1$.  Combining the last\nthree displayed inequalities gives\n$\\mathbb E(fg)\\ge \\mathbb E f\\,\\mathbb E g$, completing the induction.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteUniformMarkov":{"name":"FiniteUniformMarkov","title":"FiniteUniformMarkov","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["SpiroGoodHistoryEstimate","StageSuccessEstimate"],"lean_statement":"lemma FiniteUniformMarkov {X : Type u} (A : Finset X) (B : X → ℝ)\n    (t b : ℝ) (ht : 0 \u003c t) (hB : ∀ x ∈ A, 0 ≤ B x)\n    (hmean : (∑ x ∈ A, B x) / (A.card : ℝ) ≤ b) :\n    (((A.filter (fun x => B x > t)).card : ℝ) / (A.card : ℝ)) ≤ b / t := by","lean_proof":"classical\n  have hcount : ((A.filter (fun x => B x > t)).card : ℝ) * t ≤\n      ∑ x ∈ A, B x := by\n    calc\n      _ = ∑ x ∈ A.filter (fun x => B x > t), t := by simp\n      _ ≤ ∑ x ∈ A.filter (fun x => B x > t), B x := by\n        exact Finset.sum_le_sum (fun x hx => (Finset.mem_filter.mp hx).2.le)\n      _ ≤ ∑ x ∈ A, B x :=\n        Finset.sum_le_sum_of_subset_of_nonneg (Finset.filter_subset _ _) (fun x hx _ => hB x hx)\n  apply (le_div_iff₀ ht).2\n  rw [div_mul_eq_mul_div]\n  exact (div_le_div_of_nonneg_right hcount (Nat.cast_nonneg _)).trans hmean","tex_statement":"\\begin{lemma}\nLet $A$ be a finite set, let $B:A\\to[0,\\infty)$, and let $t>0$.\nIf $|A|^{-1}\\sum_{x\\in A}B(x)\\le b$, then\n\\[\n  \\frac{|\\{x\\in A:B(x)>t\\}|}{|A|}\\le\\frac b t.\n\\]\nAll divisions use the convention $0/0=0$, so the statement also includes\n$A=\\varnothing$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nWrite $D=\\{x\\in A:B(x)>t\\}$. Summing $t\\le B(x)$ on $D$ and then using\nnonnegativity on $A\\setminus D$ gives\n$|D|t\\le\\sum_{x\\in D}B(x)\\le\\sum_{x\\in A}B(x)$.\nDivide by the nonnegative number $|A|$; if it is zero both quotients are\nzero. Thus $(|D|/|A|)t\\le b$. Division by $t>0$ proves the claim.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"HitProbability":{"name":"HitProbability","title":"HitProbability","kind":"definition","is_target":false,"imports":["Preamble"],"imported_by":["SampledUnionHittingTransfer","StrongSpiroTheorem","ContainmentHitting","IntermediateStoppingEstimate","SpiroTheorem27"],"lean_statement":"noncomputable def HitProbability {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V] (E : Ω → Finset V)\n    (m : ℕ) : ℝ :=","lean_proof":"by\n    classical\n    exact\n      (((Finset.univ : Finset V).powersetCard m).filter\n        (fun W : Finset V => ∃ x : Ω, E x ⊆ W)).card /\n      ((((Finset.univ : Finset V).powersetCard m).card : ℕ) : ℝ)","tex_statement":"\\begin{definition}\nFor a labelled hypergraph $E:\\Omega\\to2^V$ on a finite vertex set and an\ninteger $m$, $\\operatorname{HitProbability}(E,m)$ is the ratio whose numerator\nis the number of $m$-subsets $W\\subseteq V$ containing at least one labelled\nedge $E(x)$ and whose denominator is the total number of $m$-subsets of $V$.\nIf there are no $m$-subsets of $V$, this ratio is interpreted as $0$; when\n$m\\le |V|$, it is the probability that a uniformly chosen $m$-element subset\n$W\\subseteq V$ contains at least one labelled edge.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"KGoodPair":{"name":"KGoodPair","title":"KGoodPair","kind":"definition","is_target":false,"imports":["Preamble"],"imported_by":["FragmentFiltration","WeightedBadPairPathological","WeightedBadPairEstimate"],"lean_statement":"def KGoodPair {Ω : Type u} {V : Type v} [DecidableEq V]\n    (F : Ω → Finset V) (k : ℕ) (x : Ω) (W : Finset V) : Prop :=","lean_proof":"∃ y : Ω, F y ⊆ F x ∪ W ∧ (F y \\ W).card ≤ k","tex_statement":"\\begin{definition}\nLet $F:\\Omega\\to 2^V$ be a labelled family.  For $x\\in\\Omega$,\n$W\\subseteq V$, and an integer $k$, the pair $(F(x),W)$ is\n$k$-good with respect to $F(\\Omega)$ if there is a label $y\\in\\Omega$ such\nthat\n\\[\n    F(y)\\subseteq F(x)\\cup W\n    \\qquad\\text{and}\\qquad\n    |F(y)\\setminus W|\\leq k.\n\\]\nThe pair is $k$-bad if it is not $k$-good.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"LabelMass":{"name":"LabelMass","title":"LabelMass","kind":"definition","is_target":false,"imports":["Preamble"],"imported_by":["DistributionalSmootherSpread","WeightedBadPairPathological","AnchoredOverlapMoment","ContainmentSpread","FiniteFirstFailureBound","LargestEdgeScale","StrongTerminalSpread","SurvivorMassDomination","SpiroToDistributionalSpread","WeightedBadPairEstimate","AnchoredTerminalBinomialMiss","SampledUnionHittingTransfer","AnchoredTerminalEstimate"],"lean_statement":"def LabelMass {Ω : Type u} [Fintype Ω] (μ : Ω → ℝ)\n    (P : Ω → Prop) [DecidablePred P] : ℝ :=","lean_proof":"(Finset.univ.filter P).sum μ","tex_statement":"\\begin{definition}\nFor a finite label set $\\Omega$, a real weight function $\\mu:\\Omega\\to\\mathbb R$,\nand a property $P$ of labels, $\\operatorname{LabelMass}_\\mu(P)$ is the sum of\nthe weights $\\mu(x)$ over all labels $x\\in\\Omega$ satisfying $P(x)$.  This is\nthe tablet's finite-label version of the paper's probability mass notation\n$\\mu(\\{x\\in\\Omega:P(x)\\})$.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"MAtLeastCount":{"name":"MAtLeastCount","title":"MAtLeastCount","kind":"definition","is_target":false,"imports":["Preamble"],"imported_by":["SpiroSpread","SpiroToDistributionalSpread"],"lean_statement":"def MAtLeastCount {Ω : Type u} {V : Type v} [Fintype Ω] [DecidableEq V]\n    (E : Ω → Finset V) (S : Finset V) (t : ℕ) : ℕ :=","lean_proof":"(Finset.univ.filter (fun x : Ω => t ≤ (E x ∩ S).card)).card","tex_statement":"\\begin{definition}\nFor a labelled hypergraph $E:\\Omega\\to2^V$, a set $S\\subseteq V$, and an\ninteger $t\\ge0$, $M_t(S)$ is the number of labels $x\\in\\Omega$ for which\n$|E(x)\\cap S|\\ge t$, counted with label multiplicity.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"PowersetCardinalityPartition":{"name":"PowersetCardinalityPartition","title":"PowersetCardinalityPartition","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["BinomialMedianAtMean"],"lean_statement":"lemma PowersetCardinalityPartition {V : Type v} [Fintype V] [DecidableEq V]\n    (m : ℕ) (w : ℕ → ℝ) :\n    Finset.sum (((Finset.univ : Finset V).powerset).filter\n      (fun Z : Finset V => Z.card ≤ m))\n      (fun Z : Finset V => w Z.card)\n      =\n    Finset.sum (((Finset.range (Fintype.card V + 1)).filter\n      (fun k : ℕ => k ≤ m)))\n      (fun k : ℕ => (Nat.choose (Fintype.card V) k : ℝ) * w k) := by","lean_proof":"classical\n  let s : Finset V := Finset.univ\n  let I : Finset ℕ := (Finset.range (s.card + 1)).filter (fun k : ℕ => k ≤ m)\n  have hcard : s.card = Fintype.card V := by simp [s]\n  have hfilter_eq : (s.powerset.filter (fun Z : Finset V => Z.card ≤ m)) =\n      I.biUnion (fun k : ℕ => s.powersetCard k) := by\n    ext Z\n    rw [Finset.mem_filter, Finset.mem_biUnion]\n    constructor\n    · intro h\n      have hsub : Z ⊆ s := Finset.mem_powerset.mp h.1\n      refine ⟨Z.card, ?_, ?_⟩\n      · simp [I, Nat.lt_succ_of_le (Finset.card_le_card hsub), h.2]\n      · exact Finset.mem_powersetCard.mpr ⟨hsub, rfl⟩\n    · rintro ⟨k, hkI, hkZ⟩\n      have hkZ' := Finset.mem_powersetCard.mp hkZ\n      exact ⟨Finset.mem_powerset.mpr hkZ'.1, by\n        rw [hkZ'.2]\n        exact (Finset.mem_filter.mp hkI).2⟩\n  have hpd : Set.PairwiseDisjoint (↑I : Set ℕ) (fun k : ℕ => s.powersetCard k) := by\n    exact s.pairwise_disjoint_powersetCard.set_pairwise I\n  calc\n    Finset.sum (((Finset.univ : Finset V).powerset).filter\n        (fun Z : Finset V => Z.card ≤ m))\n        (fun Z : Finset V => w Z.card)\n        = Finset.sum (s.powerset.filter (fun Z : Finset V => Z.card ≤ m))\n          (fun Z : Finset V => w Z.card) := by\n          simp [s]\n    _ = Finset.sum (I.biUnion (fun k : ℕ => s.powersetCard k))\n          (fun Z : Finset V => w Z.card) := by\n          rw [hfilter_eq]\n    _ = Finset.sum I (fun k : ℕ => Finset.sum (s.powersetCard k)\n          (fun Z : Finset V => w Z.card)) := by\n          rw [Finset.sum_biUnion hpd]\n    _ = Finset.sum I (fun k : ℕ => (Nat.choose s.card k : ℝ) * w k) := by\n          refine Finset.sum_congr rfl ?_\n          intro k _hk\n          calc\n            Finset.sum (s.powersetCard k) (fun Z : Finset V => w Z.card)\n                = Finset.sum (s.powersetCard k) (fun _Z : Finset V => w k) := by\n                    refine Finset.sum_congr rfl ?_\n                    intro Z hZ\n                    rw [(Finset.mem_powersetCard.mp hZ).2]\n            _ = (Nat.choose s.card k : ℝ) * w k := by\n                    simp [Finset.card_powersetCard, nsmul_eq_mul]\n    _ = Finset.sum (((Finset.range (Fintype.card V + 1)).filter\n        (fun k : ℕ => k ≤ m)))\n        (fun k : ℕ => (Nat.choose (Fintype.card V) k : ℝ) * w k) := by\n          simp [I, hcard]","tex_statement":"\\begin{helper}\nLet $V$ be a finite set, let $m$ be a nonnegative integer, and let\n$w:\\mathbb N\\to\\mathbb R$ be any function of one integer variable.  Then\n\\[\n  \\sum_{\\substack{Z\\subseteq V\\\\ |Z|\\le m}} w(|Z|)\n  =\n  \\sum_{\\substack{0\\le k\\le |V|\\\\ k\\le m}}\n    \\binom{|V|}{k} w(k).\n\\]\n\\end{helper}","tex_proof":"\\begin{proof}\nPartition the family of subsets $Z\\subseteq V$ with $|Z|\\le m$ according\nto their cardinality.  For each integer $k$, the $k$th part of this\npartition is the family of all $k$-element subsets of $V$.  These parts are\npairwise disjoint, because a subset has only one cardinality, and their\nunion is exactly the family of subsets with $|Z|\\le m$: if $Z$ is in the\nleft-hand family, it belongs to the part indexed by $k=|Z|$, and conversely\nevery member of a part indexed by $k\\le m$ has size at most $m$.\n\nOn the part indexed by $k$, the summand $w(|Z|)$ is constantly equal to\n$w(k)$.  Therefore the contribution of that part is\n\\[\n  \\#\\{Z\\subseteq V: |Z|=k\\}\\,w(k).\n\\]\nThe number of $k$-element subsets of a finite set of size $|V|$ is\n$\\binom{|V|}{k}$.  Summing these contributions over exactly those indices\n$k$ with $0\\le k\\le |V|$ and $k\\le m$ gives the displayed identity.\n\\end{proof}","tex_env":"helper","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"ProbabilityMass":{"name":"ProbabilityMass","title":"ProbabilityMass","kind":"definition","is_target":false,"imports":["Preamble"],"imported_by":["DistributionalSmootherSpread","AnchoredOverlapMoment","ContainmentSpread","FiniteFirstFailureBound","LargestEdgeScale","StrongTerminalSpread","SurvivorMassDomination","SampledUnionLaw","UniformExtensionKernel","SpiroToDistributionalSpread","FiniteBernoulliUniformVariance","UniformExtensionKernelFirstMarginal","WeightedBadPairNonpathologicalCount","WeightedBadPairPathologicalCount","WeightedBadPairEstimate","AnchoredTerminalBinomialMiss","UniformExtensionCoupling","SampledUnionHittingTransfer","BinomialToUniformAdditiveTransfer","ContainmentBinomialToUniformTransfer","AnchoredTerminalEstimate","ContainmentBinomialHitting","ContainmentHitting","IntermediateStoppingEstimate"],"lean_statement":"def ProbabilityMass {Ω : Type u} [Fintype Ω] (μ : Ω → ℝ) : Prop :=","lean_proof":"(∀ x : Ω, 0 ≤ μ x) ∧ (∑ x : Ω, μ x) = 1","tex_statement":"\\begin{definition}\nA real weight function $\\mu:\\Omega\\to\\mathbb R$ on a finite label set is a\nprobability mass if every label has nonnegative weight and the sum of all\nlabel weights is $1$.  This formalizes the paper's phrase ``a probability\ndistribution on the labelled hypergraph'' as a distribution on labels.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"UniformEdges":{"name":"UniformEdges","title":"UniformEdges","kind":"definition","is_target":false,"imports":["Preamble"],"imported_by":["FragmentFiltration","LargestEdgeScale","WeightedBadPairNonpathologicalCount","WeightedBadPairPathologicalCount","WeightedBadPairEstimate","StrongSpiroTheorem","IntermediateStoppingEstimate","SpiroTheorem27"],"lean_statement":"def UniformEdges {Ω : Type u} {V : Type v} (E : Ω → Finset V) (r : ℕ) : Prop :=","lean_proof":"∀ x : Ω, (E x).card = r","tex_statement":"\\begin{definition}\nA labelled family of finite edges $E:\\Omega\\to 2^V$ is $r$-uniform if every\nlabelled edge has cardinality exactly $r$.\n\\end{definition}","tex_proof":"","tex_env":"definition","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (definition)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"WeightedBadPairHypergeometricFactor":{"name":"WeightedBadPairHypergeometricFactor","title":"WeightedBadPairHypergeometricFactor","kind":"lemma","is_target":false,"imports":["Preamble"],"imported_by":["WeightedBadPairPathologicalCount"],"lean_statement":"lemma WeightedBadPairHypergeometricFactor (n r m t j : ℕ) (p : ℝ)\n    (hr : 1 ≤ r) (hm_large : 2 * r ≤ m) (hm_small : 2 * m ≤ n)\n    (ht : t ≤ r) (hj : j ≤ r) (hp : 0 \u003c p)\n    (hm : (m : ℝ) = p * n) :\n    (((m - t).choose (r - j) : ℝ) / ((n - r).choose (r - j) : ℝ)) ≤\n      (((m - t + r).choose r : ℝ) / (n.choose r : ℝ)) *\n        (p / 2) ^ (-(j : ℝ)) := by","lean_proof":"classical\n  let w := m - t\n  let d := r - j\n  have hn4 : 4 * r ≤ n := by omega\n  have hrw : r ≤ w := by dsimp [w]; omega\n  have hwm : w ≤ m := Nat.sub_le _ _\n  have hwrn : w + r ≤ n := by omega\n  have hwN : w ≤ n - r := by omega\n  have hdw : d ≤ w := by dsimp [d]; omega\n  have hdN : d ≤ n - r := hdw.trans hwN\n  have hrn : r ≤ n := by omega\n  have hwpos : 0 \u003c (w : ℝ) := by exact_mod_cast (show 0 \u003c w by omega)\n  have hNpos : 0 \u003c ((n - r : ℕ) : ℝ) :=\n    by exact_mod_cast (show 0 \u003c n - r by omega)\n  have hwNreal : (w : ℝ) ≤ ((n - r : ℕ) : ℝ) := by exact_mod_cast hwN\n  have hncast : (n : ℝ) = ((n - r : ℕ) : ℝ) + r := by\n    exact_mod_cast (Nat.sub_add_cancel hrn).symm\n  have choose_ratio (a b k : ℕ) :\n      (a.choose k : ℝ) / (b.choose k : ℝ) =\n        ∏ i ∈ Finset.range k, ((a - i : ℕ) : ℝ) / ((b - i : ℕ) : ℝ) := by\n    have hfact : (k.factorial : ℝ) ≠ 0 := by positivity\n    have ha : (a.descFactorial k : ℝ) = (k.factorial : ℝ) * (a.choose k : ℝ) := by\n      exact_mod_cast Nat.descFactorial_eq_factorial_mul_choose a k\n    have hb : (b.descFactorial k : ℝ) = (k.factorial : ℝ) * (b.choose k : ℝ) := by\n      exact_mod_cast Nat.descFactorial_eq_factorial_mul_choose b k\n    rw [Finset.prod_div_distrib, ← Nat.cast_prod, ← Nat.cast_prod,\n      ← Nat.descFactorial_eq_prod_range, ← Nat.descFactorial_eq_prod_range, ha, hb]\n    exact (mul_div_mul_left _ _ hfact).symm\n  have hfirst : (w.choose d : ℝ) / ((n - r).choose d : ℝ) ≤\n      ((w : ℝ) / ((n - r : ℕ) : ℝ)) ^ d := by\n    rw [choose_ratio]\n    calc\n      _ ≤ ∏ _i ∈ Finset.range d, (w : ℝ) / ((n - r : ℕ) : ℝ) := by\n        apply Finset.prod_le_prod\n        · intr
