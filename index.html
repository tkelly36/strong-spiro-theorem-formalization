 Good ε (fun _ => trivial)\n    (fun j _ h W hh => ((hrec j h W).mp hh).1)\n    (fun j _ => hε j) (by simpa only using hlocal)\n  have hfinal : (∑ j ∈ Finset.range d, ε j) ≤\n      6 * (ℓ : ℝ) ^ 2 * (C / 4) ^ (-(r d : ℝ) / 2) := by\n    calc\n      _ ≤ ∑ _j ∈ Finset.range d, 6 * (ℓ : ℝ) * (C / 4) ^ (-(r d : ℝ) / 2) := by\n        apply Finset.sum_le_sum\n        intro j hj\n        apply mul_le_mul_of_nonneg_left _ (by positivity)\n        apply Real.rpow_le_rpow_of_exponent_le hbase\n        have hr : (r d : ℝ) ≤ r (j + 1) := by\n          exact_mod_cast hrmono (j + 1) d (by simpa using Finset.mem_range.mp hj) (by omega)\n        linarith\n      _ ≤ _ := by\n        simp only [Finset.sum_const, Finset.card_range, nsmul_eq_mul]\n        have hdR : (d : ℝ) ≤ ℓ := by exact_mod_cast (Nat.le_of_lt hd)\n        calc\n          _ ≤ (ℓ : ℝ) * (6 * (ℓ : ℝ) * (C / 4) ^ (-(r d : ℝ) / 2)) :=\n            mul_le_mul_of_nonneg_right hdR (by positivity)\n          _ = _ := by ring\n  simpa only [Fintype.card_fun, Fintype.card_fin, Nat.cast_pow] using hb.trans hfinal","tex_statement":"\\begin{lemma}\nLet $E:\\Omega\\to2^V$ have a $(q;r_0,\\ldots,r_\\ell)$-spread probability\nmass $\\mu$, let $C\\ge8$, and let $0\\le d\u003c\\ell$ with $\\ell>0$.\nWrite $n=|V|>0$. Let $0\u003ck\\le n$ satisfy $k\\ge Cqn$ and, if $d>0$,\n$k\\le n/2$ and $k\\ge2r_0$.\nSuppose survivor predicates $S(L,x)$ and fragments $F(L,x)$ are defined\nfor all finite lists $L$ of subsets of $V$. Assume $S([],x)$ for every\nlabel. Whenever $|L|+1\u003c\\ell$, assume\n\\[\n S(W::L,x)\\Longleftrightarrow\n x\\in S(L)\\text{ and }(F(L,x),W)\\text{ is }r_{|L|+1}\\text{-good\n with respect to }\\{F(L,y):y\\in S(L)\\}.\n\\]\nIn particular assume $S(W::L)\\subseteq S(L)$ at these transitions.\nFor $|L|\u003c\\ell$ and $x\\in S(L)$, assume\n$F(L,x)\\subseteq E(x)$ and $|F(L,x)|=r_{|L|}$.\n\nPut $X=\\binom Vk$. There are predicates $G_j$ on histories $h\\in X^j$\nwith the following properties. Write $L(h)=[h_{j-1},\\ldots,h_0]$,\n$M(h)=\\mu(S(L(h)))$, and\n$\\nu_h(x)=\\mathbf1_{S(L(h))}(x)\\mu(x)/M(h)$.\nEvery empty history is good. For $j\u003cd$, a history extended by $W$ is good\nif and only if $h$ is good and\n\\[\n \\mu(S(L(h))\\setminus S(W::L(h)))\\le M(h)/(2\\ell).\n\\]\nFor $j\\le d$ and $G_j(h)$,\n\\[\n M(h)\\ge1-j/(2\\ell)\\ge1/2,\n \\qquad \\nu_h\\text{ is a probability mass},\\qquad\n \\nu_h(x)=0\\ (x\\notin S(L(h))),\\qquad \\nu_h(x)\\le2\\mu(x).\n\\]\nFor independent uniform samples from $X$, the bad-history probability is\n\\[\n \\frac{|\\{h\\in X^d:\\neg G_d(h)\\}|}{|X^d|}\n \\le6\\ell^2(C/4)^{-r_d/2}.\n\\]\nNo terminal spread hypothesis is imposed.\n\\end{lemma}","tex_proof":"\\begin{proof}\nDefine $G_j(h)$ to mean that every one of its $j$ transitions loses at\nmost the current surviving mass divided by $2\\ell$. This definition is\nmade for every $j$, using the reversed prefixes of $h$. For $j=0$ there\nare no conditions. Appending $W$ adds exactly the displayed last\ncondition, since its reversed list is $W::L(h)$. This proves the asserted\nrecursion for $j\u003cd$.\n\nFix a good history of length $j\\le d$. For each $a\\le j$ let $T_a$ be\nits survivor set after the first $a$ samples. The initialization gives\n$T_0=\\Omega$. Since $a\u003cj\\le d\u003c\\ell$, each transition satisfies\n$a+1\u003c\\ell$, and the assumed survivor inclusion gives $T_{a+1}\\subseteq T_a$.\nThe definition of goodness supplies\n$\\sum_{T_a\\setminus T_{a+1}}\\mu\\le\\sum_{T_a}\\mu/(2\\ell)$.\nApply \\noderef{SurvivorMassDomination} with stopping level $j$ and these\nsets. Its conclusions at level $j$ are precisely the mass lower bound,\nnormalization, support, and pointwise domination asserted above. The\nnonnegativity and total mass one needed here are part of\n\\noderef{DistributionalSmootherSpread}, with the meaning specified by\n\\noderef{ProbabilityMass}. Finite sums over these survivor predicates\nare the masses of \\noderef{LabelMass}.\n\nFor $j\u003cd$ fix a good prefix $h$, and put $L=L(h)$ and $M=M(h)$.\nIn this case $d>0$, so all stage-size assumptions apply. Put\n$p'=k/n$ and $C'=k/(qn)$. The spread definition gives $q>0$; hence\n\\[\n p'=C'q,\\quad C'\\ge C\\ge8,\\quad 0\u003cp'\\le1/2,\\quad k=p'n.\n\\]\nIterating the strictly decreasing scales supplied by\n\\noderef{DistributionalSmootherSpread} gives $r_j\\le r_0$, and therefore\n$2r_j\\le k$. Apply \\noderef{StageExpectedBadMass} with survivor set\n$S(L)$, fragments $F(L,\\cdot)$, and mass $\\nu_h$. Its normalization,\nsupport, and domination hypotheses were proved above; the assumed\nfragment invariants give its cardinality and anchor hypotheses. Thus,\nfor a uniform $W\\in X$, the normalized bad mass $B(W)$ satisfies\n\\[\n \\mathbb E B(W)\\le3(C'/4)^{-r_{j+1}/2}.\n\\]\nHere bad means the negation of the good-pair predicate of\n\\noderef{KGoodPair}, with the label family restricted to $S(L)$.\nThe exact successor equivalence in the assumptions identifies these\nbad labels with $S(L)\\setminus S(W::L)$. Expanding the definition of\n$\\nu_h$ in this finite sum gives\n$B(W)=\\mu(S(L)\\setminus S(W::L))/M$. Since $M\\ge1/2>0$, failure of the\nlast success condition is exactly $B(W)>1/(2\\ell)$.\nNonnegativity of $\\nu_h$ makes $B(W)\\ge0$, so\n\\noderef{FiniteUniformMarkov} gives local failure probability at most\n$6\\ell(C'/4)^{-r_{j+1}/2}$. Since $C'/4\\ge C/4\\ge2$ and the exponent is\nnonpositive, this is at most\n$\\varepsilon_j=6\\ell(C/4)^{-r_{j+1}/2}$.\nThe passage between these finite probabilities and counts on the\nalphabet $X$ changes no weights: sending a subset of cardinality $k$ to\nthat subset with its cardinality proof is a bijection from\n$\\binom Vk$ to $X$. The bijection restricts to the failure event, so both\nits numerator and its denominator agree in the two representations.\nIn the Markov division, the factor is\n$3/(1/(2\\ell))=6\\ell$, since $\\ell>0$.\n\nThe alphabet $X$ is nonempty because $k\\le n$. A uniform history is the\nproduct of the uniform laws on $X$: each tuple has weight\n$|X|^{-d}=|X^d|^{-1}$. Each $\\varepsilon_j$ is nonnegative. Goodness of\nan extension implies goodness of its prefix by its defining recursion.\nApply \\noderef{FiniteFirstFailureBound} with these predicates and the\nlocal estimates just proved. It bounds the bad-history probability by\n$\\sum_{j\u003cd}\\varepsilon_j$.\nFor each $j\u003cd$, strict decrease gives $r_{j+1}\\ge r_d$, so, since\n$C/4\\ge2$, each summand is at most $6\\ell(C/4)^{-r_d/2}$.\nThere are $d\\le\\ell$ summands; their sum is at most the asserted\n$6\\ell^2(C/4)^{-r_d/2}$. If $d=0$, the empty history is good and the\nfailure sum is zero. The same bound follows from nonnegativity, without\nusing any stage-density or stage-largeness assumption.\n\\end{proof}","tex_env":"lemma","semantic_closure":["BoundedEdges","DistributionalSmootherSpread","KGoodPair","LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"StageSuccessEstimate":{"name":"StageSuccessEstimate","title":"StageSuccessEstimate","kind":"lemma","is_target":false,"imports":["FiniteUniformMarkov","FragmentFiltration","StageExpectedBadMass"],"imported_by":["StrongSpiroTheorem","IntermediateStoppingEstimate"],"lean_statement":"lemma StageSuccessEstimate {Ω : Type u} {V : Type v}\n    [Fintype Ω] [DecidableEq Ω] [Fintype V] [DecidableEq V]\n    (E F : Ω → Finset V) (Ωi : Finset Ω) (μ μi : Ω → ℝ)\n    (q C p : ℝ) (r : ℕ → ℕ)\n    (ℓ i m : ℕ)\n    (hspread : DistributionalSmootherSpread E μ q r (ℓ + 1))\n    (hμi : ProbabilityMass μi)\n    (hsupport : ∀ y : Ω, y ∉ Ωi → μi y = 0)\n    (hcond : ∀ y : Ω, μi y ≤ 2 * μ y)\n    (hFunif : ∀ x : Ω, x ∈ Ωi → (F x).card = r i)\n    (hanchor : ∀ x : Ω, x ∈ Ωi → F x ⊆ E x)\n    (hp : p = C * q)\n    (hC : 8 ≤ C)\n    (hp_size : 0 \u003c p ∧ p ≤ (1 / 2 : ℝ))\n    (hℓ : 0 \u003c ℓ)\n    (hi : i + 1 \u003c ℓ)\n    (hm : (m : ℝ) = p * (Fintype.card V : ℝ))\n    (hm_final : 2 * (ℓ : ℝ) * p * (Fintype.card V : ℝ) ≤\n      (Fintype.card V : ℝ))\n    (hm_large : 2 * r i ≤ m) :\n    (((((Finset.univ : Finset V).powersetCard m).filter\n      (fun W : Finset V =>\n        @LabelMass Ω _ μi\n          (fun x : Ω =>\n            ∃ hx : x ∈ Ωi,\n              ¬ @KGoodPair {y : Ω // y ∈ Ωi} V _ (fun y => F y.1)\n                (r (i + 1)) ⟨x, hx⟩ W)\n          (Classical.decPred _) >\n          1 / (2 * (ℓ : ℝ)))).card : ℝ) /\n      ((((Finset.univ : Finset V).powersetCard m).card : ℝ))) ≤\n      6 * (ℓ : ℝ) * (C / 4) ^ (-(r (i + 1) : ℝ) / 2) := by","lean_proof":"classical\n  let A := (Finset.univ : Finset V).powersetCard m\n  let B (W : Finset V) : ℝ :=\n    @LabelMass Ω _ μi\n      (fun x : Ω => ∃ hx : x ∈ Ωi,\n        ¬ @KGoodPair {y : Ω // y ∈ Ωi} V _ (fun y => F y.1)\n          (r (i + 1)) ⟨x, hx⟩ W) (Classical.decPred _)\n  have hexpect := StageExpectedBadMass E F Ωi μ μi q C p r ℓ i m\n    hspread hμi hsupport hcond hFunif hanchor hp hC hp_size hℓ hi hm hm_large\n  have hℓpos : (0 : ℝ) \u003c ℓ := by exact_mod_cast hℓ\n  have ht : (0 : ℝ) \u003c 1 / (2 * (ℓ : ℝ)) := by positivity\n  have hmarkov := FiniteUniformMarkov A B (1 / (2 * (ℓ : ℝ)))\n    (3 * (C / 4) ^ (-(r (i + 1) : ℝ) / 2)) ht\n    (fun W _ => Finset.sum_nonneg (fun x _ => hμi.1 x)) hexpect\n  have heq : (3 * (C / 4) ^ (-(r (i + 1) : ℝ) / 2)) /\n      (1 / (2 * (ℓ : ℝ))) =\n      6 * (ℓ : ℝ) * (C / 4) ^ (-(r (i + 1) : ℝ) / 2) := by\n    field_simp\n    \u003c;> ring\n  rw [heq] at hmarkov\n  exact hmarkov","tex_statement":"\\begin{lemma}\nLet $V$ be an $n$-element set and let $\\Omega$ be a finite label set.  Let\n$E:\\Omega\\to2^V$ be a labelled hypergraph, let $\\mu$ be a probability\ndistribution on $\\Omega$, and let\n$r_0>r_1>\\cdots>r_\\ell$ be positive integer scales.  Assume that $\\mu$ is\n$(q;r_0,\\dots,r_\\ell)$-spread in the sense of\n\\noderef{DistributionalSmootherSpread}.  Let $C\\ge8$, put $p=Cq$, and let\n$m=pn$.  Suppose that the one-stage numerical hypotheses\n\\[\n    0\u003cp\\le\\frac12,\\qquad 2\\ell pn\\le n,\\qquad pn\\ge2r_i\n\\]\nhold.  Fix a stage index $i$ with $i+1\u003c\\ell$.\n\nAfter conditioning on fixed outcomes of the previously exposed random sets\nin the fragment filtration of \\noderef{FragmentFiltration}, suppose that the\nprevious stages were successful.  Regard the current conditional\ndistribution $\\mu_i=\\mu(\\,\\cdot\\mid\\Omega_i)$ as a probability distribution\non $\\Omega$, supported on $\\Omega_i$, and suppose it satisfies the pointwise\ndomination estimate\n\\[\n    \\mu_i(y)\\le2\\mu(y)\n    \\qquad\\text{for every label }y\\in\\Omega .\n\\]\nLet $F_i:\\Omega\\to2^V$ be the current fragment map, extended\narbitrarily off the survivor set if necessary.  More explicitly, on the\nsurvivor set $\\Omega_i$ assume $|F_i(x)|=r_i$ and\n$F_i(x)\\subseteq E(x)$ for every surviving label $x\\in\\Omega_i$.  If $W_i$ is sampled\nuniformly from $\\binom Vm$, then\n\\[\n    \\Pr\\!\\left(\n      \\mu_i\\bigl(\\{x\\in\\Omega_i:(F_i(x),W_i)\n          \\text{ is }r_{i+1}\\text{-bad}\\}\\bigr)\n      >\\frac1{2\\ell}\n    \\right)\n    \\le\n    6\\ell\\left(\\frac C4\\right)^{-r_{i+1}/2}.\n\\]\nEquivalently, with the usual definition that stage $i+1$ is successful when\nthe next survivor set has conditional mass at least $1-1/(2\\ell)$, the\nconditional probability that this stage is not successful is bounded by the\nsame right-hand side.\n\\end{lemma}","tex_proof":"\\begin{proof}\nThe support, probability-mass, domination, fragment-cardinality, and anchor\nhypotheses are local assumptions on the fixed current state; no conditional\nindependence assertion is needed inside this one-stage claim.\nPut\n\\[\n B(W)=\\mu_i\\{x\\in\\Omega_i:(F_i(x),W)\\text{ is }r_{i+1}\\text{-bad in }\n F_i(\\Omega_i)\\}.\n\\]\nBy \\noderef{StageExpectedBadMass}, the stated hypotheses imply\n$\\mathbb E B(W)\\le3(C/4)^{-r_{i+1}/2}$.\nNonnegativity of $B$ follows by summing nonnegative weights, using\n\\noderef{LabelMass} and \\noderef{ProbabilityMass}.\nApply \\noderef{FiniteUniformMarkov} to\n$A=\\binom Vm$ and the positive threshold $1/(2\\ell)$.\nIt yields\n\\[\n \\Pr(B(W)>1/(2\\ell))\n \\le \\frac{3(C/4)^{-r_{i+1}/2}}{1/(2\\ell)}\n =6\\ell(C/4)^{-r_{i+1}/2}.\n\\]\nThe assumption $2\\ell pn\\le n$ is not needed by either of these two local\nsteps. If the state comes from \\noderef{FragmentFiltration}, its exact\nsurvivor equivalence identifies the bad labels with\n$\\Omega_i\\setminus\\Omega_{i+1}$. Since $\\mu_i$ has total mass one on\n$\\Omega_i$, the event $B(W)>1/(2\\ell)$ is precisely failure of the stated\nsuccess condition. This proves the equivalent formulation as well.\n\\end{proof}","tex_env":"lemma","semantic_closure":["BoundedEdges","DistributionalSmootherSpread","KGoodPair","LabelMass","ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"UniformExtensionCoupling":{"name":"UniformExtensionCoupling","title":"UniformExtensionCoupling","kind":"lemma","is_target":false,"imports":["ProbabilityMass","UniformExtensionKernel","UniformExtensionKernelFirstMarginal","UniformExtensionKernelProbabilityMass","UniformExtensionKernelSecondMarginal","UniformExtensionKernelSupport"],"imported_by":["SampledUnionHittingTransfer","BinomialToUniformAdditiveTransfer","ContainmentBinomialToUniformTransfer","AnchoredTerminalEstimate","StrongSpiroTheorem","ContainmentHitting","IntermediateStoppingEstimate"],"lean_statement":"lemma UniformExtensionCoupling {V : Type v} [Fintype V] [DecidableEq V]\n    (Udist : Finset V → ℝ) (m : ℕ)\n    (hprob : ProbabilityMass Udist)\n    (hsize : ∀ U : Finset V, 0 \u003c Udist U → U.card ≤ m)\n    (hinv : ∀ σ : Equiv.Perm V, ∀ U : Finset V, Udist (U.image σ) = Udist U)\n    (hm : m ≤ Fintype.card V) :\n    ∃ J : (Finset V × Finset V) → ℝ,\n      ProbabilityMass J ∧\n      (∀ U : Finset V, Finset.sum Finset.univ (fun W : Finset V => J (U, W)) = Udist U) ∧\n      (∀ W : Finset V,\n        Finset.sum Finset.univ (fun U : Finset V => J (U, W)) =\n          if W.card = m then\n            (((((Finset.univ : Finset V).powersetCard m).card : ℕ) : ℝ))⁻¹\n          else 0) ∧\n      (∀ U W : Finset V, 0 \u003c J (U, W) → U ⊆ W) := by","lean_proof":"refine ⟨UniformExtensionKernel Udist m, ?_, ?_, ?_, ?_⟩\n  · exact UniformExtensionKernelProbabilityMass Udist m hprob hsize hm\n  · exact UniformExtensionKernelFirstMarginal Udist m hprob hsize hm\n  · exact UniformExtensionKernelSecondMarginal Udist m hprob hsize hinv hm\n  · exact UniformExtensionKernelSupport Udist m","tex_statement":"\\begin{lemma}\nLet $V$ be a finite set and let $\\mu$ be a probability mass on subsets\n$U\\subseteq V$.  Suppose that $\\mu$ is invariant under every permutation of\n$V$, that $\\mu(U)>0$ implies $|U|\\le m$, and that $m\\le |V|$.  Then there is a\nprobability mass $J$ on ordered pairs $(U,W)$ of subsets of $V$ such that\n\\[\n    \\sum_W J(U,W)=\\mu(U)\n    \\quad\\text{for every }U\\subseteq V,\n\\]\n\\[\n    \\sum_U J(U,W)=\n    \\begin{cases}\n    |\\binom Vm|^{-1},& |W|=m,\\\\\n    0,& |W|\\ne m,\n    \\end{cases}\n\\]\nand $J(U,W)>0$ only when $U\\subseteq W$.\n\\end{lemma}","tex_proof":"\\begin{proof}\nUse \\noderef{ProbabilityMass} for the meaning of probability mass.  Sample a\nsubset $U$ with law $\\mu$.  If $\\mu(U)>0$, then $|U|\\le m$ by hypothesis.\nConditional on this sampled value of $U$, choose an $(m-|U|)$-element subset\n$R$ of $V\\setminus U$ uniformly at random and set $W=U\\cup R$.  The assumption\n$m\\le |V|$ and the inequality $|U|\\le m$ ensure that such choices exist\nexactly for the sampled values of positive probability, since\n$|V\\setminus U|=|V|-|U|\\ge m-|U|$.\n\nEquivalently, define $J(A,B)$ by\n\\[\n    J(A,B)=\n    \\begin{cases}\n    \\displaystyle\n    \\mu(A)\\binom{|V|-|A|}{m-|A|}^{-1},\n       & A\\subseteq B,\\ |B|=m,\\ |A|\\le m,\\\\\n    0,&\\text{otherwise.}\n    \\end{cases}\n\\]\nFor each $A$ with $\\mu(A)>0$, exactly\n$\\binom{|V|-|A|}{m-|A|}$ sets $B$ satisfy $A\\subseteq B$ and $|B|=m$; they are\nobtained by choosing $B\\setminus A$ from $V\\setminus A$.  Hence the sum of\n$J(A,B)$ over all $B$ is $\\mu(A)$.  If $\\mu(A)=0$, the same marginal identity\nis immediate from the formula.  Summing the first marginal over all $A$ gives\ntotal mass $1$, again by \\noderef{ProbabilityMass}, and every summand is\nnonnegative.  Thus $J$ is a probability mass on pairs.  The displayed formula\nalso shows directly that $J(A,B)>0$ only when $A\\subseteq B$.\n\nIt remains to check that the marginal law of $W$ is uniform on $\\binom Vm$.\nLet $\\pi$ be any permutation of $V$.  Since the law of $U$ is\npermutation-invariant, $\\pi(U)$ has the same distribution as $U$.  Conditional\non $U=A$, the rule chooses $W$ uniformly among the $m$-sets containing $A$;\nafter applying $\\pi$, this is exactly the uniform rule among the $m$-sets\ncontaining $\\pi(A)$.  Hence the law of $W$ is invariant under every\npermutation of $V$.  The law is also supported on the single orbit\n$\\binom Vm$ of the symmetric group acting on $m$-subsets.  A probability\nmeasure supported on one transitive finite orbit and invariant under the\nwhole group is constant on that orbit: if $B$ and $B'$ are two $m$-subsets,\nsome permutation sends $B$ to $B'$, so invariance makes their masses equal.\nSince the second marginal has total mass $1$, each $m$-subset has mass\n$|\\binom Vm|^{-1}$, and every subset of any other size has mass $0$.  This is\nexactly the displayed second marginal.\n\\end{proof}","tex_env":"lemma","semantic_closure":["ProbabilityMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"SampledUnionHittingTransfer":{"name":"SampledUnionHittingTransfer","title":"SampledUnionHittingTransfer","kind":"lemma","is_target":false,"imports":["HitProbability","LabelMass","ProbabilityMass","SampledUnionLaw","UniformExtensionCoupling"],"imported_by":["StrongSpiroTheorem","IntermediateStoppingEstimate"],"lean_statement":"lemma SampledUnionHittingTransfer {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (E : Ω → Finset V) (d k t m : ℕ)\n    (Good : (Fin d → {W : Finset V // W.card = k}) → Prop)\n    (HitFrag : (Fin d → {W : Finset V // W.card = k}) →\n      {Z : Finset V // Z.card = t} → Prop)\n    (δ η : ℝ) (hη : 0 ≤ η)\n    (hk : k ≤ Fintype.card V) (ht : t ≤ Fintype.card V)\n    (hbudget : d * k + t ≤ m) (hm : m ≤ Fintype.card V)\n    (hfailure : @LabelMass (Fin d → {W : Finset V // W.card = k}) _\n      (fun _ => (Fintype.card (Fin d → {W : Finset V // W.card = k}) : ℝ)⁻¹)\n      (fun h => ¬ Good h) (Classical.decPred _) ≤ δ)\n    (hterminal : ∀ h, Good h →\n      @LabelMass {Z : Finset V // Z.card = t} _\n        (fun _ => (Fintype.card {Z : Finset V // Z.card = t} : ℝ)⁻¹)\n        (fun Z => ¬ HitFrag h Z) (Classical.decPred _) ≤ η)\n    (hcoverage : ∀ h Z, Good h → HitFrag h Z →\n      ∃ x : Ω, E x ⊆ Z.val ∪ Finset.univ.biUnion (fun j => (h j).val)) :\n    1 - δ - η ≤ HitProbability E m := by","lean_proof":"classical\n  let H := Fin d → {W : Finset V // W.card = k}\n  let B := {Z : Finset V // Z.card = t}\n  let U := fun (h : H) (Z : B) =>\n    Z.val ∪ Finset.univ.biUnion (fun j => (h j).val)\n  let a : ℝ := (Fintype.card H : ℝ)⁻¹\n  let b : ℝ := (Fintype.card B : ℝ)⁻¹\n  let Hit := fun S : Finset V => ∃ x : Ω, E x ⊆ S\n  let D := fun S : Finset V => ∑ h : H, ∑ Z : B,\n    if U h Z = S then a * b else 0\n  obtain ⟨hDprob, hDsize, hDinv⟩ := SampledUnionLaw d k t hk ht\n  change ProbabilityMass D at hDprob\n  change (∀ S, 0 \u003c D S → S.card ≤ d * k + t) at hDsize\n  change (∀ σ : Equiv.Perm V, ∀ S, D (S.image σ) = D S) at hDinv\n  obtain ⟨W₀, _, hW₀⟩ := Finset.exists_subset_card_eq\n    (show k ≤ (Finset.univ : Finset V).card by simpa using hk)\n  obtain ⟨Z₀, _, hZ₀⟩ := Finset.exists_subset_card_eq\n    (show t ≤ (Finset.univ : Finset V).card by simpa using ht)\n  have hHpos : 0 \u003c (Fintype.card H : ℝ) := by\n    exact_mod_cast (Fintype.card_pos_iff.mpr ⟨fun _ => ⟨W₀, hW₀⟩⟩ :\n      0 \u003c Fintype.card H)\n  have hBpos : 0 \u003c (Fintype.card B : ℝ) := by\n    exact_mod_cast (Fintype.card_pos_iff.mpr ⟨⟨Z₀, hZ₀⟩⟩ :\n      0 \u003c Fintype.card B)\n  have ha : 0 ≤ a := inv_nonneg.mpr hHpos.le\n  have hb : 0 ≤ b := inv_nonneg.mpr hBpos.le\n  have hAtotal : (∑ h : H, a) = 1 := by\n    simp [a, ne_of_gt hHpos]\n  have hBtotal : (∑ Z : B, b) = 1 := by\n    simp [b, ne_of_gt hBpos]\n  let q := fun h : H => ∑ Z : B, if ¬ Hit (U h Z) then b else 0\n  have hqle : ∀ h, q h ≤ 1 := by\n    intro h\n    rw [← hBtotal]\n    exact Finset.sum_le_sum (fun Z _ => by split_ifs \u003c;> linarith)\n  have hqgood : ∀ h, Good h → q h ≤ η := by\n    intro h hh\n    calc\n      q h ≤ ∑ Z : B, if ¬ HitFrag h Z then b else 0 := by\n        apply Finset.sum_le_sum\n        intro Z _\n        by_cases hhit : HitFrag h Z\n        · have hhitU : Hit (U h Z) := hcoverage h Z hh hhit\n          simp [hhit, hhitU]\n        · simp only [hhit, not_false_eq_true, if_true]\n          split_ifs \u003c;> linarith\n      _ = @LabelMass B _ (fun _ => b) (fun Z => ¬ HitFrag h Z)\n          (Classical.decPred _) := by\n        simp only [LabelMass, Finset.sum_filter]\n        congr 1\n        funext Z\n        by_cases hz : HitFrag h Z \u003c;> simp [hz]\n      _ ≤ η := hterminal h hh\n  have hpoint : ∀ h, a * q h ≤ (if ¬ Good h then a else 0) + a * η := by\n    intro h\n    by_cases hh : Good h\n    · simp only [hh, not_true_eq_false, if_false, zero_add]\n      exact mul_le_mul_of_nonneg_left (hqgood h hh) ha\n    · simp only [hh, not_false_eq_true, if_true]\n      have hmul := mul_le_mul_of_nonneg_left (hqle h) ha\n      have hnonneg := mul_nonneg ha hη\n      linarith\n  have hmiss : (∑ h : H, a * q h) ≤ δ + η := by\n    calc\n      (∑ h : H, a * q h) ≤\n          ∑ h : H, ((if ¬ Good h then a else 0) + a * η) :=\n        Finset.sum_le_sum (fun h _ => hpoint h)\n      _ = @LabelMass H _ (fun _ => a) (fun h => ¬ Good h)\n          (Classical.decPred _) + η := by\n        rw [Finset.sum_add_distrib, LabelMass, Finset.sum_filter]\n        have htη : (∑ h : H, a * η) = η := by\n          rw [← Finset.sum_mul, hAtotal, one_mul]\n        rw [htη]\n        congr 2\n        funext h\n        by_cases hh : Good h \u003c;> simp [hh]\n      _ ≤ δ + η := by\n        have hf : @LabelMass H _ (fun _ => a) (fun h => ¬ Good h)\n            (Classical.decPred _) ≤ δ := by convert hfailure using 1\n        linarith\n  have hmissD : (∑ S : Finset V, if ¬ Hit S then D S else 0) ≤ δ + η := by\n    have heq : (∑ S : Finset V, if ¬ Hit S then D S else 0) =\n        ∑ h : H, a * q h := by\n      calc\n        (∑ S : Finset V, if ¬ Hit S then D S else 0) =\n            ∑ S : Finset V, ∑ h : H, ∑ Z : B,\n              if U h Z = S then (if ¬ Hit S then a * b else 0) else 0 := by\n          apply Finset.sum_congr rfl\n          intro S _\n          by_cases hh : Hit S \u003c;> simp [D, hh]\n        _ = ∑ h : H, ∑ Z : B, ∑ S : Finset V,\n              if U h Z = S then (if ¬ Hit S then a * b else 0) else 0 := by\n          rw [Finset.sum_comm]\n          apply Finset.sum_congr rfl\n          intro h _\n          rw [Finset.sum_comm]\n        _ = ∑ h : H, a * q h := by\n          simp only [Finset.sum_ite_eq, Finset.mem_univ, if_true]\n          apply Finset.sum_congr rfl\n          intro h _\n          dsimp only [q]\n          rw [Finset.mul_sum]\n          apply Finset.sum_congr rfl\n          intro Z _\n          split_ifs \u003c;> simp\n    rw [heq]\n    exact hmiss\n  let M : Finset (Finset V) := Finset.univ.filter Hit\n  have hhitD : 1 - δ - η ≤ ∑ S ∈ M, D S := by\n    have hsplit : (∑ S ∈ M, D S) +\n        (∑ S : Finset V, if ¬ Hit S then D S else 0) = 1 := by\n      rw [← hDprob.2]\n      simp only [M, Finset.sum_filter]\n      rw [← Finset.sum_add_distrib]\n      apply Finset.sum_congr rfl\n      intro S _\n      by_cases hh : Hit S \u003c;> simp [hh]\n    linarith\n  obtain ⟨J, hJprob, hJfirst, hJsecond, hJsupport⟩ :=\n    UniformExtensionCoupling D m hDprob\n      (fun S hS => (hDsize S hS).trans hbudget) hDinv hm\n  have hmono : ∀ S W : Finset V, S ⊆ W → Hit S → Hit W := by\n    rintro S W hSW ⟨x, hx⟩\n    exact ⟨x, hx.trans hSW⟩\n  have htransfer : (∑ S ∈ M, D S) ≤\n      ∑ W ∈ M, ∑ S : Finset V, J (S, W) := by\n    calc\n      (∑ S ∈ M, D S) = ∑ S ∈ M, ∑ W : Finset V, J (S, W) := by\n        exact Finset.sum_congr rfl (fun S _ => (hJfirst S).symm)\n      _ = ∑ W : Finset V, ∑ S ∈ M, J (S, W) := Finset.sum_comm\n      _ ≤ ∑ W : Finset V, if Hit W then ∑ S : Finset V, J (S, W) else 0 := by\n        apply Finset.sum_le_sum\n        intro W _\n        by_cases hW : Hit W\n        · simp only [hW, if_true]\n          exact Finset.sum_le_sum_of_subset_of_nonneg (Finset.subset_univ M)\n            (fun S _ _ => hJprob.1 (S, W))\n        · simp only [hW, if_false]\n          apply le_of_eq\n          apply Finset.sum_eq_zero\n          intro S hS\n          have hn : 0 ≤ J (S, W) := hJprob.1 (S, W)\n          by_contra hz\n          have hp : 0 \u003c J (S, W) := lt_of_le_of_ne hn (Ne.symm hz)\n          exact hW (hmono S W (hJsupport S W hp) (Finset.mem_filter.mp hS).2)\n      _ = ∑ W ∈ M, ∑ S : Finset V, J (S, W) := by\n        simp only [M, Finset.sum_filter]\n  have huniform : (∑ W ∈ M, ∑ S : Finset V, J (S, W)) =\n      HitProbability E m := by\n    simp_rw [hJsecond]\n    rw [Finset.sum_ite]\n    simp only [Finset.sum_const_zero, add_zero]\n    have hset : M.filter (fun W => W.card = m) =\n        ((Finset.univ : Finset V).powersetCard m).filter Hit := by\n      ext W\n      simp [M, Finset.mem_powersetCard, and_comm]\n    rw [hset]\n    simp [HitProbability, Hit, div_eq_mul_inv]\n  exact hhitD.trans (htransfer.trans_eq huniform)","tex_statement":"\\begin{lemma}\nLet $E:\\Omega\\to2^V$ be a finite labelled family and let $d,k,t,m$ be\nnonnegative integers with $k,t\\le n=|V|$, $dk+t\\le m\\le n$.\nWrite $A=\\binom Vk$, $B=\\binom Vt$, and $H=A^d$.\nLet $G$ be a predicate on $H$, and $T$ a predicate on $H\\times B$.\nLet $\\delta,\\eta\\in\\mathbb R$ with $\\eta\\ge0$. Suppose that\n\\[\n \\frac{|\\{h\\in H:\\neg G(h)\\}|}{|H|}\\le\\delta,\n \\qquad\n \\frac{|\\{Z\\in B:\\neg T(h,Z)\\}|}{|B|}\\le\\eta\n \\quad\\text{for every }h\\in G.\n\\]\nSuppose also that $G(h)$ and $T(h,Z)$ imply that\n$U(h,Z)=Z\\cup\\bigcup_{j\u003cd}h_j$ contains some edge $E(x)$.\nThen $\\operatorname{HitProbability}(E,m)\\ge1-\\delta-\\eta$.\nThe displayed probabilities are label masses under constant weights\n$1/|H|$ and $1/|B|$, respectively.\n\\end{lemma}","tex_proof":"\\begin{proof}\nThe sets $A$ and $B$ are nonempty because $k,t\\le n$. Put\n$a=|A|>0$, $b=|B|>0$, so $|H|=a^d>0$, including $|H|=1$ when $d=0$.\nGive each pair $(h,Z)\\in H\\times B$ weight $1/(a^db)$.\nThese weights are nonnegative and sum to one, so form a probability mass\nin the sense of \\noderef{ProbabilityMass}. Its marginals are uniform on\n$H$ and $B$, since summing over one coordinate cancels its cardinality.\nThus it describes independent uniform samples of the prescribed sizes.\n\nFor a good $h$, failure of the union to contain any edge implies\n$\\neg T(h,Z)$, by the coverage assumption. Summing its indicator over $B$\ngives conditional miss probability at most $\\eta$. For a bad $h$ the same\nprobability is at most one. Therefore finite summation over $H$ gives\n\\[\n \\Pr(U\\text{ misses every edge})\n \\le\\Pr(\\neg G)+\\eta\\Pr(G)\\le\\delta+\\eta,\n\\]\nwhere the last inequality uses $\\eta\\ge0$ and $\\Pr(G)\\le1$.\nThis calculation uses only the explicit finite sums of \\noderef{LabelMass}.\n\nTo apply uniform extension, define the unconditional pushforward mass\n\\[\n D(S)=\\sum_{(h,Z):U(h,Z)=S}\\frac1{a^db}\n \\qquad(S\\subseteq V).\n\\]\nEach pair contributes to exactly one $S$, so $D\\ge0$ and $\\sum_SD(S)=1$.\nFor every pair, $|U(h,Z)|\\le |Z|+\\sum_{j\u003cd}|h_j|=t+dk\\le m$.\nConsequently $D(S)>0$ implies $|S|\\le m$.\nFor every permutation $\\sigma$ of $V$, the map\n$(h,Z)\\mapsto((\\sigma h_j)_{j\u003cd},\\sigma Z)$ is a bijection of\n$H\\times B$ with inverse induced by $\\sigma^{-1}$. It preserves each\npair's constant weight and sends the fiber of $U=S$ to the fiber of\n$U=\\sigma S$. Hence $D(\\sigma S)=D(S)$.\nThis argument concerns the unconditional mass only; neither $G$ nor $T$\nis asserted to be permutation-invariant.\n\nApply \\noderef{UniformExtensionCoupling} to $D$ and $m$. Its normalization,\nsize, invariance, and feasibility hypotheses have all just been proved.\nIt produces a joint probability mass on $(S,W)$, with first marginal $D$,\nuniform second marginal on $m$-subsets, and $S\\subseteq W$ whenever the\njoint weight is positive. If $S$ contains an edge then so does $W$.\nSumming the corresponding indicator inequality against that joint mass\nshows that the miss probability of uniform $W$ is at most that of $D$,\nwhich is at most $\\delta+\\eta$. Subtracting from one and using\n\\noderef{HitProbability} proves the claim.\n\\end{proof}","tex_env":"lemma","semantic_closure":["HitProbability","LabelMass"],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"BinomialToUniformAdditiveTransfer":{"name":"BinomialToUniformAdditiveTransfer","title":"Additive binomial-to-uniform transfer","kind":"lemma","is_target":false,"imports":["ProbabilityMass","UniformExtensionCoupling"],"imported_by":["AnchoredTerminalEstimate"],"lean_statement":"lemma BinomialToUniformAdditiveTransfer {V : Type v} [Fintype V] [DecidableEq V]\n    (D : Finset V → Prop) [DecidablePred D] (β : ℝ) (a : ℕ)\n    (hβ : 0 \u003c β ∧ β \u003c 1) (ha : a ≤ Fintype.card V)\n    (hdown : ∀ U W : Finset V, U _self hB_ne\n  have hsize : ∀ U : Finset V, 0 \u003c θ U → U.card ≤ a := by\n    intro U hU\n    by_contra h\n    simp [θ, h] at hU\n  have hinv : ∀ σ : Equiv.Perm V, ∀ U : Finset V, θ (U.image σ) = θ U := by\n    intro σ U\n    have hc : (U.image σ).card = U.card :=\n      Finset.card_image_of_injective U σ.injective\n    simp only [θ, wt, hc]\n  obtain ⟨J, hJprob, hJfirst, hJsecond, hJsupport⟩ :=\n    UniformExtensionCoupling θ a hprob hsize hinv ha\n  let S : Finset (Finset V) := (Finset.univ : Finset V).powersetCard a\n  let M : Finset (Finset V) := S.filter D\n  let u : ℝ := (M.card : ℝ) / (S.card : ℝ)\n  have hS_pos : 0 \u003c S.card := by\n    dsimp [S]\n    rw [Finset.card_powersetCard, Finset.card_univ]\n    exact Nat.choose_pos ha\n  have hS_posR : (0 : ℝ) \u003c S.card := by exact_mod_cast hS_pos\n  have hu_le : u ≤ 1 := by\n    dsimp [u]\n    apply (div_le_one hS_posR).mpr\n    exact_mod_cast (Finset.card_filter_le S D)\n  have hleft_eq : u =\n      ∑ W ∈ M, ∑ U : Finset V, J (U, W) := by\n    calc\n      u = ∑ W ∈ M, (S.card : ℝ)⁻¹ := by\n        simp [u, div_eq_mul_inv]\n      _ = ∑ W ∈ M, ∑ U : Finset V, J (U, W) := by\n        refine Finset.sum_congr rfl ?_\n        intro W hW\n        have hc : W.card = a :=\n          (Finset.mem_powersetCard.mp (Finset.mem_filter.mp hW).1).2\n        rw [hJsecond W]\n        simp [hc, S]\n  have hcoupling_le : u ≤ (Finset.univ.filter D).sum θ := by\n    rw [hleft_eq, Finset.sum_comm]\n    calc\n      (∑ U : Finset V, ∑ W ∈ M, J (U, W)) ≤\n          ∑ U : Finset V, if D U then ∑ W : Finset V, J (U, W) else 0 := by\n        refine Finset.sum_le_sum ?_\n        intro U _\n        by_cases hDU : D U\n        · simp only [hDU, if_true]\n          exact Finset.sum_le_sum_of_subset_of_nonneg (Finset.subset_univ M)\n            (fun W _ _ => hJprob.1 (U, W))\n        · simp only [hDU, if_false]\n          apply le_of_eq\n          refine Finset.sum_eq_zero ?_\n          intro W hW\n          have hn : 0 ≤ J (U, W) := hJprob.1 (U, W)\n          by_contra hz\n          have hp : 0 \u003c J (U, W) := lt_of_le_of_ne hn (Ne.symm hz)\n          exact hDU (hdown U W (hJsupport U W hp) (Finset.mem_filter.mp hW).2)\n      _ = ∑ U ∈ Finset.univ.filter D, ∑ W : Finset V, J (U, W) := by\n        rw [Finset.sum_ite]\n        simp only [Finset.sum_const_zero, add_zero]\n      _ = (Finset.univ.filter D).sum θ := by\n        exact Finset.sum_congr rfl (fun U _ => hJfirst U)\n  have hcond_le : (Finset.univ.filter D).sum θ ≤\n      (Finset.univ.filter D).sum wt / Bmass := by\n    have hcond_eq : (Finset.univ.filter D).sum θ =\n        ((Finset.univ.filter D).filter (fun U => U.card ≤ a)).sum\n          (fun U => wt U / Bmass) := by\n      dsimp [θ]\n      rw [Finset.sum_ite]\n      simp only [Finset.sum_const_zero, add_zero]\n    rw [hcond_eq, Finset.sum_div]\n    exact Finset.sum_le_sum_of_subset_of_nonneg (Finset.filter_subset _ _)\n      (fun U _ _ => div_nonneg (hwt U) hB_pos.le)\n  have hweighted : Bmass * u ≤ (Finset.univ.filter D).sum wt := by\n    have h := (le_div_iff₀ hB_pos).mp (hcoupling_le.trans hcond_le)\n    simpa [mul_comm] using h\n  have hsplit : Bmass +\n      (Finset.univ.filter (fun U : Finset V => a \u003c U.card)).sum wt = 1 := by\n    have h := Finset.sum_filter_add_sum_filter_not\n      (s := (Finset.univ : Finset (Finset V)))\n      (p := fun U => U.card ≤ a) (f := wt)\n    simpa [Bmass, Bset, htotal, not_le] using h\n  have hadd : u ≤ (Finset.univ.filter D).sum wt +\n      (Finset.univ.filter (fun U : Finset V => a \u003c U.card)).sum wt := by\n    have hbranch : 0 ≤ (1 - Bmass) * (1 - u) :=\n      mul_nonneg (sub_nonneg.mpr hB_le) (sub_nonneg.mpr hu_le)\n    nlinarith\n  simpa [u, M, S, wt] using hadd","tex_statement":"\\begin{lemma}[Additive binomial-to-uniform transfer]\nLet $V$ be a finite set of size $n$, let $0\u003c\\beta\u003c1$, and let $a$ be a\nnonnegative integer with $a\\le n$.  Let $D$ be a decreasing predicate on\nsubsets of $V$: if $U\\subseteq W$ and $D(W)$, then $D(U)$.\nThen\n\\[\n \\frac{|\\{W\\in\\binom Va:D(W)\\}|}{|\\binom Va|}\n \\le\n \\sum_{\\substack{Z\\subseteq V:\\ D(Z)}}\n        \\beta^{|Z|}(1-\\beta)^{n-|Z|}\n +\\sum_{\\substack{Z\\subseteq V:\\ |Z|>a}}\n        \\beta^{|Z|}(1-\\beta)^{n-|Z|}.\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nSet $w(U)=\\beta^{|U|}(1-\\beta)^{n-|U|}$.  Nonnegativity of both bases\ngives $w(U)\\ge0$, and expansion of the product over $V$ gives\n$\\sum_{U\\subseteq V}w(U)=(\\beta+1-\\beta)^n=1$.\nWrite $G=\\{U:|U|\\le a\\}$ and $p=\\sum_{U\\in G}w(U)$.\nThe empty set belongs to $G$ and has weight $(1-\\beta)^n>0$, so\n$0\u003cp\\le1$.  The complementary mass is\n$1-p=\\sum_{|U|>a}w(U)$, by partitioning the total mass.\n\nDefine $\\theta(U)=w(U)/p$ for $U\\in G$, and $0$ otherwise.\nIts weights are nonnegative and sum to $p/p=1$, so it is a probability\nmass in the sense of \\noderef{ProbabilityMass}.  Positive $\\theta(U)$\nimplies $|U|\\le a$.  For every permutation $\\sigma$ of $V$,\n$|\\sigma(U)|=|U|$, so $w(\\sigma(U))=w(U)$ and membership of $G$ is\nunchanged.  It follows that $\\theta(\\sigma(U))=\\theta(U)$.\nTogether with $a\\le n$, these verify all the hypotheses of\n\\noderef{UniformExtensionCoupling}.  That node supplies a probability\nmass $J(U,W)$ with first marginal $\\theta$, second marginal\n\\[\n u(W)=\\begin{cases}|\\binom Va|^{-1},& |W|=a,\\\\0,&|W|\\ne a,\\end{cases}\n\\]\nand $J(U,W)>0$ only when $U\\subseteq W$.\nHere $\\binom Va$ is nonempty because $a\\le n$, so $u$ is a probability\nmass: choosing any $a$ elements gives a member, and summing its constant\nweight over all such members gives $1$.\n\nTo account for both branches explicitly, define on all pairs of subsets\n\\[\n K(U,W)=pJ(U,W)+\\mathbf1_{\\{|U|>a\\}}w(U)u(W).\n\\]\nEvery weight is nonnegative.  Summing over $W$ gives\n$p\\theta(U)+\\mathbf1_{\\{|U|>a\\}}w(U)=w(U)$.\nSumming over $U$ gives $pu(W)+(1-p)u(W)=u(W)$.\nThus $K$ has total mass $1$, its first coordinate has the original\nbinomial law, and its second coordinate is uniform on $\\binom Va$.\nThe term $pJ$ is the non-overflow branch; the other term samples the\nuniform set independently on the overflow branch.\n\nOn the non-overflow branch $|U|\\le a$, the second term of $K$ vanishes.\nIf $K(U,W)>0$, then $J(U,W)>0$, so $U\\subseteq W$.\nConsequently $D(W)$ implies $D(U)$ on this branch.  The contribution\nof these pairs to $\\Pr_K(D(W))$ is at most\n$\\Pr_K(D(U),|U|\\le a)$.  On the overflow branch the contribution is\nat most its total mass $\\Pr_K(|U|>a)$.  Taking the two marginals gives\n\\[\n \\Pr_u(D)\\le\\sum_{\\substack{U\\in G:\\D(U)}}w(U)\n                   +\\sum_{|U|>a}w(U)\n \\le\\sum_{D(U)}w(U)+\\sum_{|U|>a}w(U),\n\\]\nwhere the last inequality only adds nonnegative terms.  The left side\nis exactly the cardinality ratio in the statement.  This proves the\nadditive bound, with no median estimate or multiplicative loss.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"ContainmentBinomialToUniformTransfer":{"name":"ContainmentBinomialToUniformTransfer","title":"ContainmentBinomialToUniformTransfer","kind":"lemma","is_target":false,"imports":["BinomialMedianAtMean","ProbabilityMass","UniformExtensionCoupling"],"imported_by":["ContainmentHitting"],"lean_statement":"lemma ContainmentBinomialToUniformTransfer {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (F : Ω → Finset V) (α β : ℝ) (m : ℕ)\n    (hα : 0 ≤ α ∧ α ≤ 1)\n    (hm : (m : ℝ) = α * (Fintype.card V : ℝ))\n    (hbin :\n      Finset.sum\n        (((Finset.univ : Finset V).powerset).filter\n          (fun Z : Finset V => ∀ x : Ω, ¬ F x ⊆ Z))\n        (fun Z : Finset V =>\n          α ^ Z.card * (1 - α) ^ (Fintype.card V - Z.card)) ≤ β) :\n    ((((Finset.univ : Finset V).powersetCard m).filter\n      (fun W : Finset V : ℝ) /\n          ((((Finset.univ : Finset V).powersetCard m).card : ℝ)) =\n        Finset.sum M (fun W : Finset V => Finset.sum Finset.univ (fun U : Finset V => J (U, W))) := by\n    calc\n      ((((Finset.univ : Finset V).powersetCard m).filter Miss).card : ℝ) /\n          ((((Finset.univ : Finset V).powersetCard m).card : ℝ))\n          = Finset.sum M (fun _W : Finset V =>\n              (((((Finset.univ : Finset V).powersetCard m).card : ℕ) : ℝ))⁻¹) := by\n            dsimp [M, S]\n            rw [Finset.sum_const, nsmul_eq_mul]\n            field_simp [hS_neR]\n      _ = Finset.sum M (fun W : Finset V =>\n            Finset.sum Finset.univ (fun U : Finset V => J (U, W))) := by\n            refine Finset.sum_congr rfl ?_\n            intro W hW\n            rw [hJsecond W]\n            have hWcard : W.card = m := by\n              have hWS : W ∈ S := (Finset.mem_filter.mp hW).1\n              exact (Finset.mem_powersetCard.mp hWS).2\n            simp [hWcard]\n  have hcoupling_le :\n      Finset.sum M (fun W : Finset V => Finset.sum Finset.univ (fun U : Finset V => J (U, W)))\n        ≤ Finset.sum (Finset.univ.filter Miss) Udist := by\n    rw [Finset.sum_comm]\n    calc\n      Finset.sum Finset.univ (fun U : Finset V => Finset.sum M (fun W : Finset V => J (U, W)))\n          ≤ Finset.sum Finset.univ (fun U : Finset V =>\n              if Miss U then Finset.sum Finset.univ (fun W : Finset V => J (U, W)) else 0) := by\n            refine Finset.sum_le_sum ?_\n            intro U hU\n            by_cases hMissU : Miss U\n            · simp [hMissU]\n              exact Finset.sum_le_sum_of_subset_of_nonneg (by intro W hW; simp) (by\n                intro W hW hWnot\n                exact hJprob.1 (U, W))\n            · simp [hMissU]\n              refine le_of_eq ?_\n              apply Finset.sum_eq_zero\n              intro W hW\n              have hJW_nonneg : 0 ≤ J (U, W) := hJprob.1 (U, W)\n              by_cases hzero : J (U, W) = 0\n              · exact hze pose $m=\\alpha |V|$ is an integer.  If\n\\[\n  \\Pr(F(x)\\nsubseteq Z\\text{ for every }x\\in\\Omega)\\le\\beta,\n\\]\nthen a uniformly chosen $m$-subset $W$ of $V$ satisfies\n\\[\n  \\Pr(F(x)\\nsubseteq W\\text{ for every }x\\in\\Omega)\\le2\\beta .\n\\]\n\\end{lemma}","tex_proof":"\\begin{proof}\nLet $B$ be the event $|Z|\\le m$.  By \\noderef{BinomialMedianAtMean}, because\nthe binomial variable $|Z|$ has mean $m=\\alpha |V|$, we have\n\\[\n  \\Pr(B)\\ge\\frac12 .\n\\]\nIn particular $\\Pr(B)>0$.  Define the conditioned law $\\mu$ on subsets\n$U\\subseteq V$ by\n\\[\n  \\mu(U)=\n  \\begin{cases}\n    \\Pr(Z=U)/\\Pr(B),& |U|\\le m,\\\\\n    0,& |U|>m .\n  \\end{cases}\n\\]\nThis is a probability mass in the sense of \\noderef{ProbabilityMass}: each\nweight is nonnegative, and summing the displayed formula over all subsets gives\n$\\Pr(B)/\\Pr(B)=1$.  It is supported on subsets of size at most $m$ by the\ndefinition of $B$.  It is also invariant under every permutation of $V$, since\nthe binomial law assigns a set $U$ the mass\n$\\alpha^{|U|}(1-\\alpha)^{|V|-|U|}$ and the condition $|U|\\le m$ depends only\non the cardinality of $U$.\n\nWe also need $m\\le |V|$ for the extension lemma.  The hypotheses give\n$0\\le\\alpha\\le1$ and $m=\\alpha |V|$.  Multiplying the inequality\n$\\alpha\\le1$ by the nonnegative number $|V|$ gives\n\\[\n  m=\\alpha |V|\\le |V|.\n\\]\nSince $m$ and $|V|$ are integers, this real inequality implies the natural\nnumber inequality $m\\le |V|$.\n\nApply \\noderef{UniformExtensionCoupling} to the conditioned law.  We obtain a\njoint probability mass on pairs $(U,W)$ whose first marginal is the\nconditioned binomial law, whose second marginal is uniform on the $m$-subsets\nof $V$, and whose support satisfies $U\\subseteq W$.  On the support of this\ncoupling, if $W$ misses every labelled set, then $U$ misses every labelled\nset as well: otherwise $F(x)\\subseteq U\\subseteq W$ for some $x$.\nTherefore the coupling mass of pairs whose second coordinate misses every\nlabelled set is at most the coupling mass of pairs whose first coordinate\nmisses every labelled set.  Using the two marginal identities supplied by\n\\noderef{UniformExtensionCoupling}, this says exactly that the uniform miss\nprobability is at most the conditional binomial miss probability:\n\\[\n  \\Pr(F(x)\\nsubseteq W\\text{ for every }x)\n  \\le\n  \\Pr(F(x)\\nsubseteq Z\\text{ for every }x\\mid B).\n\\]\nWriting $A$ for the binomial miss event, this conditional probability is\n\\[\n  \\Pr(A\\mid B)=\\frac{\\Pr(A\\cap B)}{\\Pr(B)}\n  \\le \\frac{\\Pr(A)}{\\Pr(B)}\n  \\le 2\\Pr(A)\n  \\le2\\beta ,\n\\]\nwhere the last inequality is the assumed binomial miss bound.\n\\end{proof}","tex_env":"lemma","semantic_closure":[],"semantic_closure_error":"","reported_status":"closed (proof)","verification_summary":"Correspondence: PASSSubstantiveness: PASSNL Proof: PASSLean closed: YES","source_note":""},"FiniteJansonIntegratedLogDerivativeEstimate":{"name":"FiniteJansonIntegratedLogDerivativeEstimate","title":"FiniteJansonIntegratedLogDerivativeEstimate","kind":"lemma","is_target":false,"imports":["FiniteBernoulliPowersetIdentities","FiniteJansonLogDerivativeBound"],"imported_by":["FiniteJansonExponentialMomentEstimate"],"lean_statement":"lemma FiniteJansonIntegratedLogDerivativeEstimate {Ω : Type u} {V : Type v}\n    [Fintype Ω] [Fintype V] [DecidableEq V]\n    (G : Ω → Finset V) (p : ℝ)\n    (hp : 0 \u003c p ∧ p \u003c 1)\n    (hnonempty : ∀ ω : Ω, (G ω).Nonempty)\n    (hDelta : 0 \u003c\n      Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n        (fun pair : Ω × Ω =>\n          if (G pair.1 ∩ G pair.2).Nonempty then\n            p ^ (G pair.1 ∪ G pair.2).card\n          else 0))\n    (hlog :\n      ∀ s : ℝ, 0 ≤ s →\n        deriv\n          (fun r : ℝ =>\n            Real.log\n              (Finset.sum ((Finset.univ : Finset V).powerset)\n                (fun Z : Finset V =>\n                  (p ^ Z.card * (1 - p) ^ (  p ^ (G ω).card))))))) := by","lean_proof":"classical\n  let μ : ℝ := (Finset.univ : Finset Ω).sum (fun ω : Ω => p ^ (G ω).card)\n  let Δ : ℝ :=\n    Finset.sum ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω))\n      (fun pair : Ω × Ω =>\n        if (G pair.1 ∩ G pair.2).Nonempty then\n          p ^ (G pair.1 ∪ G pair.2).card\n        else 0)\n  let ψ : ℝ → ℝ := fun r : ℝ =>\n    Finset.sum ((Finset.univ : Finset V).powerset)\n      (fun Z : Finset V =>\n        (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n          Real.exp (-(r * (((Finset.univ : Finset Ω).filter\n            (fun ω : Ω => G ω ⊆ Z)).card : ℝ))))\n  have hp0 : 0 \u003c p := hp.1\n  have hp_nonneg : 0 ≤ p := le_of_lt hp0\n  have hq0 : 0 \u003c 1 - p := sub_pos.mpr hp.2\n  have hq_nonneg : 0 ≤ 1 - p := le_of_lt hq0\n  have hΔpos : 0 \u003c Δ := by\n    simpa [Δ]\n      using hDelta\n  have hμpos : 0 \u003c μ := by\n    have hterm_nonneg :\n        ∀ pair ∈ ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω)),\n          0 ≤\n            (if (G pair.1 ∩ G pair.2).Nonempty then\n              p ^ (G pair.1 ∪ G pair.2).card\n            else 0 : ℝ) := by\n      intro pair _hpair\n      by_cases hinter : (G pair.1 ∩ G pair.2).Nonempty\n      · simp [hinter, pow_nonneg hp_nonneg]\n      · simp [hinter]\n    have hΔexists :\n        ∃ pair ∈ ((Finset.univ : Finset Ω).product (Finset.univ : Finset Ω)),\n          0 \u003c\n            (if (G pair.1 ∩ G pair.2).Nonempty then\n              p ^ (G pair.1 ∪ G pair.2).card\n            else 0 : ℝ) := by\n      simpa [Δ] using\n        (Finset.sum_pos_iff_of_nonneg hterm_nonneg).mp hΔpos\n    rcases hΔexists with ⟨pair, hpair, _hpairpos⟩\n    refine Finset.sum_pos' (s := (Finset.univ : Finset Ω))\n      (f := fun ω : Ω => p ^ (G ω).card) ?_ ?_\n    · intro ω _hω\n      exact pow_nonneg hp_nonneg _\n    · refine ⟨pair.1, by simp, ?_⟩\n      exact pow_pos hp0 _\n  have hμne : μ ≠ 0 := ne_of_gt hμpos\n  have hΔne : Δ ≠ 0 := ne_of_gt hΔpos\n  have hψpos : ∀ r : ℝ, 0 \u003c ψ r := by\n    intro r\n    refine Finset.sum_pos' (s := (Finset.univ : Finset V).powerset)\n      (f := fun Z : Finset V =>\n        (p ^ Z.card * (1 - p) ^ (Fintype.card V - Z.card)) *\n          Real.exp (-(r * (((Finset.univ : Finset Ω).filter\n            (fun ω : Ω => G ω ⊆ Z)).card : ℝ)))) ?_ ?_\n    · intro Z _hZ\n      exact mul_nonneg\n        (mul_nonneg (pow_nonneg hp_nonneg _) (pow_nonneg hq_nonneg _))\n        (le_of_lt (Real.exp_pos _))\n    · refine ⟨∅, by simp, ?_⟩\n      have hbase :\n          0 \u003c p ^ (∅ : Finset V).card *\n              (1 - p) ^ (Fintype.card V - (∅ : Finset V).card) := by\n        exact mul_pos (pow_pos hp0 _) (pow_pos hq0 _)\n      exact mul_pos hbase (Real.exp_pos _)\n  have hψne : ∀ r : ℝ, ψ r ≠ 0 := fun r => ne_of_gt (hψpos r)\n  have hψdiff : Differentiable ℝ ψ := by\n    dsimp [ψ]\n    refine Differentiable.fun_sum ?_\n    intro Z _hZ\n    fun_prop\n  have hlogψdiff : Differentiable ℝ (fun r : ℝ => Real.log (ψ r)) := by\n    intro r\n    exact (hψdiff r).log (hψne r)\n  have hcorrdiff :\n      Differentiable ℝ\n        (fun r : ℝ => (μ ^ 2 / Δ) *\n          (1 - Real.exp (-(r * (Δ / μ))))) := by\n    fun_prop (disch := assumption)\n  have hFdiff :\n      Differentiable ℝ\n        (fun r : ℝ =>\n          Real.log (ψ r) + (μ ^ 2 / Δ) *\n            (1 - Real.exp (-(r * (Δ / μ))))) :=\n    hlogψdiff.add hcorrdiff\n  have hderiv_corr :\n      ∀ r : ℝ,\n        deriv\n          (fun x : ℝ => (μ ^ 2 / Δ) *\n            (1 - Real.exp (-(x * (Δ / μ))))) r =\n          μ * Real.exp (-(r * (Δ / μ))) := by\n    intro r\n    have hlin :\n        HasDerivAt (fun x : ℝ => -(x * (Δ / μ))) (-(Δ / μ)) r := by\n      simpa using ((hasDerivAt_id r).mul_const (Δ / μ)).neg\n    have hexp :\n        HasDerivAt\n          (fun x : ℝ => Real.exp (-(x * (Δ / μ))))\n          (Real.exp (-(r * (Δ / μ))) * (-(Δ / μ))) r :=\n      hlin.exp\n    have hone_sub :\n        HasDerivAt\n          (fun x : ℝ => 1 - R
